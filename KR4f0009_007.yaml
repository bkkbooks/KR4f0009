  text: 薑齋文集卷七船山遺書四十六
  hash: sha256:5544d18bd3fa04dc94113a350c2bdb44c9c756debe24634bc2df01045c59642c
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4f0009_SBCK_007-1a}
body:
  text: 衡陽王夫之撰賦五篇南嶽賦結天元以紐靈扢陽冶之鴻施母黃精之函載焫相見于重離帝宅炎以誕命帙萬年而不辭是故其為狀也唯其為象也爾其所自昉也爰其所自往也蟬延蠆挂蜦虯蠖􅭽蜚戌騰拏龍眒鸞敞于五千里之外者獡不知其􅚩綿之逌柢而匏繫之屢遷固有神亥逡巡而戒步燭陰睥睨而改顏者矣乃循近趾蹤遠迒析柔埴柬騂剛杳翠微曨夕陽幽蠁泣掣兕狂别子汰委裘王枃勻櫛節逆迎順將拎幽絡阻逐景飛光乍曲弣于坤麓終回簫于兌方則亦有可得而形相者焉原夫岷山之俶立也會昌建福絡啓大江蕩滌東井襟帶峚鍾是器術之所復穰而火正之所下降故其靈吭嗉吸神瀵尾傾條分萬岫形擢孤榮崒翕葉嶄阢硠勍佚以田田集栩栩之䎕䎕五指南纖而戍削三眉西嫵以娥嬴匪思存而稅駕􅎃夭紹以東縈于是濵若瀘跨馬湖謝錦水揖雲巫纏以酉漵驂以鐔漊披紛夫夷趠桀都梁雖霧沓而星綴實振領而維綱蓋不知其幾千里而翔集乎耶薑爾乃蒸水南夾淸漣北款乍紖崇崖或襄沙灘帛飛緒舒凌蹙煙緩迫然掣摋妥而淹蹇如驚非意相忘以坦眩眩浮浮蔓垂棘鈎又厯條山撇裔水而後乃抵乎其邱則有巨塊巖石赬膚碧肌截為列城覆為懸帷繁星經曜間以晃煟修鬛平茸雜以迷離桓午樊籞歘以洞達康逵互徑斂以崔峗怒而奔觸旋以妖媉已顧奕僷駭以鍔觺風萍漂細散以詭狀欱然中起拔以崇魁奔精歙魄停凝矗峙者則岣嶁為之經始坡陀逶迤方伏以起亙爾順衍驚踴旁徙尋不周而發軔覛常羊以遙指僅標秀于七二紛餘峰之莫紀簇紅華立白石啓小嵩亞太室開雙髻于玉女參石廩于麥積蜿蜒蟠躍蚓夤蜴驀復或􅫋單乃瘠􅚏翩馺娑其歸翰盤容與而整翮薄經營于欒塢已緬邈乎皋宅張其華蓋鬱為煙霞崱屴崟嶔天門嵖岈披九閶邀日華神之嬺留經過杳亭亭疑不邪則安上芙蓉匌䃔巃嵸輔承顴附以奠祝融之封也其高也拔乎原隰者九千六百步軒軒堯堯以捫銀漢而挂罡風玉衡乳垂長沙咡從朱鳥翼覆天市作墉皚光下燭朱英上通孤碧混霄返翠漾空維時㽔賓律御羲和轡永雲斂數絲宵涵萬頃粵陟焉而步測有天末之焜炯維南極之樞星祝胡考于仁靜彼徵瑞而乍炫此屆至而恆炳舍離合之神山誰共覿其光景蓋其穹窿嶕嶢矯裊蕭騷詣空宛至出險將翺平揖太白俯勞嵩高哂岱宗之臨深況恆祠之溢褒宜光怪之偉赩回寒暑于坰郊蘋末乍動焚輪已號鞺鞳豗隤屭以馮總觸突漩澓餘以呦咬石級柔搖而閃霍鐵梁輕舉于鴻毛其或宿靄蠲明星晳晨鵾凝寢夕蟲喧砌沆瀣莫分海天無際睋金縷之線興沓錦浪之騰曳浴火鏡而踟蹰奮晶宇以滌涗窕驚心而蕩胸羌不宣其綺麗何人間之未遙蹇遲遲其始霽至若繁雲興穴油陰冒野雷雨半山晴虛孤寫豐隆嬰啼列缺鐙灺浸升雲之連蜷始羃厯乎趾下斯非暌髣佛乎天人胡同埵而殊冶也哉祝融是降衍為赤帝之阜秀如摘以離羣矯欲流而終取其左則朝陽日觀九仙潤牛毗盧之所蚴蟉也其後則雷祖九龍蓮花潛聖妙高之所擁負也其右則南臺羅漢明月涌几之所舒紐也其前則金紫流杯烏石黃華之所奔奏也其陰則荆紫大溈迤邐辟仆暈旋乎暮雲之逢迎而態信乎嶽麓之邂逅其外則湘渌洣瀏襟回珮紉而憑隱乎雲陽之墟以挹注乎敷淺之藪其南則石鼓回雁碧雲雨母鶚峙鵷臚椒聊瓜剖以奔息乎海嶠之列五與夫瀟山之疑九回薄磅磄團圞結復控扶來廷少長維族豈後至之或凶匪撻彼而臣僕傲紫蓋之不寧終同區而必穆唯猊奔以鸑舉奄靈徠以載謖棲赤熛之感生儼司天之帝服懲祀典之不經選祝誦以宜穀神眇眇以蝹蝹衯遲下而流睩時則常伯夙請秩宗宵寅發策明堂降匭端門淸酒既莤制帛維纁驛駕馳道有來湘干蒲鐘奰發鳳吹淸喧燎飄光以乍暗香屯煙而徐黁降炎精之曧焴貽君子以芳荃勤九伐而不匱匪明德其巳諼乃至南陸迎日元辛涓吉后有事于方澤差名山以作匹赫炎光之顯祇壇六成而列秩雖逌眂乎上公實王禋之載謐瓚築鬱之馞鼎剛騂之􅗀栗誠高朗以令終作后祇之丞弼彼熯乾封而號萬歲已啓俶豔而替昭質奚況亭亭云云之部婁浮七十二后之雄心者曾何足泚右史之彤筆耶德馨維瑞靈貺斯徵護軒轅之瓊甕霏寶露而飴凝攬寒暉于夕館帝繾綣以宵興賚羣后以滌目宛縈帶于蓬瀛降湘妃于北渚賓朱鳳于南陵逮夏后之齋寤冀通精以淡災卑金簡之雲籒謁蒼水之靈傀瀰滔天而無朕粲絲理于奇賅苟神笈之終吝眷羽淵而增哀斆隨刊于土乂訖效享夫黃能虞遂陟而覲后搢元玉曰俞哉黃壚敦膏紅泉釀澑英英九丹煜煜三秀鷦明乳雛應龍伏蓲叔夜浩歎于林岡宏景裴回于句岫故有山經窮其削柿渭卜罔其占繇者矣乃其什一千百者猶可得而究焉其草則有黃精少辛芎藭射干幽蘭菉茿芍藥芳荃苦葴甘菊藑茅香蕑虋冬紫茜沙參白前昌歜九節龍鬚纒綿竹紀千齡松壽萬年靑蘋虎掌蘧蒻旱蓮禹餘稱糧威靈名仙交藤烏首翁草華顚蘝􅱴薯蕷冰臺竊衣五加羡玉百合胎璣緑覆春皋芳泫夕暉謁風送薰馝馝馡馡積雪吐菌方暄擢薇叢點山椒弱映水湄其木則有梫桂厚朴榛橡含桃丹楓英梅梓棐杉槄徑松接武微風振濤銀杏山礬黃心碧梢木蓮六出暈紫斫瑤芬薰百尋豔蕩九皋扶條逼上擢挺危牢猿狖磬折柔逾餳膏瘣籧篨虬文曲鏖螺旋乳結盤渦瀵尻雅宜曲几或便詩瓢巨竹繁生細篠側出大任汲炊直中彀率密箐雲遏修篁風謐駘蕩靃靡檀欒蕭瑟晚茗蚤荈屑雲蔭日紫筍緑槍鹿茸荷蔤乃令又新品泉鴻漸浣盞吹松風瀹海眼祛孝先之便便罷伯倫之荷鏟視天池之與顧渚亦可登洙泗之狂簡也其泉則有金砂娑羅貫道水簾龍池洗衲虎跑三潭春草載榮石髓飛甘澄涵霜月淸混鬱藍拂阪陵磧懸珠鏗吟偶拽屑其喁噢旋庨閜以崩坍振鼉吼之鼘鼘幽蛩泣其淫淫警達旦以冘豫寄淸怨于江潯其巖岫則詰軋綢繆鈹挺弓彄始乎纖屈終乎廣裒蹇産墆翳疑墜稍收稜層礚沓􅼿㦎䜱䜪檻泉沸射雜以謰嘍千章蔽日則禺中警夜叢笴留霜則暄和懷秋杳扳捫之絶迹誰丁丁而見求閟鳥徑以太古藏內趾之與莦艽其獸則有蔚豹文貍獨猿岐蜼騊駼山都豪豕刺蝟麀鹿封彘麇䴦兕犩麝父王孫蛩蛩狒狒吟鼪嘯狐淸宵吹沸跂息騷駭趠越憤毅度夕樾之與朝陽坦不憂夫羅罻其鳥則有素鷴白練山雞吐綬睍睆鶯啼鉤輈雉雊倒挂鶭雀海靑鷹鷲鴕鶡鶶鵌望巒斯就白展素沙丹欺絺繡莫不矜羽弄魂歡春警晝盼蘭芽以低啄掠飛雲而橫逐其殊異則雨虎晴見而陰合雲師霽出而霧騰絶澗閃夜光之木懸崖炬聖者之鐙靈蟇浴春而釀雪神蜥弄水以飛冰思匪夷而恍惚亶不信其已曾迹其昭爽之瓌絶攬其滂沛之勃蒸自非象外棲心天徒合契瑩秦鏡于密勿覓軒珠于遼戾固有望景而腸迷臨高而神閉者矣琳宮丹館依隈附巔豐碑隆碣冠阜臨泉樾觀月淸石梁虹懸飛航切雲高臺含煙則有巨公經過而磨崖逸民忘反以閉關墨卿韻留于金石琴客曲寫其猗蘭其戾止也拓內美浣塵慮披天宇益修度心謀籟通目擊道遇昌黎恣七諫之遊考亭佇三益之素扶桑旦濯于雲中縞練徐消于天步指蒼天而豫正何美人之遲暮崇仁抗疏而霧隱廣漢作牧而星聚東廓函丈而英延甘泉尸祝而芳駐咀德華潄仁津衍河雒藝邱墳樹旌幟翦荆榛匪西河之疑似樂雩壇之佳辰近則荆溪制相堵公仲緘江陵詹尹張公別山拂車轍于層巒觀初暾之輪囷拊劒而義魄增振衣而烈心引濱九死以崔嵬拯皇輿之遘閔若夫杜陵西崑香山淮海之續風而接軫者取靑妃白激商諧羽于其間誠無情而不盡至如王孫憤俗而埋迹高士問津而行藥子野罷􅐟以流觀少文展圖而棲薄鄴侯避李而挂冠致堂卻檜而躡屩忠誠旁求而鵲起黃門經始而鳥革諒卜吉于允臧抑降神其維嶽矧夫銀地表瑞朱陵通真釋子彌天羽客乘雲九仙霄舉隻鶴霞賓鳥爪翻書石糧自餴懶殘飯芋岩老長醺扣玉壺于海客奏雲璈于華存含茈薑于金母養釘鉸之胎魂雲軿來其宛在哂探島之徒勤逮其三車東駕五葉南開頭陀既景思大爰來海遷蛟館顗觀天台讓磨石鏡遷滑莓苔慈明狎虎芭蕉浴雷緑蘿結菴露滅名齋丹霞鹿門金輪南臺息勞山之戍客踵紫柏以鉗椎其蠖伏而鸞舉也蓋不給于更數光參帝網威震毒鼓位揀君臣要兼賓主儼華藏之莊嚴又何論夫雙樹以故金碧璀玼堵窣穹崇比岫聯香接宇聞鐘花雨成蹊白雲在封埓石聽于道生擬鳥供于懶融苟息心于元悟豈來者之未工雖畫一于鄒魯展道大而必容要非包沕穆析鴻𪷟遴衆妙之所都建萬壑以逌宗則夫澒洞溔漾攢合蘢蔥者胡憑藉焉以孕大觀于無窮也與是故其為奧區也脈蜀踞楚拒粵引吳北吞黽厄南掩蒼梧顧陽雲而掉臂何台蕩之與匡廬浮洞庭綰濂浯帶瀟湘向背殊煌煌唐唐􅞶踔首出以參伍乎鄣都距北戒而絡漢廣紀南條以挂天樞道靡崇而莫奠功維奭而不渝皇哉有虞氏之慶也肆見羣后孟夏徂征爰服三苗乃敘南衡玉輅匪勞荆土載賓五圭儷帛一死二生誠無妄而苟薦辟奔走以載盈眄自他其匪稱格帝享于斗精渺江介而遙履作百王之典程嬴氏亂紀漢德中涼割長沙以建芮隘幅員于朱方濟三江其已惴矧雲夢之可航侈灊霍而僭號躋小星以專房羌惉懘于脂轄詎苾芬之能饗於戲陰禮陽樂徵皇王之貿軌者豈不偉與抑斂福之豐儉帝睞焉而以篤其棐也是以樂慙者綴促禮朴者俗鬼邈虞漢于霄淵互善敗其凡幾緬喬嶽而揆明禋繼皇媯其孰韙懷江永于比興髣南風于博依簡明德于炎精溢余思于有斐頌曰明明后胙來昌釐真人南翔翔陽維北漢沮漳南湘灕中合穹嶽雲葳㽔蒸哉我皇誕應之萬壽百祿重離明秩正川麓靈怡情報哉不遐朱鳳鳴綏我曾孫宅荆京靖興肇允與庚業業不傾補天石賚豫金簡遷禹迹帝錫元圭嶽之績蕩滌川原帝皇醳駿發炎光庶昕夕輝輝沄沄嶽精來陵嵩泰華恆若敦蒲姚安姒企相陪乃眷南顧曰念哉玉衡賁光天門開練鵲賦以雨餘緑草斜陽為韻即林臯之瀟淸滌繁陰於宿雨聊瀏愁以寓怡翩良禽之延佇維時條風微扇薄寒改煦雉登隴而初鷕鳦睨簷而作乳煙得得以靑縈絲亭亭而晴舞何彼鳥之嬋媛點碧光而翔圃曳搖搖之玫珮垂申申之玉組輕塵長捐屑暉並聚落星徐流鱗雲歘俯睢渙濯其餘縹岷潘浣其素縷吟喬如於梁禽睇子淵於吳馬笑丹頂之鳴陰陋銀􅐢之躞土爾乃罥弱篠過平蕪因風末乘晴餘尾垂垂以柔曼羽襜襜以旁􅨎宛飛帛之回波寫倒景而未如鄙秦聲之鴥彼哂魯謠之跦跦織吳嬪之膠髮服翾風之琲珠寶光纖其綾鑷因祗結其修裾曾煥發以蕭散猶則遠乎踟蹰亦有宏農贈環沙鹿授符魏闕樊燕葉邑羅鳧含珍絲頂之鳥繞煙縞臆之鳥或襲美於玉石或間采於紺朱潔縑翎之婉嬺泣邢美于尹妤若夫泛流鷺絲厭火屬玉名在縞而克諧文比潤而已辱彼何為兮運睛此何取乎拳足矧在幸鳥類蟬山雞名蜀蕖鴨傳丹么鳳矜緑防邱鴻鵝影娥黃鵠雙鶼銜丹海之泥三鶩照肺膏之燭雖復潔整翠襟芳修朱襮比月氅之孤淸陋藻火而必浴又況垂腴涎於竊脂觀朵頤於啄粟哀豳詩之無毀勞周官之服不形衆濁以獨醒贈遙情于芻束蓋其月鏡修姿瓊膏泛腦湔都崇之紫泉閟雲煓之瑞草曾偕奔於羿妃抑效御于金媪降子登于墉宮介阿環于靈島眷日暮而遷延阻人間之長道然且捨黛的捐弋皂貺靈飛愜幽抱鍊姹女以養形餐醍漿而卻老繁華夢之既銷豔心歇其如澡以故傅微霄而輕舉秉西淸之太皓駕蘋末以肅征問沆津而潛討疑碧虛于是非胎金虎之內寶爰是薄遊山椒遙映水涯足捎靑花咮掠蘭芽拂華露而如濡偃樵風以欲斜雖有鳥號之柘金僕之姑挾以韓嫣關以熊渠䁛逸姿之何篡終弋言之莫加遊芳林而遠害何螳雀之容嗟宜漢官之章服象黹繡於絳羅取在躬之洵美擬退食之委蛇叶音他若乃佻鳴珂之趙客媚袨服之吳娃指海山之雙鴛期白門之藏鴉望瑩質而逡巡疇同調於狹邪惟有幽人荔服逋客蕉觴行藥雲際間步夕陽飛鴻邈其遠送斥鷃樂其低翔寄息心于倦羽託持贈夫滄浪奚況時在停雲客有浮湘遺卬音于冥飛浣豫節于秋霜激白冠于易水鑒色斯于山梁感孤鶱之綽約倡豫和以不忘詛鴆媒于朔野悲鸞歌乎女牀鳳雖衰而旁覽鶡懷死以方將眷山情之窈窕敦白水以修盟抽紛絲而廣譬寫冰雪于瑤章孤鴻賦丙寅為石崖先生作耿元天之幽杳矗雲級之崚嶒夕光徽而凝黛雨紛屑而疑冰爰有失羣陽鳥遲回南徙音墜煙霄影搖寒水雍門子援琴而歌曰遙天亘兮杳無方九秋謝兮飛淸霜傷裴回兮孤往彌永夜兮悠長時則徽蚌泫其居泚瑤軫絶其寡絲墜籜零而栖禽惻瀫波驚而遊鯈悲蕭條四座志失魂離客有揚塵而起者曰何為其然哉夫物之所偶天之所郵介然相於泊然相儔為歡既乍其暌匪憂故河鼓絶軫於天津弱水迷望於東流顧翩飛之自若曾無傷於遠遰縱厥心之不康豈達人之攸纍可觀化以逍遙悲何為其最之哉雍門子嗒然有頃閔默不釋停凝俄延舍琴而作曰夫眄迹而觀其判合者未足以達悱然之緼久矣物之相翕有人有天有同原而異委有順化而偶聯水齊歸而各出木荄合而枝駢誠俱生以永結徹肌髓而勿諼則何怪夫感其煢爾而代以悢然也原夫羽族號萬函情或鮮唯此陽禽含貞來反當其草芽初肥桃波試暖韶風微漾素沙鋪軟鷇音方融毳茸尚淺偕唼喋以嬉旋幸芳洲之繾綣曾不知心魂隔乎異軀而蹤迹成乎疏遠已而六翮已長睥睨靑霄我襟子佩遵道齊鑣望雲逵於萬里詎折翼於崇朝豈其風苦月寒回首秦關商歘急而戒旦偕息駕以南還菰蔣稿而調飢姑忍􅊻繳施而行路悲難然且弔影矜雙尋聲知和垂翅雖頻盟心自可沐玉露之淸泠啄殘香於瓊顆嚮荻岸而同栖忘驚濤之屢簸於斯時也天海雖迷悲歡猶半風煉魄以森寒雨霑襟而零亂互梳翎以好修誓千秋於明旦何旻天之荒唐遽頽齡而飄散悲矣乎其聚無留其離無迹白日昭而忽馳靑春流而猶昔芙蓉死而紅霣白蘋凋而香匿楓零零以墜丹波渺渺而流碧驚鼯竄而為羣栖鳥啼而相即雖則回翔極浦留連沙磧孤魂自􅋏間愁孰戢豈溘爾之無期固難酬夫今夕蓋其為羣也不妄則其為念也不遷其為生也不獨則其為死也不捐女牀之歌匪願蘭苕之宿弗蠲唯指心於白水凌遙目之蒼煙矧俱生而聯氣疇惸孑之能全是以下窮汗漫上徹蒼茫黍米銜恤彌天悲涼亭皋凄其下葉潦水涸於津梁寒螿吟而凄冽莎草靡而藝黃苟憑今以􅑴往能驕語於憺忘也哉乃復整衽調絃別寄淸商吟猱繁亂曳響無方重為之歌曰天有涯兮人莫之知生有度兮復誰與疑誠不忍生存之一旦兮惘今昔之莫追謂焄蒿之仍相吻合兮恐達者之吾欺維時座客聞歌澘焉泣下鴻迹已遠餘哀未卸苟同類之必憐引長懷夫銷謝嗣遺操而微吟中牢愁而舒寫已焉哉抱涓子於窮年俟知音於來者雪賦以林岫遂已浩然為韻觀其紛紜崟嶔陟巘紆岑衒輕不舍趨潔如淫已迅征而忽返頃回即於空林有似去國之臣裴徊賜玦下山之婦悵惘遺簪魂搖搖而靡定窅莫慰其行吟曾岡兮下壑楓浦兮樾陰匪先諏其集止聽回風之浮沉均旻天之降命何流坎之莫諶其始也颯霅鏦錚蹇蹙䛠譳與風俱怒竄雲而驟態無暇於舂容音不成乎節族側候反則如伍相逃荆祖伊奔受甫蹍地而還驚遙望門而屢叩逝不我留怨容曳之流泉堅不我容惘停凝之巒岫踐薄冰而哀吟依荒草而幽伏符又反固已愴思士於穹崖悼征夫於遠堠矣迄乎寒雲既同層陰已遂上黮􅩙而薄天下迷離而無地倦飄颻於幕中杳不知其所詣於時羈晉南冠留邊漢使汾雲空白眄江漢以無方塞草不靑眷關山而奚至莫不俯仰同情悲生觸類何陵谷之遽遷敻浮浮以虛寄徒窘迫其寒悰夢春陽而奚至亙宵兮連晨彌漫兮未已疑月疑霜迷天迷水乍亭午之熒眸旋朔風之更起意申旦之方蘇問繁陰之凡幾嚴威巳忍偶屬望夫微暄沍凍猶凝渺孰知夫更始六方一色流目無垠疊嶂還增栗魂奚止此則逋臣埋迹於建陽築客銜悲於宋子所為乍馳意於淸熹終牢愁於填委者也若其平展素晶上酬淸昊靡幽微之不曜蠲繁蕪而如掃哂如玉之何溫厭投瓊之易好豈靑林淥水之足怡臨卭懷淸以為道則似海濱二叟山中四皓冰心旁徹於四維一志停凝其雅抱素瑩上結而大白若辱堅剛漸成而益壯於老任消謝之有期非余心之攸保暨乎微風動壑疏星在天隨雲俱斂與木偕遷乃有積林表之宛在映霽色而熒然斯則孔甲抱丹墳於魯壁圖南煉金液于華巔歆始春之載覯聊容與於暮年朝暾出谷而素顏益潤流霜沍旦而昭質彌鮮含綺霞之新影承璧月之初娟夫孰曰東風之不可與期兮惟鶯花之是妍霜賦戊辰庾子山身羈關隴神馳江介長夜修徂煢然忘寐起倚軒楹孤心流􅕉于是曉風息山明暉初日未耀零霜尚飛悵然閔默情逐霏微客有訊之者曰子其能為此長言之乎對曰何為其不然也如僕者際暄和之令景攬芳草之芊眠猶移歡以作怨將挈物以問天奚待此哉而後戞變羽之危絃耶夫化有所不可知情有所不可期貿遷榮悴曷其有涯而當之者適與相遘感之者濳與相移然則履霜之刺未諧貞感繁霜之怨獨有餘悲測淸氛於邂逅端有俟于孤羈昔者峰雲乍平商風漸展柳帶垂黃荷衣墜茜元禽猶飛蜻蛚已怨曠遼窅以涵空滌虛淸于遙甸先以涼飇申以玉露方珠顆之停勻棲徑枝而圓素已愴意于蒼蒹緬追懷夫芳樹胡玉琲之不堅遽趨新而舍故騰靈液之方升早不謀其搏聚氣母襲之於希微金輪碾之而容豫爾乃裴回夭裊依違蕭散似止仍留將合復判倚孅冶之娥嬴聊夷猶于霄半蹇遺影而薄遊匪宵光之可辨于時明河墜斜月橫遙天一碧霞綺收英雁含悽以暗度葉低墜而無聲忘知者之為誰獨旖旎而回縈宕幽情之蠲潔羌不炫夫瑤瓊爰就苔衣或依木杪豈蓄意以將迎聊栖遲而來紹眷井幹於桐陰集征蓬於江表長汀曼引以彌漫碧瓦平鋪而危峭逮于明星已爛微風不興迢遙萬頃極望晶瑩倒靑旻而涵素漾浮采而莫扃皚容淡而愈遠凜氣翕以如蒸榮衰草以留艷惜淺水之孤澄欺濃華之積雪惘戍削之曾冰於是長天益迥煙水增寒柏已凋而餘紫楓欲脫而彌丹沙廣衍以無際蘆孤飛而不還良闃寂以森瑟極百昌之摧殘眺玉峰於俄頃終銷謝以無端泣幽妻於故帷怨遷客於鄉關疇有恩而可醳疇有夢而能安當斯時也僕將何以為心哉墟煙微羃墜月初沈光淫淫而眩目寒惻惻以栖襟送南飛之驚鵲懷涔浦之靑林形長留而罔託魂猶在而莫任客有為之歌曰秋風徂兮三冬歸履輕霜兮授寒衣惘江關之已遠聊淫裔而莫違豫申歌之曰零露溥兮飛霜駛蕩纖弱兮散淸泚亙天涯兮凄以迷怊不識寒威之奚止于時四座緘愍相倚長謠負白日之不暄念蒼松之且凋厯千秋而寓愁兮曾不如晨霜之易消薑齋文集卷七終
