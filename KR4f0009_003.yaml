  text: 南窗漫記薑齋詩話卷三船山遺書六十六
  hash: sha256:52791937f8b6320c74f411e75d1d1b86db4cedd42886242c4680e6d850a30552
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4f0009_SBCK_003-1a}
body:
  text: 衡陽王夫之撰先徵君受學於伍學父諱定相先生先生詩文為南楚領褎先徵君與仲父牧石翁杖履周旋時相唱和末年斂意深靜不復屬意夫之幼曾見一箋為釋復支和先君韻者今忘之矣唯於卷尾得見過應山絶頂一絶句原草靑靑入望新歸雲將雨潤輕塵只今江北春將盡渺渺江南愁殺人戊辰春作也牧石翁有詩數百首亂後無一存者憶得三十六灣一首千里平湖水支分六六灣風橫帆影亂壑斷櫓聲間南北迷鄉望紆回滯客顔湘靈愁倚瑟徙倚碧雲間梁東銘先生志仁上元人早受學於吾鄉曾舜徵先生鳯儀以鄉舉宰衡陽淸執不合於上官左調羅田甲戌流冦陷城死之涖官繁穴不廢吟咏曾見其書扇一絶二句云再來只恐無尋處好記懸崖一古松可謂淸絶又入覲道中寄家兄叔稽近體四首中一聯云渡江十日酒遮屋五更霜置之薛許昌集中亦為拔萃矣亡友文小勇之勇有句云人誰從問字風不可開門於江西宗派體中自居勝地而其荒涼寒苦之狀簡傲絶俗之致亦槩可見矣小勇所居僦郊外一破屋每旦待糴而炊而長日一卷嘯傲自如斯人亡後戚戚憂貧未壯而氣衰者成乎風俗不復知此風味矣揭偶句於門廡柱壁蓋春帖之變體也以簡故益不易工己卯自鄂歸至城陵磯風厲檣折幸得登陸步自磯上走嶽陽小憩嶽侯祠見王澄川先生諱永祚題祠柱云為臣死忠為子死孝大丈夫當如此矣南人歸南北人歸北小朝廷豈求活邪允為警切矣庚寅秋與鄭子遺中丞遇於韶州子遺問黃鶴樓柱帖誰佳余未有以對子遺云禰衡洲上千年恨崔皓樓頭一首詩豈非獨步子遺名古愛江夏人壬午𥘉秋黃岡王又沂源曾熊渭公會同人於黃鶴樓與者百人各拈韻賦詩渭公作四言末章云試望木末好花翩翩淸明佳氣勃發楹前渭公以禫制不與秋試為同人祝也命意不落凡近淸明者豈科名足以當之渭公篤志正學有與李文孫論致知書破姚江之僻為余序詩以睂山淮海為戒著緯恤一帙皆四言也有云帝命元老黃屋左纛黃屋左纛命之莫保以追刺武陵相荆襄僨事而死也壬午殘臘小艇泊南昌城下寒雪透篷窗不可忍時張都御史鳳翔方履江撫之任自揚州駕大官舫已登陸舟停水次因僦之度歲其中窗間有題句云行人莫上長堤望楓葉蘆花處處愁似是古句墨迹尚新於時天下方將亂事無不可悲者見此令增慘淡鳳翔以監司賄致節鉞志意已滿當不知有此語或其幕客所書則亦一有心人也南昌城北龍沙四圍素沙環擁如銀城雪島中平敞為禪室有湯義仍手書門聯云池開沙月白門對杏榆淸數十年矣楮墨未損悠然想見其揮毫之頃滕王閣連甍市廛名不稱實徒以王勃一序膾炙今古求所謂飛閣流丹飛雲捲雨者何有也吳下管元心正傳令永新作一絶書版懸閣上末句云爭傳畫棟珠簾句江上蘋風笑殺人高彚旃先生選士於濂溪書院課習之省試後慰諸不第者以詩一聯云鳥自嚶喬木魚無羡武昌敦友誼薄榮名人師之語也河山無地求弓劍臣子何心飽稻粳滅絶耳根猶有恨破除心事倍多情章文毅公守湘陰時作也見之巴陵李天玉興瑋扇頭天玉公門人攝臨武令城陷死之堵牧遊先生遊南嶽問余兄弟避冦處於方廣道中有句云雙溪濺水鳴絲竹一壁初晴負畫圖牧遊先生於德慶舟中授余軍謠十首令傳之其題則月家鄉馬兒女雨漿洗風曬晾筆先鋒口打仗報瘧疾碁金丹血筵席營十殿僃喪亂艱危之狀天下之不支公心之徒苦俱於此乎傳之流離中遽失其稿唯憶其營十殿云烏雲覆眼血牙紅九殿不及十殿凶九殿披枷還帶索十殿披毛更戴角生生死死九殿中愼勿喫他犬豕藥上湘淇伯修業嘉與同邑龍季霞孔蒸以吟咏相尚擺脫凡近往往得霜鶴唳空之致丙戌開楚闈於衡陽伯修落第歸徑嶽後賦詩六章寄意宏遠視唐人榜前潛下淚衆裏卻嫌身如鱉咳耳如云洞雲無故常飛雨蕙帳何心獨嗜蘭既俯仰卓然矣至云雕弓白馬三軍客碧杜青蘅一港風憂世之心視杜陵為尤藴藉又云自有古今皆作客河山相看不相知曹劉咄咄三分耳孫阮仙仙一嘯時此豈經生心腎中所能有此種性者未幾為亂兵所害何從更得斯人與遊大雅哉季霞與王山長岱夜話詩云竊聽誰窗外琅然動壁琴蓋季霞欲與湖上作者矯竟陵纖弱之習追蹤大雅而有志無時與伯修同時遇害悲夫丁亥春余以窮愁客上湘日與伯修季霞歐陽子私淑江陵李廣生芳先痛飮忘昏曉一夕渡漣水就宿僧舍斜月未沈碧波流映余舉楊大年以鏡中人似面前人對水底月如天上月語犯合掌而意味短淺季霞曰何似鬢邊霜作鏡中霜余代云夢中身是故鄉身劉杜三自煜雖早託胎於竟陵而不全墮彼法往往有深秀之句其將入閩應召徑衡有夜宿前溪去郡三十里見寄詩飄零吾久矣離亂欲何之愁絶遙天暮哀餘斫地時南音同在耳西爽獨支頤相見情無限何能盡所思固自惻惻警人不昧杜三後有寄豫山中詩亦足增人愴然之懷病鶴無枝帶箭飛經年蕪穢惜漁磯繞牀行腳同香飯哀築當筵仍故衣築室喜聞名士並望門真被酒傭非一蛇霧隱南天遠綿上何人問割腓丙戌屯師湖上未能前進一咫而賦斂之重十倍少司馬天門郭公都賢咏雪詩云四望郊寒連島瘦一天白起奈蕭何督使聞之怒甚嗾悍帥害之會潰敗不果公卒以文字取禍卒於江陵倪文正公贈公詩云愛他風骨耐他粗善於言公者也僧詩本不足拊於檜曹之末唐宋諸名髠技止此耳況今日哉識量止於其域大無能攝微無能入也余所見者僧法智一絶有云一步一花無別意香來熏透破袈裟差為蔬笋之雄郭季林有涉園草一帙竟陵體也其有意致者良自灑然為摘録之性情皆有託不但得為人即如彼風雨孰知非周親至德不礙己豈復以等倫觀賽天山不可名雲氣與之平暑退石苔潤涼生樹葉輕細聽蟬翼寂遙感鴈來聲淡爾平林際深黃半熟橙秋雨萬山環列一茅享兀立橫空出杳冥聞説高人長飮此只堪獨醉不堪醒過劉子參山亭豈非天下士所重世間名令我南原上長吟憶耦耕此季林見懷詩也余度嶺孤心雖未能見諒然季林自率其退靜之情殷勤以相規正固自不忍忘之李林名鳳躚東莞張太史家玉諡文烈以全髮起義兵敗墜馬而卒家人刻其軍中遺稿有詩近百首唯記其一聯云真同喪狗生無賴縱比流螢死有光太傅山陰嚴公于端州行宮閣內書芭蕉葉云臣節唯知懷一冷王言不敢褻雙溫於時有卿二蒙溫旨者但得一褒語因詆公不知典故票擬失辭云九卿例得雙溫蓋競躁之妄言耳故公書此以見意黃岡晏雲章奉常明作排律二十韻以內閣芭蕉為題余和之今皆忘矣唯記晏作一聯云天情垂湛露海氣避嚴霜余亦有句云甘露憂多變緑雲望已長挑鐙説鬼亦無聊飽食長眠未易消雲壓江心天渾噩蝨居豕背地寬饒禍來只有膠投漆病在生憎蝶與鯈劣得狂朋爭一笑虛舟虛谷儘逍遙金衛公堡詔獄後足折臥舟中余往省之書此見示時余拜疏忤羣小怒亦將謝病入山矣太傅瞿公築別館於桂林東岸宮詹張公題春帖云當階古樹思堯叟隔岸江山憶伏波桂林道上松宋陳堯叟所種桂林東門外有伏波試劎石故云二忠遺筆流傳人間自有傳之者此亦吉光片羽芋巖李敬公國相遺稿屬余訂定今録其佳句云春流一道飛蒙茸嫩柳柔荑間新紅輕鷗點點飛掠水夾岸桃花笑春風春風度水搖青練溪上落花如飛霰初陽掩映白雲間唯有白雲光一片春日溪上有寄頻年寒食山之陲柳綿撲人今者悲春草漫生滿芳甸春風飄落桃李枝桃李花飛春欲晚溪流東逐長江遠白雲飛去還飛來飛盡白雲人未遠寒食山中懷人絶壑愁難託遑知自有身因之徵旅況能不念伊人日月無私照山川有異垠懷哉于役者落落聽風塵懷管冶仲百粵孤櫬淪荒域生離一夢慳問天孤鴈字無地釣魚灣挂劍情誰寄焚琴恨未刪蒼梧有舜迹君志在其間哭夏叔直九疑朅來祁連風鴈行吹忽斷南北各天涯驚魂落空彈沙漠嚴寒難久客遙望衡陽孤岫隔洞庭秋水眇愁余日落長汀蘆花白欲往從之煙水迷誰嚮深林送飛帛開函讀之淚橫流一別二十有八秋鴻飛冥冥千仞外稻粱滿野非所求孤鴈孤飛孤自哀多君兄弟共裴回獨我此心無可語深秋夢逐鴈峰來嘉魚李雨蒼占解己酉寄余此詩云欲涉湖相訪時年七十矣閲兩歲遂長逝不果所至雨蒼大崖先生裔孫國亡後不應公車唐須竹為余過其家省之蕭淸戶庭猶楚雲臺風味也楚雲臺白沙築於嶺南以館大崖者方密之閣學逃禪潔己授覺浪記莂主靑原屢招余將有所授誦人各有心之詩以答之意乃愈迫書示吉水劉安士詩以寓從臾之至余終不能從而不忍忘其繾綣因録於此藥鐺一爐煎霜雪堆頭紙信傳松葉到春原墮地竹花再種更參天縱遊泉石知同好踏過刀鎗亦偶然何不翻身行別路瓠落出沒五湖煙小築如拳之室戲作數詩或和之唯芋巖一首深為枯木撤花軀殼為誰留相看已白頭從人嗤倔強責自僃春秋寒盡鴻聲斷春歸草色柔餘霞擎晚照峯翠逐人流鳳皇集阿閣麋鹿遊山樊物性固有常甘苦能並存偶思遠塵囂隨意尋桃源自怡得間曠臨江啓柴門江光散白雲高枕淸心魂形骸已漸忘涕淚聲久吞徒欲憤韓讐深負國士恩材與不材間願其達者論此雲壑於普市見寄詩余之交於雲壑以此人無知雲壑者勿望其更知余也君歸耽石室余亦泛星槎自度桃源境頻尋洞口花江淸一鴈遠天碧數峯斜雲水蒼茫際相思路轉賒雲壑介弟聯珵寄余作也蒙聖功給事正發欵乃聲九十首曾授余訂之其警句則有片帆影挂前川月透枕霜淸五夜鐘藥市藏名嫌有價鷗羣不亂信忘機荆臺不樂呼先輩高閣從來束腐儒千里孤身分兩地一天雪意釀同雲潭經積雪波增力樹過重陽葉盡凋更擬卜居遷赤甲遙憐知己在丹霞丹霞淡歸所居淡歸者金道隱堡盡簡圖書藏一葉併裝風雨過三門臨流蒼壁霑衣翠隔岸懸崖當畫看高峯影浸寒潭黑絶壁光生晚照紅明犀照水終嫌逼寶劍沈淵免再探小槳不驚浴鶩穩回潭時積落花深詎可不謂句意雙到南窗漫記終薑齋文集卷三船山遺書四十六明衡陽王夫之撰序五首詩傳合參序學效也聞之説曆者曰用郭守敬之曆而不能用其法非能效守敬者善夫其以善言效也故易曰擬議以成其變化擬議變化如目視之與手舉異用而合體變化所以擬議也知擬議其變化則古人之可效者畢效矣然而不知擬議者其於變化猶幻人之術也眩也終古而弗能效也以詩言之朱子生二千年之後易子夏氏而為之傳奚效乎效子夏氏爾子夏氏於素絢之詩同堂而異意故能效夫子之變化以俟朱子朱子於三百篇正變貞淫之致同道而異詮故能效子夏之變化以俟後人善效朱子者可以知所擬議矣伯兄石崖先生曰吾以序言詩而於生平諷誦所蓄疑而未安者自覺為之豁如覺其豁如者覺也覺者天理之舍古今之府以效古人而自覺者也故一曰學覺也覺生於擬議而效成乎變化斯以悅心研慮而無所疑乃若愚所謂眩者則非此之謂也竊二氏之土苴建為門庭以與朱子訟戴古本為冒鏑之盾究亦未知漢儒之奚以云也一字之提不問其句一句之唱不問其篇矯揉聖教而惟其侮倚其附耳密傳之影響而不得有一念之豁如若此者固愚兄弟所過門不八而無憾者奚忍與黨同而伐朱子之異哉先生此編一以子夏序為正而固不怙也曰即出於衛氏而亦為近古其遜志而不敢誣亦於此見矣絲衣之序云高子曰靈星之尸也靈星之祀詳見應劭風俗通蓋漢人之淫祀子夏親授詩於夫子高子其何稱焉故曰即出於衛氏而亦為近古以俟後哲無慙已種竹亭稿序江天風起高閣秋新把酒酹空問騎鯨弄黍之客人有賦心仙依客影不知今之以白首對江山遽為殘夢吟蔚子各懷佳月人在春風之句何以還酬夙昔哉陽禽回翼地遠天孤一線斜陽疑非疑是江湖皆矰繳之鄉沙塞杳帛書之寄刀兵隊裏有臆無詞生死海中當離言合蕭蕭笳吹酒夕驚寒此蔚子所為磊落之胸哀歌河上者也及夫半塘畫舫荷柄通觴曲徑幽花蕉光炫夢覽鏡雖霜為歡亦夜長夏尋梅關心物外花時看盡看花人蔚子之心遠矣乃前度劉即已隨逝水苔生半畝笛怨山陽則余與蔚子雙影相憐不禁神盡又何足以長言邪嗚呼悲愈之情極乎壯老俯仰之致况有滄桑凡前三者苟得一焉足以春懷杏影之橋秋問瓊寒之闕矧自把臂以來莫匪銷魂之地乎問道錫山相期何似萬端迂折一寄長吟共此湘湄各有眇眇愁豫之旨而余少於蔚子衰乃倍之貝廷琚語兒新月楊廉夫紅幕春嬉皆以屬之蔚子爾袁伯業老而好學陸務觀取以名菴蔚子交遊半天下而存者幾也余幸而存不禁為蔚子瀏漣亦何能不為蔚子勸勉與殷浴日時藝序家則堂南歸以春秋教授則未知其所授者以道聖人經世之意邪其以為所授者羔鴈之技邪夫必有辨謝侍郎賣卜與子言孝與弟言弟則授以道矣庖丁曰臣之所好者技也而進乎道技道合則則堂可無河漢於疉山何也其登之技者敬而樂也敬業以盡人樂羣以因天進乎道矣甲午避兵入宜江山中有姪子之慟浴日拂拭而慰之少間無以閲日浴日始以帖括見示繼此而宜江士友泛晉而與余言帖括十年來乍駭人以未能嘗試余怵然懼觀既止要其能敬以樂無能度驊驑前者余以知浴日之天至而人全與之因天與之盡人余乃脫然釋其懼於浴日言必有所牖意必有所肖未有言意以先諧而譎者導人以往無敬之心則納其媚矣方有言意以放恣而逞者迫人於來無樂之度則用其爭矣今求浴日於御意擇言之際索其媚與爭者無有僩然油然文非道也而所以御之擇之者豈非道哉故余樂親浴日而不懼而後遂忘其泛也實自此始基之浴日少與余同文場已與余同漂泊今又與余同為訓詁師以自給而浴日多幸浴日雖貧有親可事有從子之孤可恤敬以樂有所施矣書曰令德孝恭其敬之謂也詩曰子子孫孫勿替引之其樂之謂也以意徵言將期於道有知言者當謂余非與浴日言技矣劉孝尼詩序楚之學騷者王逸然圓紅淸江之句耀人肌魄愚謂左徒嫡系果在劉復愚矣或者汨羅之流北滙於湖岷江雪液奪其鱗鱗皛皛之致唯湘有騷不許他氏之裔􅑴流而揖之下也友人劉孝尼著山書者余知之七年矣南諸侯未登進之絃歌俎豆之側江蘺吟晚破荒無錢復愚所謂歌則其時者今古一揆想當悽斷故肅其使烹其鯉讀其詩朱晳陸離既似粲者雜以羌蘆節以靈瑟邊馬心歸南妃淚盡葉蕭條於九月靑繚繞於數峰莫自抑其悲來問誰蓍其魂往洵天地之大百水涌滕瀾漪萬變雖欲競其濯騷之力於沅南瀟北之上而不可得夫豈公安竟陵以白蘇郊島之長技容與三澨七澤之間可投袂而爭窒皇之駕哉天淸水碧雲緑蘋香唯我坐擁而收之固將絀淮南小山湔上男子於閏位矣余雖羸者請與孝尼狎主齊盟裹菁茅搴芳芷就銅官鑿石之遺壘以爭長於列國千載悠悠誰令禁之不必見來者而屬之似續也王江劉氏族譜序王江諸劉潛明經是玉氏湘孝廉若啓氏奉季昌先生之志修其家乘以示夫之而徵言焉夫之拜手而言曰夫禮之不可以已也如是夫禮者天之秩也其在詩曰有秩斯祜天之所秩而天祜之祜者以祜其秩也劉之先長沙定王以漢懿親而食南國安成者思侯之所胙也沱潛荆沔者長沙之流滙于江漢而同潤乎南條者也湘上者固長沙之國邑也定王之祜紀於南國而諸劉之盛因之豈不以天哉夫之遂言曰夫禮立本以親始率先以崇孝統同以益愛紀分以辨微尚賢以昭德旌貴以起功立訓以著義廣類以奬仁順古以作則俟後以行遠十義賅焉故曰天秩之也允哉劉氏之譜其族乎昉于陶唐肇于炎漢而子孫繫焉親始者也六十年而一續續而不失其先崇孝者也諸劉之族散衍于南國而合于一益愛者也有合族焉有分族焉合者順而下之則分分者􅑴而上之則合辨微者也先世之行誼章者不溢微者不忘逮乎閨門之懿而僃昭德者也勤于王家升于司馬薦于鄉造于太學斆于庠序奕奕列焉起功者也發其美效在是矣著義者也所貴者生也而録之僃奬仁者也文定象山誠齋之三君子者嘉言賅而存焉作則者也勿替引之以相長而待乎後之裨益行遠者也斯十義者天之所秩祜者以祜其所秩夫禮誠不可以已如斯夫夫之終言曰禮始於親親有類類有感感者感其所同夫之之舉于鄉也與若啓氏講以世后長氏偕以年而協以寀夫之伯兄既與若啓氏講而遊辟雍之歲與季昌先生壽玉氏聲玉氏賜玉氏胥以齒然則以類而感感而秩以其言夫亦竊禮之遺意也與書後二首讀陳書書後人能為天不可為當其亂之難訖天且縈紆以延衍之極乎其終天力盡天情且息猶未嘗無千金一瓠之幾然且拂亂以即於傾仆斯誠可為之大哀也矣江左厯四代而至陳前此者晉能合已散之天下而一之宋武人傑也齊高梁武整昏亂之紀綱規恢略定故乘童昏以攘大寶而天不厭之以為差愈於北方之蒙也陳武帝以遐方小挍器止斗筲忽起而干天步立國三年穴鬬不解救死不暇遑問紀綱流血相仍無言生聚侯安都淳于量章昭達之流以村塢之雄承乏秉鉞而周迪留異陳寶應掉臂狂呼屢相蹄齕陳之自崩自坼以趨入于亡一夫折箠而收之固必然之勢也而吳明徹督星散之旅徼功淮北奪七十餘城幾半齊土使天不假周卷齊以相臨幾於興矣乃策勳未幾故版旋亡一覆于呂梁而兵􅑒將俘如疾風之殫脫葉蕭摩訶之言違於俄頃朱雀之潰應如鼓鐘豈非吳明徹之不謀其終而陳主之未量力而度智也與夫為國之道不以國戲將者國與民之司命不以身戲武鄉六返復拔西縣晉追符寇不踰長淮使能於喪亂之餘勤修內治休養數十年內無篡奪之禍兩河二京未嘗無收復之望而明徹悉殘陳之力扶尫罄罍爭匹夫之氣以取必於一死陳所恃者一旦向盡故知南土之灰飛不待叔寶之昏庸也東野子之馬力盡矣不亡胡待焉故善承天者當其有餘愾乎若不足及其不足則欿乎若無之幾虛幾盈天乃復至而君臣將吏虛枵浮起無反是之思以乘隙而徼幸此用兵之大戒抑為國者之永鑒已使明徹能從蕭摩訶返呂梁之斾我氣不盡敵威不增保固長淮宇文氏猶將憚焉然而賈豎之智沒於小利內不量己外不度物所謂逢運之貧壞不可支者也司豫之功猶屬弋獲又足見天拊衰運未嘗不眄睞重疉佑人於離絶渙散之餘而弗克承天者自趨沈沒天之不能延司馬氏之人民以徯武德也豈得已哉豈得已哉讀李大崖先生墓志銘書後夫之讀白沙先生集而有疑焉疑當時之授宗旨於江門者自張廷實林緝熙以及乎容貫陳冕之流洗髓伐毛於釣臺之下無幽不抉以相咨印而白沙所珀芥以弗諼者則唯大崖先生其唱和詩幾百篇抑未嘗以傳心考道之為娓娓視彼諸子者言不勤矣以此疑而思思而不得者蓋數月乃置其往還唱和之迹而設身以若侍兩先生之側者又數月而後庶幾若見之嗚呼兩先生之映心合魄而非張林容陳之得與者豈其遠哉白沙之於一峰猶是也於定山猶是也於醫閭猶是也於汝愚猶是也其時相與接迹者前為三原後為楓山雖未嘗與白沙遊大崖亦未嘗造膝焉而亦猶是也逾此而外交臂失之者多矣白沙沒諸君子亦先後謝世宏正以降此意斬焉又降而言學者輩興建鼓以求亡子其所建者非所以求也而所亡者固其子而亡之也則使以泰州龍溪之心測兩先生相與之際而期其遇之也不亦難乎而況於其徒之瑣瑣者乎記曰天下有道行有枝葉天下無道言有枝葉江門風月黃公臺披襟而對之扶疏蔥蔚拄靑天而蔭滄海言惡足以及之哉先生裔孫雨蒼氏占解年七十有三矣以王文恪公所撰大崖墓志銘寄唐生端笏使與夫之共讀謹識其後以訊雨蒼當如面談矣白沙送大崖還嘉魚詩曰富貴何欣欣貧賤何戚戚一為利所驅至死不得息夫君坐超此俗眼多未識乃以聖自居昭昭謹形迹敬為雨蒼誦之跋一首耐園家訓跋吾家自驍騎公從邗上來宅於衡十四世矣廢興凡幾而僅延世澤吾子孫當知其故醇謹也勤敏也乃所以能然者何也自少峯公而上家教之嚴不但吾宗父老能言之凡內外姻表交遊鄰里皆能言之至於先子仁慈天篤始於吾兄弟冠昏以後夏楚不施訶斥不數數焉然以夫之之身沐庭訓者言之或有蕩間之過先子不許見不敢以口辨者至兩三旬必仲父牧石翁引導長跪庭前牧石翁反覆責諭述少峯公之遺訓流涕滿面夫之亦閔默泣服而後得蒙溫語相戒夫之之受鴻造於先子者如此然且忠孝衰於死生之際學問惘於性命之藏白首無成死螢不耀則夫為父兄者以善柔便佞教其子弟為子弟者以諧臣媚子望其父兄求世之永也岌岌乎危矣哉吾伯兄律己嚴而慈仁有加於先子夫之嘗請益焉然夫之自不能言物行恆迪威如之吉又安能不自疾愧邪伯兄之立身立教大率皆藏密反本為用愚者弗知爾晏子曰唯禮可以已亂旨深哉伯兄睦修家訓導子孫以可行酌古今而立畫一之規禮意於是存焉為吾子孫者讀而繹之遵而行之察其所必然而喻其莫敢不然何遽不雷霆加於頂冰雪浹於背乎禮之水無他愛與敬而巳矣親親者愛至矣而何以益之以敬夫子曰子也者親之後也敢不敬與為父兄者不以諧臣媚子自居而陷子弟於便佞善柔之損敬之至也尊以禮涖卑卑以禮事尊易曰家人嗃嗃未失也婦子嘻嘻失家節也節也者禮也奉伯兄之訓父兄立德威以敬其子弟子弟凛祗載以敬其父兄嗃嗃乎禮行其間庶幾哉可以嗣先可以啓後不然吾所不忍言也伯兄傾背從子敞刊其訓以傳於後非徒尚其拜稽儀文之節也有精意存焉夫之蔽之一言曰嚴非夫之之私言也易曰家人有嚴君焉父母之謂也鬼神臨之吉凶隨之尚愼之哉柔兆攝提格之歲律中㽔賓中浣穀旦季弟夫之跋薑齋文集卷三終
