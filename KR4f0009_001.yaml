front:
  text: 薑齋文集卷一船山遺書四十六
  hash: sha256:909839910751d34460d01e37a82fd120019000b0b5abb5fe4e2d5079bc851170
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4f0009_SBCK_001-1a}
body:
  text: 衡陽王夫之譔論三首知性論言性者皆曰吾知性也折之曰性弗然也猶將曰性胡不然也故必正吿之曰爾所言性者非性也今吾勿問其性且問其知知實而不知名知名而不知實皆不知也言性者於此而必窮目擊而遇之有其成象而不能爲之名如是者於體非芒然也而不給於用無以名之斯無以用之也習聞而識之謂有名之必有實而究不能得其實如是者執名以起用而芒然於其體雖有用固異體之用非其用也夫二者則有辨矣知實而不知名弗求名焉則用將終絀問以審之學以證之思以反求之則實在而終得乎名體定而終伸其用此夫婦之知能所以可成乎忠孝也知名而不知實以爲旣知之矣則終始於名而惝怳以測其影斯問而益疑學而益僻思而益甚其狂惑以其名加諸迥異之體枝辭日興愈離其本此異同之辨說所以成乎淫邪也夫言性者則皆有名之可執有用之可見而終不知何者之爲性葢不知何如之爲知而以知名當之名則奚不可施哉謂山雞爲鳳山雞不能辭鳳不能競也謂死鼠爲璞死鼠不知卻玉不能爭也故浮屠老子莊周列禦寇吿不害荀卿楊雄荀悅韓愈王守仁各取一物以爲性而自詫曰知彼亦有所挾者存也苟懸其名惟人之置之矣名之所加亦必有實矣山雞非鳳而非無山雞死鼠非璞而非無死鼠以作用爲性夫人之因應非無作用也以杳冥之精爲性人之於杳冥非無精也以未始有有無爲性無有無無之始非無化機也以惡爲性人固非無惡惡固非無自生也以善惡混爲性歘然而動非無混者也以三品爲性要其終而言之三品者非無所自成也以無善無惡爲性人之昭昭靈靈者非無此不屬善不屬惡者也情有之才有之氣有之質有之心有之孰得謂其皆誣然而皆非性也故其不知性也非見有性而不知何以名之也惟與性形影絕夢想不至但聞其名隨取一物而當之也於是浮屠之遁詞曰有三性茍隨取一物以當性之名豈徒三哉世萬其人人萬其心皆可指射以當性之名不同之極致算數之所窮而皆性矣故可直折之曰其所云性者非性其所自謂知者非知猶之乎謂雲爲天聞筍葅而煮簀以食也老莊申韓論建之爲道術推之爲治法內以求心勿損其心出以安天下勿賊天下古之聖人仁及萬世儒者修明之而見諸行事唯此而已求合於此而不能因流於詖者老莊也損其心以任氣賊天下以立權明與聖人之道背馳而毒及萬世者申韓也與聖人之道背馳則峻拒之者儒者之責勿容辭也拒其說必力絕其所爲絶其所爲必厚戒於其心而後許之爲君子儒言治道者吾惑焉於老莊則遠之惟恐不夙於申韓則暗襲其所爲而陰挾其心吾是以惑而甚惑其惑之甚也夫師老莊以應天下吾聞之漢文景矣其終遠於聖人之治而不能合者老莊亂之也然而心猶人之心天下則已異乎食荼臥棘之天下矣下此則何晏王戎以弛天下而使亂然其所爲求之聖人之道而不得求之老莊而亦不得虚與誕聖人之所弗尙躁與貪亦老莊之所弗尙則遠之必夙者正也老莊之所弗尙則不得舉何晏王戎之罪罪老莊也夫申韓而豈但此哉韓愈氏曰仁義之言藹如也聖人之欲正天下也亟其論治也詳今讀其書繹其言蔑不藹如也其言藹如也其政油如也患天下之相賊而不以賊懲賊懲天下之賊規乎其大凡而止雖有刀鋸而不損其不忍人之心畧其毫毛揜其幽隱以使容於覆載之閒而民氣以靜是故匹夫之蹶然以惡怒非可逆也匹夫之蹶然以愉快非不可獲譽也然而聖人不忍徇之以致善治之名有人於此匹夫蹶然而怒其可殺邪從而殺之匹夫蹶然而喜喜怒如匹夫之心則明斷之譽蹶然而興而氣茀然而權赫然靜反諸心而心固怵然起視天下而天下紜然爲君子儒者以此爲愉快則抑不得爲聖人之徒矣聞之曰惡不仁者不使不仁加於其身未聞惡不仁者不使不仁者之畱遺種於天下也悲夫自宋以來爲君子儒者言則聖人而行則申韓也抑以聖人之言文申韓而爲言也曹操之雄也申韓術行而敺天下以思媚於司馬氏不勞而奪諸几席諸葛孔明之貞也扶劉氏之裔以申大義申韓術行而不能再世申韓之效亦昭然矣宋之儒者胡㦧莫懲而濳用之以徇匹夫一往之情吾聞以閨房醉飽之過掠治婦人以徵士大夫之罪矣吾聞其聞有赦而急取罪人屠割之矣非申韓孰與任此而爲君子儒者以爲愉快復何望夫袴褶之夫刀筆之吏乎是其爲術也三代以上無尙之者也仲尼之徒無道之者也三苗之所以分北也鄧析之所以服刑也自申韓起而言治者一不審而卽趨於其塗申韓以矯老莊而拒老莊者揖進之夫老莊則固衋然傷心於此矣老莊非也其衋然傷心於此者未嘗非也仲尼不以徇魯衞而老於下位文王不以徇商紂而囚於羑里我知其衋然傷心者倍甚於老莊則已知老莊之賤名法以蘄安天下未能合聖人之道而固不敢背以馳也愈於申韓遠矣畫之以一定之法申之以繁重之科臨之以憤盈之氣出之以戍削之詞督之以違心之奔走迫之以畏死之憂患如是以使之仁不忘親義不背長不率則毅然以委之霜刃之鋒曰吾以使人履仁而戴義也夫申韓固亦曰吾以使人履仁而戴義也何患乎無名而要豈有不忍人之心者所幸有其名以彈壓羣論乎易動而難戢者氣也往而不易反者惡怒之情也羣起而熒人以逞者匹夫蹶然之恩怨也是以君子貴知擇焉弗擇而聖人之道且以文邪慝而有餘以文老莊而有老莊之儒以文浮屠而有浮屠之儒以文申韓而有申韓之儒下至於申韓之儒而賊天下以賊其心者甚矣後世之天下死於申韓者積焉爲君子儒者濳移其心於彼者實致之也君相可以造命論聖人贊天地之化則可以造萬物之命而不能自造其命能自造其命則堯舜能得之於子堯舜能得之於子則仲尼能得之於君然而不能也故無有能自造其命者也造萬物之命者非必如萬物之意欲也天之造之聖人爲君相而造之皆規乎其大凡而止雨以潤之而有所湮日以暄之而有所槁謳歌者七怨咨者三毅然造之而無所疑聖人以此可繼天而爲萬物之司命安之危之存之亡之燕越不同地老稚不同時剛柔不同性規乎其大凡而危者以安亡者以存若夫物有因以危亡者固不恤也乃若欲自造其命則必其安而百不一危也存而百不一亡也榮而百不一辱也利而百不一鈍也各自有其意欲以期乎命之大順則惡乎其可也故黃帝則有蚩尤舜禹則有三苗夏則有有扈周則有商奄仲尼則有匡有宋有陳蔡弗能造也然則唐之有郭子儀卽有安史有李晟卽有朱泚姚令言源休有陸贄卽有盧𣏌裴延齡弗能造忠賢而使有弗能造姦慝而使無弗能造也受之而已受之以道則雖危而安雖亡而存而君相之道得矣李泌曰君相可以造命一偏之說足以警庸愚要非知命之言也至大而無區畛至簡而無委曲至常而無推移者命也而人惡乎與之天之命草木而爲堇毒自有必不可無堇毒者存而吾惡乎知之天之命蟲魚而爲蛇鱷自有必不可無蛇鱷者存而吾惡乎知之弗能知之則亦惡乎與之天之所有非物之所欲物之所有非己之所欲久矣唯聖人爲能達無窮之化天之通之非以通己也天之塞之非以塞己也通有塞塞有通命圓而不滯以聽人之自盡皆順受也明君以盡其仁無往而不得仁哲相以盡其忠無往而不得忠天無窮聖人不自窮則與天而無窮天不測聖人無所測則物莫能測外不待無彊敵內不待無盜賊廷不待無頑讒野不待無姦宄歲不待無水旱國不待無貧寡身不待無疢疾不造有而使無不造無而使有無者自無而吾自有有者自有而吾自無於物無所覬於天無所求無所覬者無所撓無所求者無所逆是以危而安亡而存危不造安故不危亡不造存故不亡皆順受也奚造哉造者以遂己之意欲也安而不危存而不亡皆意欲之私也而猜忌紛更之事起矣臣以意欲造君命者干君之亂臣子以意欲造父命者脅父之逆子至於天而徒懷干脅之情猶以羽扣鐘以指移山求其濟也必不可得已天命之爲君天命之爲相俾造民物之命己之命己之意欲奚其得與哉倣符命闕連珠二十八首連珠葢聞銅山雖應瓦釜不鳴嶰竹非均葭灰何感蟻駒善達難通窒曲之珠雛鶴能鳴猶選在陰之和是以龔生亢志莫諧楚老之心惠子狂言顧愜濠梁之賞葢聞嘉穟盈車非擅萬斯之利名駒千里猶邀一顧之榮材有讓乎猶龍道有超乎維寶是以功加睂睫大匡之器猶微風起丹靑百世之聞不鮮葢聞泠風和而響逸天鈞逾乎女絲甘雨降而流長物潤深乎抱甕百昌有所自興八音有所自兆是以傅說符星先遜心於河上董生致雨夙屏迹于園中葢聞附形者影形卽蔭而已藏動草者風草入飊而不遠知合離之異致斯文質之同宣是以專己保殘莫喩斲輪之巧道存目擊方收伐輻之功葢聞勁草不倚于疾風零霜則變靑葵善迎于白日宇曖斯迷故天籟無假于宮商貞筠不爭于柯葉是以壽者之恭火滅而矜其鞶帨幽人之坦途歧而範我馳驅葢聞矜容者有經日之芳工歌者有彌旬之韻質已逝而風畱絪緼自合聲已希而氣動繚繞尤長是以虞夏之心益焜煌於北海丹墳之業不隕穫于嬴秦葢聞盤盂之水能涵萬仞之山膚寸之雲遂洒三途之軌下知上者維澄而遠高臨卑者以妙而均是以至人懸今以待後挹取聽之物求哲士類古于方今感觸如其面覿葢聞金注移情猗卓之容不徙寶劒奪目晉鄭之鬒巳凋故博有祗以禦窮而非任難于自保是以卮言日出徒銷堅白之鋒守口如瓶別有通微之致連珠有贈葢聞晴徹微霄密警應龍之雲想寒凝沍宇已生靑皥之春情八表待一人之幾萬古集斯須之念是以先天無惕氣有動而必開首物不驚時當機而必協葢聞物生於氣韶風唯昌緩之宜位定於天崇嶽示防閑之則先聲不爽於玉衡蟲魚且應大矩不迷于璇表星日咸安是以洪流未乂后夔不以虚器而不咨風雨方搖史佚不以浮文而弗御葢聞元霄欲授榑桑之耀景初收甘雨將來鳴葉之孔威必振勢極重者反不得輕天化無因循之待情已圅者應無俟定羣心在俄頃之閒是以陸子昌言必矯先秦之滅裂魏公辰吿力爭五葉之遷流葢聞小者大之具體九州一亞旋之情輕者重之本根三代止晨夕之事導千縷以持經緯焉皆就積羣柯以蔭本枝乃彌昌是以薪樗僃理豳吹叶婦子之歡牡蘜分官周廟奏肅雝之頌葢聞民生於勤勤至則大勞自息禮成於儉儉行而至美宜章翕終年於一日可以千秋析百物於微端遂諧萬事是以閔鴻鴈之悲歌必覃思於究宅奠竹松之燕寢遂永奠於攸芋葢聞隴登黃茂商飊先剛銑之淸柯熟朱櫻梅雨益蕭寒之滌蒿艾盛則損芳荃相凌以氣鶠皇至而賓鷽相長以權是以炎火在原不傷慈於田祖霜鈇普震實敷惠於嘉師葢聞心量無垠筵九埏而郭萬國仁威不試伏五服而釐羣黎氣不知其自消繁雲無期而斂機忽忘其所用曾冰有候而暄是以謙書南誥海人謝黃屋之狂巽命東馳傲帥失紅陳之富葢聞操萬斛之舟者獨運恆安乎晏坐伐千章之木者揮斤不藉乎羣呼轂轉無畱機憑軾之軸自止羽飛有迅理擎跗之指不行是以成都桑畝龍以臥而成雲柱下春臺鮮不撓而薦鼎葢聞圜丘九變密移在縱斂之閒宣榭千尋圅受但合離之際燕居淸迥雲雷之動恆盈朽馭飄搖冰鏡之涵自定是以鷹揚百戰陳書但義敬之微言龍馬多占觀變一貞明之靜理葢聞鬱資百築黃流非芳草之能璧藉羣文虹氣在組紃之上天欲治而生治人人尤待治士隨時而乘時化化必需時是以鼓鐘改韻於豐宮瑟柱之調必夙圖笈載陳於東觀芸香之辟尤嚴葢聞無情者不可使有氣待黃鳥而鳴春無氣者不可使有情期蒼蜦而召雨勸威作氣勸威盡而勇無餘祿賞移情祿賞窮而仁不繼是以等威天險積培塿而泰岱干霄于喁人和應宮商而韶音合漠葢聞咸若之理原安原而隰安隰不言之化動應動而虚應虚縱游鯈于淺渚神龍自至其淵養散木於遙岑社樹必豐其報是以商宮之㝱不數用其㫄求富渚之綸遂永扶於風敎連珠葢聞勢之所拒非無利用之資情之所攖自有獲心之樂達士因撓以成功庸人喜同而失順是以魚衝波而上不損其鱗鳥遡風而翔全用其羽葢聞魚目未欺詎識隨珠之寶龍淵在握無傷蛟室之遊審畏途者乃遵周道之安厯朔風者益就春陽之曝是以命適周之駕始知柱下之非龍下過楚之車不鄙接輿之歌鳳葢聞名言所絕理卽具於名中意量所圅變可通於意外膏非燄而燄待膏明鏡無形而形生鏡內是以經綸草昧太虚不貸於雲雷麗澤講習君子必恆其敎事葢聞歲差以漸厯虚斗而在南箕河徙無恆合濟漯而奪淮水害已成而不可挽挽則橫流道已變而不可拘拘斯失算是以阡陌旣裂商鞅暴而法傳笞杖從輕漢文仁而澤遠葢聞修竹產於懸岑時憂冰折幽蘭藏於密箐不受霜欺犀惟沐月乃辟遊塵蟈厭喧春必焚牡蘜是以歡諧啜菽恥經勝母之鄕化被鳴琴愼簡父兄之事葢聞雲有合離無礙靑旻之迥辰分昏旦難畱之餘故是以達人貞觀唯修撥亂之書君子固窮自之世葢聞死生一則神龍等視於蝘蜓耳目淫則山雞幾驚爲威鳳然而拚蜂有戒必謹尊生抑且鳴鶴在林無嫌好爵是以愼冰淵之手足乃可雄入于九軍懷霜雪之姱修非以好名于千乘葢聞業有待於傳人無殊衒玉道有需於倣古終哂效顰前百世而後千春誰爲知者抱孤心而臨五夜自用怊然是以花無異采非仍用其落英水有同歸不豫期於後浪薑齋文集卷一終
