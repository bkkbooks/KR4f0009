front:
  text: 洞庭秋詩夕堂戲墨卷四􅂳山遺書五十六
  hash: sha256:84faf2906c018c20c3966fc109925a5cb750d5617edcb1e61ab222dbe66040fa
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4f0009_SBCK_004-1a}
body:
  text: 衡陽王夫之譔洞庭秋三十首遙和補山堂作落㠶笙竹來垂二十七年湖量未忘者記持耳昔人評騭畫水獨以活水爲至到記持中何從有活水乎是以捃湖采邈秋容一聽之諸公而僕詩最晚岀抑不能爲馴雅之音但思拂得活水一兩波幾不遠作者未審閒能勿疑殆己酉杪秋記瀟湘北下巴江東上蟠下際摶靑空天地忘憂消偪側淒淸作意撩鴻􅄥䕫子􅀌城懸太白三苗餘壘挂殘虹古今無那此俄頃欹危歘爾生蘋風月似蘆花烟似水似如不似勞形容歕雪凝寒猶淸適涵暉冷燄飛輕鬆星漢相看交不昧心魂欲之亦奚從但覺晃煟透圓碧不辨愁來忽已逢大儀懸張覆釡幢誰其至者弗心降長天纖忽隨泯泯商飊騷㞕入淙淙浩瀚無餘一絲挂淸微欲將九鼎扛安得沐日仍浴月東赬西皎晶熒雙洞䆗虛無淨一規驚濤相卽不相疑精金大冶鍊幽蠁俊鶻老鼉愁傾危炎心已改何洗滌高旻受盪還淸嬉妙香浮動非蘋芷水霧上攝開輕吹乾坤倦遊行將歸損山容益水光肥片雲㠶側不能影木葉天際知己飛游子去妻百交感戰伐漁樵雙息機驅除姝暖返肅爽禁愁爲惜素心違羈心劈破芥浮居色色消沈遠近如險目不平夾韻度凉魂小住姑安舒孫劉戰爭問漚沫懐葛徂伏畱蕭疎情知涕泗無棲泊放浪磊砢任太虛翛然容與淸泠都何求不得須黃壚函蓋雙樞合駘宕明暗半絲分有無潛蛟旅鴈忘興廢疎雲片月矜昭蘇縮爲椰子沁心腎幻計無忝移山愚空有無垠剷徑蹊分明至極翻淒迷遠視不正非野馬客心已窘聊木雞㠶蝶賣眼驚天末􅧃烏亡賴啼日西陰光夕灼動綠氣􅋏然鬼臂相牽􅂝碧落無疑鵬背揩入寥天一絶安排邂逅不停增蹇産虛空未破猶沈埋略遣水光存芥蔕想知天骨正厓柴鯨鯉可騎終未稱吾生箬笠雙靑鞵回頭搖落悲羣動廣大昌明亦自猜無觸之聲消夢晷不寒而慄貯騷才藏舟後夜同歸壑張楚初心冀緩哀馳騖淸狂何所吝寒潭降潦畏相催瀰瀰盈盈不借春千蕭萬瑟屯嶙峋水力未至溢浩淼雄心僅可吞淸貧張樂鼓瑟憑慰藉巫娥湘后惘逡巡自然難釋虛無恨斜月流霜非有因目窮差別耳非聞逼塞諸根但有云觸法大都無軟美寛饒何處着殷勤如浮今古誰爲紐儘費烟霄不受熏一笑中流誇定力那知悽惻破三分西淸啟寒亦有門扃魂不扃金水魂方諸津潤遂昌大靑女娥㜲失恭温􅀌雲峯勢向凌替海天精彩捐煩􅁈空洞雖非萬法侣臨之未易相貪吞隨處波心着戲竿剛森簇簇護輕安充形暄氣存黍米大冶昭質任烹爨根株吾豈依墳埴鬚髪何庸非羽翰霏蒼颺碧自生意行與渾儀謀團欒遠行之感劇登山壑斷湍哀夢亦慳戍火祠烟盪精切長天白雨怙癡頑天涯交臂早無紹去景凝眸暫不閒難與此懐覓止竟征鴻一縷空飛還塞臆英多杜口宣淸歌難唤奈何天古人不見閒邀月置我無從小學仙鐵脊未妨聊旖旎金輪猶恐不剛堅餘霞落日關何事帶影微茫起識田法界􅀌微此泬寥鯤遊亦竦等鷦鷯環區不鯁魚頭乙􅇦水方凝雀目椒濃露可憐添浥潤片雲何恃得逍遙窮塗收拾千年恨鰕國遊誰岀斗跳欱然斂精歸元包匀凝活汞停煎炮穹窿舍此復何有沆瀣相干故不交稍覺絲緡牽靜謐非分玉笛喧淫咬神光四映飛芒角詎倚星月相雜殽弱骨凌乘一綫操未憑長目送雄豪通身冰血爭融結伸臂烟霄試抑搔豈必人生方幻寄足知厚載不功高金風但鼓嚢中籥大費尖酸徒爾勞晶輝蝡影縈一窩澄之蕩之夫如何容裔積已成堅冽鏦錚喧外絶煩苛綠非荇藻發誰浦光帶露霜自昨波驚鴻亦知無聞見抱意長鳴凌嵯峨大圓不息翻河車閃爍萬頃吹銀芽化汁一色混瀟皛靑氣雙合通荒遐無質可摶猶沐浴有見不盈奚開遮何得喪耦此􅀌坐誰邀明月覓蘆花三秋三楚塡淫荒誰能不斷憂思腸遥遙極浦浮雲樹渺渺生洲迷荻蔣馬殷南國飛星白陸遜西壘落日涼咫尺千波杳向往孰爲大壑恣埋藏浮槎無繫巴邱城縹渺之樓空若驚微霜覆蓑失􅋊夢遠火照帆悲他情乘乘宇内旣淸澈􅎃脈空際或經營小范於此言憂樂胸中無故橫甲兵微風軟縠退以聽濯濯平遠㧞昭靈吝儉物情不獲巳險阻大造故須經餘霞半壁從明滅征鴈萬雙亦伶俜居然幻泡警凉魄無數浮心一日扃崚嶒何來凜氣增􅃕此空輪無與勝吳天海色遥迎送楚霜蜀凍交消凝蕩滌赤日曵素練消息銀漢絡珠繩從知白帝威權甚萬象㵼影涵傾崩鷓鴣聲斷西日浮君山未愁黃陵愁白浪幾何傾楚塞金風旣展訖神州蕭颯萬个撼斑管迢遞千古疑膠舟賈至張說爾何物落拓欲牽萬里憂但哀無端眇淫淫長嘯不展狂歌瘖欲與招魂迷南北橫令此愁亘古今蟄雷殘雨無所藉金樞玉露亦難諶日暮息棹殊未巳寒波倒射冄楓林玻瓈帝網兩鏡參元中之元淸靈酣露泡影相合不二水月空觀誰爲三中流兩岸四無定鳥道一碧微自諳軍持滿汲寒沁骨容受無多祇大慙靑幕白地淸涎黏濃淡分界唯微纖未審天容虧半壁定疑水氣消餘炎披襟不讓雲將御理楫略挂羚羊尖鏖空白戰九十日吸月餐風亦損廉玉液統此微霄函俯仰不知靈與凡旭霧平收兜羅捲陰彩夕湧牟尼嵌肉翅欲愁千里倦韻目難厭一晌饞蒼螺半點點霜色謫仙何情强欲芟洞庭秋終薑齋文集卷四􅂳山遺書四十六衡陽王夫之譔啟一首六十初度答徐蔚子啟生無益於人子羽之頭空白老自安其命趙孟之晷將斜脛宜孔杖之施敎無失故肘有原襟之露友且憐貧伏惟執事道不遺遐心惟求舊刀兵劫改僅存鵠渚之弟兄生死夢中還記虎塘之歡笑人閒甲子已如鹿在蕉中世外春秋不謂鴈來天際指靑松以似我五大夫閱世空悲進赤舄以邀僊幾䩫屨今生更著靑袍無煩嚴武用支肺病之寒湘箑不拂元規持卻熱中之暑匪尋常縞紵之交實早歲笠車之約拜登不言顏甲念雉壇之存者幾人晉祝將俟先庚記鶴羽之歸來隔歲聊陳謝悃肅寄遐思尺牘十首闕薑齋文集卷四終
