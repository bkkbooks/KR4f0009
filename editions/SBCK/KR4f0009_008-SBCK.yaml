  text: 薑齋文集卷八􅂳山遺書四十六
  hash: sha256:0a69a79dc1a8a7c8cf195c7ead4560e8d575e59dcfd6859c2ec558dedaf9c0b7
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4f0009_SBCK_008-1a}
body:
  text: 衡陽王夫之譔賦三篇闕一祓禊賦謂今日兮令辰翔芳皋兮蘭津羌有事兮江干疇憑兹兮不歡思芳春兮迢遙誰與娛兮今朝意不屬兮情不生予躊躇兮倚空山而蕭淸􅔚山中兮無人蹇誰將兮望春章靈賦章顯也靈神也善也顯著神筮之善吿也壬辰元日筮得暌之歸妹明年癸巳筮復如之時孫可望挾主滇黔有相邀赴之者久陷異土旣以得主而死爲歆託比匪人尤以遇巷非時爲戒仰承神吿善道斯章因賦以見居調軫以理誓兮連權兆而晢夢莫紅切系緌蘀以搖搖兮憂期愆而恤豐爾雅權始也夢不明也易愆期有待又豐亨王假之勿憂王弼日得豐亨乃可勿憂恤亦憂也閒居調其軫念之情以自理所誓之志故必稱引初始述祖考之肇啟者以開其􅀩昧王之得姓自太原世系綿􅄛丁此亂世如冠之垂緌木之有蘀搖搖其恐墜也故旣憂有待之期或愆抑以未豐而亨爲恤進退維谷懼忝爾所生也皇濠泗飛以試囦兮余祖御乎揚之土靖協勞于滹池兮采赤麓以剖戸蟬考葉之文濳兮玉書宛其舒心筮鴻柯之非集兮珍海翮而息南叶食邑日采蟬蟬聯也麟吐玉書春秋以作鴻掌而不爪枝柯非其所集南溟之化六月而息太祖始起於濠泗當龍躍在淵之時始祖驍騎公從揚之高郵舉兵應之迨成祖靖難又協贊成勞於滹沱河故剖萬戸之封食采赤帝之麓嗣是蟬聯不絕逮顯考徵君以文章理學起家受業安成傳春秋大義天啟初用特徵入貢太學時不能用將授以散秩非所宜見歸而隱焉眇熹光之麗形兮凌太白而揆初雖冽淸其逖垢兮抑寒銑而善痡凜不知其逾涼兮抽巳秋之餘荂熹微明也人生而形具明斯麗之其始生則尙熹微然余生以九月朔旦金氣方盛而揆日在初雖秉氣淸剛而寒銑不昌乃雖遘凜秋而猶爭夕秀其於時固已難矣鄕升廉以脂轄兮齊側皆切明夜以庶格䝟貐午於周原兮歸魂􅖦肥通其猶未莫謨白切脂脂車也午旁午也􅖦遯遠引也莫安也壬午歲舉孝廉於鄕方上公車冀得出身致主齊明夙夜庶有感通乃李自成犯順於秦晉蹂踐於畿南狼狽南歸冀全肥遁而張獻忠入楚湖南全陷奔竄不甯勝調周飢於紫鼃兮永眇視於躍馬奮殘形以殆庶兮危季歎於撩虎勝龔勝王莽贊紫色鼃聲永任永三都賦公孫躍馬以稱帝易顏氏之子其殆庶乎季柳下季莊子柳下惠以孔子見盜跖而歎之子曰撩虎鬚幾不免虎口癸未冬張獻忠陷衡州捕人士補僞吏時絕食傷肌以脫其污庶幾龔任二子之意然其得免虎口者僅矣釋余枻於曾波兮導吿余浸以滔天行汨災而后嬰兮馬壯拯其無人哀輪縈以痟愁兮襲宵永而辭晨天叶曾層通導導人戒塗者也易用拯馬壯言救難當健速也張獻忠入蜀湖南稍甯甲申春李自成陷京師思廟自靖五行汨災橫流滔天禍嬰君上普天無興勤王之師者草野哀痛悲長夜之不復旦也鷸倀皇而狂僨兮蠢蹊田而奪之豈弗悶其終沈兮荼良苦其將捋之步岑嶭以㳙友兮援余戈而徂征孤拊和其怒節兮乾時潰其誰榮國策鷸蚌相持漁人兩得之語云孤掌難鳴春秋不諱乾時之戰言能與讐戰雖敗猶榮口未久旋亦敗滅如鷸蚌之持徒爲漁人之利牽牛蹊田而牛亦奪也固將死生以之豈徒遯世無悶而終隱之爲得哉故涉厯險阻涓戒同志枕戈待旦以有事焉而孤掌之拊自鳴自和至於敗績雖云與讐戰者敗亦非辱而志事不遂亦何榮􅁘驂儆余以荒術兮皇雖阻其猶平叶胡釋余祖之亨遇兮吝余策於南條邅申申其離卽兮余情婉以終留陳介李其曷共平聲兮憗有心而長區烏侯切荒大也術路也邅遲回貌左傳一介行李區藏也舉兵不利遂繇郴桂入粤皇路可通雖險阻如平夷也先世旣以從王起家胡爲釋此不圖而吝南征之策也戊子冬旣至行闕所見尤爲可憂遲回再四已復歸楚而情終繫主己丑夏復繇閒道赴闕拜行人雖陳力之無可致其靖共而悲憤有懷不能自匿故有死諍之事荃服鷟而未閑兮或進鼪而善啼軒聆律於秬絫兮􅇪繇庚其若蹊熯女離而長謠兮矧旣雨而申䨑余姣固殉於所字兮蒼天正余以無奔虹奇居宜切色其眾媚兮暌星樞以思存蹇疾頞而嬰疹兮返牢􅖨以行路迹違魏以率野兮魂慺慺其念故荃芳草喻君服乘也軒軒轅秬絫累秬黍以正律䕫一足獸庚夷庚大道也申再也䨑霽也奇奇衺不正也牢􅖨深閉也魏魏闕時山陰虞山二相公孤忠濟難反􅀩主疑而朱天麟王化澄吳貞毓郭之奇萬翺流輩猶恣奸佞得進用結叛臣陳邦傅下諌者金堡等於嶽幾杖殺之夫哲愚之量今古不齊有黃帝之聰則秬絫可察若一足之䕫則坦道如蹊然則衆人之憒憒固不能欺余心之炯炯矣時値傾覆若谷蓷之熯仳離之女旣不能已於長謠況幸値事幾之可爲若久旱之雨而姦邪偸一日之利更欲圯壞如乍雨重霽安能不益其痛哭耶唯余一意事主不隨眾狂而孤立無援如彼何也羣姦畏死貪賂復陰戴孫可望如舍日而媚虹北辰固爲天樞非彼所思存暌而去之如遺屣矣旣三諫不聽諫道窮矣乃以病乞身遂離行闕而心念此去終天無見吾君之日離魂不續自此始也符烕淪余離凶兮欣長摧而數訛詛余志之不充兮疇飾非於未化叶烕滅淪喪之禍果合符於所諫庚寅冬兩粤俱䧟死於亂兵者幾矣固誓捐生而勢不便天不卽與孤臣以死數之訛也靜言自責蓋亦志之未充故猶波流以有今日之生方之古人於斯媿也詎云遯跡窮山不爲降吏遂得以天日之誠文飾而致於貞夫之列后適河以拂訓兮輔志鸇而逢怒配與旬其交佛兮何所肆余之雅武屏服昧於蒸原兮震伐方以流耳旣余之永仇兮王鈇亦維以悼紀佪葛荏余糺躓兮眄余天而未可叶夙延淸而㱃虛兮紛莫知余之所甫天王狩于河陽仲尼曰以臣召君不可以訓季文子日見無禮於其君者猶鷹鸇之逐鳥雀也易配主謂君旬均也謂所與同志事君也佛戾也武步也屏退也服用也昧幽也蒸水出􅁘薑山今謂之黃帝嶺時所避地近其處易震用伐鬼方震大臣之象王鈇見鶡冠子謂天子之大權葛蔓草荏柔木言相糺縈動卽仆躓天所宜尊者甫美也時上受孫可望之迎實爲所挾旣拂君臣之大義首輔山陰嚴公以正色立廷不行可望之王封爲可望賊殺君見挾相受害此豈可託足者哉是以屏迹居幽遯於蒸水之原而可望別部大帥李定國出粤楚屢有克捷兵威震耳當斯時也欲留則不得乾凈之土以藏身欲往則不忍就竊柄之魁以受命進退縈回誰爲吾所當崇事者哉旣素秉淸虛之志以內決于心固非悠悠紛紛者能知余之所好也思崩登之逝絶兮介曶􅘒其無幾皓汔染于中遷兮歎頽齡其曷改叶鳬唼鱻而泛行兮愈流睞以怡旃鶠遂胥以召嬉兮駴不信其已然爲不善如崩易斯速也爲善如登難斯勞也其始也一幾之决其終也相去邈絕矣其幾微之介曶汶難知而轉移􅘒倏使以皓素之姿聊且受染於淄黃而中變其故則終至暮年不可復改是則素抱淸虛之志者安能妄投於一試耶夫泛泛之鳬隨波而唼魚則人益喜其流蕩怡我心目若神雀忘其內美而亦與羣遊以致人之歎賞斯物情之所駴而亦事之所必無者也故余之所甫自非紛紛者之可得而知屯建子于錫侯兮􅀩納耦以受寅叶豈初柔之讓易兮麗險窞之何姬力魚切叶如字曰維命余不猶兮奚懟位其不夙胚父壯以濟童兮妃內景而中穆頫思返於貞牝兮哲懼膏之致焚窈余不知其畔兮遵原筮以得垠參同契云屯納子􅀩受寅謂屯陽在初􅀩陽在二也屯以濟難􅀩以養正其用別矣納耦者謂􅀩二納婦吉退治內也夫屯􅀩各有一陽在內卦屯以蚤見剛健得建侯之利􅀩豈不然而以柔居初成坎險而讓平易所以然者則時在􅀩昧不宜急見其剛才素位遲疑無容怨也唯是保乾父之剛內藏其健納坎水之景中守其明則􅀩昧可濟而和靖於心是故李萼赴顏公之招臧􅇝同張邈之死成敗雖殊而道在經綸故得以烈聲自遂今所遇非人蒙晦無可別之跡則出身磐桓不􅀗如彼命之不猶唯含貞韜明而巳位旣不夙其可爭乎俯而自思返於正順以遠膏火之焚故事幾幽杳而生平素尙甘於戢退斯有垠㟁之可遵者也􅔶當無以尙沖兮非廢用而頽滑康違堪以木形兮激契闊于履發儷龍元其貞庸兮矧秉禮于鄹闕老子云當其無有車器之用頽廢滑亂也嵇康絕交書自言七不堪人目康土木形骸謂不尙飾也契闊不合也履湯名發武王名子日老子其猶龍乎又人謂嵇康龍章鳳質儷龍謂二子皆如龍者二子以元爲尙然且在老則以無爲用非並用而廢之以恣滑亂在嵇則非湯武之征誅而不徇司馬況秉禮敎於鄹里闕黨者其得弗擇地善行而徒取進趨乎維食陰而質滋兮必吸淸以塡形爽􅎃叛其不來兮石頑隕而失星􅏆冰惻此絲鼎兮厯棘纆其難康重遄情于荃側兮怨霄路之何長爽淸淑之氣也脈微動也霄路天路夫鄹魯之敎以理人性以正人紀盡之矣夫人之生食陰濁以滋形質而必受淸剛之氣於天乃以充其體而善夫形色倘此淸剛之氣見利斯昏叛去形質之內則如星隕爲石不復得爲星矣所以懷冰自戒憂此一絲之繫九鼎厯于糺躓之塗懼不得夫安步也其自念名義旣如此矣而愛主之心尤不能忘遄寄此情欲往就之姦雄窒路如天難登如之何其弗怨也狂憤憂而自棄兮耿三歲而子遷遠淸塵余穉慕兮抑朋蹇其企連巴骨出而仍掉兮虎靈藉而養巽尸鼎號以隳庸兮矧自古之多券穉慕如穉子之慕親也易大蹇朋來又往蹇來連謂相率以濟蹇也巴巴蛇也巴蛇吞象三年而出其骨掉掉尾也藉假也鼎大也鼎號謂天子之大命尸如祭者之尸代居其位庸功也自違君側以來於兹三歲而孤踪屢遷望屬車之淸塵而深其慕憶葢願得朋以出大蹇倘値其人樂與來連者矣乃如可望者若巴蛇之飽颺尾而游而大君之威虎爲狐假反退養夫巽順若此者豈足以有爲神器大名不可以久借功之無成固其所矣桓温失志於枋頭劉裕覆師於關內今古如一有心者去之唯恐不速也遂託膏去聲以歸音兮雖先露其何怨鄰化哀而狎悻能兮豈不知秋駕之可學媒與鴆其遝搖兮覆悔幾之先覺夢宵征之輕馳兮畏失轡于罔泱叶昏左次余騷㷀兮徼神憫而啟彭哀公牛哀也七日而化爲虎離騷鮌悻􅀡以亡身能黃能三足獸秋駕御法夢學秋駕事見莊子罔泱荒遠貌彭行也使爲可望者能如郇伯之爲膏雨俾得遂所託以西歸則雖溘先晨露固所願也以今者所居非乾淨之土所鄰而狎者皆化獸之人則豈不欲學御而得以馳驅哉乃其或爲良媒或爲毒鴆遝雜搖搖胥不可測旣已覺其不可託是以逗留而不往則將使我終不得遂西歸之志者斯幾先之覺也使茫然未覺則往而不叶歸于一死而已豈不愈于鄰虎而狎能哉故曰悔也旣已覺之則非死之恤而失身之爲憂是以夢輕馳而終畏罔泱人之已窮神或通之故當左次憂獨之際希冀神之見憫而啟以所當行焉儔勉釋余之棼緒兮曰窮通天以迓之帝攽箕以貞倫兮範有事於稽疑祓端策而氛睞兮火出澤以章景宗廟震于悔端兮勞再告而益昞儔友也箕箕子火出澤上暌卦卦六爻初士二大夫三􅀸四公五天子上宗廟震動也內卦爲貞外卦爲悔上九老陽變動故曰震于悔端再告益昞謂凡兩筮皆暌上九神之所告其義甚明疑可決矣好逑暱其姝俟兮猾貌之庸猜施膚寸以征合兮羣淫解而卷霓誠狶溷其難測兮魍馮軾而增怪卭孤淸以弗堪兮歧不􅊫其所夬猜叶此演暌上九之辭而詳玩其占好逑姝媛以俟謂婚媾也猾寇也旣爲好逑而毋庸猜則所謂匪寇婚媾也泰山之雲膚寸而合不崇朝而徧天下則雨矣雨則霓爲之卷藏正氣昌而淫氣不成如此者以征則疑釋而道合所謂往遇雨則吉也狶豕也溷不潔也謂豕負塗難測其不潔之心也魍鬼也馮軾在車中也謂載鬼一車其情增人之怪也豕負難測之穢鬼增妖怪之情則以暌孤之道處此而欲保其淸貞固難堪矣夫日婚媾日遇雨似宜往者也日鬼日豕又似不宜往者一爻之占歧而不合安能􅊫而決之哉夬決也訟徙倚而倘逢兮彖旣章余以崇别女同閨其各袂兮孰嫫與施之可頡眾美少之膏濡兮忘衷狠於飾柔中仲湻耀其曈曨兮盟登天而果求雖輿䄏其勿恤兮矧弢矢之有時保昆烈以延昭兮勰杲質於素思頡叶訟内訟也中心聚疑如聚訟然徙倚不定也暌之彖日二女同居其志不同行袂所以自飾者嫫嫫母施西施少少女兌也膏濡澤之美也兌內剛外柔柔以飾狠也中中女離也湻耀曈曨日之光也登天照四國也輿䄏亦載鬼之義弢矢謂後說之弧也昆大也延昭謂致光于身也勰合也暌上九之象辭其疑不易决也如彼中心聚訟欲得遇卦意以决之乃觀于彖而知暌之爲道不苟同而尙别二女之志不同美之與惡豈可頡頏而同居哉今卦爻之動不動于兌而動于離且暌者離宮初世之卦則道宜用離明而不宜用兌說眾人無知爲少女所惑慕其膏澤而忘其衷情之狠躁則以可望爲歸者固矣若夫中女之含光以照四國者則非專壹其心于忠貞者不能求也使誠得主而爲之死雖鬼車其勿恤況今之張弧者自有其說弧之時命在天而志在己唯觀其象玩其占保吾正大光明之氣以體白日於丹心而已奚復問津于少女之悅狠羊之躁哉於占旣然素志亦爾神與心協守其昭質暗投之侶必謝幽棲之志益堅矣亂曰天昧冥遷美無耽兮方熯爲澤已日䨙兮鑿秕孔勞矧懷婪兮督非我經雌不堪兮專伏以需師翰音兮幽兆千里翼余忱兮倉怳寫貞疾煩心兮貿仁無貪怨何尋兮侵覃二韻通叶天理也昧幽也耽久著也已日更一日也鑿熟舂也秕粟皮莊子綠督以爲經督如人身之督􅎃居中而行于虛善不近名惡不近刑不凝滯而與物推移所謂緣督也倉怳憂貌貿求也天理幽􅀮初無定在遷移于無迹之中則昔之所可今或否矣其得立一必美無惡之事以耽著而沈溺之哉如方久旱則得雨爲澤更日不止又爲苦䨙方其四海淪胥不餘尺土則矯制興師者固以足音慰空谷而久假不歸釁深改玉名爲漢相實漢賊矣君子之不幸而當此也留則河山非有往則逆順無垠求以潔身而報主者如鑿秕求精亦已難矣況敢懷富貴之褊心當去留之大事乎與物推移而知雄守雌以苟全其身而得利涉旣非所能爲則將退伏幽棲俟曙而鳴今孤臣在千里之外吾君介存亡之閒往逕旣絕來踪未卜唯幽冥之中若有朕兆可翼余忱以必達人不可謀天不可問寸心孤往且以永懷思主則愴怳而煩心求仁則堅貞而不怨章靈之作意在斯乎薑齋文集卷八終
