front:
  text: 薑齋文集卷十家世節錄船山遺書四十六
  hash: sha256:d4b108ef8815c8703396d8e431d36886b27017e3e4b642f075c7a4249437836d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4f0009_SBCK_010-1a}
body:
  text: 衡陽王夫之譔禮大夫有家詩稱有邰家室司馬遷紀列國爲世家下况之辭也今制七品以下通乎士六品以上通乎大夫先驍騎公肇家于今十三世雖子孫之弗克構乃家固得以有家矣夫之不肖以墜令聞又遘兹鞠凶國緒如綫家亦以殄嗚呼維我祖曁考之保此彞命者甯有替也夫之最晚生時得敬聆庭訓者十百之一二隨節譔錄肅呈之從長兄萬戶伯兄孝廉僉曰諧汝從嗚呼後之人其尙念之哉時十有二年季秋月朔日乙未徵仕郞行人司行人介子夫之謹述太原王氏出自姬姓之後至離次子威而分至鴈門太守昶而著元以上興替不一元末有居高郵州之打魚村者斷爲始祖驍騎公諱仲一驍􅀐公兄弟或云九人或云七人羣雄逐元公兄弟亦起義兵會焉或殁于兵中其與公竝顯者公弟仲二公仲三公皆從太祖渡江仲一公以功授山東靑州左衞正千戶仲二公仲三公各以功累襲長沙衡州二衞指揮驍􅀐公生明威將軍上都尉公諱成從成祖南下功最陞衡州衞指揮僉事乃宅于衡都尉公生嗣都尉公諱全嗣都尉公生嗣都尉公諱能皆襲世職終于官嗣都尉公生昭勇將軍上輕車都尉公諱綱累官江西都使司都指揮僉事輕車公風裁剛正嫺治文墨掌衞事時與太守古公偕見􅀡指使古公自司馬郞出守郡執舊屬禮與公爭西上公據祖制折之曳落其裾􅀡指使以公爲􅀡會同里劉黄公昊請於廷修南嶽廟部推公能檄入川採木歸督造廟巋然帝制崇麗冠五嶽所費不過五千金皆公所區節也事具商文毅公輅碑記後官江西與藩臬會紫薇堂藩使以公伉􅀡欲以文墨相難連綴韻語公應口和之如夙譔藩臬使皆爲斂容焉輕車公生驃􅀐將軍上護軍公諱震字東齋累官鎭守柳慶參將始輕車公所與伉太守古公者擢大司馬驃騎公以舍人襲職過司馬門下古公閱世系狀知爲輕車公子問曰汝王某兒耶應曰諾古公曰王某文武材也此正思擢之以紓邊急今豈其沒耶對曰某父以某時厯江西都使卒于官古公愴然改容作而嘆曰汝父風采今日若在人目中虎父不生豚兒汝但好爲之無憂不大用護軍公泣伏再拜而退逮致政里居毎舉以戒子孫至先君猶能詳道之如昨日事嗚呼先正體國用人爭而不忮如此天下何得不晏然顧非輕車公之大節實有以厭君子之心者亦無以得此驃騎公累官二品家無餘貲柳慶居百蠻之衝懷柔震疉不侵不叛其承堂構而報元老之知亦有所自來也驃騎公長子諱翰襲職累官都使卒賜葬祭第四子處士公諱甯號一山居士始以文墨敎子弟起家儒素焉一山公長子順泉公諱亨郡文學次掌故公諱雍號靜峰應隆慶四年鄕貢初授武岡州學訓陞江西南城縣學諭致仕卒于家掌故公純懿寛厚推重倫輩凡應貢者類以㨗得相競公屆餼滿請讓于所受業師學使者義而許焉公以遲之閒歲家世弁組頗務豪盛公苦吟淸澈不問家人業或故詰公曰一石穀舂幾許米公曰一石米輕薄者笑焉公亦不怒其敦長者行類如此夫之童年曾于先君篋中見公試論一帙今忘之矣記其髣髴淸健樸亮似楊貞復手筆至論畱侯用四皓爭太子非大臣體王茂宏不得爲純忠葢補綱目所未及也掌故公生三子長次峰公諱惟恭次少峰公諱惟敬次太素公諱惟炳補郡文學少峰公之始生也掌故公㝱有奇徵故小字曰㝱公姿貌森偉長六尺髭鬚疎秀瞳光透出十步伉爽尙大節飮酒至一石不亂歲時衣大褶戴平定帽坐起中句矩或勸公曰君閥閱胄子郞君又以儒名家獨不可以儒服乎公笑而不應掌故公之卒以貲讓弟太素公隨散隨益之終身不見一長吏亦不襒裾于富貴之門縱酒自匿而竟日口不道一里巷語遇人有不可者面折無諱而姻黨敬愛生平如一日居家嚴整晝不處于内日昃入戶彈指作聲則室如無人焉者課先君洎仲叔二父誦習每秉鐙對酒寘筆硯座隅令著文蓺恆中夜不輟仲父偶戲簪一花驀見之作色曰此豈吾子弟􅁘故先君兄弟終身不有華曼之飾先君年在旣立聲望已著毎小失意猶長跽踰時必痛自謝過乃已或時爲勞勉焉夫之少不肖􅀩譴于先君仲父述此以見誡相向欷歔已哽塞不能竟語公年五十三蚤卒大中丞李公燾爲表墓焉元配馮太孺人無所出繼配范太孺人生三子長先君次仲父牧石先生諱廷聘字蔚仲次季父諱家聘字子翼皆郡文學仲父和易而方介恬于榮利博識工行楷書古詩得建安風骨近體逼何李而上深不喜竟陵體詩毎顰顣曰何爲作此兒女嚅唲晚歲築室坰外號曳塗居蒔花植藥怡然忘物每謂漆園吏東臯先生去人不遠生長兄玉之起邑文學以繼絕嗣祖職官指揮使季父儒而俠不屑家人業裘馬壯遊敦友睦事先君如嚴父生珍之先君諱上从􆂸从月下从耳从甹字逸生一字脩侯志考亭閩山之遊以顏其居學者稱武夷先生少師事邑大儒伍學父先生定相研極羣籍已游鄒泗山先生德溥之門講性命之學萬厤閒爲新建學者甚盛淫于浮屠先君敦尙踐履不務頑空嘗曰先正有言難克處克將去此入德第一持循處吾力之而未能也一切玩好華靡不畱手目篤孝敦友省心減務窺所淵際大概以克己爲之基也雅不與佛老人遊曾共釋憨山德淸談義已聞其論咈然而退終身未嘗向浮屠老子像前施一揖甲申歲以冦退遺骴滿野募僧拾而􅄟之竝使修懺摩法仍曰此自王政掩骴骼之一事顧今不以命之僧吾懼僕傭之狼籍也已屬之矣固不容執吾素尙而廢其事此亦神道設敎之意汝曹勿謂我佞佛而或效之少峰公早世夫之兄弟不及見先君色養聞諸先孺人終少峰公之世有所呼召未嘗不稱名以應毎加戒訓則長跽中庭非命之起至客至不起已乃煦然無少見顏色少峰公卒柴毀泣血免喪親故乃不相識在殯食一溢米粥力疾執葬事畚鍤栽植躬與傭力雜作范孺人之疾革也先君方授生徒于衡山范孺人不欲先君之亟歸逮屬纊仲父方以信走報猶諱言不測時已昏黑就主人借一駿馬馳百里丙夜抵家先君體淸羸素不習馳縱轡馳陰黑中把火者不相及卒無傾躓聞者以爲神助及歸已復魂矣匍匐號血水漿不入口者三日范孺人以痰疾終收所唾盂藏之苫次每捧以哭殆于絕聲每上少峰公范孺人墓酹酒泣下耆艾之年猶作孺子泣歲時薦于寢整衣鵠立屏息攝足茶醴之奠必躬執焉夫之兄弟閒請分其勞皆不聽許待仲叔二父終身無一閒言或遇咈意事相對二父則笑語如常脫然忘其所憂戚一觴一詠評古跋今諧適送難歡如朋友而危坐正膝不傷於媟至於衣無私主財無私藏則初以爲適然未嘗畱先君胷中不足細述也萬厤間諸以理學名者拱手曳裾糨褶峩巾以爲容先君口無過言身無嫚度而坦易和粹衣冠亦如時製無所矜也崇禎初文士􅀋以文社相標榜夫之兄弟亦稍與聲氣中人往還先君知之輒蹙眉而不懽者經日丙戌歲鄕試楚士于湖南劉浣松水部明遇以點定墨牘屬夫之已授之鐫者先君怒曰汝以是爲儒者分内事耶卒不許竟其事大約窺先君之志以不求異于人爲高以不㞕浮名爲榮故性不喜飮酒而畱客卒歡或至中夜不以斷肉禁殺爲仁而啟蟄方長終無侵害食品非雞鶩豚魚未嘗下筯終身不過狹邪之門而對歌舞亦爲之適然投牒歸隱未嘗岩棲谷飮而盤桓斗室竟歲不履城市自非忠孝大節卒不修赫赫之行此以恆久而不可亂也先君爲制義風味似馮具區詣入似朱大復每以理極一往翔折取意爲至而不多取繢藻論文則以極至爲主恆苦作者不能臻己所未到早受知于邑令胡公忘其名自童子中以國士相期會學使者有所嗛于邑故抑先君以示意繼新安立齋王公宗本令衡復深相知凡兩最童子科乃補郡文學以文字相知許者義興周公應脩太湖馬公人龍四明陳公圭溫陵劉公春先君以萬厤乙卯辛酉兩副秋榜分考胡公允恭首薦太史西溪繆公昌期業定錄名次以對策中犯副考朱黄門童蒙名黄門不懌置乙第是年熹宗登極以恩予副第者貢太學先君年已五袠倦于文場歎曰余分在此且筮一命或得報政而邀王言以補祿養之不逮也遂應貢入辟廱厯滿應部銓時選政大壞官以賄定授正八品官先君素矜風軌及是相知聞者謂必罷選不就先君笑曰積薪何常之有我應此小用者何意無亦聊與優游而以悻悻去哉初仲父聞之亦爲扼腕先君自都門歸欣然盡遣諸胸中仲父歎曰吾兄所謂賢者不測也已赴謁選會烏程當國操切以希上旨其姻家唐元弼者乾沒副貢籍求府判所部覈罷之烏程怒爲罷銓郞新銓郞蔡相弈琛會烏程意旨苛按辛酉副貢移儀曹索故紙束溼甚暗索賄焉先君曰是尙可吏也乎吾以求一命爲先人故俛折至此若出賕吏胯下以重辱先人是必不可詣儀曹辭罷大儀慈谿馮公起龍笑謝先君曰觀生氣固不可折者吾爲選君必旦暮爲除遣何有長者而作少年拂衣意氣乎先君正色長揖而對曰無所辱公嘉惠某有田可耕有子可敎終不敢欺天以暮夜金博一官碎假帖而退夜買驢出春明門逐歸蒔藥灌畦若未踏長安塵者家居十七載不一至郡邑庭亦不通雜賓客非兩叔父外諸從洎及門問字者往來都絕長吏到門以疾卻刺夫之舉主歐陽方然先生諱霖相過請見者三乃一報見而止猶不懌者終日焉先君少治詩徙治春秋躡屩束經走安成亭州問業所向卽傾動人士已授生徒精爲研鑿及門達者先舅氏孝廉譚公允都舉首歐陽節庵瑾開建令經元貴陽馬丹鄰之馴晩歲端居屏人事里社後進閒因夫之兄弟以文字求點定時際欣適亦爲論次如郭季林鳳躚夏叔􅀡汝弼何偉孫一琦皆所鑒別俱爲名孝廉會喪亂不得竟其所至先君和粹不立城府燠然無所牴牾于物顧所不可纖毫不以折意方謁選時邑大常卿陳公宗􅆻零陵銓司蔣公向榮深相引重欲爲先君地皆笑而謝之大叅陳公聖典會先君因致書長安達者先君受之中塗發椷有先容語遂不復致橐之而歸初欲返之大叅已而曰何用作此皢皢折彼意爲因不果返之營道駱都督思恭掌金吾事監修國史史成例薦纂修者晉所考秩予速選以同鄉故咨先君于部先君亦笑受其咨旣終不以赴部亦不以返于駱畱笥中抵家乃焚之葢先君大節求盡于己而不標君子之名以自􅋑大要如此壬午冬夫之上計偕請于先君曰夫之此行也將晉贄于今君子之門受詔志之敎不知得否先君怫然曰今所謂君子者吾固不敢知也要行己自有本末以人爲本而己末之必將以身殉他人之道何似以身殉己之道哉愼之一入而不可止他日雖欲殉己而無可殉矣嗚呼先君之訓如日在天使夫之能率若不忘庚寅之役當不致與匪人力爭拂衣以遯或得披草凌危以頸血效嵇侍中濺御衣何至棲遲歧路至于今日求一片乾淨土以死而不得哉誨爾諄諄聽我藐藐小子之弗克靖也人也非天只矣初伍學父先生與先君爲師弟子而相得如友生先生藏書萬餘卷居恆謂家君此中郞所以貽仲宣者行歸之子後先生猝得􅀬疾懣急不能語先君躬執藥食先生目語先君如將有所授者先君輒俛首不答歸而歎曰吾甯􅀒先生治命不能受仲宣之託也先君嚴于取與大率如此夫之所目擊者未嘗輕過一人飯亦未嘗輒受一人名刺凡夫之兄弟所交遊稍有箋扇之饋必峻卻焉伯兄己卯上北雍旋于白下市縳音線絹製袷衣著綿以進彌月不敢呈漸因先孺人奉之笑視良久取而藏之經冬不御閒歲仍返諸伯兄伯兄復因仲父婉道意乃以所値授伯兄始取服焉兩兄洎夫之有茗菓羮脯之獻月不敢再閒月進之亦多納而不嘗兩兄省試歸曾買小說一帙奉先君爲解頤之助開卷視數則輒束焉嗣以遺族叔且曰此兒子所奉也仲父以閒言曰兄之子幸免不成立所奉亦筆舌所得何峻拒之如是曰其人則吾子也其物則非吾有也以吾一人者用物于天地而數人者取天地之精不已汰乎且淸心省事徒以行之他人而不行之吾子其亦以此忤物矣且吾以此敎豚犬子尙不能不轇轕浮沉于名利之際奈何復決堤而先之泛濫也凡受業于先君者約數十輩束脯之儀以貧而卻之者半焉時亦有所賑予及爲人排急難要未嘗輕先期諾之賢者不得而親不肖者不得而疎也夏紵冬絮擁膝危坐閒終日而不一語自夫之有識以來二十年如一日亦姻黨僚友所共知無得而閒焉先君嚴於自律恕於待物卽僮僕亦未嘗深加訶責以少峰公塋墓爲族人不肖者所犯一訟之有司此外無一字入郡邑曾衣新繒褶過城闉有鬻薪者醉而突出以所荷杖刺衣幅裂落其裾其人惶遽故狺狺作不遜語先君笑曰待我執汝索償而始作此狀未晩今且去不須爾也其人雖醉不覺膝之屈也先君亦顧而去之又嘗晏出門外有鬻豆糜者踞坐門檻命之起不起稍正色詰之顧瞋目􅀡視捧其糜擲中先君巾服皆漬先君徐步入内易衣家人皆不測所以先君亦不語以故徐聞門外喧豗則鄰左人共搏其人盡以所鬻糜投之溝中捽而將繫之矣先君易衣畢遽出語搏者彼幸未有所犯于我􅀡蠢愚不慮難爾何忍令其荷空甔歸無用以對妻子爲如其値而授之錢鄰人皆驚訝餘怒不已詰旦乃笑而謂之曰子昨者之怒今可以忘乎未耶故里中之醉而號者爭而􅃲者樗蒲而相逐者惟恐令先君知鄰有貴介子弟任縣令罷歸不能輯其奴客虐侮市買小民先君遇之則正色視之雖未加詆訶而無不倉皇失措者後遂漸畏而改焉凡里中􅇿邑文學有數至公門請謁者皆令攜巾衫人走閒道不敢經過門閈先君後漸聞之歎曰夫我奈何使人徒畏遂以禁步門丙又曾以孟冬攜夫之上一山公塋歸渡耒水操舟人索錢不已從人與之爭其人醉而狂詈刺刺不休奮石相擲及夫之馬首夫之于馬上勸止之愈不得止夫之怒令人搏之其人掉舟中流無可如何先君見夫之怒不可遏從容上肩輿去使人傳命云此何難且歸徐吿于有司捕繫夫之乃􅂞轡而反抵家先君色旣不忤又不一語及之夫之不敢請遲之數日乃曰前者操舟狂夫何以不屬之有司乎俛而微笑夫之不覺汗之霑頤先君乃爲好語慰藉而起先君敎兩兄及夫之以方嚴聞于族黨顧當所啟迪恆以溫顏奬掖或置棋枰令對弈焉唯不許令習博簺擊毬游俠劣伎閒坐則舉先正語錄辯析開曉及本朝沿革史傳所遺略者與前輩風軌下及制藝剔鐙長談中夜不息兩兄湻至無大過失時或以小節違意旨夫之少不自簡多口過每至發露先君不急加詰謫唯正色不與語問亦不答故夫之兄弟亦不易自請諐焉如此旬餘必待眞恥内動流涕求改而後譴訶得施巳乃釋然至于終世未嘗再舉前過以相戒庭戺之中暄日嚴霜竝行不悖恆謂處人己之間當令有餘親如子弟賤如奴僕且不可一往求盡況其他乎昔在京師見一名冢宰大書榜云本部旣不要錢如何爲人要錢亦何至如此以爲君子耶故其施於家者張弛如此而夫之兄弟亦幸以免于惡焉崇禎癸未張獻忠陷衡州鈎索諸人士令下如猛火購伯兄及夫之甚急先君爲僞胥所得勒至郡城僞吏故爲輭語誘先君致夫之兄弟先君張目􅀡視終不答僞吏怒將羈先君先君歎曰安能以七十老人俛仰求活沐浴易衣就親故告別將以是夕投繯夫之聞先君在繫乃殘毀支體舁簀到􅇿守候徹夜乃不果明日遂以計脫遁黄岡奚鼎􅉗始以文字與夫之相知聞至是陷賊中爲吏力脫先君于險先君終不與語永厤丁亥夫之避居湘鄕山中伯兄匿跡東安之四望山先君間寄手書至曰汝若自愛切不須歸勿以我爲念時八月二十三日也書發之明日遂以覯疾伯兄踉蹌先歸夫之以次還先君顧不喜已乃力疾率伯兄及夫之上南嶽峰頂以隱俄而疾急乃曰吾居平無一言可用敎汝兄弟者況今日乎我卽不起當葬我此山之麓無以櫬行城市違吾雅志且以塋兆在彼累汝兄弟數見諸不淨事也臥病三月未嘗有一呻吟之聲十一月十八日平旦扶起晏坐而終先君之於患難生死有如此者先君于文詞詩歌不數操觚葢以􅂤柙性情懼藝成之爲累也早歳與學父先生洎詩僧復支頗有酬和皆削其藁盡無傳者夫之所獲見者送邑侯梁東銘志仁入計序及贈處士陶翁萬梧夫之妻父文今皆忘之矣又曾于刺尾得覩過應山平靖關一絕句今附錄焉楚塞横開西接秦平沙風起柳花春卽今江北須囘首渺渺江南愁殺人崇禎戊辰春所作也先君于書法不求甚工而終身不作一行草及縱筆大書易簀之歲七十有八先卒三月所敕夫之兄弟手札皆蠅跡鴈行如界畫少所讀書收束潔齊五十餘年帙卷如新生平未嘗敗一陶器殘楮廢藁歲聚而焚之食無兼味飯止一盂飮酒不見酒容諸非時蔬菓烹飪失宜者絕不入口葺屋取蔽風雨所居一室淨几堊壁蕭然無長物禁夫之兄弟不令置田宅僅以給一年豐凶之中爲止曰安有儒素而求田問舍者且貪之媒而禍之始也大歡不破顔而笑大怒不虓聲而呵北還遇盜于良鄕縣界掠奪殆盡會有中丞赴鎭遇焉遣人存問竝邀往見欲爲追捕先君謝而不往唯一笥中餘二十金同行者多有所餘而故閟之以窮告先君遂分所餘授之不取償焉凡此皆細節不能具誌要非先君所畱意聊贅一二語以記素業用示諸後云爾先君元配綦孺人外大父掌故公諱綦孺人淑順孝婣生子一三歲而殤孺人以萬厤甲午歲卒繼配先太孺人姓譚氏外大父處士念樂公諱時章念樂公性和愷爲敦篤長者顧崖岸嶃峻不可干侮曾遊巴蜀有姻戚宰充國往訪之因稍畱􅅟舍其館客倨諧一言拂意不辭而出疋馬走江濱順流泛三峽而歸主人數道追贐已弗及矣其標致高遠如此念樂公配歐陽太母生子三長惺欹公諱允阜季玉􅀸公諱允琳皆邑文學中子小酉公諱允都中天啟甲子鄕試乙丑上春官以文句犯權奄置乙第女二長卽先孺人次適文學伍季咸公一盈遇亂爲賊所得不屈罵不絕口賊以刀環亂築致殞先孺人生伯兄介之中崇禎壬午鄕試次仲兄參之宏光選貢未就廷試遇亂以疾先先君卒次不肖夫之以壬午舉人授行人司行人予假養病歸山今行年四十矣孫七敉敞勿藥致攽勿幕敔敞伯兄出敉致皆仲兄出勿藥攽勿幕敔夫之出敉以孝殞于難致早夭曾孫一生祁敞出先孺人年十九歸先君以少峰公之嚴雖先君及兩叔父籍甚士林未嘗少爲假借顧于先孺人則不能不喜道之曰此孝婦也先孺人終未自言所以事舅姑者今故不能述其詳閒聞之叔母云少峰公洎范孺人存日起恆不待曉色夜則闇坐徹丙夜茗漿酒餌以進者不敢使烹飪刀砧之聲聞于外隆冬不爐懼煙焰之達也盛暑不扇懼其作聲響也與侍婢語必附耳嚅唲雖甚喜笑不見齒也少峰公晝出于外薄暮入則滌器移案之􅀋都不復作如是者終少峰公之世閒歸甯外大母頗加慰問則對曰居家固如是未見翁之獨嚴也外大母後述之輒以爲笑少峰公卒范孺人雖慈愷亦不忍不以事少峰公者事范孺人執三年之喪哀泣瘠毀傾笥篋以襄大事迨釋服無以卽吉焉與仲母吳太恭人相得如骨肉白首無閒言一庭之中兄弟誾誾于外妯娌雝雝于内歡然忘日月之長後雖析居閒十日不往還則怦怦若失季母萬晚得奇疾性稍亂先孺人一往問之則流涕竟日其卒也一慟幾絕從大父太素公暮年喪子與朱太母就養先君酒茗必淸蔬脯必治飴粥果餌逆探其意而供焉二十年如一日毎逢綦孺人生忌躬設香茗拜薦事掌故公如父綦太母如母向卒五十年言及猶爲慘然變容對先君如承嚴賓先君夙有痰疾煮藥調食必躬親執事不以屬之子婦及委僮婢先君疾革時先孺人新自病起羸弱不振顧蚤起晏息篝火親事一如其素焉家承嚴政內外栗肅者九代自先孺人易之以和愷育夫之兄弟恩九而威無一遇諸新婦則純用柔道談笑拊摩終歲不一蹙其眉卽有過失不加訶譴徐俟其悔悟而後微戒焉顧恆歎曰吾性不欲以嚴待人自此以往流及于後將有不率而反脣者乎雖然佳兒女豈須人訶責不肖者操之益橫出矣人日趨下顧非吾作法之涼也先君宦學四方家徒壁立先孺人躬親舂飪支盈補虛以佐圖史舟車之貲費踰千金而兩兄及夫之鐙丸書卷衣履贈遺娶婦飴孫以及歲時嘗薦伏臘酒漿之屬不計焉皆先孺人之手澤也顧每有贏餘輒盡散以施婣黨之乏及他迫而來吿者下迨僮僕人得取給恆霈然有餘終不囊宿一錢曰奈何以有用置無用之地也居少不約居多不豐順聚散以隨時故晚遇喪亂麻衣椽食欣然如素夫之兄弟藉以保其硜節實厚載之無疆也先孺人年七十四伯兄洎夫之同舉外王母歐陽太君年九十有二生小酉公舉于鄉歐陽太君母年八十有四生元素公炳舉于鄕官郡丞楊太母所生母年九十生恥所楊公舉于鄕官州刺史凡四世略相等戚里以爲盛談先孺人晩年尤康勝年踰七十起居如五十許以仲兄洎夫之婦陶相繼早世嗣先君見背哀愴所侵始見衰微己丑歲夫之不孝從王嶺外隔絕無歸理憂思益劇遂以庚寅八月初二日橫罹崩摧俾年袠劣于先世嗚呼無始安再造之功永天水當歸之痛此夫之含恨沒齒而不慊者也哀哉薑齋文集卷十終
