front:
  text: 夕堂永日緒論內編薑齋詩話卷二船山遺書六十四
  hash: sha256:946189b39492172ac78af5f8fe56f9aa5575fdb7ee5a154a1cf31d378e5275f2
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4f0009_SBCK_002-1a}
body:
  text: 衡陽王夫之譔興觀羣怨詩盡於是矣經生家析鹿鳴嘉魚爲羣柏舟小弁爲怨小人一往之喜怒耳何足以言詩可以云者隨所以而皆可也詩三百篇而下唯十九首能然李杜亦髣髴遇之然其能俾人隨觸而皆可亦不數數也又下或一可焉或無一可者故許渾允爲惡詩王僧孺庾肩吾及宋人皆爾無論詩歌與長行文字俱以意爲主意猶帥也無帥之兵謂之烏合李杜所以􅁛大家者無意之詩十不得一二也煙雲泉石花鳥苔林金鋪錦帳寓意則靈若齊梁綺語宋人摶合成句之出處宋人論詩字字求岀處役心向彼掇索而不恤己情之所自發此之謂小家數總在圈繢中求活計也把定一題一人一事一物於其上求形模求比似求詞采求故實如鈍斧子劈櫟柞皮屑紛霏何嘗動得一絲紋理以意爲主勢次之勢者意中之神理也唯謝康樂爲能取勢宛轉屈伸以求盡其意意已盡則止殆無剩語夭矯連蜷煙雲繚繞乃眞龍非畫龍也池塘生春草胡蝶飛南園明月照積雪皆心中目中與相融浹一出語時卽得珠圓玉潤要亦各視其所懷來而與景相迎者也日暮天無雲春風散㣲和想見陶令當時胸次豈夾雜鉛汞人能作此語程子謂見濂溪一月坐春風中非程子不能知濂溪如此非陶令不能自知如此也僧敲月下門祇是妄想揣摩如說他人夢縱令形容酷似何嘗毫髮關心知然者以其沈吟推敲二字就他作想也若卽景會心則或推或敲必居其一因景因情自然靈妙何勞擬議哉長河落日圎初無定景隔水問樵夫初非想得則禪家所謂現量也詩文俱有主賓無主之賓謂之烏合俗論以比爲賓以賦爲主以反爲賓以正爲主皆塾師賺童子死法耳立一主以待賓賓無非主之賓者乃俱有情而相浹洽若夫秋風吹渭水落葉滿長安於賈島何與湘潭雲盡暮煙出巴蜀雪消春水來於許渾奚渉皆烏合也影靜千官裏心蘇七挍前得主矣尙有痕迹花迎劍佩星初落則賓主厯然鎔合一片身之所厯目之所見是鐵門限卽極寫大景如陰晴眾壑殊乾坤日夜浮亦必不踰此限非按輿地圖便可云平野入靑徐也抑登樓所得見者耳隔垣聽演雜劇可聞其歌不見其舞更遠則但聞鼓聲而可云所演何齣乎前有齊梁後有晚唐及宋人皆欺心以􅋑巧一詩止於一時一事自十九首至陶謝皆然夔府孤城落日斜繼以月映荻花亦自日斜至月出詩乃成耳若杜陵長篇有厯數月日事者合爲一章大雅有此體後唯焦仲卿木蘭二詩爲然要以從旁追敘非言情之章也爲歌行則合五言固不宜爾古詩無定體似可任筆爲之不知自有天然不可越之榘矱故李于鱗謂唐無五古詩言亦近是無卽不無但百不得一二而已所謂榘矱者意不枝詞不蕩曲折而無痕戍削而不競之謂􅀂于鱗所云無古詩又唯無其形埓字句與其粗豪之氣耳不爾則子房未虎嘨及玉華宫二詩乃李杜集中霸氣滅盡和平溫厚之意者何以獨入其選中古詩及歌行換韻者必須韻意不雙轉自三百篇以至庾鮑七言皆不待鈎鎖自然蟬連不絕此法可通於時文使股法相承股中換氣近有顧夢麟者作詩經塾講以轉韻立界限劃斷意旨劣經生桎梏古人可惡孰甚焉晉淸商三洲曲及唐人所作有長篇拆開可作數絕句者皆蠚蟲相續成一靑蛇之陋習也以神理相取在遠近之閒􅂊着手便煞一放手又飄忽去如物在人亡無見期捉煞了也如宋人咏河魨云春洲生荻芽春岸飛楊花饒他有理終是於河魨沒交渉靑靑河畔艸與綿綿思遠道何以相因依相含吐神理湊合時自然恰得太白胸中浩渺之致漢人皆有之特以微言點岀包舉自宏太白樂府歌行則傾囊而出耳如射者引弓極滿或卽發矢或遲審久之能忍不能忍其力之大小可知已要至於太白止矣一失而爲白樂天本無浩渺之才如決池水旋踵而涸再失而爲蘇子瞻萎花敗葉隨流而漾胸次局促亂節狂興所必然也海暗三山雨接此鄉多寶玉不得迤邐說到花明五嶺春然後彼句可來又豈嘗無法哉非皎然高棅之法耳􅀂果足爲法烏容破之非法之法則破之不盡終不得法詩之有皎然虞伯生經義之有茅鹿門湯賓尹袁了凡皆畫地成牢以陷人者有死法也死法之立總緣識量狹小如演雜劇在方丈臺上故有花様步位稍移一步則錯亂若馳騁康莊取塗千里而用此步法雖至愚者不爲也情景名爲二而實不可離神於詩者妙合無垠巧者則有情中景景中情景中情者如長安一片月自然是孤棲憶遠之情影靜千官裏自然是喜達行在之情情中景尤難曲寫如詩成珠玉在揮毫寫出才人翰墨淋漓自心欣賞之景凡此􅀋知者遇之非然亦鶻突看過作等閒語耳更喜年芳入睿才與詩成珠玉在揮毫可稱􅀟絶不知者以入字在字爲用字之巧不知渠自順手湊著欲投人處㝛隔水問樵夫則山之遼廓荒遠可知與上六句初無異致且得賓主分明非獨頭意識懸相描摹也親朋無一字老病有􅀌舟自然是登岳陽樓詩嘗試設身作杜陵憑軒遠望觀則心目中二語居然出現此亦情中景也孟浩然以舟楫垂鈎鈎鎖合題卻自全無干渉近體中二聯一情一景一法也雲霞出海曙梅柳渡江春淑氣催黄鳥晴光轉綠蘋雲飛北闕輕陰散雨歇南山積翠來御柳已爭梅信發林花不待曉風開皆景也何者爲情若四句俱情而無景語者尤不可勝數其得謂之非法乎夫景以情合情以景生初不相離唯意所適截分兩橛則情不足興而景非其景且如九月寒砧催木葉二句之中情景作對片石孤雲窺色相四句情景雙收更從何處分析陋人標陋格乃謂吳楚東南坼四句上景下情爲律詩憲典不顧杜陵九原大笑愚不可瘳亦孰與療之起承轉收一法也試取􅀄盛唐律驗之誰必株守此法者法莫要於成章立此四法則不成章矣且道盧家少婦一詩作何解是何章法又如火樹銀花合渾然一氣亦知戍不返曲折無端其他或平鋪六句以二語括之或六七句意已無餘末句用飛白法颺開義趣超遠起不必起收不必收乃使生氣靈通成章而達至若故國平居有所思有所二字虛籠喝起以下曲江蓬萊昆明紫閣皆所思者此自大雅來謝客五言長篇用爲章法杜更藏鋒不露摶合無垠何起何收何承何轉陋人之法烏足展騏驥之足哉近世唯楊用修辨之甚悉用修工於用法唯其能破陋人之法也起承轉收以論詩用敎幕客作應酬或可其或可者八句自爲一首尾也塾師乃以此作經義法一篇之中四起四收非蠚蟲相銜成靑竹蛇而何兩閒萬物之生無有尻下出頭枝末生根之理不謂之不通其可得乎樂記云凡音之起從人心生也固當以穆耳協心爲音律之準一三五不論二四六分明之說不可恃爲典要昔聞洞庭水聞庭二字俱平正爾振起􅀂今上岳陽樓易第三字爲平聲云今上巴陵樓則語蹇而戾於聽矣八月湖水平月水二字皆仄自可若􅇽虛混太淸易作混虛􅇽太淸爲泥磬土鼓而已又如太淸上初日音律自可若云太淸初上日以求合於粘則情文索然不復能成佳句又如楊用修警句云誰起東山謝安石爲君談笑淨烽煙􅀂謂安字失粘更云誰起東山謝太傅拖沓便不成響足見凡言法者皆非法也釋氏有言法尙應捨何況非法藝文家知此思過半矣作詩亦須識字如思應敎令吹燒之􅀋有平仄二聲音別則義亦異若粘與押韻於此鶻突則荒謬止堪嗤笑唐人不尋出處不誇字學而犯此者百無一二宋人以博核見長偏於此多誤杜陵以酇侯酇字作才何切平聲粘緣史漢注自有兩說非不識字也至廉頗音婆相如音湘則考據精切矣蘇子瞻不知軒轅彌明詩序長頸高結結字作潔音稺子之所恥爲而孟浪􅀂此近見有和人韻者以葑菲作芳菲字音押雖不足道亦可爲不學人永鑒唯孟浩然氣蒸雲夢澤不知雲土夢作乂夢本音蒙靑陽逼歲除不知日月其除除本音住浩然山人之雄長時有秀句而輕飄短味不得與高岑王儲齒近世文徵仲輕秀與相頡頏而思致密贍駸駸欲度其前王子敬作一筆草書遂欲跨右軍而上字各有形埓不相因仍尙以一筆爲妙境何況詩文本相承遞邪一時一事一意約之止一兩句長言永歎以寫纒綿悱惻之情詩本敎也十九首及上山采蘼蕪等篇止以一筆入聖證自潘岳以凌雜之心作蕪亂之調而後元聲幾熄唐以後閒有能此者多得之絕句耳一意中但取一句松下問童子是已如怪來妝閣閉又止半句愈入化境近世郭奎多病文園渴未消一絶髣髴得之劉伯溫楊用修湯義仍徐文長有純淨者亦無歇筆至􅀂晚唐餖湊宋人支離俱令生氣頓絕承恩不在貌敎妾􅀂爲容風㬉鳥聲碎日高花影重醫家名爲關格死不治不能作景語又何能作情語邪古人絶唱句多景語如高臺多悲風胡蝶飛南園池塘生春艸亭臯木葉下芙蓉露下落皆是也而情寓其中矣以寫景之心理言情則身心中獨喻之微輕安拈出謝太傅於毛詩取訏謨定命遠猷辰吿以此八字如一串珠將大臣經營國事之心曲寫出次第故與昔我往矣楊柳依依今我來思雨雪霏霏同一達情之妙有大景有小景有大景中小景柳葉開時任好風花覆千官淑景移及風正一帆懸靑靄入看無皆以小景傳大景之神􅀂江流天地外山色有無中江山如有待花桺更無私張皇使大反令落拓不親宋人所喜偏在此而不在彼近唯文徵仲齋宿等詩能解此妙情語能以轉折爲含蓄者唯杜陵居勝淸渭無情極愁時獨向東柔艣輕鷗外含悽覺汝賢之類是也此又與忽聞歌古調歸思欲霑巾更進一格益使風力遒上含情而能達會景而生心體物而得神則自有靈通之句參化工之妙􅀂但於句求巧則性情先爲外蕩生意索然矣松陵體永墮小乘者以無句不巧也然皮陸二子差有興會猶堪諷咏若韓退之以險韻奇字古句方言矜其餖轃之巧巧誠巧矣而於心情興會一無所渉適可爲酒令而已黃魯􅀡米元章益墮此障中近則王謔菴承其下游不恤才情別尋蹊徑良可惜也對偶有極巧者亦是偶然湊手如金吾玉漏尋常七十之類初不以此礙於理趣求巧則適足取笑而已賈島詩高人燒藥罷下馬此林閒以下馬對高人噫是何言與一解奕者以誨人奕爲遊資後遇一高手與對奕至十數子輙揶揄之曰此敎師碁耳詩文立門庭使人學己人一學卽似者自詡爲大家爲才子亦藝􅁐敎師而已高廷禮李獻吉何大復李于鱗王元美鍾伯敬譚友夏所尙異科其歸一也􅂊立一門庭則但有其局格更無性情更無興會更無思致自縛縛人誰爲之解者昭代風雅自不屬此數公􅀂劉伯溫之思理高季廸之韻度劉彦昺之高華貝廷琚之俊逸湯義仍之靈警絕壁􅀌騫無可攀躡人固望洋而返而後以其亭亭嶽嶽之風神與古人相輝映次則孫仲衍之暢適周履道之蕭淸徐昌穀之密贍高子業之戍削李賓之之流麗徐文長之豪邁各擅勝場沈酣自得正以不懸牌開肆充風雅牙行要使光燄熊熊莫能揜抑豈與碌碌餘子爭市易之場哉李文饒有云好驢馬不逐隊行立門庭與依傍門庭者皆逐隊者也建立門庭自建安始曹子建鋪排整飾立階級以賺人升堂用此致諸趨赴之客容易成名伸紙揮毫雷同一律子桓精思逸韻以絕人攀躋故人不樂從反爲所掩子建以是壓倒阿兄奪其名譽實則子桓天才駿發豈子建所能壓倒邪故嗣是而興者如郭景純阮嗣宗謝客陶公乃至在太沖張景陽皆不屑染指建安之羹鼎視子建蔑如矣降而蕭梁宫體降而王楊盧駱降而大厤十才子降而溫李楊劉降而江西宗派降而北地信陽琅邪厯下降而竟陵所翕然從之者皆一時和哄漢耳宫體盛時卽有庾子山之歌行健筆縱橫不屑煙花簇湊唐初比偶卽有陳子昂張子壽扢揚大雅繼以李杜代興杯酒論文雅稱同調而李不襲杜杜不謀李未嘗黨同伐異畫疆墨守沿及宋人始爭疆壘歐陽永叔亟反楊億劉筠之靡麗而矯枉已迫還入於枉遂使一代無詩掇拾誇新殆同觴令元浮艶又以矯宋爲工蠻觸之爭要於興觀羣怨絲毫未有當也伯溫季廸以和緩受之不與元人競勝而自問風雅之津故洪武閒詩敎中興洗四百年三變之陋是知立才子之目標一成之法扇動庸才旦倣而夕肖者原不足以覊絡騏驥唯世無伯樂則駕鹽車上太行者自鳴駿足耳所以門庭一立舉世稱爲才子爲名家者有故如欲作李何王李門下厮養但買得韻府羣玉靜學大成萬姓統宗廣輿記四書置案頭遇題查湊卽無不足􅀂欲吮竟陵之唾液則更不須爾但就措大家所誦時文之於其以靜澹歸懷熟活字句湊泊將去卽已居然詞客如源休一收圖籍卽自謂酇侯何得不向白華殿擁戴朱泚邪爲朱泚者遂褎然自以爲天子矣舉世悠悠才不敏學不充思不精情不屬者十姓百家而皆是有此開方便門大功德主誰能舍之而去又其下更有皎然詩式一派下游印紙門神待塡朱綠者亦號爲詩莊子曰人莫悲於心死心死矣何不可圖度子雄邪曹子建之於子桓有僊凡之隔而人稱子建不知有子桓俗論大扺如此王敬美風神藴藉高出元美上者數等而俗所歸依獨在元美元美如吳夫差倚豪氣以爭執牛耳勢之所凌灼亦且如之何哉敬美論詩大有元微之旨其云河下傭者阿兄卽是揮毫落紙非雲非煙爲五里霧耳如送蔡子木詩一去蔡邕誰倒屣可憐王粲獨登樓恰好安排一呼卽集非河下傭而何元美末年以蘇子瞻自任時人亦譽爲長公再來子瞻詩文雖多滅裂而以元美擬之則辱子瞻太甚子瞻野狐禪也元美則吹螺搖鈴演梁皇懴一應付僧耳爲報鄰雞莫驚覺更容殘夢到江南元美竭盡生平能作此兩句不立門庭者必餖飣非餖飣不可以立門庭葢心靈人所自有而不相貸無從開方便法門任陋人支借也人譏西崑體爲獺祭魚蘇子瞻黃魯􅀡亦獺耳彼所祭者肥油江豚此所祭者吹沙跳浪之鱨鯊也除卻書本子則更無詩如劉彦昺詩山圍曉氣蟠龍虎臺枕東風憶鳳皇貝廷琚詩我別語兒溪上宅月當二十四囘新如何萬國尙戎馬只恐四鄰無故人用事不用事總以曲寫心靈動人興觀羣怨卻使陋人無從支借唯其不可支借故無有推建門庭者而獨起四百年之衰落日照大旗馬鳴風蕭蕭豈以蕭蕭馬鳴悠悠斾旌爲出處邪用意别則悲愉之景原不相貸出語時偶然湊合耳必求出處宋人之陋也其尤酸迂不通者旣於詩求出處抑以詩爲出處考證事理杜詩我欲相就沽斗酒恰有三百靑銅錢遂據以爲唐時酒價崔國輔詩與沽一斗酒恰用十千錢就杜陵沽處販酒向崔國輔賣豈不三十倍獲息錢邪求出處者其可笑􅀋如此一部杜詩爲劉會孟陻塞者十之五爲千家註沈埋者十之七爲謝㬪山虞伯生汙衊更無一字矣開卷龍門奉先寺詩天闕象緯逼雲臥衣裳冷盡人解一臥字不得祇作人臥雲中故於關字生許多胡猜亂度此等下字法乃子美早年未醇處從陰鏗何遜來向後脫缷乃盡豈黃魯􅀡所知邪至沙上鳧雛傍母眠誣爲嘲誚楊貴妃安祿山則市井惡少造謠歌誚鄰人閨閫惡習施之君父罪不容於死矣小雅鶴鳴之詩全用比體不道破一句三百篇中創調也要以俯仰物理而咏歎之用見理隨物顯唯人所感皆可類通初非有所指斥一人一事不敢明言而姑爲隠語也􅀂他詩有所指斥則皇父尹氏暴公不憚􅀡斥其名厯數其慝而且自顯其爲家父爲寺人孟子無所規避詩敎雖云溫厚然光昭之志無畏於天無恤於人揭日月而行豈女子小人半含不吐之態乎離騷雖多引喻而直言處亦無所諱宋人騎兩頭馬欲博忠􅀡之名又畏禍及多作影子語巧相彈射然以此受禍者不少旣示人以可疑之端則雖無所誹誚亦可加以羅織觀蘇子瞻烏臺詩案其遠謫窮荒誠自取之矣而抑不能昂首舒吭以一鳴三木加身則曰聖主如天萬物春可恥孰甚焉近人多效此者不知輕薄圓頭惡習君子所不屑久矣近體梁陳已有至杜審言而始叶於度歌行鮑庾初製至李太白而後極其致葢創作猶魚之初漾於洲渚繼起者乃泳游自盗情舒而鱗鬐始展也七言絕句初盛唐旣饒有之稍以鄭重故損其風神至劉夢得而後宏放出於天然於以揚扢性情馺娑景物無不宛爾成章誠小詩之聖證矣此體一以才情爲主言􅂤者最忌局促周促則必有滯累苟無滯累又蕭索無餘非有紅罏點雪之襟宇則方欲馳騁忽爾蹇躓意在矜莊祇成疲苶以此求之知率筆口占之難倍於按律合轍也夢得而後唯天分高朗者能步其芳塵白樂天蘇子瞻皆有合作近則湯義仍徐文長袁中郞往往能居勝地無不以夢得爲活譜才與無才情與無情唯此體可以驗之不能作五言古詩不足入風雅之室不能作七言絕句直是不當作詩區區近體中覓好對語一四六幕客而已七言絶句唯王江甯能無疵纇儲光羲崔國輔其次者至若秦時明月漢時關句非不鍊格非不高但可作律詩起句施之小詩未免有頭重之病􅀂水盡南天不見雲永和三日盪輕舟囊無一物獻尊親玉帳分弓射虜營皆所謂滯累以有襯字故也其免於滯累者如只今唯有西江月曾照吳王宫裏人黃鶴樓中吹玉笛江城五月落梅花此夜曲中聞折柳何人不起故園情則又疲苶無生氣似欲匆匆結煞作詩但求好句已落下乘況絕句只此數語拆開作一俊語豈復成詩百戰方夷項三章且易秦功歸蕭相國氣盡戚夫人恰似一漢高帝謎子擲開成四片全不相關通如此作詩所謂佛出世也救不得也建立門庭已絕望風雅然其中有本無才情以此爲安身立命之本者如高廷禮何大復王元美鍾伯敬是也有才情固自足用而以立門庭故自桎梏者李獻吉是也其次則譚友夏亦有牙後慧使不與鍾爲徒幾可分文徵仲一席當於其五七言絕句驗之論畫者曰咫尺有萬里之勢一勢字宜着眼若不論勢則縮萬里於咫尺􅀡是廣輿記前一天下圖耳五言絕句以此爲落想時第一義唯盛唐人能得其妙如君家住何處妾住在橫塘停船暫借問或恐是同鄉墨氣所射四表無窮無字處皆其意也李獻吉詩浩浩長江水黄州若箇邊岸囘山一轉船到堞樓前固自不失此風味五言絶句自五言古詩來七言絕句自歌行來此二體本在律詩之前律詩從此出演令充暢耳有云絕句者截取律詩一半或絶前四句或絕後四句或絕首尾各二句或絕中兩聯審爾頭刖足爲刑人而已不知誰作此說􅆷人生理自五言古詩來者就一意中圓淨成章字外含遠神以使人思自歌行來者就一氣中駘宕靈通句中有餘韻以感人情脩短雖殊而不可雜穴滯累則一也五言絕句有平鋪兩聯者亦陰鏗何遜古詩之支裔七言絕句有對偶如故鄉今夜思千里霜􅁂明朝又一年亦流動不覊終不可作江閒波浪兼天湧塞上風雲接地陰平實語足知絕律四句之說牙行賺客語皮下有血人不受他和哄大雅中理語造極精微除是周公道得漢以下無人能嗣其響陳正字張曲江始倡感遇之作雖所詣不深而本地風光駘宕人性情以引名敎之樂者風雅源流於斯不昧矣宋子和陳張之作亦曠世而一遇此後唯陳白沙爲能以風韻寫天眞使讀之者如脫鈎而游杜蘅之沚王伯安厲聲􅸏暍箇箇人心有仲尼乃游食髠徒夜􅃻木板叫街語驕橫鹵莽以鳴其蠢動含靈皆有佛性之說志荒而氣因之躁陋矣哉門庭之外更有數種惡詩有似婦人者有似衲子者有似鄉塾師者有似游食客者婦人衲子非無小慧塾師游客亦侈高談但其識量不出鍼線蔬筍數米量鹽抽豐吿貸之中古今上下哀樂了不相關卽令揣度言之亦粤人咏雪但言白冷而已然此數者亦有所自來以爲依據似婦人者倣國風而失其不淫之度晉宋以後柔曼移於壯夫近則王辰玉譚友夏中之似衲子者其源自東晉來鍾嶸謂陶令爲隱逸詩人之宗亦以其量不宏而氣不勝下此者可知已自是而賈島固其本色陳無已刻意㝠搜止墮韲鹽窠臼近則鍾伯敬通身陷入陳仲醇縱饒綺語亦宋􅀄九僧之流亞耳似塾師游客者衛風北門實爲作俑彼所謂政散民流誣上行私而不可止者夫子録之以著衛爲狄滅之因耳陶公飢來驅我去誤墮其中杜陵不審鼓其餘波嗣後啼飢號寒望門求索之子奉爲羔雉至陳昂宋登春而醜穢極矣學語者一染此數家之習白練受污終不可復白尙戒之哉艶詩有述歡好者有述怨情者三百篇亦所不廢顧皆流覽而達其定情非沈迷不反以身爲妖冶之媒也嗣是作者如荷葉羅裙一色裁昨夜風開露井桃皆艶極而有所止至如太白烏栖曲諸篇則又寓意高遠尤爲雅奏其述怨情者在漢人則有靑靑河畔草鬱鬱園中柳唐人則閨中少婦不知愁西宫夜靜百花香婉孌中自矜風軌迨元白起而後將身化作妖冶女子備述衾裯中醜態杜牧之惡其蠱人心敗風俗欲施以典刑非巳甚也近則湯義仍屢爲泚筆而固不失雅步唯譚友夏渾作靑樓淫咬鬚眉盡喪潘之恆輩又無論已淸商曲起自晉宋葢里巷淫哇初非文人所作猶今之劈破玉銀紐絲耳操觚者卽不惜廉隅亦何至作懊儂歌子夜讀曲前所列諸惡詩極矣更有猥賤於此者則詩傭是也詩傭者衰腐廣文應上官之徵索望門幕客受主人之僱託也彼皆不得已而爲之而宗子相一流得已不已閒則繙書以求之迫則傾腹以岀之攢睂叉手自苦何爲其法姓氏官爵邑里山川寒暄慶弔各以類從移易故實就其腔殻千篇一律代人悲歡迎頭便喝結煞無餘一起一伏一虛一實自詫全體無瑕不知透心全死風雅下游至此而濁穢無加矣宋以上未嘗有也高廷禮作俑於先宗子相承其衣鉢凡爲傭者得此以擿埴而行而天下之言詩者車載斗量矣此可爲風雅痛哭者也咏物詩齊梁始多有之其標格高下猶畫之有匠作有士氣徵故實寫色澤廣比譬雖極鏤繪之工皆匠氣也又其卑者餖湊成篇謎也非詩也李嶠稱大手筆詠物尤其屬意之作裁剪整齊而生意索然亦匠筆耳至盛唐以後始有卽物達情之作自是寢園春薦後非關御苑鳥銜殘貼切櫻桃而句皆有意所謂正在阿堵中也黃鶯弄不足含入未央宮斷不可移咏梅桃李杏而超然元遠如九轉還丹仙胎自孕矣宋人於此茫然愈工愈拙非但認桃無綠葉道杏有靑枝爲可姗笑已也嗣是作者益趨匠畫里耳喧傳非俗不賞袁凱以白燕得名而月明漢水初無影雪滿梁園尙未歸按字求之總成窒礙高季廸梅花非無雅韻世所傳誦者偏在雪滿山中月明林下之句徐文長袁中郞皆以此􅃷巧要之文心不屬何巧之有哉杜陵白小諸篇踸踔自尋別路雖風韻不足而如黄大癡寫景蒼莽不羣作者去彼取此不猶善乎禪家有三量唯現量發光爲依佛性比量稍有不審便入非量況􅈂從非量中施朱而赤施粉而白勺水洗之無鹽之色敗露無餘明眼人豈爲所欺邪夕堂永日內編終薑齋文集卷二􅂳山遺書四十六衡陽王夫之譔傳二首石崖先生傳畧吾兄之先我而逝也意者其畱夫之之死以述兄之行歟不然何辜于天而使㷀孑荼毒之至此極也兄遺命以狀屬孤姪敞而俾夫之潤色乃夫之有識而侍兄先於敞者十餘年敞所未及知而夫之知之患難流離敞有時而不與則有餘地以聽夫之之述自顧衰病奄奄血氣盡而僅有心存且懼心之日㪚而不可旦暮待故哀緒未甯而急於述乃述吾兄之難也所可言者敞所未知者耳過此則有不能言不忍言不欲言者乃兄之所以爲兄者在是而旣不能不忍而不欲矣其餘固非兄之所以爲兄者而奚以言爲雖然敞所未及知與所未與者涕笑皆神之所行逡巡皆氣之所應固可於此得吾兄共貫同條之精爽請言其畧焉吾先子之得兄也年三十有七先妣亦三十矣惜兄甚而兄幼端凝淡泊食淡衣麤更以爲適與兩從兄自鬬草騎竹以至就外傅皆未嘗一語失敬愛之度依叔父牧石先生叔母吳太恭人無殊於父母冠昏後且生子授生徒矣對叔父母未嘗不以乳名答也仲兄稍長同席受讀而仲兄病幾痿兄調䕶扶掖齧指以受鍼艾仲兄賴以愈而卒以文章名南楚無一非兄曲意怡聲亹亹講說以成之者若夫之狂娭無度而檠括弛弓閑勒逸馬夏楚無虚旬面命無虚日者又不待言昌啓間先君子徵入北廱家僅壁立兄於世故雅不欲涉而戢志以支補者唯下帷畫粥敦孝友爲族黨鄕鄰所推重而家以甯念先君子之畱滯燕邸苦寒善病歲時晨夕無歡笑之容嘗記庚午除夜侍先妣拜影堂後獨行步廊下悲吟長安一片月之詩宛轉欷歔流涕被面夫之幼而愚不知所謂及後思之孺慕之情同於思婦當其必發有不自知者存也先妣有心痛疾舉發則彌旬不瘳夫之旣羸且惰仲兄亦多病扶掖按摩寒暑晝夜局曲於牀褥間十餘夕不寐兩三日粒米不入口以爲恆凡事先妣三十餘年以揜覆夫之不孝莫贖之罪者皆兄慈雲仁蔭之恩也兄爲學篤敏十六補弟子員餼於庠者八年自萬厤末時文日變始承禪學之餘繼以莊列管韓之險澀已乃效蘇曾而流於浮穴迨後則齊梁浮艷益趨淫曼兄獨守家訓一以鄧黃李鄒爲典型而整雅則􅀡追夏官明胡思泉之高躅一時文章鉅公推賞者不絕而杜門不一投謁在崇禎末人士以聲譽相高騰竿牘徵秋課者徧海内兄一無所醻酢闇然如巖穴之士嘗愴然謂夫之曰此漢季處士召禍之象也文章道喪不十年而見矣己卯以乙榜詔入太學時以六曹策士雋者卽授美除同舍皆氣矜競獵兄以父母老亟請告歸未允諸同舍以旦夕釋褐相畱兄尤憎其躁競曰吾焉能一日與奔騖者伍遂拂衣不請而歸憶鄕前輩歐陽正􅊙翁自北歸持兄家報夫之往領焉歐陽翁曰伯兄無日不垂思親之淚吾誘之以弈至三兩局則淚滴罫中矣歸而謝絕人事授生徒以佐菽水郡守墨而酷諸紳士畏其威其生日醵金爲軸欲製文祝之屢以强兄兄瞋目對眾大言曰不能惡惡如巷伯而更賦緇衣乎眾皆縮項面無色兄談笑而去壬午舉於鄕錄文呈御計偕至南昌楚中亂遂同夫之歸是時觀察全椒金公念吾兄弟貧甚欲爲治北裝邑有劣而梟者按法當死公屬意令餉吾兄弟千金活之其人來懇兄顧問夫之曰何如夫之答曰此固不可兄喜見於色曰是吾心也或曰千金不死於市豈能必彼之不幸免乎兄又顧夫之微笑夫之曰吾安能令其必死但不自我可耳兄曰此人逸他日禍延於鄕黨雖然吾謝吾疚而已子言是也遂峻拒之其人他請得釋後果一如兄言凡兄之所以教夫之而相砥礪者如此類不能毛舉也張獻忠陷衡州索紳士補僞吏吾兄弟以父母衰不能越疆望門無依賴舅氏玉􅀸譚翁引匿南嶽蓮花峯下賊購索益急匍伏草舍中兄忽亟向野人問黑沙潭之勝欲往遊夫之不解兄意曰此豈遊山時耶兄笑曰今不遊更何待子豈能不從我遊乎已而私語夫之曰更何處得一􅇦淸凈水爲我兩人葬地耶當是時夫之回眄見兄目光出􅊿外如電鬚髮皆怒張會日暮家奴遽報先君子爲邏者所得兄聞之欲出脫先子而沈湘以死夫之知兄耿介嚴厲出且與先子俱碎夫之所舊與爲文字交者黃岡奚鼎􅉗陷賊中知吾兄弟必不可辱曲意相脫夫之乃剺面刺腕僞傷以出而匿兄以死告先君子乃免夫之亦隨宵遯當夫之出時兄藏繩衣內待夫之信卽自盡夫之旣免先子而自免乃不果死然則棲遲荏苒年逾八袠而死于林巒之下非兄志也豈曰未嘗受祿而遂可生哉故其題座右曰到老六經猶未了及歸一􅀧不成􅁅自此以後迄于今則所謂不能言不忍言不欲言也不欲言者天地之生人均也我兄弟亦僅與人而爲人也賢且智疏通而剛勁倍蓰什百於我兄弟多矣我兄弟所以自問者非有殊絕不可及之事而柰何沾沾以自言且恐人之無或聽也則欲言而汗浹於背矣不忍言者使我兄弟前此而死卽幸而爲士又幸而食祿亦與耕鑿屠販之人不相爲異天之不弔乃使我兄弟若有可言者是幸天之異以自異也而忍乎哉不能言者我兄弟之苟延視息哽塞如遡風而終老死于荒草寒煙之下不知者以爲窶且貧而不釋􅀬中之憾卽邀惠於知者亦以爲如是生如是歸愚者之事畢矣夫孰知我兄弟之戴眉含齒抱餘疚於泉臺也故置吾兄於箕山吹瓢桐江垂釣之間而兄不受置吾兄於神武挂冠華頂高眠之間而兄亦不受悠悠蒼天蕩蕩黃壚抱愚忱以埋幽壤吾兄弟之志存焉顧卽兄遘愍以前惻悱天極􅀌高嶽立爲夫之所侍圅丈而習知者以髣髴之性一也情一也勃然不中槁之氣一也不縱步於康莊自不㝠趨於臲卼夫豈有二致哉留夫之於衰病之餘以述兄者止此而已投筆欷歔知遺忘之尙多也第三弟夫之譔孝烈傳雙髻外史曰吾避戎上湘湘之人競相吿曰􅇝子揮利刃以斷首讐首女彭抱嬰兒而赴水余諗之良然盈目皆忘恩畏死苟圖榮利者而能稱道弗絕人心固不容泯也亟次所聞而傳之􅇝孝子者問其名不得祖懋德以孝亷仕縣令父業嘉字伯修補文學喜交游吟咏與湘人士龍孔蒸歐陽淑稱湘三詩人丁亥春湖上墮守降將王進才之兵鞭督師潰掠而走湘西湘西之地曰縠水林箐深險伯修奉母匿峻谷中獨與姊婿瀏陽胡某坐谷口茅舍中詗音息胡某者故貴公子裘馬甚飾偶客於此伯修有老􅶃奴曰家祿不知何以憤怨其主人逸出故與兵遇吿兵曰從此越叢薄有谷口茅舍胡􅇝兩公子在焉多金有好馬可襲取也兵如其言執胡某及伯修索金無以應索馬馬盡兵怒曰適一老漢黑而傴言若爲胡􅇝兩公子多金多好馬而不與我邪遂殺伯修及胡某當其時有小奚奴匿積草中具聞之孝子時年十五閱旬日兵定乃行哭求尸斂之求父所繇遇害不得晝夜悲號小奚奴憐其骨立乃具以吿孝子遽起掩小奴口故慰勞家祿攜之至伯修母孺人所長跽泣血以請曰某將手刃此賊不敢不吿孺人以某穉弱狎其言未應明日復􅂝奴至伯修殯次捽奴跪殯前呼小奴出證之奴且諒其無能爲漫應曰兵執我我不如此云我死矣語未絕口孝子先淬一利刃藏殯帷中至是急斫之奴首已墮地矣遂刲其心置筵上退就位號泣以吿於殯血流殷衰旁人怪呌孝子母驚出視之大駭仆地孝子掖母入温言慰母神色不變孝子素淸羸髮方覆額長不滿五尺奴故􅶃揮刃俄頃頭隕胸疈人羨怪之以爲有神助焉余嘗交伯修欲求至孝子所弔慰之道阻不達唯習聞湘人之言百喙如一者若此雙髻外史曰神勇者死而忘乎慮性勇者慮而决以死夫慮至則勇且衰矣慮而能勇勇矣哉唯絕慮者能以慮勇要離菀勃焚其妻息伍員從容寄帑後從其致雖殊均慮效也上湘有鄕曰梓田王氏世居焉丁亥春長沙巡使趙廷璧率所部兵潰而西縱使大掠彭烈婦者田家女也適王氏子有一子方晬兵猝至烈婦與其姒及一婢皆被執烈婦􅐾容獨粲兵睨而謔浪之烈婦赬然而怒已而正容俯首而思良久而定拊其姒曰吾知所以處此矣姒曰何若曰死耳姒曰我焉用死􅀗而縶者豈徒我兩人哉烈婦笑曰此非而所知也我未卽死者此一歲子無所託將踐蹂之或豚子置之姑與夫不可得見將誰授邪誠不忍其踐蹂且先決絕此而吾自處易矣其子時在婢懷抱中遽起奪而趨之池畔投子水中㦸手呼曰吾無所復念矣躍入池水死其婢後得釋歸對其家人言如此死三日兵去尸乃浮出不脹不䵟貌如生外史曰此夫勇而能慮慮以生勇善慮而力勇者與嗚呼豈不賢哉行狀二首先君子行狀闕譚太孺人行狀不孝夫之旣受命於介之述先君子狀遂狀先妣譚太孺人哀哉先君子几筵方徹太孺人遽罹終天之慘毒抑三十有四年矣不孝兄弟偷活人間弗能率迪慈訓以處一死而厚載之恩有心未死而何能自昧也先君子以宏慈行德威抑且至性􅂤靖尙不言之敎不孝兄弟之奉敎也不以其不可黙喻之頑愚而多所提命毎有顚覆違道之行但正容不語倚立旬日不垂眄睞乃不孝兄弟頑愚實甚倀罔莫知所自􅀗咎刋心欲改而抑不知所從太孺人乃探先君子之志而戒不孝兄弟以意之未先志之未承也詳謫其動之卽咎善之終迷申之以長傲從欲之不可發不孝兄弟之慝於隱微而述先君子之素履以昭滌其睯曶旣危責之抑涕泗將之然後終之以笑語而慰藉之哀哉吾父如油雲在天而吾母且承之以敷甘雨然而伊蔚伊蒿終爲枯槁則不孝兄弟之􅀒吾母尤甚於􅀒吾父也如是者不孝兄弟胥有之而不肖夫之蚤歲之破轅毀犂也爲加甚勞吾母之憂者爲加篤至於今老矣弗能洗心振骨自立於鬚眉之下猶然一十姓百家啄粒栖枝不亡以待盡也德人君子固宜遐棄無稱雖然太孺人之懿則未忘於宗族姻黨者其能不冀望於彤管乎凡太孺人之篤婦順也介之成童而游於鄕較母已逾四旬夫之成童而游於鄕較母已望六袠矣所謂起敬起孝以事堂上者皆莫能知但聞太孺人申戒諸子婦承事先君子者述其事少峯公者三年酷寒不敢爇火畏煙之出於牖罅也炎暑不敢撲蟁畏箑聲之遙聞於靜夜也滌器不敢潄水引濡巾而拭之猫犬擾不敢迫逐擁袂而遣之毎一語及䕫䕫悚立對子婦如大賓及述范太孺人疾痛傾逝則淚盈於􅊿不異初喪以此測太孺人之事舅姑非可以意量知者哀我生之晩而不能見也佐先君子之襄大事也太孺人自不欲言之無敢問者問亦不答但少峯公英卓不事家人生產徒四壁立先君子勤素業乃薄田僅給饘粥而愼終之厚倍於素封稱貸繁猥卒皆酬償太孺人銷􅆪珥斥衣襆固不待言抑數米指薪甘荼如飴以成先君子之孝若不孝兄弟所得見者先君十年燕趙娶子婦搆堂室終不孝讀書之業且河潤宗婣無乾餱之失􅀋出於太孺人之撙節則襄大事之時心專力竭愈可推矣叔母吳太恭人長太孺人二歲周旋四十年歡如一日迨旣分居經旬不相見則皇皇問訊不絶每圍爐共語呴呴如兩新婦從兄玉之年四十棄諸生拜世官冠帶入省猶手酒漿相勞苦如撫孺子季父子翼翁蚤未有子嗣置側室或頗輕之先孺人待之如姒娣曰且令叔氏有子卽貴矣至養子婦以慈畜童僕以惠而自然整肅莫敢䙝越及今念之不孝兄弟在膝下時如幸生時雍之世春風一庭靈雨四潤哀哉不可復追矣前母外祖父學博綦公罷敎歸里無子太孺人承事敦篤不異所生綦公垂殁待太孺人而瞑先叔祖太素翁罷諸生落拓且無應嗣叔祖母朱井臼不給太孺人迎養敬事怡然終老葢推事父母者以事綦公推事舅姑者以事太素翁誠至而禮洽亦不自知其厚也不孝夫之閒關兩載未􅀗奉臨終之訓遺命介之更無餘語惟歸葬先君子之右遠腥穢而不厯城市以求協於先君子淸泉白石之心而已哀哉此尤不孝所血涌心濤而滔天之罪百死莫酬者也墓誌銘表四首文學劉君崑映墓誌銘友人崑映劉君撤瑟二十年矣子安基安鐂以幼孤未能成禮飮泣而欲求銘其墓以叔父庶僊氏之命來言曰誌以志功銘以名名弗功弗名亦足以勒片石乎余肅然竦起而對曰是其所以可志而可名也且夫今之所謂功名者吾知之矣其始也槁吟而蹙睂以操觚知刺繡文不如倚市門也望風會之所流隨波以靡拾殘英調鳥語而唯恐其不肖繇是而詭合矣則以吮弱民􅆺上官赩然獵榮膴孰不健羡之苟其詭而失也猶且徼時譽以自雄於里序栩栩然翔步於長吏之門噞喁漚沫以自潤士能不㞕於此者其志可誌其無名也可銘此余所以樂交崑映氏而悼之不忘也二子其何讓焉君初名永公更曰瑋崑映其字也先世有以丞相稱者名不傳大約以祥興蒙難而家于衡遺戒子孫廢讀而耕故爵里名字皆佚子孫世農而樸爲鄕里重至起潛公登甲乃讀書補文學登甲生去華公紹蕢鄕貢士未仕君生而刷睂植骨有偉人器度起潛公喜而名之曰鐵漢稱其質也讀書不甚敏而所志益堅苦吟窮旦夕崇禎間齊梁風靡駢麗爲虛華而君刻意以摉求經傳之旨毎有論辨毅然不隨時尙而求其至當以是補文學者二十餘年試于鄕而不售乃就山中誅茅搆斗室蒔雜花坐誦行吟忘年忘境其視世之倏爲牛鬼蛇神倏爲嬌花囀鳥者蔑如也此名之所以窮也數十年之士風毎況而愈下其相趨也毎下而愈況師􅆺其生徒鄰􅆺其豪右士􅆺其守令乃至􅆺其胥隸友􅆺其奔勢走貨之淫朋而君之義形於色也人之􅆺己視如鮑魚之在側見􅆺人者則蟲豸遇之不爲一動其色笑間有初能戍削者亦欣然與定交迨其以貧易操則截然拒絕于一旦乃至相遇而不與揖以是食貧沒世取給于舌耕而躬親田牧僅免飢寒悠然自適郡邑之門逆風而避其腥村塢化之數十里之間無訟嗚呼使有遇於世可追踪器之以不􅀒起潛公之期許而齎志違時中身而折此功之所以窮也叔氏之言哀君之窮焉耳矣爲名於世不如顧名於心爲功於物不如加功於己久矣舉念而可質之君子心之名也衛生而遠於不仁身之功也請廣叔氏曰君之功名大矣哉銘曰疇昔過君溼雲蒙岫雷雨夕喧裂窗傾澑縱酒高吟天爲倏晝弔古悲今別人分獸自君之亡狂言誰奏獨遺孤塋㝛艸靑覆銘以千秋式垂爾後武夷先生曁譚太孺人合葬墓誌有明徵士武夷先生曁配譚太孺人先後合葬于此閱三十七年冡子介之已卒不孝季男夫之年七十矣遘屯永世將拂螻蟻迺克誌焉前此幾幸當世知道君子拂拭幽光而頫仰人間無可希望弗獲已而質述大略所望徼來哲之鑒閔尙無後艱恃天在人中不可冺也先生姓王氏諱朝聘字修侯曾祖考一山公諱甯上輕車都尉諱震之次子也祖考靜峯公諱雍厯任江西南城敎諭考少峯公諱惟敬妣范孺人譚孺人考念樂公諱時章妣歐陽孺人先生以隆慶庚午季冬月朔日誕生卒以丁亥十一月望後三日先生始終爲明徵士遺命不以柩行城市方隱南嶽潛聖峯下卽卜其麓以葬孺人袝焉先生盡道事親白首追思猶勤泣血敦仁友弟早齡同學垂老不衰於時三湘風化胥重天倫皆不言之敎所孚也少從鄕名儒伍學父先生受業徒步遊安成亭州博訪師友已從泗山鄒先生受聖學奉誠意爲宗密藏而力行之取與言笑一謹于獨知發爲文章體道要以達微言葢知者尟也天啟辛酉以乙榜奉詔徵入太學無所屈合投劾不仕抱道幽居長吏歆仰求見不得門人以文登楚黔賢書者五人邑里被服靜正之敎薄者敦恣者斂悍戾者柔譚太孺人以孝睦慈順贊成令模内外蒸蒸焉孺人後先生三歳庚寅仲秋月朔後一日卒去誕生歲萬厤丁丑閏八月二十二日凡七十四載而姻婭鄕國傳聞欽慕先生孺人之澤視不孝夫之有加焉生子三長介之明孝廉歲在丙寅卒人士謚爲貞獻先生次叅之選貢生早卒次則不孝夫之也嗣學不明守死不篤令聞永謝僅保孤封于此嶽阜尙宜爲天所愍爲人所式永固幽藏與山終古不敢系銘泣述梗略如右牧石先生曁吳太恭人合袝墓表蓋聞德契於幽弗容終閟慈留於永詎忍或諼旣不昧於諶懷矧敢矜其溢美惟我仲父牧石先生諱廷聘字蔚仲我祖考少峯公之仲子先考武夷公長弟也配吳太恭人以伯兄玉之繼絕襲右職遇覃恩例得受贈先生孝自天豐文因道勝遺塵雲迥抗志霜淸其順以承親也于童年小有過失少峯公責譴門外永夕下鑰時當除夕風雪凄迷先考私從隙道掖令歸寢先生引咎自責必遵庭命翼日元旦少峯公方啟扉焚香先生怡顏長跽少峯公且喜且泣稱其允爲道器逮及耆年省塋酹酒涕泗橫流拜伏不起則夫之所親見也嗣與先考同受業于伍學父先生之門匪徒文譽齊騰抑且德隅均整易衣共枕長年歡浹吳太恭人與先妣譚太孺人孝睦壹志等于同生繇是稱孝友者以寒門爲華族之箴瑱施于今日流頌不衰有耳有心胥于一致非不肖夫之所敢侈一詞也十八補郡文學屢應賓興文筆孤淸弗售于有司歲己酉與先考同赴省試先考中塗病作遽謝同輩掖扶歸里小艇炎蒸篝燈搔抑目不定􅊿者五晝夜因􅁣然曰幸全三樂復何有于浮雲哉自是雅意林泉布韈靑鞵逍遙于下潠觀田孤山種梅之下築曳塗居搆小亭題曰濠上浚小池蒔雜花其側釀秫種蔬供歲時之薦先生少攻吟咏晩而益工於時公安竟陵哀思之音歆動海内先生斟酌開天參伍黃建拒姝􅆺之曼聲振噌吰之亢韻屢嬰離亂遺稿無存而夫之早歳披猖不若庭訓先生時召置坐隅酌酒勸戒敎以遠利蹈義懲傲撝謙撫慰叮嚀至于泣下迨今髮敝齒凋忠孝罔據仰負宏慈未嘗不刻骨酸心深其怨艾而祇畏冰淵差遠巨憝則固先生包蒙以養不中之明德所被也先生以萬厤丙子正月六日生以丁亥十月日謝世恭人先一歲乙亥三月十一生同歲十月日沒子玉之釗之玉之以文學襲衡州衛指揮同知釗之早卒孫恪安國恬子偉敏恪恬殤殞子偉亦早世曾孫生祐子偉出生蔭敏出夫之事先生無異先考追懷慈誘瀕死不諠年垂七十乃克與敏輩勒遺緒于阡不足述高深之百一聊傳家世孝友醇靜之矩型勿俾後裔卒迷云爾文學膴原氏墓誌銘膴原氏名敞貞獻先生之冡嗣于余爲從子貞獻先生以丙寅正月晦卒膴原哀毁成疾以其年十月二十一日終于殯宫先生違世守眞耐園雅不與世親膴原依依園側躬耕授徒以侍麾之遠而愈不忍離篝火具沐腧厠汛除之勞髯髮半白矣呴呴如孺子執勞不倦如是者三十餘年先生八十矣其卒也啼號不絕于口閱六月而病病愈哀又四月而亡哭抱遺書授余爲訂定而傳之遺命以衰麻斂停棺侍殯側候啟殯相隨葬于先生曁妣歐陽孺人之墓側和淚濡筆作書貽余俾如其志余家自驍騎公于洪武間世官衡州衛十世而至先徵君武夷公十一世而至貞獻先生皆以内行爲士友所推許膴原克敦先訓而發自性生尤爲切摯其素履秉心堅樸不欺然諾于昆弟姻婭友朋皆抉心殫力以相周旋無所緣飾十五補邑文學爲文淸通醇正詩得陶謝風旨讀書刻意以求物理天則之蘊不如手捫而目見之不止幼從余學學于余者篤志精研未有及之者也有子二生祁生郊女一幼未字生祁生二子綿續一女許字蕭喬如生以崇禎庚午八月二十日距沒之年五十有七余于其亡哀之不欲生而重悼其銜恤以隕生父沒而不能一日存于世也爲之銘記二首􅂳山記船山山之岑有石如􅂳頑石也而以之名其岡童其溪渴其靳有之木不給於榮其草癯靡紛披而恆若凋其田縱橫相錯而隴首不立其沼凝濁以停而屢竭其瀕其前交蔽以絯送遠之目其右迤於平蕪而不足以幽其良禽過而不棲其内趾之獰者與人肩摩而不忌其農習視其堘埓之坍謬而不修其俗曠百世而不知琴書之號然而予之厯溪山者十百其足以棲神怡慮者往往不乏顧於此閱寒暑者十有七而將畢命焉因曰此吾山也古之所就而不能槩之於今人之所欲而不能信之於獨居今之日抱獨之情奚爲而不可也古之人其遊也有選其居也有選古之所就夫亦人之所欲也是故翔視乎方州而尤佳者出而跼天之傾蹐地之坼扶寸之土不能信爲吾有則雖欲選之而不得蠲其不歡迎其不棘江山之韶令與愉恬之志相若則相得而固爲棘人地不足以括其不歡之隱則雖欲選之而不能仰而無憾者則俯而無愁是宜得林巒之美蔭以旌之而一坏之土不足以榮吾所生五石之煉不足以崇吾所事栫以叢棘履以繁霜猶溢吾分也則雖欲選之而不忍賞心有侶詠志有知望道而有與謀懷貞而有與輔相遙感者必其可以步影沿流長歌互答者也而㷀煢者如斯矣營營者如彼矣春之晨秋之夕以戸牖爲丸泥而自封也則雖欲選之而又奚以爲夫如是船山者卽吾山也奚爲而不可也無可名之於四遠無可名之於末世偶然謂之歘然忘之老且死而􅂳山者仍還其頑石嚴之瀨司空之谷林之湖山天與之淸美之風日地與之豐潔之林泉人與之流連之追慕非吾可者吾不得而似也吾終於此而已矣辛未深秋記小雲川記湘西之山自􅁘薑竝湘以東其複數十以北至於大雲大雲之山遂東其陵乘十數因而曼衍以至于蒸湘之交大雲之北麓有溪焉竝山而東以匯于蒸未爲溪之麓支之稚者北又東其複十數皆漸伏而爲曼衍登小雲複者皆複而曼衍盡見爲方八十里以至于蒸湘之交遂踰乎湘南盡晉甯之洋山西南盡祁之岳侯題名東盡耒之武侯之祠東北盡炎帝之陵陵􅌕也北迤東盡攸之燕子巢天宇澄淸平煙􅇈野飛禽重影虹雨明滅皆迎目授朗於曼衍之中其北則南嶽之西峰其簇如羣蕚初舒寒則蒼春則碧以周乎曼衍而左圅之小雲之觀止矣春之雲有半起而爲輪囷有叢岫如雪而獻其孤黛夏之雨有亙白有漩澓有孤裊有隙日㫄射燿其晶瑩秋之月有澄淡而不知微遠之所終冬之雪有上如暝下如月萬頃有夕鐙爍素懸於泱莽山之觀奚止也小雲之高視大雲不十之一也大雲之高視嶽不三十之一也豈啻大雲嶽之觀所能度越此者唯祝融焉他則無小雲若葢小雲者當湘西羣山之東得大雲之委而臨曼衍之首者也故若此是故湘西之山觀之尤者逮乎小雲而盡繫乎大雲而小者大雲龎然大也或曰道士申泰芝者修其養生之術於大雲而以小雲爲別館故小之雖然盡湘以西終無及之者自麓至山之脰皆高柯叢樾陰森葱蒨陟山之巔則古木百尺者皆俯以供觀者之極目養生者去僧或廬之廬下蒔雜花四時縈砌右有池不雨不竭予自甲辰始遊嗣後歲一登之不倦友人劉近魯居其下有高閣藏書六千餘卷導予遊者薑齋文集卷二終
