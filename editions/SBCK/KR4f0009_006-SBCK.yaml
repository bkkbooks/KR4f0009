front:
  text: 倣體詩夕堂戲墨卷六􅂳山遺書五十八
  hash: sha256:641f26f5bb896679c0f602da0d97d765e5e5aa815ca434f22646dc1750125428
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4f0009_SBCK_006-1a}
body:
  text: 衡陽王夫之譔倣昭代諸家體居常謂與天同造者迎之不見其首隨之不見其尾適融而流適結而止其唯三百篇乎過此以還思必有津筆必有逕非獨至而不可至者也江醴陵自李都尉至湯休上人得其思與筆所起止以相迎隨遂爾神肖皆唯其津逕爾昭代三百年間詩屢變矣要皆變其所變徙倚於銖寸之頃一羽而知全鳳亦知全雞其爲翮本均也偶爲尋之得三十八人人倣一章非必全乎形埓想其用筆時適如此耳淺者循其一跡以自樹於宗風一噱而已風可帆使也雨可蜥蜴致也日而後不可追也孰其爲日乎吾不敢爲夸父之逐矣劉護軍基秋興括蒼雲繞縉雲都萬簇芙蓉翠色鋪紅雨溼飛烏桕薄碧波晴點鷺痕孤登樓有賦依州牧長揖無門傲酒徒不識故園他日淚蘋花還送暗香無楊提舉維楨嬉春選勝明朝陌上花狂夫已宿黃公家連錢夜洗香泥點團扇新描輭縠紗燕尾掠人霑綠酒鶯歌隨處呪蘭芽片雲南浦不成雨油幕高搴看晚霞倪處士瓚園居長夏新桐洗綠莖乳鶯厯亂啄朱櫻不知㣲雨遮靑嶂卽次流珠濺紫萍閒整丹經香篆歇小臨鶴逕碧苔生碁枰已斂湘簾捲稍􅁴銀鈎挂嶺橫貝助教瓊感亂正作越來溪上㝱潮聲夜打淛東城春花春柳皆他日羽檄羽書悲此生戍火搖烟低片月歸鴻掠浦警三更堂堂歲月相欺得明鏡新􅄈雪幾莖袁御史凱白燕烏衣莫與怨斜陽雪色新裁素練裳隋苑柳疎長帶月河陽花满不驚霜瓊牕瞥眼窺銀字玉鏡偸臨鬭靚粧似妬蘋花秋色好不畱淸影照寒塘高太史啟梅花稍覺逢春客思催江春無奈促花開一枝橫水寒潭月幾點囘風雪砌苔啼鳥易驚歸客㝱隴雲空寄故園哀東風已遣芳心盡誰與垂楊􅃷楚臺劉典籤炳早朝暄風綠草鳳臺新金爵浮光射寶輪雲斂三山澄海氣日華雙闕起江春衣裳初識龍文闊導唱遙欣黼座親還使故園歸興盡鳴珂長日惜芳塵孫典籍蕡客思扁舟下嶠識春寒五兩隨風度幾灘古渡鐃吹侵月奏孤城樓堞帶雲看故園荔酒經春熟過嶺梅花度雪殘一曲滄浪牽客淚羊城珠斗冷仙壇高禮曹棅酬答彈鋏新從上國行遙瞻山斗識才名漢廷屬望賢良策魯殿初傳絲竹聲柳色上衣春日酒梅花吹笛歲寒情殷勤莫􅀒乘槎約拂劒欣看碧漢淸李少師東陽感春小園花發鎭簾垂春草臨堦未覺滋香尾困風穿溼幕墨膠凝水帶冰澌病中藥裹煩南客㝱裏蘭芳記楚辭猶有湘干田二頃君恩不許趁耕時陳簡討獻章晚酌日㬉風微柳帀溪分明莎逕未須迷鶯聲過澗還如近蝶翅因花亦屢低心迹同原聊共賞乾坤雙歇恰單提芒鞵是處尋春好不揀蒼苔與沁泥祝京兆允明悲秋獨坐不知秋日短行年唯有鬢霜新病過柳市愁京兆㝱記番禺狎海人泡影勳名消易得牢騒日月閱來親烏藤拄杖明朝事怕見丹楓映水濱唐解元寅落花啼鶯流水怨匆匆萬頃春華一㝱中芳韻悠悠隨畫角閒愁點點到簾櫳囘風無望依瑤草韶月難期映晚紅囘首繁華能幾日碧條簇簇惹薰風李副使夢陽懷古百尺麗譙俯暮原黃河捲雪擁蛟門朱仙祠廟靑松冷艮嶽風霾白日昏華表定畱千載恨靈旗難返九招魂寒鴉斜照蒼茫外酹酒長懷國士恩何副使景明遊厯軺車明發啟秦關縹渺河山紫氣殷淸渭波縈勞悵望蓮峰雲杳阻躋攀鴻門霸氣蒼烟合漢寢遺封翠柏閒萬里蕭條隨薄宦不知明鏡改朱顏文待詔徵明齋宿星華淺映御池冰栖鵲寒喧樹影層獨對畫垣圍藻井遙知香霧達觚稜鐘人屢扣流霜杵羽騎長依帶月燈應有五雲迎鳳葆曉風已覺透靑綾鄭稽勳善夫送客相送今朝倒客杯風高木落試登臺乾坤帶甲無終日草澤紆籌幾駿才南去祇悲湘水鴈北書唯寄隴頭梅栖遲迢遞雙極目大斾孤城畫角哀楊殿撰愼塞垣碎葉􅀌城朔鴈飛安西都䕶候騎歸漢旌已覺交龍捲虜酒初驕撞馬肥桃葉楊花江上㝱敲冰燧火北庭圍伏波未洗明珠恨莫詫中朝有建威李廉訪攀龍登眺絕巘岧嶤接太淸登臨極目羽翰輕靑徐海色侵牛斗河朔雲山擁鳳城漢樹龍鱗秋色爽秦碑屭贔暮烟橫探崖欲問長生訣咫尺蓬壺萬里情王司寇世貞投贈白雪仙郎雅奏偏秋曹雲冷綵毫傳迢遙星棹依元禮蕭瑟高樓憶仲宣采藥三山迷蜃氣長歌萬里看龍淵東方千騎空籌策媿爾酬恩紫禁邊高廉訪叔嗣宦況三晉雲山西爽開猶憑呼吸近燕臺時依朱邸陪仙仗喜際靑陽進壽杯鈴閣雪消春草長牙旌風急暮笳哀葵心欲逐桑乾水縈遶金河輦道苔梁秋官有譽弔古陸沈不擬盡天涯囘憶西湖怨㝱華萬古神州消白浪中流尺土捲黃沙雲蒸海氣栖檣燕樹隱龍宮急暮鴉遙想講筵當日語唯畱碧血洒魚鰕屠大儀隆送別高樓淸瑟送離羣欲逐楊花怨夕曛繡袷春寒三月雨牙檣風急一江雲狂歌戲馬臺前客囘首鍾山移後文浩蕩長淮分咫尺揚州紅藥屬夫君朱九江曰藩閨怨章臺垂柳葉凋秋孤怨孤栖蕩婦樓六朝香粉丁都護萬里戎弢霍小侯明月機中雙紐縷黃雲城上千金鈎此生不擬長相憶猶㝱落花逐上流王上舎穉登月遊秋滿吳淞江外江棠橈波斂夜推牕月華始出照五兩白鳥飛來恰一雙客散歌聲猶有恨霜寒酒力未全降西歸更送山陽笛寫人落梅別調腔于閣學愼行紀賜龍胎密孕御園春蔬署尋芳剝錦鱗天詔正如裁玉版臣心未敢擬霜筠中宵酒醒香生頰緩火羹淸玉點脣肉食承恩霑鳳實秋風忍憶故鄕蓴徐秀才渭懷古湖光千頃敞祠宮雪捲長堤綴蓼紅血蹟㝱殘凋燕壘靈旗雲閃起蛟風局爭成敗天難主情到華夷感亦同古鼎香烟飄碧篆絲絲飛繞六陵東湯遂昌顯祖寄懷星漢當簷挂素秋元禽欲去復緘愁江花笑拂荷衫袖縠水囘迎竹葉舟行藥定逢菖九節憶梅遙愛月三洲垂楊色色縈歌扇未遣新箏怨鴈樓袁吏部宏道放言乾坤非短㝱非長花落聊紓粉蝶忙莫遣酒星囚北海偶逢伏日飽東方蠅牕乍裂雙眸闊狐帽隨拈徹骨香唯有昭文琴外譜不從䕫曠問宮商王太史衡春賞幾日新陰輭碧莎羽笙日日入鶯歌花如靜女添春繡月許遊人畫淺蛾病減恰逢垂柳瘦詩成長在野亭多銀箋欲寄催花句卻爲情深未訂訛陳徴君繼儒閒居衡門過雪草心蠲玉茗胎紅透始暄乍響靑松烹紫笋閒移斑几就黃綿茅山書至兼酬藥上海鶴歸未買田熟煮淸酤添箬裹爲移春閏入新年鍾少參惺淮泛書史笙歌儘未殊林光江氣各淸迂深知帝里春偏靜小愛閒官韻不拘水有性情鷗鷺得月函虛皛藻蘋孤囘舟羣動皆空謐隔岸籠燈半有無譚解元元春嶽遊不知猿鳥至何方葉葉晴容發靜光潭黑龍能深定力苔新雲亦戀幽香泉於草樹情偏摯日以森寒影倍長始覺向來湘艇上孤危錯擬露鋒鋩王僉事思任登岱何須大叫帝閽聞肸蠁通天黍米分吳練淒迷虧老壽漢封細碎到亭云欲收元氣無堅影自笑頑軀亦片雲帝鬼癡靈皆一蟻强將齋沐溷元君曹蘭臺學佺感時杉關關外幾分春已報江干惹戰塵臨水自澆三日洒看花無那百年人仙函難訪龍韜祕瑤草誰於御輦親暫與風光相藴藉巡池􅂎柳亦芳辰倪司徒元璐抒憤狂歌不審定因何夾臆紅潮湃萬波怖鬼已勤懸紫蟹沖天無望錮蒼鵝妬津日日添風雨疑網重重長薜蘿爲愛信陵多縱酒糟邱無奈醖情魔陳黃門子龍贈戍江潭瑤草不須生自折疎麻送遠行九廟威靈元白日四愁風雨有孤榮靑編白簡星光迥大纛高牙落照傾極目蒼生悲海色唯餘三學傲公􅀸顧秀才開雍慟哭饞蛟風激怒濤腥逝水東傾夜不扃無望金山邀北岸恰逢潮水落臯亭烏衣夜色空迷燕碧血中宵欲化螢囘首五雲蟠御寢斷腸鵑哭向冬靑倣體詩終薑齋文集卷六􅂳山遺書四十六衡陽王夫之譔九礪闕
