front:
  text: 鴈字詩夕堂戲墨卷五船山遺書五十七
  hash: sha256:f6973c48ff904f4265d06278f899a9db499f5337ebe5513f77860bd29f8c70fe
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4f0009_SBCK_005-1a}
body:
  text: 衡陽王夫之撰前鴈字詩十九首鴈字之作始倡於楚人楚澤國也有洲渚有平沙有蘆蔣菰菼東有彭蠡以攸居志南有衡陽之峰曰所回翼也故楚人以此宜為之咏歎近則玉沙湖補山老人續唱作者連軫豫病未能者且十年矣不期病中忽有陽禽筆陳如鳩摩羅什兩肩童子出現因吟十九首諸公於霜寒月苦南天落翼之日目送雲翎而僕於花落鶯闌炎威滅迹之餘追惟帛字時從異軌情有殊畛短歌微吟不能長斯之謂矣故諸作者皆賦七言而僕吟四十字縷縷漸深深當天一片心書雲占朔色緪瑟譜商音尺帛無勞繫南樓未易尋暝煙生極浦長夜付浮沈碧浪合逡巡蕭條接迹親三蒼言外旨七日句中春避暑疑秦火懷沙弔楚臣雲林添畫筆中土不無人活譜賦秋聲音容共一淸空頑難轉語天老未忘情羽調悲寒水行吟倦汨征蘆干悽怨急絶筆意誰平鵲渡已如夢深秋始報章偷臨無乳燕低誦有寒螿落葉勤讐誤墟煙與祕藏重來無粉本隨意寫蒼蒼紀豔非吾義驚春去色匆分飛南北史厯亂檜曹風天問憑條答空言未道窮何須藏魯壁絲竹奏淸融無待月中聽哀吟意已形同文從鳥紀馳檄指龍庭旁午悲邊雪零丁寄汗靑清泉涵片影井底血函經冉冉漾輕柔關河只此愁鷹鸇疑謗詛鳩鷽漫咨諏水月三人影霜霄一抹秋江山日日改挾策亦奚遊今古一相如飄颻賦子虛元文披帶草碧個倣林於蘭葉肥還瘦銀鈎蹙已舒稻粱非汝志投筆莫欷歔乘風莫草草雨雪且舒邪依毛詩音徐燕國迷蒼素鵑言染茹藘六歌懷天水尺一謝休屠依漢書音除一線臺城詔難忘紙鷂書此字無人識空勞厯九州分明扶日月因革自春秋鴆篆刪妖步鶯歌恥佞喉冥飛誰弋篡不墜草元樓野水漾初春苔涵緑字新煙雲都不染風雨故如神軟影翰非弱餘寒手不龜依莊子音麇鳳兮衰已久還現素臣身終知無寄處不欲昧前期人世誰長目天心自列睂寒宵聞見外皚雪炫熒時豈為知音絶停毫罷遠思脈脈有心期行行且浪嬉大人狂客傳小雅遺民詩解就名鴻烈書成授意而關門邀紫氣聊與著雄雌晴空不易得欲示下方難黑月韋編絶酸風蠹迹殘黃麻悲鷺序白簡笑鷹彈獨吹靑磷火傳書乙夜寒倚杖孰亭臯尋行送望勞霞章添旖旎星采點蕭騷唯覺孤心合難將遠目韜昏鴉空潑墨何當一鴻毛居然緣慧業亦自種情苗始旦回鸞帖淸秋題鵲橋彌天知泛宅露地注逍遙既證無師智靈雲瞥眼消癡蠅鑽故紙窗隙溷雲容天外勞一笑書中誰萬鍾童烏何足與燕頷止為傭小過占哀儉飛離不恤凶一從悲鳳靡長是問蒼旻南北招重疉風霜挾苦辛昔時人不見歸去奈何春童子三生塔還留慧命因靑女授靈符全身入畫圖血潮勒欵識毛鷙化酸迂天變人終定雲生道不孤無心持換米生計有雕胡後鴈字十九首或曰謂楚人宜吟鴈字者楚澤國也有洲渚有平沙有蘆蔣菰菼東有彭蠡之澤以攸居志南有衡陽之峰曰所回翼也過斯以往孰妄言之而孰妄聽之乎余曰可哉嗣吟十九首首四十字之繞打虛空經營慘淡中蟲魚多詰屈龍馬半昭聾副墨傳溪影雌黃聽落虹天情駘宕裏消息一絲通寓言河漢迥草線與灰蛇應迹説隨掃文身開復遮梵書疑以八易象半交義飛舞茅龍趣江門憶白沙抗墜引淸微靈心挾肉飛蝸銀真白俗鰂墨莽鍾肥主乙疑無定偏傍竟不違方春湘水上拓得禹碑歸塵氣不餘纖憑虛一縷黏分歧垂遠勢透露簇微尖曳腳神還整藏鋒力自銛臣書真逸品鳳藻得無嫌閃霍倣公孫垂垂引漏痕裝潢懸玉宇授受付金昆帶雨流鶉火銜蘆賦大言靈文人未測只倩記寒溫密迹簇春蠶靑編削蔚藍闕文唯夏五足用及冬三元鳥誰徴宋金天舊問郯筆花欲有授鳥夢奈沈酣湘岸臨潭帖天山拓漢銘為誰修楚史自解注禽經語雀羞刑牘言鸚笑説鈴揮毫千里瀉腕脫不曾停恥化頑仙羽新宫待爾題河山雙劃斷物論片言齊脈望徒吞字蟾蜍未映迷寒陵勞坐卧極目去蹤低霽雪曙南天孤縈倍可憐蛾睂流曉鏡香尾篆罏煙幽意蠅頭密連絲􅗀緒牽靈紋驚易沒移入斷雲邊秋思本無多千行自不訛淸姿從倒薤壯志欲眠戈散隊連行草遙天任擘窠催花看盡發誰與換羣鵝滌硯裊元雲瀟湘寫練裙龍蛇雙腕競魚燕尾梢分出像傳毛穎題幀倣墨君夫人學已熟誰復笑羊欣素宇無留墨平沙印別痕暗書還自省未到意先吞映雪功彌苦依天道已尊八紘開義海瀟灑動乾坤渾敦帝鴻開誰云子不才國門懸月令南極轉三能依周禮注音奴來翻下士稱微者雄風詠快哉匆匆春早駕薦福畏驚雷沙雪箋銀暗蘆鋒筆陳降驚飇催就急虛白人鈎雙髮細縈空鏡晴波上曉窗研朱和露滴楓冷落吳江有句兼無句羚羊偶挂尖吹毛傳密諦帶影悟廉纖化迹空三藏迷人頂一砭獻花巖畔鳥半偈不曾拈刮目經年別驚非吳下蒙四聲終寫入六義不刪風恥逐蝌文亂誰憑雉譯通斯文知未喪幾復畏虛弓淡墨布層層癡肥自不勝回文低落月影本暗漁鐙險句從空搆秋思與上興懸題天闕迥為爾費冰兢始知空闊裏無數妙詮偕娓娓談天衍䀶痕煉石媧紙光從月砑筆冢有雲埋仙笈傳靑鳥空勞曼倩諧未肯負居諸飄流不廢書長塗收史料小正作經疏贋迹徒相似鴻儒亦借譽鯤鵬聊志怪終是不才樗題蘆鴈絶句家輞川詩中有畫畫中有詩此二者同一風味故得水乳調和俱是造未造化未化之前因現量而出之一覓巴鼻鷂子即過新羅國去矣八閩曉堂上人以蘆鴈為法事即得蘆鴈三昧亦即以蘆鴈為詩正爾壓倒元白余於畫理如啞人食飽心知而言不能及為師隨拈若而首師遇畫著時有與余詩相磕攃者即以題之不信非瓠道人所寫也驚風吹霰雪中還萬里黃雲一線關回首江南此風景唯將嗚咽寫潺湲汀渚誰家儘自疑懸愁漁火隔江知飄零亦是前生果不羡鷦鷯老一枝月明是水是蘆花逗漏淸空片影斜沙上有蹤誰見得儂家曾泛逆流槎健翮先飛下淺汀魚蝦雖飽郤餘腥何如且帶斜陽影點綴殘山一段靑秋江渺渺月微明飛雪縱橫點翅輕自學春鶯穿柳絮不知白羽賺蘇卿簇簇霜花覆淺灘荻根蔣葉一江寒秋聲徹夜驚鷗鷺箏柱參差不忍彈蜀雪消遲水拍空前時汀渚杳蘋風今宵隨分聊收翼只在秋聲一派中老碧蒙茸嫩葉齊一鈎斜月照幽棲淸宵寒夢雖無據不到飛狐谷口西南來不為稻粱謀徹骨森寒月下洲藻苦荇甜隨口過飢鳶莫漫為含愁書人欲倦曳波長一幅皚皚側理光盡捲丹墳歸竹素不留之繞待雌黃淺白平鋪萬緑稠蒼翎碧水素沙洲色如非色云何攝一味分明墨氣收漁艇無蹤樵徑荒平沙露冷月微茫問師此景從誰得莫是前身現鴈王驚心矰􅗤曉飢餘何有壼漿一艇漁莫道相酬無寶劒明年先寄報恩書密葉修莖翠萬竿未須還怨曉霜寒天涯拚作無歸客且得淸秋一夕安回望還驚伴侣遲分飛愁絶故心移江臯莫愛霜楓紫自是棲烏夜宿枝秋心萬古此瀟湘漢苑胡關帶恨長誰道靈均哀思絶唯將鶗鴂怨年芳斜暉欲下颭金飈緑苞初開碎練飄莫認天山飛雪早江南饒有可憐宵墨光之外噴秋光夜永江寒楚塞長記得蒼梧多淚竹緘愁無奈斷衡陽題此經一年矣乃賦鴈字如兩畫相擬一士一匠自有分別者寒窗西日自顧而笑因鴈字帶出此十八絶句所謂新婦騎驢阿姑牽也庚戌秋冬之際敗葉廬記鴈字詩終薑齋文集卷五船山遺書四十六衡陽王夫之撰九昭附刻楚詞通釋後楚辭通釋卷末船山遺書四十五衡陽王夫之撰九昭有明王夫之生於屈子之鄉而遘閔戢志有過於屈者爰作九昭而敘之曰僕以為抱獨心者豈復存於形埓之知哉故言以奠聲聲以出意相逮而各有體聲意或留而不肖者多矣況斂事徵華於經緯者乎故以宋玉之親承音旨劉向之曠世同情而可紹者言難述者意意有疆畛則聲有判合相勤以貌悲而幽蠁之情不宣無病之譏所為空羣於千古也聊為九昭以旌三閭之志發江山之芉萰兮回風被乎嘉卉靑春􅎃其將闌兮羌何情而愈此發始就道也萰力甸切芉萰卉木盛貌􅎃徵動於不覺也春物可愈悅而愁人不為之欣賞凌巴邱之澒洞兮余甫閲乎南條之荒大巴邱今嶽州其南為洞庭甫始也自巴邱而南山自黔中東來為南條崇山復嶺重溪疊澗風日卉木與湖北迥異屈子生長郢都被竄而來始識湖南山川之色䆗宎綿延不知涯際舉目之悲觸物難巳矣駭哀吟之宵鼯兮鬱薄霄乎夕靉虹半隱於叢薄兮雨中岫而善淫此巴邱以南荒大之景也薄霄迫天也夕靉暮雲中岫雨止于山半善淫易雨而難霽也即靈媛之前思兮惘南狩之所尋靈媛謂舜二妃南狩舜南巡山川荒遠二妃不知舜之所在望君不見今古同情綿修林之茸閟兮􅌄洞壑之紛疑答空響之森寒兮合嶂沓其如規耳迥寂其無聞兮目改觀於異色茸閟草木蒙茸而幽蔽也紛疑洞壑屈曲不知涯際也答空響者空谷傳聲相答杳亦合也山色四圍仰窺天如規圓湘沅之間西連辰酉其荒大有如此者人蹤絶而音響寂但觸目蒼茫而已詎侘傺之足捐兮悄不知迢遞之何極去國巳遙山河間之佇立含愁安能忘耶汨征述屈子始遷於江南覽河山之異而興悲憂菀積中更無從而明言所怨深於怨者言自窮也靑林白水敞蘭風兮理前心而益炯良時淸適偶然息慮追惟往事井井不忘既服藥之春氣兮蘋又申余以秋穎謂白日之匪鮮兮豈蒼天之莫正姱修既潔矢心抑靖可自信不欺者讒人可毀白日之無光而蒼天豈可罔哉拊雲門之淸瑟兮悼傾耳之獨敻改繁聲以申悲兮介師延而相將匪將者之為勞兮邈夷庚於羊腸追思進諌之初舉要而約言之則忽而不察欲譎諫因機以進乃言愈長而愈相猜疑我坦衷直致而君終惑于險詖之説不我從也袤九州於尋尺兮亙千嵗於昏旦恢畫畫以申猷兮悔曩辭其猶未半所諌者括天下得失之幾盡古今興亡之理規恢而條悉之非不至也然及今思之未即追原禍本以攻發讒佞不能無悔蓋均之取怨於人不如直揭其姦慝如下文所云斥氣珥於禺中兮堙洪流於冀野涉漩澓而濡首兮洵猶賢夫今者禺中巳位近天之中喻君側左右冀州首受大河喻津要為藏姦之主靳尚之邪鄭袖之煽悔未直攻之雖受其摧傷猶令其姦邪露見而不敢違逸征鳥以翾翩兮泝皓穹而莫執回風飇而隕穫兮悵行野其何及征鳥題肩鷂也不即執姦佞而顯誅之使其猶翺翔於君側反乘勢以空善類自悔無及矣進不可與期兮退不可與息曠嘉會以韜愁兮誰豫侜而自戢逸姦佞而未申明其罪既必不能改而從我且必求毀我之成謀以誤國早念及此誰止豫而姑容之能無追悔乎懷王之初信任屈子甚至乘其時而與靳尚輩爭死生於一日事尚可為如其不克以身殉之可爾投鼠忌器而留禍本以使蔓延想屈子沈湘之日必懷此遺憾故為代白之申理達屈子未言之情而表著之想其忠愛憤激之心逮沈湘之日申念往事必有如是者淸君側之惡雖非人臣所敢專而宗臣之義與國存亡知無不為言無不盡故管蔡可誅昌邑可廢况張儀靳尚之區區者乎輒為追惜無嫌悁烈也凌漳澨兮及晨邀余目兮天末漳南漳水入漢合于江楚之東遷自荆北至宜城浮漢而下回望郢都如在天末驂驔嶄岏兮紆荆門之縹渺滂溏濞浿兮遂江流以奰發嶄牀咸切岏吾官切高鋭貌滂普郎切溏音唐濞音避浿音派山自夔巫西來至荆門而展所謂羣山萬壑赴荆門也江水為山所束下夷陵而迅流浩蕩此言郢都山川形勝有如此者相九州而洵美兮承靈祚而奄處立國之固自熊繹而始至熊通而盛奄有江山踞九州之形勝崇臺婥妁以詣天兮下睨乎廣陌之鱗聚蘭春被乎平皋兮都人懷芳而從之被羅袿之袨服兮尚不改乎此容也袿音規婥妁同綽約亭立貌登高臺視廣陌人物之盛雖經喪亂而不損皆先君生聚之積也華鐙烜於永夜兮羽蓋飄而陰晝夫何姣好之嬋媛兮抑雄風之蟉虬文物既盛而武威尤雄長於上國吞冥厄以無外兮卷河鼓而浮天街旋北斗使挹桂酒兮固誰昔之所懷冥厄楚塞河鼓牽牛星北方宿天街昴畢之間西方辰度言北卷中原而收秦也旋北斗挹桂酒代周受命楚先君之志事如此豈一郢之不保哉逮鳴鶪之未聞兮芳草榮其如昨逞余望以流觀兮恣含情之廣託當未遷之時江山如故人物如故顧瞻佳圖猶可壯王居而規遠大物無廢而不興兮羌聊謝夫送目顧美人之倦遊兮曾不臨高以旁矚今之廢者固昔之興者也何不可再興而遽棄之目送江山徒留餘惜使頃襄能憑高而回望其能忍兩東門之遽蕪乎違郢夕弭榜兮中洲淡淫淫兮安流蘋風歘兮緣波明月影兮不留靜不可長愈兮情善疑怵若危兮落葉之辭枝蒼天羃羃兮四垂朕何為兮數離江次飄零月明人靜孤危忽警舊怨難忘忽爾興思幻成良遇如下文所云若有期兮新歡折瓊茅兮贈言維中庭兮妒者迥相遇兮曠野申旦旦以及今兮涕零零而交下若思若夢之間與君邂逅避妒者于中庭別訂歡于巷遇悔前非而申後誓感極而繼以泣冥思幻成忘非其真也來無蹤兮去無秉思心發兮遺光景猿啼林兮惝恍魚驚波兮溟涬江上之寂厯兮夢夢悄余眷兮精相從孰寓形之洵然兮覆魂投之靡通夢平聲夢夢無所見也非有之境恍惚形成猿嘯魚跳驚失所遇雖形終孑處而精魄相從則不信幻成之非實也幸曠古兮良夜輕千里兮命駕結蘭佩兮攬羅袪馳芳皋兮驅駟馬夫杳靄奚其不可親兮幾神會之無假精魄相遇隨君反闕倏爾思成安得遂如此時之心境而非徒幻想哉引褱不得巳之極思意中生象其與君相遇之幻景固篤志者情中必有之情也為屈子曲引之悲孤緒之獨縈兮曠千秋而無與晉謀古而不獲兮奚凡今之可訴古人於我或事同而志異或志同而事異尚不可謀况今之悠悠者屈子之孤忠所為無耦也二士行歌於首山兮未夙謨夫商邑百里望哭於殽崟兮追虞諫其何及刳比干於一邱兮待殷殄而始封抉子胥於吳門兮盼於越之凌江言雖售而志殘兮要忘親而邇怨引憤毒於黃泉兮操余言以為券誠彌縫其終窘兮軌有僨而必繇隕蕭艾於繁霜兮匪芳桂之所求夷齊避紂而不為謀百里奚哭秦師而不諫虞公皆先事之未盡者比干之墓受封于周非比干之榮也子胥懸眼以望越兵愈違其初志矣然則屈子身死言驗而楚亡鄭袖膺妲己之誅靳尚蒙宰嚭之戮豈其所願乎乃至采薇行歌終餓西山亦非己所欲此古人所不可與謀者也鳥將飛而遺音兮顧靑林而息羽策士謀臣知楚之不可有為則去而之他國巳耳魚沈冥以詬沫兮憺忘情於洲渚若莊周荀卿之流皆楚人也全身遠害退隱巳耳漁父鼓枻之歌且欲己之置安危于罔恤豐草靡於江干兮懷零露之新滋昔日芳草今為蕭艾且附姦佞以求榮矣喬木榮於崇邱兮冀氛霰之後時故家舊臣徼幸苟安不能遠慮凡此皆今人之不可訴者也高天廣陌之敻敻兮元冬閉而不泄諒俯卬之無與酬兮韜鬱陶以永世卬與仰同上下相蒙幽閉無復生之氣己獨有心誰可與相告語埋憂地下隨逝水以東流而巳扄志扄閉也孤情自怵不與古人同調而舉國無同心之侶緘閉幽貞之志千古而下猶有謂其忠而過者誰與發屈子之扄乎耿元夜之穆淸兮今者愔愔而寤余邈登天其無畔兮嘉余魂之安驅寒夜蕭淸一念忽興神馳楚塞之外而所以雪恥振威西吞殽函者皆若惟我之驅馳而得志者然余儲奇服以遐征兮紛髣佛而襲之左葳㽔之翠羽兮右離褷之星施張楚破秦之策夙所位置若在目前發丹陽之故宮兮首商於而問道夏旌旖旎而前征兮余又申之以鷺翿介三靑鳥以先鳴兮誅鳳皇於西母詭逢迎而中變兮余怒叱夫蜚廉之蚴蟉此下言興師討秦之次第也誅鳳皇於西母詰懷王不返之故使自服罪意秦人多詐必偽請和以誘我叱風伯使勿遲回不聽其甘言而決於致死乃可以逞志升密雲其未半兮彗熒熒而西弛覲太乙之婉存兮責余駕之不駛以誓死之氣與秦爭存亡兵甫交而秦可破奪武關臨渭水秦且西潰逮懷王之未死迎之以歸當喜極而嗔怨其不速也兩龍抃而南迥兮顧豐隆之未怠懷王雖返秦罪未足以懲則怒不容於中止懲蓐收之善淫兮霽九嵕之暗靄滌三危之宿曀兮憩崆洞而息轡蓐收西方神九嵕山在武功三危在肅州崆洞在固原秦極西境也秦人積怨於天下如秋霖之害良稼誅其君弔其民息天下之禍如滌陰翳而覩靑天訖於西極而後巳容成嬺以徠下兮唁余勞之巳艾容成崆洞之仙者設為相勸之辭言用兵之巳勤日浮雲不可為期兮白日中其易傾龍虯螑其且蟄兮鳳翩翻而不寧排霄路之繽紛兮又安得夫玉山之嘉穎螑許救切虯螑龍伸頸低昻貌穎禾穗也或以勝不可久恃欲罷兵而退保成功廊淸大定惟天所授而不可遽望相為勸止蓋亦物論之有然者而積憤初申固難自抑如下文所云余填膺而申答兮懷萬年而一逞鸞族鳳以孿生兮梟屢攫而永惎指昊天以奮飛兮懼日月之我遲孿音戀己與楚為同姓之親臣秦人之怨辱及宗祧特憾日月之不速豈患虔劉之巳過哉輕蹇産之雲逵兮憤間關之梁輈騖飇風而凌浮焰兮夫何倒景之足憂志茍能遂何謀遠之恐不逮而功高之足危哉憤之巳深籌之巳夙故其靜念而若將為之者如此蕩憤楚之勢不兩立者秦也百相欺百相奪者秦也懷王客死不共戴天者秦也屈子初合齊以圖秦為張儀靳尚所阻憤不得申放竄之餘念大讎之未復夙志之不舒西望秦關與爭一旦之命豈須臾忘哉事雖沒世不成而靜夜思之炯然不昧若蹀血咸陽飮馬涇渭無難旦夕必為者聊為達其志以蕩其憤焉獻嵗發春兮荃茸茸其始稚抽盈盈之微榮兮孰飄風之可試頃襄沖弱嗣立國家多難念其孤昧可為寒心皇天不仁兮白日淹而西頽夕月孤淸兮怛浮雲之羣飛懷王西客咸陽而不返國無生氣小人復羣聚於嗣君之側必欲擁孤月而蔽之邅煢煢其駘蕩兮脈亭亭其誰訴美人豈其無儔兮介良媒而屢誤國勢孤危無有憂恤之者夫豈無人之可任哉所求非賢則舍西施而聘嫫母矣蕙託荃以同畦兮荂與稿之相連戒秋霜之凜冽兮誓嘉會於百年唯巳與君恩屬一本榮枯與共故切危亡之憂而思保國以長存鴟梟駤戾於陰雨兮吟公旦於東國五子悲謳於雒汭兮怊有求而弗獲或流哀而必動兮或皇皇而弗庸余雅不謀夫判合兮維靈修之夢夢怊鴟昭切悵恨也夢平聲周公作鴟梟而成王悔悟五子歌雒汭而太康終迷然悼孑悼君側之無人也雖被遷竄而所隱省者惟君七諫以下忿懷才不試而詆君者固不足以知屈子之心矣若奪祿位罹厄窮而悻悻自沈於淵則豈非好勇疾貧之亂人哉承榮光於有緒兮卬元鬒而善容徼嫵媚其無與仇兮遑嫭忌而始工身為世胄宗臣且內美修能之可表見若持祿容身豈患不得君而顯奚必與人競是非以希得志乎亮兹情之莫蔽兮素與􅉳其不相凌荃同芳其猶迷兮又奚况夫背憎君子不待排小人而始顯此皎然易知者如黑能污白白不妨黑乃懷王既知任己終且見疑則背憎之姦疑忌而攻擊之抑且如之何也藥與葹之爭熒兮輅棧車之相觸玉抵玫其必毀兮熠耀固掩乎華燭捐盛年之煌扈兮殉奄息於既耄辱干將以刜石兮夫唯靈修之悼也刜音弗熠耀鬼火磷也煌扈壯盛貌奄息奄奄之息君子固不屑與小人爭爭必為小人所傷夫豈不知遠引以避其毒哉大謀不定君且身危國削悼君之陷溺故辱玉以抵玫知禍及而不避少師馘而隨延兮恫皇天之不遄怒箕子狂而辛殄兮悽行歌以何補能早殄姦人則楚尚可延故不惜與競而受禍如其不然徉狂以免咎雖他日哀歌麥秀亦無救於滅亡則愛身全道之説固非心所安也企漢東而眕申息兮鼯狌晝啼於叢薄高臺夷以成蹊兮憯不滿朝鞠人之溪壑羌自而庸違兮審僨踣之必諶眕音軫目所止也日蹙百里故邑邱墟姦佞之欲尚不知厭自亡自毁知其必然矣巳矣夫方將之不可念兮聊息乎長夜之曾陰旋踵之覆敗不堪回念唯決從彭咸赴江流俾不見聞巳爾懲悔君心邪正之分社稷存亡之介雖不屑與匪人爭而觸權姦以死無所悔也洞庭之南兮湘流㶁㶁危岑厜㕒兮靑冥無極悲風颯兮楓林幽夕雨亙兮秋草積㶁古伯切厜㕒音追彝沅湘之南山川景物之慘淡有如此者幽魂往來於其間益增悽愴敞蒼天之穹窿兮魂渺渺其誰寄引萬年於無終兮羃四表而焉至沈湘之後神無所棲能無飄散無歸之怨乎日長逝而不留兮固蕩散其匪今就沆瀣於窮北兮邀歸雲而復南神與魄之不相守兮光與容違僅耿耿之若存兮疇昔相知雖當未死之日而憂國怨深忘生志定神去魄而心目之光不著於形體久矣唯此耿耿若存之心不隨消散則沈湘以後神魂飄忽於往來心知其亦如此而已營飄颻其莫羈兮精滒弱其不固憤連蜷以輪囷兮恐傷余之雅度滒音戈營魂也老子曰載營魄家國之怨鬱而不散將為白虹將為靑珥而素心淡漠不欲其然則亦從容闡緩於兩間耳白日夕沈兮星漢高寒誰俟余兮神導余以漫漫言不可理兮心不可將朧朧其若有明兮指郢路之蒼茫遼戾滉漾兮蕩斥八埏誰與旋歸兮娛美人之暮年淸宵寒夜耿耿若存者既離物孤遊唯不昧之忠忱猶依宗國念已長辭君所則誰為閔亂憂傾輔君於式微者死而不忘者此爾剸志今夕兮逝無與遷鬱勃歘以憤興兮遺孤熲之流連決志一死無所復待遺此孤忠長依君側君雖莫我能知而矢志於泉壤者固然此屈子之所以為屈子也與遺愍此絶命之遺音也自言既死以後其神爽有如此者故安死自靖怨誹而不傷楚辭通釋卷末終
