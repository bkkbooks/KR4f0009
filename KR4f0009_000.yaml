front:
  text: 南窗漫記引物必有不可復陽者而況僕乎頽然任之而已顧有難於自已者自蚤歲侍庭闈洎出承先生長者之席隅及與士友周旋即閉顚當之戶於穹谷不乏跫然之音數年來俱以一淚而絶近則兩耳皆聵杜鵑啼屋後樹亦不復聞然且寸心猶昔將何措而可哉生無記持性人往往謂不然此亦何庸欺者嘗讀太極圖説至三百巡隔夕而忘疇昔所辱贈示之作如張別山先生劉端星中丞湘客金道隱黃門堡劉浣松太史明遇及上湘龍季霞孔蒸餘杭姚夢峽湘皆苦思索不得一章其他可知也病中髣佛所憶僅保􅋊數章句悽然已乃還自哂人且哀余余何庸為諸逝者哀雖然人亦誰且哀余者余固不可不拾零香拈碎玉為疇昔哀也亦各如其情也已戊辰天中日南窗記瀟湘怨詞夕堂戲墨卷七船山遺書六十二
