body:
  text: 衡陽王夫之撰瀟湘小八景詞寄調摸魚兒國初瞿宗吉詠西湖景斆辛稼軒君莫舞君不見玉環飛燕皆塵土體詞意淒絶乃宗吉時當西子湖洗會稽之耻苧蘿人得所託矣固不宜怨者乙未春余寓形晉寧山中聊取其體仍寄調摸魚兒詠瀟湘小八景水碧沙明二十五絃之怨當有過者閲今十年矣􅊧破篋得之亦了不異初意深山春盡花落鵑啼乃不敢重吟此曲乙巳上巳茱萸塘記其一鴈峰煙雨插靑天俯臨圖畫一壁翠光欲滴炎風吹斷陽禽影認得孤峰回翼如相識記寒聲蕭蕭咽盡霜華夕望中何極儘䈴壓千絲窗飛一縷垂幕籠輕碧回首處猶記當時蹤迹危亭斜倚南陌滿城春滑笙歌膩消盡銀缸夜色君莫惜君不見黃沙漢使無消息秦關坐隔聽沙岸殘更野塘曉陳總似三生笛其二石鼓江山瞰蒸湘曲影雙淸流下洞庭秋遠危崖突兀玉峰寒界破蒼流一線誰許見只鮫宮金繩夜擁魚龍怨畫船歌扇對笑水江花窺樓暈月惹盡流霞片行樂地記取韶光迅轉畫闌彩筆題遍雲杳瀟湘千頃碧瞥眼武陵溪畔君莫羡君不見漁陽撾斷霰裳宴滄桑已變想眉黛嬌靑眼波凝緑不是舊時面其三東洲桃浪剪中流白蘋芳草燕尾江分南浦盈盈待學春花靨人面年年如故留春住笑浮萍輕狂舊夢迷殘絮棠橈無數儘泛月蓮舒留仙裙在載取春歸去佳麗地仙院迢遙煙霧溼香飛上丹戶醮壇珠斗疏鐙映共作一天花雨君莫訴君不見桃根已失江南渡風狂雨妬便萬點落英幾灣流水不是避秦路其四西湖荷花漾平塘緑錢初展正是乳鴉啼後桃尖漸放朱霞暈芳惹遊鞭征袖真如繡點波紋紅綃靑幛團絨皺田田歌奏問苦菂尋蓮縈絲覓藕幾許多情逗莫浪語西子湖頭難又錦屏十里香透繁華滿目江南夢約略送愁時候君莫嗅君不見淸香銷盡酸風瘦秋容如舊只莎草吟螿蓼花飛鶒露冷金飆驟其五花藥春溪啓琳宮暖回溪畔江南共道春早桃花新雨溶溶後誰把瓊漿釀造壼天老正望中茶煙幾線縈僧橑燕泥香掃快翠泛銅瓶膏凝玉盞魚眼調香腦添勝迹百道奔泉回抱暗縈緑荇芳藻泠泠碎玉夜聲中花院晨鐘輕搗君莫惱君不見玉礬落盡瑤京道王孫芳草縱百丈絡絲萬條羅帶難繫春光好其六嶽亭雪嶺翠屏遙眉橫七二空靑一派如灑間登危榭憑闌眄垂羃同雲覆野銀河瀉道飛來楊花玉樹都疑假望迷鴛瓦興陵朱邸在焉問酒擁銷金茶烹鳳乳若個償春價賞心事不在酒旗歌社梅痕暗偷蕚赭凍髭笑指祝融君故騎火龍未下君莫惹君不見胡沙似雪催征馬笳聲怨也把塞北氷天江南春色都付漁樵話其七朱陵仙洞向蒼崖􅐟聲吹裂斜陽一片危岸江流北瀉鴈南征洞裏春光無算星燦爛都應是雲中劍舞珠光按花蹊碁館留滿地蒼苔數峰煙樹擲與人間看仙戶啓石乳倒垂銀蒜空山翠杳天半百花橋阻玉壺遠誰倩鴛鴦抵喚君莫歎君不見彤雲故鎖三山斷罡風吹散想華表鶴歸天台人返怕見人民換其八靑草漁鐙截流澌飛虹側挂長空流月孤影斜收返照蔚藍天蘋末一江風冷更漏靜罷鳴桹停橈沙觜星光耿疏鐙夜永似説向人間流光易謝夜燭遊須秉歌舞罷追賞良宜此景木蘭牽動緑荇樵靑唱闋斗參橫殘月又斜西嶺君莫省君不見蘆中人老成萍梗載愁舴艋向牛飲溪邊羊裘灘上別把絲綸整瀟湘大八景詞寄調摸魚兒情者非有區宇者也有一可易情之區移傺侘而昭蘇之何為懷此都哉余歌小八景來十六年矣雲中眇眇北渚愁豫九嶷修眉煙秋不展望里盈千目飛無寄續歌爰九魂授尤勤惘張樂之簫鐘哀琴在御追淚筠之粉翠香酒忘尊然則迷不一方思橫三楚固其所矣重吟大八景詞復用瞿辛原體旌初志也雖然北逾冥厄南度秦城西望雨雲之浦東臨曰夜之江豈但此哉而祇以寄情於畔岸耶行且怨紫塞之歸禽唁蒼山之弔鳥於斯始矣其一瀟湘夜雨望九疑罏煙飛黛遠送元雲千里斜陽楓岸平沈後木末驚飇拂水蘭舟艤薦新涼銀缸影顫篷聲起推窗間盻看幅幅輕綃層層珠瀑駘宕空靑裏淸絶地故是蕙汀蘭沚淺碧舊含芳蘂朝來潤浥靈苗發共載天香雲髓君莫擬君不見楚騷歌闋蘭蘅死靈修邈矣怕碎玉鏦錚金鈴淋􅅹吹入愁人耳其二洞庭秋月展平湖一片玻璃何處天圍四野金風輕捲千波雪陳陳落暉低亞真瀟灑漸西晶連天接住東光射氷輪上也見鏡吸空明練飛霜影一蕩淸無罅憑檻處百尺麗譙飛榭玉樓閃冉光乍淸魂搖曳渾無定靈肉欲隨羽化君莫詫君不見南來猿鶴悲淸夜天孤月寡歎吹笛王孫朗吟仙客倦理雲軿駕其三平沙落鴈問陽禽北發天山尺帛為誰長繫當年不作關山怨但愛江南佳麗秋無際擁長汀銀膏玉屑堆光膩橫空如砌宛一抹修眉千行淡墨欲墜還容曳菰米熟千頃元珠豐脆何須更尋歸計丹楓染紫蘋花白飛舞一江淸霽君莫睇君不見三更月落催哀唳春光無蒂蚤炎焰燔空狂濤拍岸羽駕何方稅其四遠浦歸帆接長江西上三巴東下海門萬里高樓思婦天涯夢昨日金錢送喜春歸矣倩啼鶯遙催綵鷁乘風起危闌間倚望碧浪參天斜陽低樹片影浮空水相認處靑練雙飛旗尾夕風吹送旖旎銀缸對照江樓眼收拾寄愁蠲紙君莫盻君不見征人已老蘭舟委艨艟浪起儘大帽白衣攤錢打鼓不向湘臯􅋈其五漁村夕照捲殘虹隔岸蘆梢低挂一團赬玉紫金光聚明霞閃雪洗鷺飛鷗浴江一曲舞輕橈橛頭車子相隨逐荻灣六六聽短笛橫吹棹歌遙答共趁沙汀宿投竿處牽動綃金波蹙濺珠縣灑紅粟暝空欲斂西淸色一派炊煙凝緑君莫矚君不見羲輪無繫西流速雲昏極目聽哀鴈啼更孤篷打雨難擬明朝旭其六山市晴嵐俯江潯灘臨危磴屏擁靑蓉回抱小橋流水平田迥緑浪風生畦稻當晴昊散溪雲輕鬆一抹飛煙巧靑簾繚繞有白笋黃魚紅蝦緑酒裝點旗亭好蘭舟泊正及江南春早玉山何惜傾倒桃花留客紅垂暈羃䍥輕綃籠罩君莫惱君不見鮫人蜃客迷三島韶華易老但棠杜花邊鷓鴣聲裏瘴雨迷衰草其七山寺晚鐘轉汀洲回巒斜擁曲徑松杉堆黛落帆人語寒潭靜幡影風搖星彩涵輕靄漸潮聲魚音梵唄喧金界霜林驚籟更百八綿連噌吰奰發流響空靑內深院鎖誰放鯨吟出海澄江歘騰漰湃喚回客夢淸宵永寂厯間心如灑君莫駭君不見景陽舊恨臺城改佛鐙緑靉共窣堵鈴鳴相輪鐸語長夜悲興敗其八江天暮雪舞廉纖不知是雪還是沙明波素同雲返映晶光凝暝色遙籠煙樹雙無據顫寒空微霄極浦相回互蘆洲古渡有孤艇篷窗挑鐙酌酒唱徹梁圍句知此夕一派瑤峰玉宇朦朧半函銀兔淸暉的皪蛟氷漾疑是東方已曙君莫覷君不見迥波難挽流澌住珠摧玉仆向帝女祠東昭王潭北直下長江去瀟湘十景詞寄調蝶戀花瀟湘八景不知始誰差遣唯洞庭月瀟湘雨耳他皆江南五千里所普攝也湖南淸絶地萬古一長嗟杜陵遊迹十七於神州而期茲萬古豈徒然哉瀟水出自營浦西北流五百里而得湘湘水出興安之海陽山與灕背流既合於瀟北流千二百里至巴陵北大江自西來注之然後瀟湘之名釋而從江此千五百里間縠波繡壁楓岸荻洲淸絶之名於斯韙矣迹不勝探探其尤者得十景焉情物各有因緣歸宿不迷於萬古視諸帆鴈嵐雪悠悠無擇地者不猶賢乎僕雅欲為此詞不知何以未暇歌八景後驅筆獵之吟際習為哀響不能作和媚之音應節為湘靈起舞曰非我也有臣妾我者存也其一舜嶺雲峰瀟水自江華西北流至寧遠九疑山北疑峰恆有雲藏其半嶺飛雨流淙入瀟水中九嶺參差無定影淚竹陰森回合靑溪冷一片緑煙天際迥迷離千里寒宵暝香雨飛來添碧凝認是當年望斷蒼梧恨東下黃陵知遠近西崦落日回波映其二香塘淥水湘水徑東安縣東有沈香塘石壁罅插一株云是沈水香澄潭淸泠緑蘿倒影湘水自分灕水下曲曲潺湲千里飛哀瀉氷玉半灣塵不惹停凝欲挽東流駕百尺危崖誰羽化一捻殘香拈插莓苔罅憶自尋香人去也寒原夕燒悲餘灺其三朝陽旭影在零陵縣瀟水側去鈷鉧潭愚溪不遠北十里為湘口是瀟湘合處瑶草難尋仙苑道洞裏春生一霎韶光好圓牖蘢蔥迎始照天涯一點紅輪小無那雲煓迷海嶠斷送金烏悶損飛光倒縱有晶熒開霽昊斜陽又被寒煙罩其四浯溪蒼壁在祁陽縣北元次山勒顔魯公中興頌于崖壁苔光水影靜目愈心誰倚磨崖題彩筆記得中興仙李蟠根密萬里湘天開白日晶光長射蛟龍室欲泛扁舟尋往迹路隔丹梯水弱罡風疾日暮湘靈空鼓瑟猿聲偏向蒼灣出其五石鼓危崖在衡陽縣北二水滙流潭空崖古蒸水東流湘水北一曲滄浪映帶靑山色舊是朱陵仙洞客鶴歸不向烏衣國江樹迷離潭影側畫檻筠䈴夢斷春消息擊鼓馮夷尋未得饞龍怪舞雲生墨其六嶽峰遠碧自衡陽北三十里至湘潭南六十里嶽峰淺碧宛轉入望見説隨帆瞻九面碧藕花開朵朵波心現曉日漸飛金碧顫晶光返射湘江練誰遣迷雲生絶巘蒼水仙蹤霧鎖靈文篆帝女修眉愁不展深深未許人間見其七昭山孤翠一峰矗立江次北去湘潭縣三十里下為暮雲灘日落天低湘岸杳迎目蘢蔥獨立蒼峰小道是昭王南狩道空潭流怨波光裊緑影寒澄春放棹記得當年淥水歌年少明月南枝烏鵲繞登樓何處依劉表其八銅官戍火銅官浦在長沙北三十里蘆汀遠岸水香生於始夜漁鐙戍火依微暮色間如寒星映水打鼓津頭知野戍萬里歸舟認得雲中樹日落長沙春已暮寒煙獵火中原路何處停橈深夜語江黑雲昏莫向天涯去舊是杜陵飄泊處登山臨水傷心句其九相灣曲岸湘隂縣北三十六詩云是馬殷所開縈回淸徹出此即次人青草湖李賓之詩三十六灣灣對灣者是也為鎖湘流東下緩兩岸蘆梢片片蒲帆短寒水茫茫漁火亂唯應曲裏春風暖萬古沅湘秋思滿六六灣頭綰住愁無算無那湖光都個管鼉風吹浪連天捲其十君山浮黛湖光極日至君山始見一片靑芙蓉浮玻璃影上自此出洞庭與江水合謝眺所云大江流日夜客心悲未央者於焉始矣湖南淸絶亦於此竟焉渺渺扁舟天一瞬極日空淸祇覺雲根近片影參差浮復隱琉璃淨挂靑螺印憶自嬴皇相借問堯女含嚬蘭珮悲荒磷淚竹千竿垂紫暈賓鴻不寄蒼梧信瀟湘怨詞終夕堂永日緒論外編船山遺書六十五衡陽王夫之撰程子與學者説詩經止添數字就本文吟咏再三而精義自見作經義者能爾洵為最上一乘文字自非與聖經賢傳融液吻合如自胸中流出者不能先輩間有此意知之者鮮自四大家之名立各有蹊徑強經文以就己規格而此風蕩然矣藝苑品題有大家之目自論詩者推崇李杜始李杜允此令名者抑良有故齊梁以來自命為作者皆有蹊徑有階級意不逮辭氣不充體於事理情志全無干涉依樣相仍就中而組織之如廛居櫛比三間五架門廡廚厠僅取容身茅茨金碧華儉小異而大體實同拙匠窶人倣造即不相遠此謂小家李杜則內極才情外周物理言必有意意必繇衷或雕或率或麗或清或放或斂兼該馳騁唯意所適而神氣隨御以行如未央建章千門萬戶玲瓏軒豁無所窒礙此謂大家而論經義者以推王守溪為大家之宗守溪止能排當停勻為三間五架一衙官廨宇耳但令依倣即得不甚相遠大義微言皆所不遑研究此正束縛天下文人學者一徽纆而巳陋儒喜其有牆可循以走翕然以大家歸之三百餘年如出一口能不令後人笑一代無有眼人乎錢鶴灘與守溪齊名謂之曰錢王兩大家所傳惡不仁者謂不使加身如避蛇蝎按此字音褐其螫人之螫字從歇字尚不藏何況文理不使不仁加身者是何寧靜嚴密工夫而堪此躁戾惡語也惡如蛇􅙴乃陳仲子出哇鵝肉忿戾之氣正是不仁以此稱大家者緣國初人文字止用平淡點綴初學小生無能倣佛錢王出以鈍斧劈堅木手筆用俗情腐詞著死刀講題面陋人始有津濟翕然推奉譽為大家而一代制作至成宏而掃地矣鶴灘自時文外無他表見唯傳吳騷淫俗詞曲數齣與梁伯龍陳大聲一流狹邪小人競長如此人者可使引伸經傳之微言乎下劣文字好作反語亦其天良不容掩處人能言其所知不能言其所不知凡反語皆不善不勤不愼之慝今人晝之所行夜之所思耳之所聞目之所見特此數者終日習熟故自寫供招痛快無蹇澀處若令於聖賢大義微言從正面上體會教從何處下口無怪乎反之不已一正便托開也無法無脈不復成文字特世所謂成宏法脈者法非法脈非脈耳夫謂之法者如一王所制刑政之章使人奉之奉法者必有所受吏受法於時王經義固受法於題故必以法從題不可以題從法以法從題者如因情因理得其平允以題從法者豫擬一法截割題理而入其中如舞交之吏俾民手足無措且法者合一事之始終而俾成條貫也一篇之中為數小幅一揚則又一抑一伏則又一起各自為法而析之成局合之異致是為亂法而巳矣謂之脈者如人身之有十二脈發於趾端達於顚頂藏於肌肉之中督任衝帶互相為宅縈繞周回微動而流轉不窮合為一人之生理若一呼一諾一挑一繳前後相鉤拽之使合是傀儡之絲無生氣而但憑牽縱詎可謂之脈邪四家中唯瞿文懿能無束溼之法而有法無分析鉤鎖之脈而有脈其餘非所知也鉤略點綴以達微言上也其次則疏通條達使立言之旨曉然易見俾學者有所從入又其次則􅊧索幽隱啓人思致或旁輯古今用徵定理三者之外無經義矣大要在實其虛以發微虛其實而不窒若以填砌還實而虛處止憑衰弱之氣姑為搖曳則題之奴隸也四家中亦唯昆湖免此填砌最陋填砌濃詞固惡填砌虛字愈闌珊可憎作文無他法唯勿賤使字耳王楊盧駱唯濫故賤學八大家者之而其以層絫相疊如刈草茅無所擇而縛為一束又如半死蚓沓拖不耐皆賤也古人修辭立誠下一字即關生死曾子固張交濳何足效哉非有吞雲夢者八九之氣不能用兩三疊實字非有輕燕受風翩翩自得之妙不能疊用三數虛字然一虛一實相配成句則又俗不可耐故造語之難非嵇川南趙夢白湯義仍黃石齋鮮不墮者對偶語出於詩賦然西漢盛唐皆以意為主靈活不滯唯沈約許渾一流人以取靑妃白自矜整鍊大手筆所不屑也宋人則又集古句為對偶要亦就彼法中改頭換面其陋一爾況經義以引伸聖賢意立言初非幕客四六之比邱仲深自詫博雅而以被髮左衽弱肉強食兩偶句推奬守溪此七歲童子村孰散學課耳況以韓交對經語其心目中止知有一韓退之謂可與尼山並駕陋措大不知好惡乃至於此鉤鎖之法守溪開其端尚未盡露痕迹至荆川而以為祕密藏茅鹿門所批點八大家全恃此以為法正與皎然詩式同一陋耳本非異體何用環紐搖頭掉尾生氣既巳索然並將聖賢大義微言拘牽割裂止求傀儡之線牽曳得動不知用此何為一篇載一意一意則自一氣首尾順成謂之成章詩賦雜交經義有合轍者此也以此鑒古今人交字醇疵自見有皎然語武而後無詩有八大家文抄而後無文立此法者自謂善誘童蒙不知引童蒙入荆棘正在於此賈生治安䇿偶用繳回語亦緣痛哭流涕長太息説得駭人故須申明以見其實然耳蘇曾效之便成厭物經義有云其一則云云有云其云云者此其一耳不聵目不盲止兩三段文字何用唱籌厯數凡此類皆文抄引之入荆棘也司馬班氏史筆也韓歐序記雜文也皆與經義不相涉經義竪兩義以引伸經文發其立言之旨豈容以史與序記法攙入一段必與一篇相稱一句必與一段相稱截割彼體生入此中豈復成體要之文章必有體體者自體也婦人而髯童子而有巨人之指掌以此謂之某體某體不亦傎乎試取曹子桓典論論文范蔚宗後漢書引語張思光自序讀之古人作文字研慮以悅心精嚴如此而欲據一虛起實承反起正倒前鉤後鎖之死法填腔換字自詫宗工何其易也四大家未立門庭以前作者不無滯拙而詞旨溫厚不徇詞以失意守溪起既標格局抑專以遒徑為雄怒張之氣繇此而濫觴焉及文抄盛行周萊峰王荆石始一以蘇曾為衣被成片抄襲有文字而無意義至陳棟傅夏器而極矣隆萬之際一變而愈之於弱靡以語録代古文以填詞為實講以杜撰為淸新以俚語為調度以挑撮為工巧若黃貞父許子遜之流吟舌嬌澀如鴝鵒學語古今來無此交字遂以湮塞文人之心者數十年語録者先儒隨口應問通俗易曉之語其門人不欲潤色失真非自以為可傳之章句也以此為文而更以浮屠半吞不吐之語參之求文之不蕪穢也得乎文凡三變而其依傍以立戶牖己心不屬則一而巳矣萬曆之季李愚公始以堅蒼驅軟媚方孟旋始以流宕散俗穴稍復雅正之音於先正沖穆之度未遑領取而其變也亦足以起久病之尩矣當萬曆中年俚調橫行之下有張君一以誠雖入理未深而獨存雅度君一與許子遜同時昧心之作至子遜而極其樂則生矣一段文字開講處有數樂字鳥語班闌不知音嶽音雒猶可謂肉團心有一針孔乎承嘉靖末蘇曾汜濫之餘當萬曆初俚調咿嚘之始顧涇陽先生獨以博大宏通之才竪大義析微言屹然嶽立有制藝以來無可匹敵奪王唐大家之名以推轂先生雖閲百世不能易吾言也但以無可躋攀為流俗所不歆羡耳黃藴生欲問津焉而見地不徹能放而不能收自非實有得於道要而淹貫古今舍糟粕而吸精液惡能不望崖而返錢受之謂黃藴生嗣歸熙甫非也熙甫但能擺落纖弱以亢爽居勝地耳其實外腴中枯靜扣之無一語出自赤心藴生言皆有意非熙甫所可匹敵但為史所困又染指韓蘇未能卓立耳然藴生當天步將傾之日外則左禍逼內則流寇蜂起黃扉則有溫周楊薛之姦中涓則有張彜憲曹化淳之蠧憂憤填胸一寓之經義抒其忠悃傳之異代論世者所必不能廢也陳大士史而橫金正希禪而曲若其離此二者別尋理際獨至處自成一家固賢於歸熙甫之徒矜規格也若經義正宗在先輩則嵇川南在後代則黃石齋凌茗柯羅文止剔發精微為經傳傳神抑惡用鹿門震川鋪排局陳為也先輩中若諸理齋孫月峰湯若士趙儕鶴後起如沈去疑倪伯屏金道隱杜南谷章大力韋孝忍克濟黃岡人薑如須垓山東人亦各亭亭獨立分作者一席釋氏有言從門入者不是家珍特以無門可入絶陋人攀援之徑故人不知元賞耳孫月峰以紆筆引伸搖動言中之意安詳有度自雅作也乃其晚年論文批點考工檀弓公穀諸書剔出殊異語以為奇峭使學者目眩而心熒則所損者大矣萬歷中年杜撰嬌澀之惡習未必不緣此而起考工記乃制度式樣册子上令士大夫習之勾考工程而下可令工匠解了故刪去文詞務求精核其中奇字乃三代時方言俗語愚賤通知者非此不足以定物料規制之準非故為簡僻也檀弓則摘取口中片語如後世世説新語之類𥘉非成章文字公穀二傳先儒固以為師弟子問答之言非如左氏勒為成書原自不成尺幅以此思之三書者亦何奇峭之有而欲效法之邪文字至琢字而陋甚以古人文其固陋具眼人自和哄不得文字至撮弄字面而穢極矣黃葵陽巳啓其端至萬曆壬辰而益濫陳懿典憲章文武出題云國憲王章本朝為重闡文繹武昭代為尊此是何等語而一時傳誦為警句嗣後效之以不通者三十餘年崇禎間諸名人力為洗滌然猶有云天無子人之聖者為其子海無內人之聖者居其內德為聖人四句會墨如此迷惑喪心之語猶拔作南宮首卷文字安得不陋士習安得不偷邪良知之説充塞天下人以讀書窮理為戒故隆慶戊辰會試知之為知之不知為不知文以不用集注繇此而求之一轉取士教不先而率不謹人士皆束書不觀無可見長則以撮弄字句為巧嬌吟蹇吃恥笑俱忘如戰戰兢兢如履薄冰而撮云冰兢念終始典于學而撮云念典乃至市井之談俗醫星相之語如精神命脈遭際探討總之大抵不過是何汚目聒耳之穢詞皆入聖賢口中而不知其可恥此嘉靖乙丑以前雖不雅馴者亦不至是湯賓尹以淫媢小人益鼓其焰而燎原之火卒不可撲實則田一俊黃洪憲倡之於早也有代字法詩賦用之如月曰望舒星曰玉繩之類或以點染生色其佳者正爾含情然漢人及李杜高岑猶不屑也施之景物已落第二義況字本活而以死句代之乎如敬則是敬更無字可代而所敬與所以敬正自隨所指而異用代字者以欽翼兢惕代之或以怠荒戲渝反之直是不識敬字支吾抵塞耳信曰惇篤仁曰慈祥學曰敏求思曰覃精善曰純粹治曰經理皆代字也先輩中亦有此病自吳季子小注來有胸有心者不應染指疊字不可析用如詩賦悠悠而云悠迢迢而云迢渺渺而云渺皆不成語兢兢業業舊有此文亦不甚雅業業云者如筍虡上崇牙兩兩相次齟齬不相安之象時文絶去一字而云兢業不知單一業字則止是功業連兢字如何得成文理此病先輩亦有若嵇川南趙儕鶴諸公則必不作此生活欲除俗陋必多讀古人文字以沐浴而膏潤之然讀古人文字以心入古文中則得其精髓若以古文填入心中而亟求吐出則所謂道聽而塗説者耳經義固必以章句集注為準但不可背戾以浸淫於異端若注所未僃補為發明正先儒所樂得者如尤公瑛寡人之於國也章文以制産重農救荒分三事而以末段歸重汰獸食發倉廩為目前應迫救荒之先務救荒而後待來年以重農然後徐及制産乃令孟子之敷施調理井然有序又如金正希侍於君子有三愆文謂人有愆而不自知唯侍君子乃知有之而慙惶思改見人之不可不就正於君子陳大士欲仁而得仁文謂欲取於民者薄斂而緩征之仁者之政也則所得者民皆樂奉而懷恩固仁者之得也如此乃與不貪相應諸若此類注所未及詎可以非注所有而謂為異説乎困死俗陋講章中者自不足以語此以酸寒囂競之心説孔孟行藏言之無怍且矜快筆世教焉得而不陵夷哉聖賢雖以撥亂反正安天下為志然乘六龍以御天濳亢飛躍無不可樂之天無不可安之土而作經義者非取魯衛齊梁之君臣痛罵以泄其忿則悲歌流涕若無以自容其醜甚矣榜前濳下淚衆裏卻藏身孟郊之所以為郊也愁中天屢陰談元春之所以為元春也而使君子如此其齷齪乎愚嘗判韓退之為不知道與楊雄等以進學解送窮文悻悻然怒澘澘然泣此處不分明則其云堯舜禹湯相傳者何嘗夢見所傳何事經義害道莫此為甚反不如詩賦之翛然於春花秋月間也擡一官樣字作題目拈一扼要字作眼目自謂名家實則先儒所謂只好隔壁聽者耳官樣字者如老者安之三句張受先以王道二字籠罩不知夫子言志時但就面前説去初未嘗言以此治平天下若論其至處則雖王者亦待必世後仁之餘方慚與此相應若行王道者何敢易言及此張之使大正局之使小耳又如哀公問政章以法祖為旨者亦官樣話也經文明言人存而後政可舉亡其人則政雖布在方策而必息故必極學問思辨之力以果能好學力行知恥而修仁義禮之人道然後可以治天下國家非但依樣胡盧遽言法祖如王莽之效周公也凡此類皆大言無當徒使淺學陋人有所倚之巴鼻而已扼要字者如程子教學者以主敬乃立本以起用非知有此事便休更不須加功修治之謂如止至善章學修恂栗威儀內外交盡德乃盛善乃至仁敬孝慈親賢樂利天德王道之全豈一敬字遽足以該括之又如道千乘之國章言敬事者但於事言敬初非主一無適之謂與居敬言居者抑別固該括下四者不得聖賢之學原無扼要乘龍御天無所不用其極扼要之法乃浮屠所謂佛法無多子者孟子謂之執一賊道宋末諸儒雖朱門人士皆暗用象山心法拈一字為主武斷聖賢之言苟趨捷徑而作經義者依據以塞責萬曆以後惡習熺然流及百年餘焰不熄誠無如之何也古者字極簡秦程邈作隸書尚止三千字許愼説文亦不逮今字十之二三字簡則取義自廣統此一字隨所用而別熟繹上下文涵泳以求其立言之指則差別畢見矣如均一心字有以虛靈知覺而言者心之官則思之類是也有以所存之志而言者先正其心是也有以所發之意而言者從心所欲是也有以函仁義為體為人所獨有異於禽獸而言者求放心及操則存舍則亡者是也有統性情而言者四端之心是也有性為實體心為虛用與性分言者盡心知性與張子所云性不知簡其心是也凡言天言道皆然隨所指而立義彼此相襲則言之成章而必淫於異端言之無據而不成章則浮辭充幅而不知其所謂大全小注諸家雜亂於前講章之毒盈天下而否塞晦蒙更無分曉不能解書何從下筆宜乎為君子儒者之賤之也陋人以鉤鎖呼應法論文因而以鉤鎖呼應法解書豈古先聖賢亦從茅鹿門受八大家衣鉢邪如哀公問政章於知仁勇之仁鉤上仁義禮之仁不動心章以勿求於心之心鉤上不動之心但困死呼應法中更不使孔孟文理得通何況精義魔法流行其弊遂至於此王子敬作一筆草書世稱墨妙然一帖之中語雖連貫而字形嚮背各殊必於一筆未免有拗折牽連之病若經義一題自一理一篇自一意豈容有二筆邪既必一筆何用鉤鎖止緣陋人氣不能長如老病喘促必須歇息方更接續故鉤鎖之法一立而天下翕然從之為獨參湯以延殘喘非此字不足以盡此意則不避其險用此字已足盡此義則不厭其熟言必曲暢而伸則長言而非有餘意可約略而傳則芟繁從簡而非不足嵇川南湯義仍諸老所為獨絶也避險用熟而意不宣如扣朽木厭熟用險而語成棘如學鳥吟意止此而以虛浮學蘇曾是折腰之蛇義未盡而以迫促仿時調如短項之蛙才立門庭即趨魔道四者之病其能免乎有意之詞雖重亦輕詞皆意也無意而著詞才有點染即如蹇驢負重四蹄周章無復有能行之勢故作者必須愼重揀擇勿以俗尚而輕泚筆至若涇陽先生以龍躍虎踞之才左冝右有隨手合轍意至而詞隨更不勞其揀擇非讀書見道者未許涉其津涘不博極古今四部書則雖有思致為俗軟活套所淹殺止可求售於俗吏而牽帶泥水不堪挹取乃一行涉獵便隨筆涌出心靈不發但矜遒徑或務曲折或誇饒美不但入理不真且接縫處古調今腔兩相黏合自爾不相浹洽縱令摶成必多敗筆趙儕鶴湯義仍羅文止何嘗一筆倣古而時俗軟套脫盡無餘其讀書用意處別也以外腴中枯評歸熙甫自信為允其擺脫軟美踸厲而行亦自費盡心力乃徒務間架而於題理全無體認則固不能為有無也且其接縫處矯虔無自然之度固當在許石城張小越之下熙甫子子慕變矯厲為輕安不失為儒者之言度越其父遠甚人言殊不然所謂相者舉肥也自李贄以佞舌惑天下袁中郎焦弱侯不揣而推戴之於是以信筆掃抹為文字而誚含吐精微鍛鍊高卓者為咬薑呷醋故萬曆壬辰以後文之俗陋亙古未有如必不經思維者而後為自然之文則夫子所云草創討論修飾潤色費爾許斟酌亦咬薑呷醋邪比閲陶石簣文集其序記書銘用虛字如蛛絲罥蝶用實字如屐齒黏泥合古今雅俗堆砌成篇無一字從心坎中過真莊子所謂出言如哇者不數行即令人頭重蓋當時所尚如此啓禎間始洗滌之而艾千子猶以莽莽蒼蒼論交蒼字上聲誤讀為倉不知莽莽蒼蒼者即俗所謂莽撞孟子所云茅塞也昔人謂書法至顔魯公而壞以其著力太急失晉人風度也文章本靜業故曰仁者之言藹如也學術風俗皆於此判別著力急者心氣粗則一發不禁其落筆必重皆囂陵競亂之徵也俗稱歐蘇等為大家試取歐陽公文與蘇明允並觀其靜躁雅俗貞淫昭然可見心粗筆重則必以縱橫名法兩家之言為宗主而心術壞世教陵夷矣明允其明驗也啓禎諸公欲挽萬曆俗靡之習而競躁之心勝其落筆皆如椎擊刻畫愈極得理愈淺雖有才人無可勝澄淸之任就中唯沈去疑杜南谷為有超然之致猶未醇也其他勿論巳代聖賢以引伸至理而赬面張拳奚足哉元詩人如貫雲石薩天錫馮子振欲矯宋詩之衰而羶氣乘之啓禎文多類此意者亦天實為之邪學蘇明允猖狂譎躁如健訟人強辭奪理學曾子固如聽村老判事止此沒要緊話扳今掉古牽曳不休令人不耐學王介甫如拙子弟效官腔轉折煩難而精神不屬八家中唯歐陽永叔無此三病而無能學之者要之更有向上一路在談友夏論詩云一篇之朴以養一句之靈一句之靈能回一篇之朴囈語爾以朴養靈將置子弟於牧童樵豎中而望其升孝秀之選乎靈能回朴村塢間茅苫土壁塑一關壯繆衮冕執圭席地而坐望其靈之如響為嗤笑而已慶曆中經義以一句爭勝皆此説成之曹大章大哉堯之為君也章承頭一句云甚矣帝堯之德天德也袁黃贊其壓倒萬人許獬畏聖人之言起比一句云聖言亦庸言耳場中以此定為南宮第一如實思之有何意味如口給人説酒令適資一笑而已聞之論奕者曰得理為上取勢次之最下者著文之有警句猶碁譜中所注妙著也妙著者求活不得欲殺無從投隙以解困厄拙碁之爭勝負者在此若兩俱善奕全局皆居勝地無可用此妙著矣非謂句不宜工要當如一片白地光明錦不容有一疵纇自始至終合以成章意不盡於句中孰為警句孰為不警之句哉求工於句者有廓落語如聖人一天也及非甚盛德誰能當此而王者又上觀千世下觀千世之類有陡頓語如甚矣帝堯之德天德也之類有鉤牽語如畏聖人之言而云知所畏者也之類有排對語如𬒳髮左衽弱肉強食之類其下則有蔓延語如剿襲檀弓不出而圖吾君苟出而圖吾君之類浮枵語如又進而加詳焉然後浩乎其有得之類含糊語如悠然其可思之類答話語如大抵不離乎云云者近是之類肥膩語撮必讀古文中俗艷為句懵懂語如道德仁義禮樂詩書等字湊手便用俗講語殊不知總之大抵之類賣弄語如入夢之姬公易逝病諸之堯舜難酬之類市井語煙花語招承語小題文多此三者門面語如天不變道亦不變雖天子必有父諸侯必有兄之類滑利語如君子之仕也文云踐其士而食其毛誰非臣子者出口快甚然豈販夫牧豎亦須求仕乎嬌媚語如我浮沈之人也與哉及性也而情在其中矣之類黃貞父好為短句短比快轉以求媚近則包長明亦中此病凡此類始則偶一作者意與湊合不妨用之陋人驚為好句相襲而不知其穢皆於句求工之拙法啓之也有所謂開門見山者言見遠山耳固以縹眇遙映為勝若一山壁立當門而峙與面牆奚異曹子建有面山背壑之語彼生長譙許己居鄴城未嘗有山恨不逼近危崖若使果有此室豈不是倒架屋劣文字起處即著一斗頓語説煞謂之開門見山不知向後更從何處下筆此弊從仕宦而至將相富貴而歸故鄉來彼作法於涼重復申説一篇已成兩橛何足法也若環滁皆山也語雖卓立正似遠山遙映耳陋人自為文既爾又且以解聖賢文字如哀公問政章扼定文武之政四字通章縈繞更不恤下文云何誠意章以毋自欺也也字應上者字一語説煞後復支離皆當門一山遮斷遙天遠景豈知古人立言迤邐説去要歸正在結煞處哉抑有反此者以虛冒籠起至一二百字始見題面此從蘇曾得來韓柳歐陽尚不盡然然蘇曾但以施之章疏序記抒己意者經義自有立言端委如人家族譜但敘本姓源流何用自從混沌初開盤古出説起也昔人謂之為壽星頭洵然薛方山每於起冒下急出本文此科場論式也論取題而推廣言之故可揭過經史本文重抒己意經義體聖賢之言而紬繹之語盡則止一句急出則如喉間骨鯁吞吐皆難一篇之中分為兩截勢必更端説起項下安頭此法利於孰師教劣子弟使易收歸本科段段著想遂翕然稱之為大家不虞之譽引人入坑塹如此羅長源論字學云胸中無數千卷書日用無忠信之行則雖蠆尾銀鈎八法僃舉求其落玉垂金流奕淸舉者乃至一點亦不可得嘗服膺此言以為論文之善莫過於是而茅鹿門云吾作文時屋瓦皆為動搖説得恁鬠鬡可畏想訟魁代人作訴牒時當如此下筆看章句集注須理會先儒云何而作此語非可一抹竄入訓詁中暝煙繚繞正使雲山莫辨如子在川上注川流與道為體恐學者將川流與道判作二事以水為借譬劃斷天人失太極渾淪之本體故下此語初非為逝者不舍晝夜作注讀者但識得此意則言水即以言道自合程子之意不可於夫子意中增此四字反使本旨不得暢白又如鳶飛戾天一段章句有活潑潑語乃以贊子思立言教人之妙使人隨處見道無所執礙以反失當幾之省察故又云其要在愼獨若子思言此初非以鳶飛魚躍為活潑潑物事駘宕圓融如浮屠水流花開之狂解若不解此謂魚鳥化機流動無恆則正程子所謂弄精魂者故作經義者當置活潑潑三字不須插入但實從道之全體大用充周溥遍上著講此處不分明引金屑入目宜其文之茫茫白霧也陳大士自云三月而遍讀草一史目力之勝可知乃其天之高也一節文字於曆法粗率且未曉了出語便成差異想其讀史時於曆志無能曉處便擲向一壁去先輩於所未知約略説過卻無背戾惟不欲誇博敏大士以博敏自雄故亂道以此推之大士於史凡地理職官兵刑賦役等志俱不蒙其眄睞若但取列傳草草看過於可喜可恨事或為擊節或為按劍則一部鳳洲綱鑑足矣何必九十日工夫翻此充棟册子邪黃藴生易經義説曆法較無舛訛其讀史視大士為能詳審自不以三月誇速了乃所言曆法又晉宋以降何承天虞􅒠一行郭守敬所定歲差定朔等精密之法孔子作易繫傳止據夏周之曆何嘗有此藴生知解而不知用亦欲誇博敏之失也近人爭讀近思録資時文之用且問渠太極是何物事清虛一大是何形狀主一無適何以用功若止記取册子上語句搭得上輒與鈔寫則近思録豈詩學大成四六類函供汝道聽塗説者乎此之謂不知恥通身倒入古人懷中王莽學周公且供笑罵況誦桀之言者乎周萊峰王荆石學蘇氏止取法其語言氣勢至説理處自循正大之矩至陳卧子陳大士將身化作蘇明允開口便説權説勢權勢二字乃明允譎詐殘忍以商鞅韓非尉繚為師賊道殃民之大惡讀孔孟書者何忍效之大士以文人自命者不足深責卧子嚴氣正性大節凛然而斯言之玷不可磨能弗為之惋惜妖孽作而妖言興周延儒是已萬曆後作小題文字有諧謔失度浮艷不雅者然未至如延儒以一代典制文字引伸聖言者而作豈不爾思踰東家牆等淫穢之詞其無所忌憚如此伏法之後閨門狼籍不足道乃令神州陸沈而不可挽悲夫經義之設本以揚榷大義剔發微言或且推廣事理以宣昭實用小題無當於此數者斯不足以傳世其有截頭縮腳以善巧脫缷吸引為工要亦就文句上求語氣於理固無多也守溪作此以翦裁尺幅為式義味亦復索然特不似後人作諢語耳若荆川則已開諢語一路如曾子養曾晳一段文謂以餘食與人為春風沂水高致其所與者特家中卑幼耳三家村老翁嫗以卮酒片肉飼幼子童孫亦嘐嘐之狂士乎諢則必鄙倍可笑類如此此風一染筆性浪子插科打諢與優人無別有司乃以此求士可謂之舉國如狂矣唯有種説事説物單句語於義無與亦無所礙可以靈雋之思致寫令生活此當以唐人小文字為影本劉蛻孫樵白居易段成式集中短篇潔淨中含靜光遠致聊擬其筆意以駘宕心靈亦文人之樂事也湯義仍趙儕鶴王謔菴所得在此劉同人亦往往近之餘皆不足比數逆惡頑夫語覆載不容而為之引伸心先喪矣俗劣有司以命題試士無行止措大因習為之僃極凶悖如孰謂鄹人之子知禮乎謨蓋都君咸我績之類何忍把筆長言漢兒學得胡見語又替胡兒罵漢人罵漢人且不忍聞何況射天笞地橫截數語乃至數十語不顧問答條理甚則割裂上章連下章極不相蒙之文但取字迹相似者以命題謂之巧搭萬曆以前無此文字自新學橫行以挑剔字影弄機鋒下轉語為妙悟以破句斷章隨拈即是為宗風於科場命題亦不成章句如邦畿千里二節絶去可以人而不如鳥乎孟懿子問孝章絶去子曰生事之以禮三句行己有恥使於四方絶去不辱君命皆所謂搭題也命題如此而求有典有則之文其可得乎唐人選士命作幽蘭賦舉子傲岸不肯作主司為改渥窪馬賦乃曰較可古人奬進人才如此而以功令束人使相效以趨於卑陋侮聖言而莫敢違之經義之不足傳非此等使然與人各占一經已不足以待通儒乃於所占之經視為續貂之狗尾孰課先習浮爛之詞文場取塞終篇之責五經大指已屬面牆先聖精微永隨茅塞詩則採輯詩賦四六中最下俗艷語用為無鹽之粉黛咏歎淫泆之意百無一存春秋則以俗吏爰書訟魁牒狀醜詆之詞取巳往之君臣恣其詬厲數百年來能免此者千無一二近世名人略為洗滌詩則黃石齋凌茗柯春秋則劉同人及路君朝陽逸羣遒上庶幾不負明經之目至若周易廣大精微以六虛盡天人之理數而作經義者限之以君臣出處苟為位置若有一姓六名二之相建元九五之君或得或失𬒳以褒嘉施以誚責加之勸勉曲為詰問象占時位罔所聞知黑風吹墮莫能拔出者久矣書唯典謨有論道之言誓誥乃諭臣民之作典謨辭顯而意深自為一體誓誥則雜以方言使人易曉辭不通今若有僻奧而大指所歸示生人之利害作經義者一以危微精一強相附會將與介胄之夫田野之氓反側之子談心性乎迷而不反者二百餘年啓禎以來後起諸公雖或不雅馴而窮經得歸趣者間出焉方之慶曆以前自覺積薪居上科場文字之蹇劣無足深責者名利熱中神不淸氣不昌莫能引心氣以入理而快出之固也況法制嚴酷幾如罪人之待鞫乎漢晉以上惟不以文字為仕進之羔雉故各隨所至而卓然為一家言隋唐以詩賦取士文場之賦無一傳者詩唯曲終人不見江上數峰靑一律而已燕許高岑李杜儲王所傳詩皆仕宦後所作閲物多得景大取精宏寄意遠自非局促名場者所及經義本儒者分內事而一行作吏則置之如隔年曆間有作者祗為子弟作嫁衣裳陳啓新誚為𫾣門磚子非誣也唯楊貞復宦稿借經義講學其意良善乃又為姚江之學所賺非徒見地詖淫文氣亦迫促衰弱深可惜也為一代文人而不遇者多矣則膠庠之下自應有偉人傑作睥睨今古乃嘉隆以前無一傳者後乃有徐文長渭漏仲容坦之張子延大復數首行世亦無甚超絶處天啓後社稿充斥終不脫揣摩蹊徑若錢吉士顧麟士輩欲矯時趨而本領既薄指趣自卑因憶昔與黃岡熊渭公李雲田以默作一種文字不犯一時下圓熟語復不生入古人字句取精煉液以靜光達微言所業未竟而天傾文喪生死契闊念及祗為哽塞夕堂永日緒論外編嶽餘集卷一船山遺書五十九衡陽王夫之撰霜度函口嶽徑墜葉滿行衣徑草試霜色何知山川想足敵絶塵力初暾峰紫搖浮空夾蒼植似可就奇光問之求羽翼即事癸未匿嶽看山正好北風吹寒在峰頭最上枝莫漫放鬆笻竹杖詰朝晴好野翁知寒甚下山訪病兒存沒道中逢夏仲力下小竹舁栗不能語哀我無衣授之以絮歸山有咏志感也癸未匿嶽應自友朋恩知深謝不言無衣度霜雪多難際乾坤泥重芒鞋澀雲濃溼帽昏更愁從此去託足向何門其二得絮不云暖此情君合知主憂臣但爾心死身何為緑草華山帶高樓燕子枝詎言身未嫁可任東風吹聞鄭天虞先生收復寶邵別家兄下山而西將以臘杪往赴愴然而作癸未匿嶽微生一日一偷生為惜鴻毛死亦輕從此岐行還強飯盡收雲水答淸平月中曉發僧俗送者十三人皆攀泣良久子亦淚別癸未匿嶽恨别非常度相憐已有時飢分羹芋飽誠絶叟童欺段尉慙無笏王丞敢著詩感茲昵我衆益笑黨人癡其二出山仍不樂未返故園時林岫應相笑蒼天吾豈欺簡囊羞短劒藏穴護新詩有約歸潮日圖存筆墨癡黑山訪址甲申重遊不覺生處高上有萬壑爭潺湲如可即欲問蘆蔣聲其二嶽力偏幽最平遙眼一新得從煙月望擬作釣江人鐵牛菴下忽不喜往僧汲水聲處旋歸未掩關喜尋黃葉溼已度夕陽間玉門望獅子峰用舊作四韻甲申重遊前遊餘愴在霜月況同時世益麏麋駭生為神鬼欺九州浮一影殘夢續新詩視徹餘生淡悠悠吾豈癡其二屢望高難到前冬一杖時分明霜雪苦逼側虎狼欺芒屨仍潭水石函尚小詩只今腸可斷翻笑昔情癡戀響臺甲申重遊平接上峰去忽從林莽頽奇情供一徑並送此中來繇戀響眺一奇石而上同夏叔直援石曲折遂得方址巋然可臺甲申重遊身隨落葉高足盡奇響力同是一潺湲泉端不可識曉同叔直出寺拂讀朱菊水所攜談友夏嶽記甲申重遊登徑驚林泉知有高人址昨宵話霜月寒河固盈耳星光問吟嘯松根想屐齒是日靑天高一石映緑峙朝暾不敢惜白光滿蘋芷夏子發笑言循池纍徑此似有神護蔽珍重以需子遙秀豈敢蒙道孤無出美勉以答古人雙影戀流水湧几甲申重遊大拗而下平橋叢石間覺有異已忽兩石臨水下石承上石旁壁頂覆可度可登豫命人為級穿折于肩肘之間攙度裂處顧其逼鬱尚以翔移為苦造形以來悠悠者誰望而目之則經此者又可知矣舉酒酹石貌以湧几今往後來遊覽相積風雨苔蘚之所不忌則此石其傳也已時崇禎甲申陽月望後曠古登應少問之石不知此山初得主千嶽覺增奇葉動鳴泉處橋寒亭午時有來爭勝槩切莫突西施縱馬三十里曉及樟木市大江寒流荒崖野艇出嶽霜山曉氣下連江水影寒花的的雙淸絶不知乘一羽遙天似有碧雲幢分寄方廣避亂諸緇侣寄嶽嶽雲三尺雪一尺爛木枯根焰不生曾記凍僵雙足重諸師許我入山深二屢逢虎迹如牛掌晴日鳴風森晚潭自喜林敲山石碎百靈能識我無慙三燒盡山中貓竹籜特教瘦土發龍材可憐春雨騰靑削曾此蕭蕭風雨哀四麋晨鶻夜晝鵂鶹足覆寒蓑聽未休此自答恩還聖代山僧莫只話驚鷗五有土不容雙足入冤親寂寞得山僧若為一衲寒鐘底卻解人間劒俠能六兩杖擕歸意暗交鏗然嶽石許晴敲時艱未靖羞神力風雨何當補一巢七螺縈萬疊靑難已縷縷雲來森自平中有人煨山芋熟破煙郤喜杖來輕八飢將覓食無方向飽我山中瓜果根一片寒香入骨裏直令淸絶是師恩嶽餘集終序周禮大司樂以樂德樂語教國子成童而習之逮聖德已成而學韶者三月上以迪士君子以自成一惟於此蓋涵泳淫泆引性情以入微而超事功之煩黷其用神矣世教淪夷樂崩而降于優俳乃天機不可式遏旁出而生學士之心樂語孤傳為詩詩抑不足以盡樂德之形容又旁出而為經義經義雖無音律而比次成章才以舒情以導亦所謂言之不足而長言之則固樂語之流也二者一以心之元聲為至舍固有之心受陳人之束則其卑陋不靈病相若也韻以之諧度以之雅微以之發遠以之致有宣昭而無罨靄有淡宕而無獷戾明於樂者可以論詩可以論經義矣余自束髮受業經義十六而學韻語閲古今人所作詩不下十萬經義亦數萬首既乘山中孤寂之暇有所點定因論其大約如此可言者言及之有不可言者誰其知之庚午補天穿日船山老夫敘國史儒林傳王夫之湖南衡陽人明舉人張獻忠陷衡州設偽官招夫之夫之走匿南嶽賊執其父為質夫之引刀自刺肢體舁往易父賊見其創也免之父子俱得脫歸居石船山杜門著書神契張載正蒙之説演為思問録內外二篇所著書有周易稗疏書經稗疏詩經稗疏其言易不信陳摶之學亦不信京房之術於先天諸圖及緯書雜説排之甚力而亦不空談元妙附會老莊之旨故言必徵實義必切理其説尚書詮釋經文多出新義然詞有根據不同遊談其説詩辨正名物訓詁以補傳箋諸説之遺皆確有依據不為臆斷又辨叶韻一篇持論名通足解諸家之轇轕又著尚書引義春秋稗疏春秋家説康熙間吳逆在衡湘夫之又逃入深山吳逆平巡撫嘉之餽粟帛請見夫之辭帛受粟未幾卒把鏡相看認不來問人云此是薑齋龜於朽後隨人卜夢未圎時莫浪猜誰茟仗此形骸間愁輸汝兩眉開鉊華未落君還在我自從天乞活埋右船山先生自題畫像小詞同治乙丑冬杪獨山後學莫友芝録詩譯薑齋詩話卷一船山遺書六十三衡陽王夫之撰王仲淹氏之續經見廢於先儒舊矣續而僭者七制之詔䇿也仲淹不任刪七制之主臣尤不足述也春秋者衰世之事聖人之刑書也平桓之天子齊晉之諸侯荆吳徐越之僭偽其視六代十六國相去無幾事不必廢也而詩亦如之衛宣陳靈下逮乎溱洧之士女葛屨之公子亦奚必賢於曹劉沈謝乎仲淹之刪非聖人之刪也而何損于采風之旨邪故漢魏以還之比興可上通于風雅檜曹而上之條理可近譯以三唐元韻之機兆在人心流連泆宕一出一入均此情之哀樂必永於言者也故藝苑之士不原本于三百篇之律度則為刻木之桃李釋經之儒不證合于漢魏唐宗之正變抑為株守之兔罝陶冶性情别有風旨不可以典册簡牘訓詁之學與焉也隨舉兩端可通三隅詩可以興可以觀可以羣可以怨盡矣辨漢魏唐宋之雅俗得失以此讀三百篇者必此也可以云者隨所以而皆可也於所興而可觀其興也深於所觀而可興其觀也審以其羣者而怨怨愈不忘以其怨者而羣羣乃益摯出於四情之外以生起四情遊于四情之中情無所窒作者用一致之思讀者各以其情而自得故關雎興也康王晏朝而即為冰鑑訏謨定命遠猷辰告觀也謝安欣賞而增其遐心人情之遊也無涯而各以其情遇斯所貴於有詩是故延年不如康樂而宋唐之所繇升降也謝疊山虞道園之説詩井畫而根掘之惡足知此采采芣苡意在言先亦在言後從容涵泳自然生其氣象即五言中十九首猶有得此意者陶令差能倣佛下此絶矣采菊東籬下悠然見南山衆鳥欣有託吾亦愛吾廬非韋應物兵衛森畫戟燕寢凝淸香所得而問津也昔我往矣楊柳依依今我來思雨雪霏霏以樂景寫哀以哀景寫樂一倍增其哀樂知此則影靜千官裏心蘇七挍前與唯有終南山色在晴明依舊滿長安情之深淺宏隘見矣況孟郊之乍笑而心迷乍啼而魂喪者乎唐人少年行云白馬金鞍從武皇旌旗十萬獵長楊樓頭少婦鳴筝坐遙見飛塵入建章想知少婦遙望之情以自矜得意此善於取影者也春日遲遲卉木萋萋倉庚喈喈采蘩祁祁執訊獲醜薄言還歸赫赫南仲玁狁于夷其妙正在此訓詁家不能領悟謂婦方采蘩而見歸師旨趣索然矣建旌旗舉矛戟車馬喧闐凱樂競奏之下倉庚何能不驚飛而尚聞其喈喈六師在道雖日勿擾采蘩之婦亦何事暴面于三軍之側邪征人歸矣度其婦方采蘩而聞歸師之凱旋故遲遲之日萋萋之草鳥鳴之和皆為助喜而南仲之功震于閨閣室家之欣幸遙想其然而征人之意得可知矣乃以此而稱南仲又影中取影曲盡人情之極至者也始而欲得其歡已而稱頌之終乃有所求焉細人必出於此鹿鳴之一章曰示我周行二章曰示民不佻君子是則是效三章曰以燕樂嘉賓之心異於彼矣此之謂大音希聲希聲不如其始之勤勤也杜子美之於韋左丞亦嘗知此乎庭燎有輝鄉晨之景莫妙於此晨色漸明赤光雜煙而􅩙但以有輝二字寫之唐人除夕詩殿庭銀燭上熏天之句寫除夜之景與此倣佛而簡至不逮遠矣花迎劍佩四字差為曉色朦朧傳神而又云星初落則痕迹露盡益歎三百篇之不可及也蘇子瞻謂桑之未落其葉沃若體物之工非沃若不足以言桑非桑不足以當沃若固也然得物態未得物理桃之夭夭其葉蓁蓁灼灼其華有蕡其實乃窮物理夭夭者桃之稚者也桃至拱把以上則液流蠧結花不榮葉不盛實不蕃小樹弱枝婀娜妍茂為有加耳子之不淑云如之何胡然我念之亦可懷也皆意藏篇中杜子美故國平居有所思上下七首於此維繫其源出此俗筆必于篇終結鎖不然則迎頭便喝句絶而語不絶韻變而意不變此詩家必不容昧之幾也天命元鳥降而生商降者元鳥降也句可絶而語未終也薄汚我私薄浣我衣害浣害否歸寧父母意相承而韻移也盡古今作者未有不率繇乎此不然氣絶神散如斷蛇剖瓜矣近有吳中顧夢麟者以帖括孰師之識説詩遇轉則割裂別立一意不以詩解詩而以學究之陋解詩令古人雅度微言不相比附陋于學詩其弊必至於此知池塘生春草胡蝶飛南園之妙則知楊柳依依零雨其𪷟之聖於詩司空表聖所謂規以象外得之圜中者也賜名大國虢與秦與美孟薑矣美孟弋矣美孟庸矣一轍古有不諱之言也乃國風之怨而誹直而絞者也夫子存而弗刪以見衛之政散民離人誣其上而子美以得詩史之譽夫詩之不可以史為若口與目之不相為代也久矣魯頌魯風也商頌宋風也以其用天子之禮樂故仍其名曰頌其郊禘之升歌也乃文之無慙侈心形焉鼓咽咽醉言歸于胥樂兮與鐃吹白紵同其管急絃繁之度雜霸之風也鮑昭李白曹鄴以之女也不爽士二其行士也罔極二三其德語似排偶而下三語與上一語相匹李白劍閣重開蜀北門上皇車馬若雲屯少帝長安開紫極雙懸日月照乾坤竊取此法而逆用之蓋從無截然四方八段之風雅也謝靈運一意回旋往復以盡思理吟之使人卞躁之意消小宛抑不僅此情相若理尤居勝也王敬美謂詩有妙悟非關理也非理抑將何悟用復字者亦形容之意河水洋洋一章是也靑靑河畔草鬱鬱園中柳顧用之以駘宕善學詩者何必有所規畫以取材興在有意無意之間比亦不容雕刻關情者景自與情相為珀芥也情景雖有在心在物之分而景生情情生景哀樂之觸榮悴之迎互藏其宅天情物理可哀而可樂用之無窮流而不滯窮且滯者不知爾吳楚東南坼乾坤日夜浮乍讀之若雄豪然而適與親朋無一字老病有孤舟相為融浹當知倬彼雲漢頌作人者增其輝光憂旱甚者益其炎赫無適而無不適也唐末人不能及此為玉台底蓋之説孟郊溫庭筠分為二壘天與物其能為爾􅍐分乎詩譯薑齋詩話卷一終薑齋詩賸稿船山遺書補遺一衡陽王夫之撰戊戌嶽後辱戴晉元見訪今來復連榻旃檀口占五古一首我居雙髻峯峯雲嘗相護雲裏忽逢君不畏潭龍妒荏苒十八年夢巾時一遇今昔非有殊鬚髮徒蒼素譬如雲隙月隨處時偶露不知東升烏何有西沈兔明明雙眼孔誰者為新故薪易火居然千秋為旦暮同君宿郊菴四目還相注回看雙髻雲南飛繞湘樹示姪孫生蕃忘卻人間事始識書中字識得書中字自會人間事俗氣如糨糊封令心竅閉俗氣如嵐瘧寒往熱又至俗氣如炎蒸而往依坑厠俗氣如遊蜂癡迷投窗紙堂堂大丈夫與古人何異萬里任翶翔何肯縛雙翅鹽米及雞豚瑣屑計微利市賈及村氓與之爭客氣以我千金軀輕入茶酒肆汗流浹衣裾拏三而道四既為儒者流非胥亦非隸高談問訟獄開口即賦稅議論官貪廉張脣任譏刺拙者任吾欺賢者還生忌摩肩觀戲場結友禮廟寺半截織錦襪幾領厚綿絮更僕數不窮總是孽風吹吾家自維揚來此十三世雖有文武殊所向惟廉恥不隨濁水流宗支幸不墜傳家一卷書惟在爾立志鳯飛九千仞燕雀獨相視不飮酸臭漿間看傍人醉識字識得真俗氣自遠避人字兩撇捺原與禽字異瀟灑不沾泥便與天無二汝年正英少高遠何難企醫俗無別方惟有讀書是大雲山歌為熊畏齋社戚翁六秩壽湘山之高雲山高朱鳥回翮蟠雲翶羣仙握符顧九宇翩然來下揮旌旄我聞石笈金扄在峯頂緑苔不掩珠光炯邇來六百四十六春秋紫金液老三花鼎鼎裡刀圭人不識懸待其人烹太極靜如止水暖如雲即此金壷貯春色我欲從之君許否願酌紅泉為君壽松雲蘿月數峯前玉露凝香挹天酒重過蓮花峯為夏叔直讀書處七律山陽吹􅐟不成音淒斷登臨舊碧岑雲積步廊春袖溼燈寒殘酒夜鐘深河山憾折延陵劒風雨長迷海上琴聞道九峯通赤帝松杉鶴羽待招尋同歐子直劉庶仙登小雲山靑天下鏡倒晴空戰壘仙壇碧萬叢終遣屈平疑邃古誰從阮籍哭英雄大荒落日懸疏檻五嶺孤煙帶遠虹獨坐上方鐘磬裏消沈無淚灑羊公寄懷陳耳臣兼懷安福陳二止緱山月榭夢中秋疏雨湘波一寄愁老大乾坤添戲局蕭條風月識中流維摩香飯聊長飽魯壁哀絃未易酬為訪華山酣睡客可容長笑指神州春山漫興千心一病總消除隨處中原且卜居餘草舜根堪藥裹安流禹治付蒼書枕函帶夢花陰徙釣竹過春篠尾舒霧眼能留臨曲沼桃花雖謝長芙蕖挽烈婦廖周氏五絶冒刃扶姑命軀殘刃折鋩至今荒冢裏贏得血痕香悼亡四首十年前此曉霜天驚破晨鐘夢亦仙一斷藕絲無續處寒風落葉灑新阡讀書帷底夜聞雞茶竈松聲月影西間福易銷成舊憾單衾愁絶曉禽啼生來傲骨不羞貧何用錢刀卓姓人撒手危崖無著處紅爐解脫是前因記向寒門徹骨迂收書不惜典金珠殘帷斷帳空留得四海無家一腐儒柳岸吟薑齋詩集卷四船山遺書五十二衡陽王夫之撰和龜山此日不再得我生秉孱弱不能任耕桑居然消秫稻何以酬旻蒼星盡晨雞鳴東方生炯光良陰無踟躊俄頃收斜陽行行天地間南北各有方步履無定審宇宙空茫茫忮求但自輯尚未足以臧百端苟遏絶暗觸還自戕身心取輕安未免等粃粳良珠固在握胡乃忘吾藏春暄熏百草隨類發芬芳秋氣淨四極一碧涵淸剛春秋皆在斯何為空倣徨積粟太倉盈積步萬里長踸踔而凌越竺氏與蒙莊如彼鳥篆空漫爾矜文章辨説及組繡慷慨登詞場如彼挾策子與博偕亡羊砭心不知痛支體皆隳忘何忍蹈此蹊而更詫豪強關閩有津濟但自理舟航鼓勇未為殊綿綿功在常一息不相續前勤皆巳亡與俗俱汨沒徒為造物傷返念誠自驚斯須分聖狂溪上晚步次間來無日不從容韻溪光空碧淨秋容灼灼斜陽蓼岸紅風日不欺樵徑好江山未換釣竿同難分憂樂雙行裏誰道窮通一夢中不遣希夷酬上古乾初一畫海天雄和白沙胡不思身巳有身桃花柳絮各當春歸除共算三辰日截續無差上古人拔地雷聲驚筍夢彌天雨色養花神他時午夜靑天月恰好金波片影真二粥飯終朝劇可憐無心叢裏有心天髑髏不爽元生意枯稿翻新看火然莫撇孤淸求鳥徑巳知實際厯長年分明饒有中和用不但虛懸未發前為躬園題用念菴韻厯厯有此躬何求而不得即此欲得心分明無疑惑二受來非彼來應去亦不去雲行而雨施皆豫措躬處讀念菴詩次之真靜應知動不消冰霜雷雨總淸霄吹鐙滅影形還在炯炯三更伴寂寥二碧筍驚雷拔地長緑筠玉粉土膏香連踵徹頂無涯畔誰是胞胎祕息方和白沙問天無意更枯蓍不道忘情勝馬龜蒙叟夢中真蛺蝶柴桑枕上自軒羲汀洲杜若香原在海上蓬萊路不疑欲起江門向今日藤蓑珍重釣珊枝二百尺峰頭泛鐵船情知到我卻無緣遙飛靑鳥知難致當頂金烏不易遷一線自循芳草路雙趺直上蜃樓巔勞勞終日心間極池上琴尊笑樂天鼾睡拂拭南窗小榻空緑陰鏬裏紙光紅昨朝狼籍今朝在花自輕飛柳自濃二劈破鬚眉剩脊梁間心不耐更商量朦朧稍見東峰上一片雲飛暮雨香三薝葡胎玉破新函白髮簪花老自慙衝雨摘來安枕上香熏華頂老圖南四挍書如蘀掃難窮且自埋心白晝中為報泉臺舊知己儂非劉向與揚雄亡友文小勇以二子相奬五春鳥過春不肯鳴雨中仍聽兩三聲緑光影裏還飛去驚落殘紅一片輕六詩書放下千端在王霸拈來一點無消受三竿紅日影生成一幅後天圖七白日惺忪賣影新人間原有黑甜春夢中不識邯鄲道記得誠齋煞認真誠齋桂陽朱大中丞英詠懷次韻洪爐片雪陳公甫獨棹中流羅一峰玉露金莖撑九陌桃花流水度三冬江門孤月元無影太極丸春自有容傳與鐵船憑泛海棹歌聲裏儘相逢二不問靑天擬問誰孤琴搖曳動淸脾雷聲偶逐片雲起輕碧無勞過雨疑幾有一漚生舊處笑看新葉發殘枝逢人持此間供具啼笑當前換兩眉三紙窗無縫看靑山也覺秋容不放間瓶水影中莎草岸菱花曲裏白蘋灣他時搖落含春思昨夜蕭淸啓月顏識得金風消息好逢場抖擻試癡頑次定山野馬從來未受羈寒原衰草不須辭殘山殘水誰相問獨笑獨歌且浪為日午睡連淸旦睡白沙詩更定山詩靑霄明月容遲上一卷殘書了更遲二攤書腹內破彭亨不憶愁從何處生天地病深宜我病鬚眉睜後更誰睜醇醪聊借風光釀仙藥無勞雨露耕正自坦然人盡覺敢矜天馬躡空行三溪月溪風太有情不容塵土得分爭乾坤消受無多子今古蕭條第一名夢裏靑山留我住鏡中白髮為誰生爐煙銷盡空香滿脈脈幽心只自評和白沙釣瀨與湛民澤收管詩示唐須竹遙山寫出虛無畫孤笛吹來雪月吟不是逢人難口説湘流淸淺祝融深三門灘感興古今皆效動欲靜勢不遣古今皆效靜欲動功不展乘之有順逆用之有深淺無心即無知有心智復蹇脈脈以持危非言能宣顯二置身雲際觀何為而栖栖延目千秋視所據皆粉齏目力既有窮生年不久稽吾心固可引遙與霄漢齊苟守規中見安能無笑啼三鳴鳶為風徵鳴鸛為雨徵畏風或苦雨勃然而怒興天適欲風雨吾力亦奚能吾適患風雨天心亦奚憑况彼區區者俄然為化乘不知方寸內風雨皆淵冰露坐和白沙不辨香何際回塘有芰荷風來巳良久月上見微波草氣從涼淨星光在宇多韶英吾識汝枯竹有鸞歌月坐和白沙幽篠晚風遲披襟待月癡亭亭有獨坐夕夕得淸嬉休夏聞西竺衰周栖仲尼藕絲非繫縛灰稿亦奚為和白沙中秋片葉聽蕭然何妨素影翩東窗千嶂外玉鏡一輪圓空界原非妄天心巳盡傳明宵隨顯晦墟里上孤煙和白沙真樂吟效康節體真樂夫如何我生天地間言言而行行無非體淸元春鳥鳴華林秋水淸寒淵無功之功微乘龍而御乾和白沙耳目欣浮光不自知其性砂中原含金非天有殊命外取亦甚晳內視還成瞑如彼夜行人思與騏驥競二天下自間間人心長戚戚身為物所持騎虎不得息息之在先幾幾先人不識適燕而南轅終身無返迹三我聞莊定山其心如寒鐵去我二百載淸琴音已絶船山半畝池一泓貯香雪濯髮夕風微長歌弄明月四迢迢開一徑雙足儘登臨密至雲無際明生月有心當前霜岸直徹底碧潭深神禹留金簡居然在嶽岑五蠕息皆吾侶鯤鵬固不交有時冰串釋歘爾淚珠澆酬物唯三徑從天付一瓢空林桂花發何有小山招六此心晝夜至此生天地生雲先膚寸合月到上弦明自昔知無畏隨方受一淸白沙瀟灑處步步踏莎行七無雲天自碧有雲天亦淸在天原不損因爾有雲名一極情無妄六爻變遂成千秋儘合轍莫笑造車輕八江門一空際萬卷且幽尋龍馬誰之迹星河盡此心萍月開池影松風合澗音萬端無彼是中有指南針旅警此曰良可惜純熟尚不舍斷續有異心况我悠悠者巨浪而停舟將為千里瀉惻惻生內慙紅輪西墜也二惻惻保此名踧踧護此生此生何以重此名何以榮無乃隨影動其根若浮萍安得良宵中齁睡而不驚三幸天與我知幸世與我憂知知而憂憂人將為我憂不知而不憂吾將為我愁豈不有我哉云胡不自求四閉戶讀殘書居然有戶牖出門對羣動未必免濡首無曰無知音日月皆針灸徹骨療沈疴焉得辭老醜五辨言終自賊寸心若電耀使自泝源流多端堪內笑請即所笑端捩轉其樞要孤月遊霜空寒林淸猿叫元日折梅次定山韻隨折一枝好淸香破霧新盈盈此天地恰恰正芳春白髮不相負靑陽始試旬殷勤明看汝朵朵玉華真和白沙梅花梅花欲發雪撩之不損淸香一萬枝半點千鈞春氣力看花人似海誰知二花外春光有此梅江城斷岸儘催開寒蜂凍蝶誰驅汝度葉穿花得得來和白沙桃花花到靈雲只一開桃根桃葉隔天台劉郎前度人無恙日日看花不厭來白沙詩只許劉郎一度來為浮屠見聞覺知只許一度之邪説所引據附會其靈雲見桃花不再見宗旨故為駮正之和白沙影從虛出無生響兩段分開覺後迷但識太空都撲滿不容風雨弄天機二雲移隔嶺搖緑草雨過橫塘綻白蓮大造無心誰解此莊生浪説欲忘言為白沙六經總在虛無裏解嘲楊用修譏其墮禪緑其語太迫耳曉日上窗紅影轉暝煙透嶺碧煙孤六經總在虛無裏始信虛無不是無和一峰虛中是神主神者天之妙心者人之主去人而用天我生如鱗羽二神靜物不攖神動心以靡不復知其他禪元但測此三天地既設位人微何以參分明有人主天地不能堪四人心天之仁道心人之仁造物自大德奈何迷我真五不但塵非我光昭亦是天實中是人主珍重一峰傳示兩子一年不遣病軀安此事分明汝輩看不為菜羮須汝出人間第一菜羮難二領我淸狂纍幾分旁人指摘更深文回眸但顧身邊影即爾依依望白雲暑過友人新齋燒燈照雙影兩心在影中影隨燈去留此心滿虛空二駸駸行稻田薰風為誰發知君開軒望縣愁涼吹歇三古人不可知今人我對君有時發狂嗔太和自氤氲四蕭齋臨古甸緑香飛几席一峰太極丸居然自疇昔五飛雨白四峰人如雲中坐此勢不可忘當眉起頑懦六就子請一言珍重言復止如彼冰上行厚薄自知耳讀文中子樂天知命夫何憂不道身如不繫舟萬折山隨平野盡一輪月湧大江流二天下皆憂得不憂梧桐暗認一痕秋厯厯四更山吐月悠悠殘夜水明樓書陳羅二先生詩後白沙飛舞茅龍一瓠埋頭蠅迹莫道我狷彼狂共弄暮天空碧二金牛洞口春色觀生居畔秋聲徹底與君拈出前山雨過雲生和一峰入道門道牖無開闔天閶在寸心琅然絲竹啓不但有淸琴孝友春雲沃中和海嶽深金樞才一轉九折任幽尋和一峰讀書樓竹戶緑光迥疏窗素影幽曲通邀月徑直上摘星樓片字非虛設孤心自泳流陳言皆此日無往不天休和一峰扇和巖世故爭欲暮吾生始試春居然從古哲莞爾笑時人月轉羣山曙鶯啼一苑新老來知此意即次認天真和一峰一覽亭生余當此日滌目掃昏煙掘幸前賢在高居未有邊道香原在鼻銀氣漫熏天顔孔樂何事間遊豈自然和白沙梅花天地機方息此花不暫間斜陽熏蕊破凍蝶飽香還淺水尋猶遠高枝折未難壼天麟髓浹何必問神山和白沙懷古伏羲枕上皇靖節不荒唐澆酒巾猶溼當籬菊巳香雲飛從鳥倦苗長記農祥天地悠悠裏春風正未央和白沙五位一絲七日復六爻全用九三乾江門不賣間風月月白風淸總未然次康節韻質之俄頃仍千歲天心常轉移六龍飛不息三極各乘時有畫皆成象無聲不是希誰將華頂睡迢遞贈庖羲見狂生詆康齋白沙者漫題任爾舌尖學語誰知趺下生根一線經分子午雙鈎畫破乾坤逼窄墨台狹路蕭條原憲柴門天下古今幾許梨花春雨黃昏讀易贈熊體貞孫倩澄宇既滌淸霜欲飛天地居然云胡以窺勿庸遐矚道豈遠而物生必偶心動則奇物無不應心無不幾遇成秩敘否必參差雷風日月載此為儀孰敢自康吉凶不違二油雲在天舒卷不齊隨風而東歘爾還西或飛甘雨或散虹霰君子攸行不害先迷經厯紛糾如取如攜比干殉殷夷吾相齊昏旦殊星燕粵殊蹊移之分寸徙宅忘妻哀哉羣動莫之能稽百草隕芳鶗鴂先啼所以靈氛告爾天倪三自我徂冬元夜其修晨光警曙肅肅衾裯我身則痡我心則悠潛與化尋敢侈天遊遂厯韶春言迄凜秋物不我遐化不我浮俄頃有樞誰云遷流六龍之轡遍乎九州因之致遠抑又何求四大圜如規旦昏各半道樞不留氣轂時轉理隨象宣通於一貫如鏡取影但窺其面坤不外生乾非中竄其去非亡其來非幻屯隱四陽鼎陰未現非有有無唯徵舒卷靜言念之即經為變險易盈虛窮通萃渙豈不我繇何為外眩五文王既沒文其在兹赫赫明明有彖有辭志非所問義著於蓍日不可煬天不可帷宵人竊燭不照鬚眉周道茂草別趨路歧弄方如砌畫圓如規星曆相竄巫覡是師天化地産玩如行碁以謀羮炙以詢淫嬉神所不告覆譏其違修吉悖凶天鑒在斯皇天弗尚吾為爾危六昨日之日為今日先荏苒來兹仰今為緣有象皆後理亦無前華山有叟胎息密傳謂天為後別有先天祕相授受玩弄淸元劃破乾坤符火爭權我無羽翰乘風而仙居天之後奚用此焉雒陽看花天津聞鵑歸之氣數莫匪自然人用以廢天樞不圓采苓首陽其尚舍旃七脂我神輿遊于太虛太虛匪虛充塞無餘火來陽燧水赴方諸水火無間况道之儲薺麥夏成款冬凍舒摩蕩無方各含道腴匪車何軸匪戶何樞六龍並轡互惜其珠行地無疆良哉駿駒哂彼曲學謂之乘除心不可遊道不可拘庶幾夙夜警我頑愚八悠悠我生去日巳長懷我友朋墓草藝黃父兮生我罔極昊蒼莫寶匪命含柔含剛乾龍坤馬厯厯腎腸日用不知雖哲而狂不耕之農蝕彼稻粱崦嵫既迫朽骨空藏亦既邂逅矧敢斁忘荆棘是芟庶顯康莊多言為尤自疚不臧惟抒我忱薦其悚惶示從遊諸子七載相憐巳久如寸心未展祗相於諸君懷玉空彈鵲老漢直鈎儘釣魚大易圈義唯父母上天時物在詩書勿勞載酒詢奇字便草元文亦子虛二千林瀟灑試金風萬里秋淸一夕中正好腰鐮收玉粒不妨停轡看霜紅層層剝筍方逢肉縷縷穿針未損絨欲遣平臯新雨透先將利劍斷雌虹三今人笑古古笑今笑將在口或在心攜杖穿雲雲不惹褰衣涉水水何深他人有夢難代説夜半索枕自幽尋莫擬船山如布穀斜陽高樹認歸禽薑齋詩集卷四終鼓棹二集船山遺書六十一衡陽王夫之撰十六字令元夕見月雪面女耐冷卸羅衣盈盈出爭賽粉香肥搗練子咏愁剛有緒又無端細雨千絲月半彎一寸眉稜千障壓不教人放片時間又咏霜空無際月無痕悄悄盈盈上草根蜻蛚逼窗鐙影緑愁人不道不消魂如夢令春後寒雪不已粟起鏡中珠飽光射窗中花擾消遣一衰翁鯿項縮來欲稿休惱休惱昨夜春山先老又小遊仙一色花飛鶯報五色煙輕雲罩夢裏屢驂鸞只是今生未到誰道誰道只有人間春好又前題天酒玉童斟送秋水小鬟低誦今日與他生一徑瓊壺花動非夢非夢波動月原不動長相思春恨鶯亂飛花亂飛總愛春光去不違誰知春事非風滿扉雨滿扉坐待元禽暮不歸孤雲繞翠微又前題待尋芳懶尋芳褪粉梨花背夕陽淸明未斷霜遊絲長柳絲長欲綰春光春又忙辛夷早綻香又落日海天寬暮煙殘才得團欒對面看還沈山外山人倚闌鳥飛還回首東風一碧寒嬋娟欲上難醉太平冬夜霜楓墜丹風窗送寒心知明月光殘轉牆西小灣巍巍豹關迢迢玉山夢回還在人間聽雞聲夜闌生查子春感梨花一片飛飛落春衫袖莫漫愛餘香春去君知否靑郊驄馬兒浪醉旗亭酒不是不催歸寶鞭在君手又秋感藕花豔銀塘玉露凋零盡素蝶不知愁波影弄金粉飛飛飛不去日暮西風緊為惜白蘋香怕受微霜損點絳脣飛花不是人間定然無個藏春處和風和雨抵死驚飛去暖日晴風猶自難留住天涯路金勒駒驕踏作紅塵土浣溪沙秋感風翦芙蓉墜晚香衝波難認舊鴛鴦秋宵漸永儘思量幾度相逢唯夢裏疑非疑是不端詳鷺鷥空帶滿頭霜又冬景欵凍額黃暈淺檀金罌頰醉半腮丹妬他臨老更芳顏落葉泠泠淸影瘦敗荷翦翦緑雲乾爭教不怯曉來寒又冬望縹渺雲絲展碧空孤峰峰影影孤松天南天北鴈來風極目江山無止竟傷心日月太從容霜楓依舊半林紅又病起春日小步水淺平田碧幾叢出胎初葉翦嬌紅勻勻流柳半溪風小雪去年門外影如今還落少陽中春光不道不從容添字昭君怨友人劉懿菴營虎塘頗勝沒後鞠為茂草賦此寄歎燕壘粉垣香墜螿館蓼花紅碎行人莫唱水東流水西流柳外畫船簫鼓簾外梅龍煙雨當年原倩遣間愁惹間愁攤破浣溪沙病中與劉李二生夜話曾把榆錢買少年少年已是奈何天為憶楊花未落已啼鵑閲盡間愁都是夢不知殘夢在誰邊贏得如今蠶老已三眠又夏景隱隱輕雷挂斷虹平田高下與溪通溪外罩魚人影落波中屐齒泥融雙印直葛衣風漾一襟鬆回看西峰峰外半靑紅菩薩蠻遣愁半生只伴間愁住如今卻待驅愁去歸鳥沒遙天雲橫斜照邊乾坤看一笑愁到何時了拋擲與征鴻霜宵唳曉空訴衷情春景東風亭午擺垂楊絲絲日日長吹落梅花無數不解惜幽香落霞紫暮煙黃送斜陽無憑天氣一霎融和蜂蝶空忙醜奴兒令和李後主秋怨當年誰送江南怨雲樹悲秋舴艋含愁月影消沈玉一鈎無數蜻蜓飛晚照紅蓼梢頭欵欵嬉遊水冷蘋花帶影流憶秦娥蓼花秋江渺秋心獨展幽芳悄幽芳悄護臂紗輕注脣丹小蘆花風亂汀洲繞采芳人遠知音少知音少幾葉漁船一輪殘照又病中寒卧寒無那凍雲乍裂晴難果晴難果紙窗低覷龎眉深鎖年華容易催人過寒威荏苒留人臥留人臥乍夢春生雞聲啼破又前題酸風惡寒梅不管丹楓落丹楓落當年也似梅含朱萼侵窗雲暗晴珠奪壓肌衣重腰弓弱腰弓弱曾聞衰老而今方覺謁金門小除夕年華驟閃閃孤燈依舊半盞春前村醖酒病裏還消受一劒天風孤吼千里暮雲鋪就不惜鏡中人易朽只笑恆河皺減字木蘭花憶舊春溪水滿月嚮桃花香處暖幾葉芭蕉緑影斜侵嫩草苗碧煙日罩遙聽江城歌管閙小步間吟一徑苔陰萬里心又前題江湖短劒醉臥不知誰野店笑傲刀兵月落猿啼客夢驚寒更厯盡孤鴈孤飛棲不穩為問靑天錦瑟誰人續斷絃淸平樂咏雨歸禽嚮暝隔斷南枝徑不管垂楊珠淚迸滴碎荷聲千頃隨波賺殺魚兒浮蘋乍滿淸池誰信碧雲深處夕陽仍在天涯又問劉存孺索香橙秋光已盡月也幽香褪只有霜膏團紫暈仙霧蘭漿深醖小窗讀易初晴藥爐風軟煙輕莫遣先生午睡憑教鼻觀惺惺阮郎歸本意桃花流水紫雲深瑶京路易尋人間何事苦關心匆匆下碧岑才燕語又螿吟飛霜兩鬢侵玉壼鴛語信空沈藤蘿鎖翠陰又前題當年只解愛桃開尋芳得得來仙娥容易許仙才霞裳浪與裁愁弄月怕驅雷繇來非聖胎巫山別有楚陽臺行雲夢不回西江月春日野興草緑黃犉歸晚溪平白鳥飛低小池春藕半沈泥漸近梅酸天氣昨日社逢雨止今年閏放春遲寒深茸母短芽稀未與山厨做美又重過續夢菴殘夢當年欲續草菴一枕偷間無端幻出苦邯鄲禁殺騎驢腐漢幾度刀兵膋血十年孤寡辛酸潭龍齁睡太癡頑欲續衰年已懶鷓鴣天白蓮斂束檀心吐半絲遲回妝靚暗香吹緑窗獨倚珠千淚團扇斜窺玉一規淸露淺碧煙微間心自照鏡光知鹿門漫作無情句月冷風淸欲墜時玉樓春前題媚媚片月涵秋影低照銀塘光不定緑雲冉冉粉初勻玉露泠泠香自省荻花風起秋波冷獨擁檀心窺曉鏡他時欲與問歸魂水碧天空淸夜永一翦梅春晚妬花風雨在花前開也堪憐落復何言愁魂斜軃淚珠懸弱蒂難堅紅影難圓何事迷香雙蛺蝶浪向東園魂夢相牽誰知不是養花天試聽啼鵑春在誰邊蝶戀花衰柳為問西風因底怨百轉千回苦要情絲斷葉葉飄零都不管回塘早似天涯遠陳陳寒鴉飛影亂總趁斜陽誰肯還留戀夢裏鵝黃拖錦線春光難借寒蟬喚粉蝶兒咏霜問天涯有幾多寒情冷緒怕春來遊絲飛絮更因風黏住了江天紅樹弄輕盈勾引教飛去悄不知小橋西荒雞催曙月斜時揉碎一天珠露苦恁將酸風勒住儘淒涼拚與寒鴉低訴醉春風咏蝶紅影紛無數偷眼斜回覷闌干十二繡簾垂住住住亂蘂繁花熏人無奈非儂留處緑影輕風度芳草天涯路翩翩淸夢自逍遙去去去縱使飄零依然不似輕狂柳絮風中柳水桂不惜輕盈取次濃妝珠蘂似憑闌緑雲倦倚低鬟微笑噴蘭襟香細斂幽情間心如水道是江妃還似月中仙子向秋淸露凝芳髓冷然孤秀怕微霜風起索細挽柔條重覷靑玉案秋海棠雕闌玉露凝珠屑長只恐芳魂折日暮碧煙相護切翠鬟低軃胭脂淡染了不愁孤怯含情靜解丁香結淺笑偷窺淸夜月自惜斷腸誰與説金風蝶困歸雲燕去唯有寒蟬咽行香子遊珍珠巖流水淙淙澗草茸茸轉蒼灣午日霞烘赤城圍玉紫蓋擎空試問仙翁今何在絳雲封芒鞋幾兩靑山踏偏乍桃溪一曲相逢平田下望霧靄煙濛誰人知我極遠目送歸鴻江城梅花引病中口占示劉生和鐙和影一雙雙耐淒涼儘淒涼天也難教病骨老來降還欲其天爭旖旎空碧裏弄輕狂競飛霜飛霜飛霜夜何長有難忘自難忘夢也夢也還認得煙水微茫待把疏星斜月與分張一葉暗飄風不定飛去也儘飄零在回塘碧芙蓉闕題風定小窗明半睡初闌雙眉乍展追數餘寒浪過春半花有恨一枝不穩柳如人三眠巳倦莫更惜幾日韶光催取玉礬香滿還愁輕暖處更一絲雲繭橫掠山腰雖則暫時消散怕黃昏玉繩低挂又參差碧綃斜捲靑天如夢倩取百囀啼鶯喚滿江紅藤蓑詞一幅藤蓑遙領取江門風月釣竿把孤舟獨泛滄波噴雪倚棹騰騰吹笛去衝風直犯金鼇窟有些些間事不關心同誰説鐙一點漁歌歇天一碧歸禽沒買村醪自酌醉梳華髮撲岸蘆花飛已盡鴈聲不呪西風劣又何妨拳足橛頭中霜衾鐵天香餘冬雪霽念早梅應開病中不得尋訪悵然有作霜薄含冰雲輕弄雪未遣珊珠紅褪夕塢回塘誰借問早把瓊心幽醖也應待我嚮月下微吟相訊自惜自憐孤影半吐半垂淸暈來時早鶯啼破幾點點玉錢緑襯便與尋芳已晚粉殘香損猶自不成辜負卻只恐東風垂柳困夢裏依然蝶魂相趁鳳凰臺上憶吹簫憶舊楚塞天遙灕江雨冷煙雲溼透征衣指數峰殘雪候鴈先歸堪歎生生死死今生事莫遣心違家山裏一枝棲穩碧草春肥依依舊家枝葉夢不到峴山風雪霏微念鏡中霜鬢人老漁磯指點棠梨春雨猶應化白蝶雙飛孤飛也寒煙羃䍥鐙火荆扉滿庭芳初夏顆顆梅珠條條菖葉不須更怨春歸垂楊風軟練鵲一雙飛自愛芳塘素影與波光上下爭暉間日永新來病淺相賞莫相違當年還似此年華雖老不道今非問靈均去後誰翦荷衣日暮輕雲凝緑遙天回笑揖湘妃還應有芙蓉出水妝點釣魚磯念奴嬌松影擎雲縹渺有五鬛仙姿憑誰細數半頃黃茸茵藉軟移上素琴冰柱縷縷絲絲斷紋交映細寫雙淸譜疏光逗漏幽香幾許暗度一霎雲散西淸遲遲送上到回巒高處垂靄霏微深黛轉似把歸禽低護霧冷山空一枝斜閃猶在尋香路夕陽易沒輕陰且趁歸去又柳影半塘春水早光透玻璃緑鬟倒軃曲岸苔平鋪徑淨還惹晴風輕簸葉葉衣涼垂垂佩委碎翦緑陰破柔情不定翠眉偏映雙鎖為問庭院沈沈畫垣幾曲卻放春愁過巷陌斜陽偷送出欵欵碧煙縈裏亂點征衫橫拖玉勒似惜垂鞭墮猶愁未穩黃鸝更著一箇又竹影紙窗僧院記溼雲初散秋山如洗繚繞茶煙輕裊外荇藻淡生空水簷雀低飛松鼯偷竄欲壓還扶起蘭風微展泠然斜軃仙袂不道活現金身尋根撥葉問幾莖疊翠斷續晴嵐飛片片總入虛澄鏡裏題字遮殘疏櫺界破厯亂毶毶尾間心窺破闌干何事重倚又梅影香魂近遠卻早離枝上暗黏芳草為惜淸姿全似水幻作碧膏籠罩側墜蜂鬚半凋珠顆非被冰霜惱侵階零亂素痕未許人掃遙想萼緑仙姿繡妝翦綵那似晴光好斜轉回塘淸淺裏脈脈相看微笑凍蝶低飛疑非疑是無奈陰寒峭暄風動後濃陰任遣鶯鬧又鴈影關河迢遞恨塞日昏黃難傳標格沙淨水澄淸徹好點點蕭蕭厯厯曉鏡修眉淸波皺影淡寫層層碧分明瞥見孤舟莫弄漁笛貼水浴鶩爭飛凌亂波紋未放千雙直風裂雲痕開夕照還與蘆花相即野岸霜前南樓月下應恨無人識曉來無據教人空望天北又蝶影紈衣試暖乍圓印苔錢旋添花暈藥徑日高風力軟細逐落花低隕微掩香鬚別裁黃袂金粉應初褪雕闌重疊玉階未遣全認小院午睡方醒扇羅乍覷似撲芳魂損側轉忽如秋葉舞又向碧紗窗隱垂柳參差紅芽掩映夢也無憑凖殢人憑檻凝眸無那嬌困又雲影層巒飛映似縹渺神山因風離合簇簇靑蓮輕度過卻繞孤峰三匝極目空明遙天無際瑤鏡微籠匣平沈遠樹翠光略吐尖甲曳仗間倚亭皋微飇下拂便涼生一霎荷芰半塘新緑暗忽染素羅輕夾回首吾廬午煙遙接一幅靑綃裛數竿修竹鳳梢還與低壓又波影晴江春曉但搖曵落花溶溶東下誰送素綾千皺褶直上畫簷鴛瓦鏡面回鐙月輪浮雪一色飛光下遊絲婀娜吹來似欲相惹一霎汞走珠流應有漁舟蘭棹縱橫把迸散一天星斗亂不覺銀河西瀉驚碎還圓輕勻稍淡移向荼䕷架日高風靜瀟湘依舊如畫又簾影鶯啼報曙早驚覺繡帷星眸欲炫起看瓶花香漸噴的皪深紅如顫衣翦輕羅參差三五恰透冰肌現叉光閃爍翠鬟怕有撩亂恰好細數湘紋無端攪動奈飛來雙燕還憶夜香燒罷後妬殺玉蟾光滿何似疏筠半籠曉色一儘來回便簷陰未半銀鈎且莫高捲又帆影西風落照看渺渺滄洲煙波無際一段輕陰相趁轉不許蘭橈驚碎略帶神鴉時飄蘆葉曲映江楓紫憑遮客鬢怕教照見憔悴有人獨倚危樓沙際遲回疑是歸舟繫已過輕鷗飛起處不見旗悄燕尾蕩入中流斜侵隔岸依舊縈沙嘴回頭北渚唯餘塔影孤峙又影戲影笑啼俱假但綽約風流依稀還似半壁粉牆低映月賣弄佳人才子情絲牽引淸光回照漫道傷心死猛然覷破原來情薄一紙應是縹渺飛仙當年竊藥落在銀蟾裏半面人間高處望傳與霓裳歌吹有意留仙難禁夜短還怕鐙花墜迷樓吐焰倩誰挽住香袂又走馬鐙影炎光未謝競的盧飛躍爭先赤兔才轉危坡還注坂橫戟無心回顧汗血追風怒髯奮臂總被流光誤暗中轂轉蟻磨幾時停住兒童莫笑來回半針尖裏走英雄如鶩終是蝦跳難出斗漸有荒雞催曙五夜光殘一絲氣冷敲罷邊腔鼓勳名半紙無人重與偷覷又薑齋影衰病彌月一切盡遣擁火枮坐心無所寄因戲作諸影詞引半縷活氣令不分散孤鐙下忽見婆娑在壁因念人知非我之無彼不知非彼之無我也留連珍重旋與評唱一闋孤鐙無奈向頽墻破壁為余出醜秋水蜻蜓無著處全現敗荷衰柳畫裏圈義圖中黑白欲説原無口祇應笑我杜鵑啼到春後當日落魄蒼梧雲暗天低準擬藏衰朽斷嶺斜陽枯樹底更與行監坐守勾撮指天霜絲拂項皂帽仍黏首問君去日有人還似君否永遇樂紙窗日影籠月雲輕開萍水碧問還似否落葉旋飛鴈聲空度未計間情生受乍暖熏肌殘紅上頰睡眼半醒相逗卻猜疑荔枝初剖紫暈冰綃微透鏡匣斜開枕䀶淡染粉面如中卯酒含笑迎眸回光相映應念人消瘦乳雀低飛嶺雲橫度巳怨暫時僝僽更只恐午夢將闌未許偎人長久惜餘春慢本意似惜花嬌如憐柳懶前日峭寒深護從今追數雨雨風風總是被他輕誤便與揮手東風間愁拋向緑陰深處也應念曲岸數枝新柳不禁飛絮爭遣不燒燭留歡暗邀花住坐待啼鶯催曙怕燕子歸來定巢棲穩不解商量細語未擬扳留長久乍雨乍晴繇來無據待荷珠露滿梅丸黃熟任伊歸去沁園春渾天毬黍子勻黃吉貝銜絨莫問因誰但既在於中自堪細數未超其外不得旁窺暗去明來偷寒送暖無情還作有情癡相憐甚教碧綃簾幕翠擁珠圍知恩今古人稀猶自把雙鐙照路迷更劃斷鴻溝不隨轂轉調成玉律一任淸吹綵縷交縈金梭互擲珍重天孫織錦機莫辜負聽毬門簫鼓對打爭馳摸魚兒咏霜向深秋蘆花風起吹散一天珠露六銖仙袂新裁薄翦落冰絲千縷輕盈舞還只恐素娥鏡裏深相妬欲留教住奈晴色窺人斷雲送暖驀地催歸去更誰念暗壁吟蛩正苦遙向征鴻低訴平沙野水朦朧影難認白蘋香處春期誤卻早遣啼鵑血淚霑江樹暝煙休護又何似明朝天低日淡散作蕭疏雨又辛幼安傷春詞悲涼動今古惜其蛾眉買賦之句未忘身世為次其韻以廣之總繇他間愁不管才來又還催去悠悠一派東流水載得落花無數人長住卻笑伊來回奔走天涯路憑闌無語終不似黃鶯苦愛東風百囀迎人絮今古事莫待怨誰相誤可但月來雲妬傷春未已傷秋賦重倩吟螿寒訴瓊花舞又早見玉山瑤井填黃土無為自苦待人散月斜日長山靜儂自有歸處又辛詞煙柳斜陽之句宜其悲也乃尤有甚于彼者復用韻寫之向西園花飛一片早已傷心春去殘紅落盡更如今難把流光追數留不住征鴻影黃沙紫塞秦關路從誰寄語道有人獨對雨打梨花看黏泥飛絮倩流水欲覓芳蹤還誤津頭風雨深妬凄涼庾信江南賦難向無情天訴為楚舞流不盡楚歌血濺陰陵土寸心知苦望萬里荒煙一蓑漁艇渺渺無歸處賀新郎上巳前一日雪春自無愁耳笑無端一枝淺絳半林新翠便擬東風相寵惜暗約柳絲縈繫喬相賺落霞片紫斜日煙籠沈海底早蛟風亂翦雲皴碎鮫淚冷彌天墜寒澌漸結流觴滯便拚得蘭亭休賞龍門堪醉糝徑不遮春草緑略染西峰螺髻刪不了朗淸天氣乍與碧桃爭粉素奈鉛華俄頃成流水今視昔應如是多麗別恨悄年華偏是流光難擲夢回時分明眼底離亭楊柳初折渾相忘金微路遠與扳留靑組珠勒天涯何處漫生芳草歸來珍重怕逢啼鴂重思省元來是夢生死關河隔今生永迢迢良夜如何拚得祗當年華鐙影裏鴛鴦繡帶輕拆怨落花浪隨流水消盡西園舊春色孤館黃昏雨絲雲片蒼苔滿地無人迹問靑天何意留住孤鸞隻教空辜負當年無限山海恩德哨遍廣歸去來辭蘇于瞻櫽括歸去來辭陶公之餘潘也吾自有大歸大去而大來者為期未知遠近然知遲遲之不如接淅久矣因借其韻以自抒己懷一領靑蓑一柄長鑱也是間牽纍歸去來何處可言歸舊家山目前即是知者稀誰堪就問津路莫將黃葉迷童稚憑冷覷春花間看秋月蒼天伎倆止此笑乾坤兩扇半開扉任柳絮穿簾撲面飛既不黏泥自然輕脫唯吾之意噫歸去來兮縱橫萬里人間世嚼匢橄欖來回甘苦知味弄二月輕雷散一天暮靄傾倒銀河香水釀就蜂蜜驚回蟻夢丈夫當如此矣昭昭白日亭午時駕玉虬停驂一問之向虞淵可容轉計燭龍今在何處料也難酬答但斟北斗天漿滿斚恣我花前沈醉歸來斬盡一團疑胡不歸漫留止搗練子咏霜孤月上夕風微忍得寒生玉粟肥征雁千雙空裏過可能帶得向南飛憶王孫本意蘆花誰覆釣魚船寶玦藏腰未敢言落葉驚烏月上弦夜如年春夢無人與再圓又蜂投窗紙掇遣飛去戲祝之寓意白雲送望轉霏微別徑人間去不違好逐桃花一片飛阮郎歸莫問天台路是非如夢令寫恨恩重玉簪金管愁盡玉魚金碗莫道只今生萬歲難消春恨淚眼淚眼題顆零零珠串又春閨拋郤瓶花蒂軟坐待盤香線斷不見也還休門外鶯忙蝶亂誰捲誰捲一軸畫簾銀蒜長相思石榴蕊珠宮碧霞封風裂雲䀶一線空繁星數點逢素綃重隔簾櫳丹荔新餐玉液濃楊妃病齒紅生查子咏史長平十萬人一夜秦坑殺魚死濁流中不祭乘時獺死坑未是愁唯有生坑惡眢井埋蟾蜍欲跳只三腳又前題沙中奮一椎飛影不知處知非賭命場不下千金注蒲山電眼兒約略知其趣豪氣未能降長揖關朗去又前題千秋銅雀臺腸斷西陵妓誰念故園空豆􅛌含胎死淸漳自東流粉黛愁難洗分得餘香歸驕殺邯鄲子又前題靑衣抱玉觴獨嚮蒼天哭天有無情時厯亂雙鵝撲杜鵑啼不休商陸子難熟流淚一千年血迹西臺續又前題阿姨罵不瞋為怕鸚哥罵貓兒殺鸚哥才卜歸魂卦堂堂靈隱僧桂子香淸夜五字萬年碑竟是誰天下又前題龍鳳是何年人間瞞不得空谷無人行且喜似人迹可憐松雪翁不惜天水碧馬腹君自投芳草嘶南陌浣溪沙桃花初破靈砂顆題肥緑煙輕繞護霏微晴烘休漫怕丹飛結子他年千歲熟如今剛半過春暉莫教輕放阮郎歸又前題春恨拚教柳帶長朱顔貪耍醉霞觴臨風臨水笑雙雙欲洗兒容爭采摘郤隨蝶夢儘飄揚愛他嬌艷奈他狂又李花前日氷花萬樹飛晴風初解曉寒威誰鋪瓊蘂更霏微卻怪乍來雙燕子涎涎尾掠素光肥應如雪夜待人歸又前題流水前灣曉鏡淸粉香玉潤素綃輕欲邀月姊伴飛瓊不可久留仙佩冷天桃爭賽妬顔頳江梅殘夢正相迎攤破浣溪沙偶興為訊南朝燕子飛人間何處有烏衣不是舊家庭院也爭歸低啄絮泥防易落不知疏柳墜殘暉還與一雙蝙蝠傍簷飛謁金門示意有授幽緒悄欹枕夢回分曉俯仰乾坤霜月皎此際愁多少欲洗長空天杳袖裏靑虹光裊相倩一揮雲漢表莫打間之繞玉樓春歸鴈秦關楚水天涯路唯有歸鴻知住處經時巳換蓼花洲依舊難忘芳草渡南天回首蒼煙暮寄語元禽歸也誤垂楊千樹亂啼鴉誰聽呢喃淸晝語一翦梅答須竹所問北海殘碑數字傳前日烽煙今日蒼煙湘靈鴈柱鼓湘川欲扣淸弦還恐驚弦間心遙寄水雲邊莫問湖天自有壺天忘憂春暖錦堂萱好種芝田且看桑田李北海嶽麓碑為野火燒毁嘉興呂帥濓拾十數字于芳草中今更不知在否臨江仙水仙花道雪無香都不是峭寒一點春融昨宵煙月水涵空粉肥略滯影緑弱不禁風遙與碧窗人似玉檀心深鎖重重倚闌初日照憨慵春纖珠串墜仙袂素羅鬆蝶戀花候雁不至曾倩歸飛雙燕子換取賓鴻來渡瀟湘水雲綿烏絲闌畫紙素綃好寫關河字斜日寒鴉飛接翅為底迷留白草黃沙地搔首問天天似醉南樓霜冷丹楓墜漁家傲翠濤作煨榾柮詩索和以詞代之爐影圓紅煙尾曵湯瓶漸送松聲碎不是村醪無米兌難成醉酸風昨夜新傷肺靑鏡古今多少淚無緣卻嚮寒崖墜明月在天霜滿地愁也未兩莖鐵脊舒腰睡又前題薄日漸消霜徑粉荷鋤細把枯株認惜取山􅈨休蹙損春事近香風遣透幽窗噴橡斗藤花誅已盡杜鵑無蘂盤根穩劚得歸來剛一畚煨教燼明年莫更啼春恨又前題雙髻峰頭千樹縞輕鬆鍾乳玲瓏罩相聚團圞圍土竃愁欲倒而今郤憶愁時好不怨融和春不早春雲怕障邯鄲道舊夢不成人愈老流鶯惱憑誰喚醒粘天草又前題鵓鴿桃紋干煉熟棗膏胡粉和香築鳳翅狻猊填綘緑紅光簇貂璫門外神茶矗殘夢京華難再續空山雪子埋牛目幾橛枯株鷹爪秃誰人斸跛奴運斧還傷足天啓間大璫㨶炭和以棗粉作門神雕鏤精巧爇立門側又前題殘火星星容易灺鹿頭虎爪相撑架漸次囫圇低復亞難消夜憑誰細數興亡話正閏參差王與霸妖狐也把骷髏挂肉餡饅頭人甕鮓都休也獵人不怕猩猩罵又前題膏膩孤鐙花蘂褪寒灰漸縮霜絞印坐待一絲紅影燼眠不穩梅花夢也無憑準十九年來氊齧盡歸鴻望斷長安信莫歎蘇卿霜染鬢渠非困多他一倍還添閏訴衷情近秋望遙天一碧回望西飛白鳥乍臨鏡水搖空又嚮蓮峰弄影風起素光斜映薄袂蕭清悄覺涼襟迥雙眸炯今古寸心孤另亭臯一葉墜響楓林靜還重省間愁元鳥歸遲幽緒藕花香冷夢到今宵永金人捧露盤和曾純甫春晚感舊韻古嵩臺雙闕杳無蹤憶潮平細浪熔溶龍舟渡馬依然先帝玉花驄衝冠髮指旗揮星落血斬蛟紅怨蒼梧班管淚沈白日瘴雲中更背飛孤影飄蓬今生過也魂歸朱邸舊離宮苔殘碧瓦鴛鴦碎蔓草春風驀山溪聽雨間拋數點似灑無情淚一晌悄無聲儘教疑輕狂調戲山溪驀度更不許人猜渾似醉全無謂濫簸銀河水元雲空膩無力支天墜荷蓋小亭亭應難留得琉璃脆孤鐙昏閃瘦影未分明愁不寐情誰繫夢也心魂碎八六子花朝夜窗中見月蕩春寒一輪娟娟初上煙暖雲柔奈鐙穗影含金粟藥罏聲泣寒螿淒然似秋無端還與綢繆幾線疏櫺界破半襟白夾光浮想溪外梅花低垂瘦影斜窺流水香魂欲絶應共我遙嚮素蛾寫怨靑天碧海悠悠不禁愁滅鐙擁衾去休滿江紅直述淚冷金人渭城遠酸風痛哭君莫笑癡狂不醒口如布榖墮地分明成艮兌通身渾是乾坤肉耿雙眸黑白不糢糊分碁局千鍾粟誰家粟黃金屋誰家屋任錦心繡口難忘題目為問鶴歸華表後何人更唱還鄉曲把甲辰堯紀到如今從頭讀又寫怨離亭人散折不了柳絲垂緑儘桃花飛盡故枝緣終難續鴈影更沈湘岸月鵾弦誰奏燕臺築只空山剩得老靑蓑掘黃獨汗靑照文山福紫芝采商山祿但荒草侵階修藤覆屋井底血函空鄭重知音誰與挑鐙讀問杜鵑何日血啼乾商陸熟又家兄傾背後諸君見慰重疊恤其衰病有踰量之奬含淚作此答之丁寧千遍教綰住一枝飛絮奈伶仃孤燕歸來黃昏自語縱使長條堪繫馬栖鴉風冷斜陽暮問前時流水繞桃花今何處漚已散難重聚鏡已破難重覻聽子規喚道不如歸去他日天台花再發人間自有劉郎遇便癡迷蝶夢不教醒終無趣掃地花憶舊微霜碾玉記日射簷光小窗初透夜寒深否問素羅新裁尉須銅斗間攬書帷笑指硯冰蹙皺香篝有黃熟篆銷芳膏結紐自惹間愁後對蓮嶽雲壓苔潭珠濺罏煙孤瘦歎渺渺京華不堪回首碧海人歸雄劍誰憐孤吼空凝望繞湘流暮雲荒岫水調歌頭驚夢昨夜喧雷雨一枕血潮奔千紅萬紫撩亂浪喚作芳春大抵白霓嬰茀更有玉蟾偷藥驀爾弄精魂寶劍在儂手閃霍動乾坤儘今生梨花雨打黃昏厯厯悄悄山寺鐘聲曙色分待我鐵眉刷翠罩下金睛點漆彈指轉晶輪十里杏花發人道是樣雲燭影搖紅十月十九日瑞靄金臺瓊枝光射龍樓雪羣仙笑指九閶開朱鳯翔丹穴雲暗鴈風高揭向海屋重標珠闕彩鵷飛舞日暖霜輕小春佳節迢遞誰知碧雞影裏催啼鴂驂鸞不待玉京遊難挽瑤池轍黃竹歌聲悲咽望翠瓦雙鴛翼折金莖露冷幾處啼烏橋山夜月雙雙燕除夕憶家兄荒山百里想殘雪初晴應同消受莫還似我祇共寒罏相守重疊山河冷淚更夢對團圞春晝讀書帷裏華鐙獻壽堂前椒酒辜負當年人説道仙苑芝英一時三秀山移海涸別是人間花柳還聽金雞玉漏怕天也妬人長久但念今夕相憐莫問明年健否解語花鴛鴦梅羅浮月下豆蔻胎中許結同心侣漸啓朱唇含淺笑不倩緑衣歌舞暄風疏雨紅袖斂芳心自吐一雙雙永不分離何事還含醋照影銀塘低覻向香泥玉藕暗中增妬彩禽欲唼還應惜自趁桃波飛去緑陰深處儘拋與多情細數不差池三十六雙作宜男繡譜綺羅香讀邵康節遺事屬纊之際聞戶外人語驚問所語云何且日我道復了幽州聲息如絲俄頃逝矣有感而作流水平橋一聲杜宇早怕雒陽春暮楊柳梧桐舊夢了無尋處拚午醉日轉花梢夜闌風吹芳樹到更殘月落西峰泠然胡蝶忘歸路關心一絲別罣欲挽銀河水仙槎遙渡萬里間愁長怨迷離煙霧任老眼月窟幽尋更無人花前低訴君知否鴈字雲沈難寫傷心句薄幸午睡覺問渠當年是你兜攬下箇儂來此更不與分明道止競如何安置但隨流蕩漾雲䀶歸鴻水底成人字便俐齒嚼空金睛出火都則不關渠事但惜取剎那頃忍不得秋瓜藤墜逗殺人為霜禁冷為風禁淚鎮柳絲輕擺搖春水到曆頭垂杪半酣不睬難驅使無端薄幸付與烏鳶螻蟻望梅憶舊如今風味在東風微劣片紅初墜早已知疏柳垂絲綰不住春光斜陽煙際漫倩遊絲邀取定巢燕子更空梁泥落竹影梢空才栖還起闌干帶愁重倚又蛺蝶粘衣粉痕深漬撥不開也似難忘奈暝色催人孤鐙結蘂夢鎖寒帷數盡題愁錦字當年醖就萬斛送春殘淚沁園春翠濤六每句戲用彩色字步碧蘿灣尋紫芝英壽翠濤翁忽逢赤松子赴靑女約染千樹緑作小春紅微啓朱唇笑余白髮黍米丹砂豈未逢若會得則翠濤偕爾穩住絳雲中蔚藍天色淸空但淨洗黃塵即閬蓬看漫天黑瘴徒然黮􅩙當頭皂帽自許從容素書宵授元文密印彤雲原自護雛龍憑寄語展雙眉黛鎖霜老蒼松賀新郎寒食寫怨綿上飛烏恨更龍蛇追隨四海一時驚散回首五雲金粟地不見玉驄珠汗但撲地蒼煙撩亂酒冷餳香休道也夢石泉槐火成虛幻棠杜雨離腸斷嶽雲回望蓮花巘儘淒涼延陵十字難酬幽願昨歲杯漿澆淚後拚付寒螿莎館正夜雨松杉緑滿一徑蒼苔行迹杳想鵂鶹夜哭鼯鼪竄寸草盡春暉短鼓棹二集終鼓棹初集船山遺書六十衡陽王夫之撰船山鼓棹初集十六字令落花影落花影欵欵映春江終相就貼水不成雙又前題落花影風颭小橋西掠素夾疑是染香泥搗練子晚春雲似夢雨如塵花淚紅傾柳黛嚬也算人間春一度明年莫更不還人如夢令本意花影紅搖簾縫苔影緑浮波動風雨霎時生寒透碧紗煙重如夢如夢􅑯殺春光調弄又前題如夢花留春住還夢春隨花去一片惜春心付與遊絲飛絮無據無據不覺夢歸何處長相思本意寶刀分寶叉分繡帶分開墜畫裙餘香猶自溫錦鴛羣野鴛羣三十六雙認得真旁人莫漫嗔又前題不思量也思量密語何曾得話長驚鴻夜渡湘真成雙假成雙儂似蓮心苦薏藏憐他菡萏香點絳脣牡丹春未分明覿面始知韶日曉朱凝粉裊費盡春多少人在緑窗􅝰影朦朧繞碧天杳瑞雲回含錦襭空靑表又前題不道人間消得濃華如許色有情無力殢著人相識閲盡興亡冷淚花前滴真傾國沈香亭北此恨何時釋又月桂蟾館飛英隨他月在秋長在凍雲如黛幻出香嚴界曾訂靑娥有誓深如海春光改淸芳縹眇還與山礬賽山礬一名春桂又碧桃碧海凝霜問誰喚作春光住緑煙輕處月染幽香聚縹眇雲魂舊厭霓裳舞天台路山空月冷不管劉郎誤又矮桃絳襭盈盈墻頭怕惹遊人顧幽情誰訴芳草萋萋處燕眼偷窺早倩緑雲護勤囑付低飛蛺蝶莫惹香泥污女冠子賣薑詞余舊題茅堂日薑齋此更稱賣薑翁非己能羡聊以補人之不足爾戲為之詞且賣且歌之賣薑來也誰是能酬價者不須慳老去絲尤密酸來心愈丹垂涎休自悶有淚也須彈最療人間病乍炎寒又慈竹蕭疏不可簇簇緑煙深鎖一枝枝乳鳳梳翎細遊鱗蛻甲遲天高難借問風橫怕相欺且自團圞住要誰知浣溪沙山行曲曲屏山翠幕垂啼禽不揀淺深枝逗人斜轉竹林西緑玉竿柔愁露浥翠煙葉密耐風欺溪光一半染玻璃又過熊男公夜話炊稻煙闌煮笋香溪流縈岫半斜陽間宵不覺翦燈長魚計向春元得水蝶魂入夢不驚霜無勞濠上訊蒙莊又即景幸草猶餘幾段殘燒痕斜插野雞斑灰堆無數米家山雙眼矒騰疑夢覺一天晴雨兩闌珊不愁也索帶愁看又望歸雁病眼遙天認不真一雙雙影未全分空花搖曳亂春雲香篆欲消拖蘲尾平波初皺起魚鱗烏絲闌染素箋紋霜天曉角懷舊平湖春水日落扁舟艤話到傷心深處雙淚落靑樽裡天不留愁緒拚遣愁人死剛有一絲春怨又花落鵑聲止菩薩鬘早春梅花綻錦催寒去霜花鋪粉留寒住去住兩悽然衰翁惜歲年燒根紅茁草巳報春生早莫惹曉鶯啼啼時花亂飛添字昭君怨秋懷誰染千山烏桕欺殺一株衰柳微霜何似鏡中霜萬絲長蠟屐從今幾兩冰級當年屢上夜闌星漢耿淸空挂殘虹又春懷茸草偏生南浦桃葉半遮芳樹東風何用苦相催緩緩來剛倩柳綿黏住又被落紅勾去麟洲聞有返魂香海天長減字木蘭花冬盡煙籠殘月遮屋五更霜似雪小愛東窗逗漏玻璃數點黃梅風疏緩凍蝶乍蘇幽砌暖生怕春生生雨生風困早鶯減字木蘭花春怨落花飛絮只有間愁吹不去雨雨風風消受殘春一夢中蒼煙碧靄一望迷離天似海燕燕鶯鶯儘説離愁話不成憶秦娥鐙花心未冷娟娟還弄斜陽影斜陽影半點紅輕一天煙暝殘香猶裊金猊鼎淚痕微映鴛鴦枕鴛鴦枕如何落去孤衾難整從不作􅝰詞以鐙花止載得底語妄人説理可憎又前題殘膏少零紅難待春宵曉春宵曉灰飛無迹更誰弄巧朦朧睡眼微縈繞疑無疑有幽光小幽光小破鏡寒輝死螢殘照浮屠作鐙花詩其自謂妙悟之供狀也以此為爰書淸平樂咏螢夕風乍定冉冉穿芳徑曲沼欲尋鴛侶並郤是伶俜孤影來回柳岸苔陰不知露冷更深幾點殘星未落一彎斜月初沈又嫩柳霏霏屑屑略上些兒色斂盡翠眉剛半纈應是春光不徹未妨雨細寒輕緑波淺映盈盈更著一分螺黛和煙綰住流鶯西江月俗到處凍膿絡索逢人呵閜謰嘍無多弊摋總酸餿罯得英雄漚傝􅼾幾分即澑郎當一味鼾齁砰訇浪裏囫圇遊誰受㒼干僝僽呵虎可切閜火雅切謰嘍讀如連婁弊摋莊子注音跋撒今祁陽人呼零星物事為八撒應即此字漚去聲浼音耨傝􅼾或作沓颯㒼干或音作衎干音南鄉子留別家兄老去別堪驚日暮長亭亦短亭鏡裏朱顔唯夢裏惺惺刺柏堂前一字行此去更無憑藥餌誰扶瘦骨輕望斷嶽阡魂縹眇伶俜萬疊煙波兩葉萍鷓鴣天劉思肯畫史為余寫小像雖不盡肖聊為題之把鏡相看認不來問人云此是薑齋龜於朽後隨人卜夢未圓時莫浪猜誰筆仗此形骸間愁輸汝兩眉開鉛華未落君還在我自從天乞活埋觀生居舊題壁云六經責我開生面七尺從天乞活埋又藤蓑詞藤蓑白沙隱服籊籊江門舊釣竿如今落手儘淸間鱗鱗三六雙雙鯉厯厯千重疊疊山斜月落曉霜殘藤蓑耐得一江寒橛頭信水亭亭去鯨浪驚雷午夢安又前題拾得藤蓑挂破船蘆汀柳岸兩悠然曈曨海日生殘夜爛漫江春入舊年霞散綺緑飛煙儂家何處不靑天星辰濫摘從人買只索苔陰數顆錢又前題不唱江門舊棹歌人間今古有藤蓑况逢木落天空後奈此風淸月白何穿衰柳度殘荷一行白鳥掠淸波孤吹鐵笛騰騰去驚落殘花罥女蘿又前題雲自垂垂水自流藤蓑晴曬釣魚舟蓼花雙映迎紅粟鷺影斜拖顫玉鈎從闡緩儘摟搜丹楓葉落不關愁間愁只為多愁客鏡裏狂尋頭上頭又前題藤蓑別樣有新裁不打江門舊譜來自憐艇子容雙槳不羡鱸魚有四腮帆已挂柁頻開掀濤拍岸且徘徊涪翁漫道風波險似此風波亦快哉虞美人落花柳風催送橫天雨自是難留住更無消息教人知不解一宵驚去定因誰香膏釀出紅芳密費盡東風力到來無緒戀東風為愛半溪流水暖溶溶臨江仙山礬瑒花也一名春桂或云唐昌玉蕊即此本是玉瑒天上種幾時還駐雲軿檀心粉頰兩盈盈香迷雙嫩蝶熏惱一林鶯手折一枝相借問何如蟾闕秋淸東君著意更殷勤朦朧煙月暖駘宕柳風輕蝶戀花早秋落日靑空分燕尾一片殘雲猶作孤峰紫翦翦白蘋風歘起藕花露滴淸波裏為問貼天雙燕子底事能忘辛苦春前壘回首垂楊無限意無情也應悲秋死又春景薄日蒸雲光影碎白靄濛濛罩住春山睡一樹梨花輕霧裏玉山斜倚冰綃醉半吐山礬香孕蕊小步尋春好了鶯花事莫待楝花花信至子規難挽東流水醉春風遣病未了遊絲債莫被浮雲礙雞聲厯厯曙光微在在在月挂西樓風輕柳岸虹垂天外但遣愁城壞不怨霜荷敗情知臘盡雪須消耐耐耐未必他生還如今日長年禁害靑玉案憶舊桃花春水湘江渡縱一艇迢迢去落日頳光搖遠浦風中飛絮雲邊歸雁盡指天涯路故人知我年華暮唱徹灞陵回首句花落風狂春不住如今更老佳期逾杳誰倩啼鵑訴江城子咏雪依依欲待人簾櫳怕回風怨回風一霎驚飛吹過小橋東梅信未來楓葉盡誰欵欵與從容前溪流水􅑯匆匆拚孤蹤碧波溶冷淡魂消舊恨有無中不似柳綿歸計晚人只解惜殘紅又咏雪驚風淅􅅹漸無聲恰泠泠早盈盈促拍悲絲轉入鳳笙淸喚醒梅花月下夢看咫尺有瑤京人間何用久留情曉風輕曉煙晴流水斜陽莫惜玉山傾解釋消沈千種恨明鏡裏鬢絲橫祝英臺近初夏碧莎蹊菖葉渡寂寞尋芳處梅雨無憑更把殘紅誤淸池幾片荷錢浮萍相亂留不住淚珠如雨空凝佇柳枝低軃夕陽猶作舊時舞也自無聊怕惹香泥污問雙飛乳燕何心間情間緒向枝上嬌憨對語滿江紅初夏霞映晴空驚曉夢餘寒消盡日影轉緑陰疊疊碎痕紅印燕子歸來憨不語柳塘樾徑都相認儘從今長日小樓空無人問浮萍葉魚難信商陸子鵑猶恨怕黃梅雨浥溼煙還困記得年時遊冶處輕衫碧映荷錢嫩奈柳絲間挂葛巾斜窺霜鬢又新月遠碧無涯但約略淸光瑩徹凝望處誰勻鬆玉斜分雲葉幽魄可憐涼似水一絲淺漾冰紋纈問靑天何事送新愁從誰説棲不穩驚禽咽風不定波光疉眄南枝高處素痕明滅認得遙山靑不了半峰微露峩眉雪便迢迢飛夢入層霄還孤怯又憶舊鐙影蕭疏身還在為誰消受拚盡了月下吹笙花前縱酒寂寂仲華今已老太阿知我還知否向中宵寒鐵噴淸光雌龍吼骨已白黃泉友魂已杳黃頭婦便長吟梁父溪山非舊飛盡楝花天不管韶華難得春風又聽啼鴉啼徹五更心棲衰柳滿庭芳重九蘆展霜英蓼開紅粟三分秋在堪憐芙蓉木未午壓絳痕鮮似欲將人共醉何須問誰健他年吹不去當頭皂帽直上有靑天飛仙曾授我汝南真訣壼裏淸元已住雲山絶頂藝盡芝田何處更尋高巘纍芒鞋竹杖橫肩凝眸處齊州數點萬里罩平煙水調歌頭咏懷釣竿落吾手意不在魚邊六鰲何處一艇縹渺凌孤煙耐可乘流直上不避回風吹轉蹴破浪花圓一曲棹歌裏星斗落帆前白蘋洲芳草渡扣哀絃落花細數坐久目送荇絲牽出入無腸國裏爛漫無愁天上鼎鼎度華年唯有千絲雪鏡裏自相憐黃鶯兒苦雨昏昏昏曉忘春曙幾尺幽窗半掩蒼苔一抹靑山平鋪飛絮似酒醒乍扶頭鐙炧難留炷沈沈天海𪷟濛早把韶光暗裏消去拚與白鳥蕩銀波淸猿隱高樹芭蕉幾葉莫有緑肥輕寒依然勒住想流水小橋東密篠濃陰處應有怨老鶯聲細把間愁訴高陽臺蛛絲落葉拚郤無情更誰厮惹西風簷角蕭蕭留看人間斜陽一晌光搖蘋花應笑歸期誤又爭知孤緒無聊被殢人輕蝶憨憨片影相撩天涯一夢迢迢任露侵衰草月冷危橋便隨塵土離魂不倩人招前時難憶藏鴉處有歸飛孤鴈低邀望誰為並刀一翦翦斷情苗念奴嬌咏蝶流鶯啼遍喚不醒芍藥叢中雙蝶待把紅香留住穩無待雨狂風劣流水浮萍垂楊飛絮都是間枝節殷勤為甚飄零了不孤怯縱好繡帶雲裳來回弄影蕩芳情一捻日暮簾垂歸燕語池上晚風獵獵渺渺天涯歸魂何處便是煙花劫無人説與陽關夢裏三疊又對鏡間愁自昔到如今當得雪欺霜負雲亞天低擡不起隨意白衣蒼狗劒躍雙龍筆搖五嶽也是間筋斗蝶黏蛛網絲毫動得還否別有一線霏微輕絲杪忽繫蟠泥秋藕一恁敗荷凋葉盡自有玉香靈透眉下雙巖電光猶射獨運枯楊肘無情日月也須如此消受水龍吟蓮子平湖渺渺波無際難認舊時靑蓋荻絮橫飛蓼紅斜炫秋光無賴拚不含愁韞香密裹泠泠珠佩伴江妃淚顆盈盈怕誰厮惱幽房裏深深綴十斛明珠誰買空望眼懸愁碧海露冷昆明霜凋玉井蘭舟罷採自抱冰魂海枮石爛千年不壞莫拋擲一點孤心苦留得秋容在本草石蓮子帶殼則千年不壞即此李時珍云藥肆別有一種石蓮子不知何物又前題白蘋紅蓼秋江岸早有蜻蜓斜睨鬚褪蜂黃乳含菽玉懨懨倦起乍厯金風誰知漸老蜜房深閉應只似天寶雞坊皂衣人在空記得霓裳事零零玉露含愁漫閣住淚珠難墜無情忍見蹴碎菱花啄殘菰米自惜殘香又逢劈破辰離煙水問多情碧藕抽絲可得經時重繫又余既作蓮子詞二闋夢有投素札者披覽之云公不棄豫小子補為酬詞良厚乃我本無愁而以公之愁為我愁屈左徒之愈東皇雲中不爾也且公所咏者荻絮蓼花金風玉露皆余少年事假以公弱冠時文酒輕狂今日為公道公其能不赬見於色乎敗荷秋藕吾已去之如籜自別有風味在公雖苦吟非吾情也世人皆以我為朴質公當為豔語破之幸甚曉起因更賦此不復以豔為諱輕舠直上瀟湘五湖載取風光去蘭湯初浴絳羅輕解雞頭剝乳膩粉肌豐苞香乍破芳心暗吐待笑他石家赬面楊家病齒雖天冶還含醋曾倩緑窗深護全不教香泥微汚莫愁秋老儂家自有杏金丹駐唯應少府無妻空老長憐樊素願年年歲歲相期解佩蘋花洲渚瑞鶴仙壽李為好早覺秋淸也是年華通閏露晶瑩也霏微香淺處知月中金粟遙飛英也雙星炯也良宵映人間永也祝其人如玉頡頏姑射在瑶京也輕也鄴侯仙骨凌虛上御風泠也夢鶴逈也何知蟻夢醒也笑向來蠻觸交爭何事冷看間看定也儘海波干度桑田吾心靜也春雲怨春雨一宵風雨將小窗曙色朦朧勒住驚起數聲啼鳥多在碧煙深重處肥緑欺人瘦紅欲盡流水無情向南浦紅藥多憨翠胎未吐還遣花期誤問春擬向何方去怕芳草天涯萋萋非故記得年時踏靑路燕子重來夢裏樓高望迷煙樹桃葉難憑流鶯不管自綰柳絲低訴喜遷鶯元夕龜紋雲展逗月影照人淸善徼幸春光等間換郤銀海玉山萬片不道殘梅香盡似惜柳條緑淺更念我一莖瘦骨風絲欲翦繾綣笑年年歲歲長伴韶華轉野燒烘朱疏星炫采一點山鐙光顫良夜人間似此莫問瓊壼近遠癡來自笑衰翁受用東風消遣歸朝歡春晚不道春光消不得風風雨雨落紅積餘芳一片尚嫣然倡條冶葉誰相識幽情還自惜向他時斷虹殘雨留取韶華迹遊絲裊裊嬌無力難憑遠覓春消息也知春只在天涯杜鵑莫訴春歸急柳帶煙如織從容綰住東流疾任桃花路杳天台不道仙源隔瀟湘逢故人慢贈李簡尤初度簡尤方五十髭髯如雪已十餘年矣瀟湘一曲記前時相念此地相逢掀髯一笑中問霜雪因甚早上靑松多情自昔閲桑田滄海重重有吳市洞簫孤奏碧天吹裂晴空酌君酒為君舞怕長沙袖短舉手難工把袂且從容但五絃揮罷目送歸鴻隨時梅酒又何有今古英雄鶯花在年年三月緑楊柔軃春風尉遲杯聞丹霞謝世遙為一哭離愁遠恨灕水不逐湘流轉蕭蕭寒雨天涯南鴈一聲驚斷間悰無數都付與似水并刀翦忍今生死死生生總難片語分判追憶雲暗蒼梧也則是風光本色消遣裸戲谷泉雷電裏莫更有耶娘生面今且向垂楊暮雨鵑啼處呪殘春一線想依然還我傷心歸舟天際相見二郎神七夕秋生處還只恐佳期無據俯杳杳人間幾點疏鐙亂流螢低度莫有多情應似我向蛛網含愁輕訴方信得經年此夕帶水橋成堪渡休誤荏苒凌波迢迢西浦費烏鵲高飛心力倦奈塵世荒雞催曙回首盈盈靑女下似笑我淒涼庭戶算自有銀潢幾許年華玉顔非故玉連環述蒙莊大旨答問者生緣何在被無情造化推移萬態縱儘力難與分疏更有何間心為之偢睬百計思量且交付天風吹籟到鴻溝割後楚漢局終誰為疆界長空一絲煙靄任翩翩蝶翅泠泠花外笑萬歲頃刻成虛將鳩鷽鯤鵬隨機支配回首江南看爛漫春光如海向人間到處逍遙滄桑不改又前題彀中遊羿莫漫驚寵辱浪生規避原自有萬里淸空可無影而藏不飛而至黑白兩端算都是龍泉輕試但塗中曵尾刃發新硎全牛皆廢無涯有涯交纍唯餌香藥作不黏滋味消彼此百種聰明向白日靑天鼾齁熟睡側足焦原弄獶虎不殊豚彘笑奕秋著著爭先居然鈍置望湘人歸鴈到君生寒裏寒盡春邊惺惺還自分曉煙水無涯關河何處長是夢魂飛繞任不歸來也堪信宿奈他幽悄儘江南草長魚肥難把寸心灰了厯盡墟煙晚照更天低月暗風淒雲窅脈􅎃自孤征冷覷垂楊棲鳥隨處生緣暫時留戀只愛桃英嬌小問他日萬片秋聲誰領取江天縹渺風流子自笑老夫無藉處問今古更有幾人知把紅霞揉碎挼成火棗玉露團合釀就氷梨飽餐罷擎籃盛夜月添炭煮冰澌一掐中天星隨指落還從殘臘花促春歸秋風落葉裏捫碧霄敲響玻璃大笑天翁白雀輸我偷騎金彈驚開幽窗啼鳥玉笙喚起茅店荒雞且殷勤屬望絶調鍾期沁園春梅花道人題骷髏圖淡歸嗤其鄙陋為別作七首乃詞異而所見亦不相遠反其意作四闋正之白日難欺靑天不爽只此骷髏到排場戲畢盡停邊鼓熏爐煙散郤剩香篝無想有天也須扣算放自當年到此收終不道泛秋波一葉隨處芳洲思量慙愧難酬曾頂戴春霖起白漚憶香蒸雲子從伊飽滿輕裁霞綺護汝溫柔莫倚無知瞞他有眼總付梧桐一片秋應認取者下回分解別有風流又前題當汝無時原無消息逗此風光到雲生月吐旋相圓滿山支水派不爽針鋩桂斧誰修玉砂難碾琢就玲瓏七寶裝曾倩汝為日輪炫紫寒夜凝霜成功底事難量仍擲與乾坤自主張儘雪裏梅開憑誰藴藉風中柳擺非汝輕狂百折如新一絲不亂煙草迷離總不妨珍重好教大鈞裁翦鶴短鳬長又前題畢竟還他曉風殘月正好惺惺看太白占星顯開玉色黃鐘應律𫾣作金聲揖讓筵終征誅局罷渠不增加汝不輕堪愛處為元龜受灼枯稿皆靈西園片片落英也妝點東風媚晚晴任血灑虞兮原非戰罪腸回康了不礙文名萬石洪鐘一絲殘紐止此冰霜骨幾莖夫誰暇怨華亭鶴唳蜀道淋鈴又前題為問蒙莊巵言枉弔笑爾何知既使我其然焉能免此如君之説抑又奚為幸未凋零先為飄蕩究竟魚還死水湄早辜負郤桃花春水楊柳秋隄欲拋拋付伊誰真避影銀鐙只浪吹便一枕蝶輕還黏粉趐三眠𧖟穩仍惹繅絲去則難留留原難卻一線紋生玩月犀唯片晌耐板橋霜迹茅店荒雞摸魚兒病後作問還餘鶯花幾許容吾酬盡春債向來淡墨寫虛空也須添朱著黛真狡獪拈一片落英欲揉韶光碎潑天無賴拚古廟香爐荒村迓鼓社夥從新賽癡絶處瘦骨披襟瀟灑倚闌目斷天外歸禽誰戢雙雙翼棲穩垂楊煙靄空慙愧噴熱血心肝摘出從人賣寸絲留在便棠杜雲寒白楊風起不道餘香壞又自述當年事也隨風起片帆一晌輕挂雲間江樹霏微處早愛靑山如畫停橈也又郤有蘋花菰米香低亞難消良夜且月載金樞波分素練飽看銀河瀉入佳境茹櫱居然啖蔗千金難酬春價娟娟蛺蝶花間戲不怕黃鶯絮罵誰真假已早似光風霽月連牀話千蹊萬岔則堪信堪疑欲歌欲泣狂譜從人打賀新郎自題草堂狼籍成衰老唯餘此數莖瘦骨隨風顚倒滿目江山無熟處一曲林巒新造何敢望松縈竹抱新緑半畦荒徑側怕萋萋仍是黏天草钁頭在還須掃東牆幸有冰輪好到秋來暖雪生眉瓊漿灌腦人道森寒淸徹髓也是龜毛蛇爪總拚與寒灰冷竈萬頃煙嵐窗紙暗恰昏昏齁睡忘寅卯阿鼻獄蓬箂島金明池新柳多幸煙和無妨風細裊裊自憐春軟嬌小甚鵝黃綻處但一葉兩葉初翦拚多情拖逗波光映岸側鏡影苔茸深淺總冉冉相依搖搖不定約約勻勻低轉不問花期今近遠只著意韶華殷勤欲綰忍微寒待鶯已久向落日藏鴉不慣定誰知無限柔情對殘月曉風翠眉難展只片晌停凝經時蕩漾獨自來回消遣瑞龍吟別恨天涯遠凝望迢遞層陰夕陽一線幾番拚不相思曾種情苗待誰割斷初相見也似輕薄楊花隨風飄轉無聊且付間心燈下香前自尋幽願漫道天台桃徑重逢劉阮殘紅一片又隨流水飄零凋殘故苑盈盈脈􅎃煙鎖芙蓉巘勞想像扇影低回佩聲繾綣夢裏啼鶯似把遊人喚又恐春期淺辜負卻翩翩畫梁雙燕此情誰欣一簾春晚望江南本意一江南憶鍾阜杳霏微佛子獻來金堵窣功臣長侍玉罘罳繚繞五雲飛又本意二江南憶錦帶繞秦淮萬古中原龍虎氣百年冠蓋鳳凰臺天闕一雙開又本意三江南憶牛斗劍光橫跳壁將軍飛似蝶換橋萬戶語如鶯虹捲海天淸又木意四江南憶霞采映江波吟社春翻紅雪譜講壇月滿碧雲阿錦瑟奏清和又本意五江南望渺渺似雲中五色秣陵芝作蓋三山北固海吞虹今古幾英雄長相思春夜花影低月影微一夜迢迢已半非問天知不知風滿扉露滿衣爐冷殘香戀素幃棲禽尚未歸昭君怨本意千古英雄一淚只在琵琶聲裏冷笑看功臣畫麒麟嬌面胡風吹皺拚與紅顔消受赤鳳不知愁漢宫秋又咏柳鶯囀上林春軟蟬噪隋隄秋晚一樣繫興亡碧絲長夜雨盈盈千顆點點淸波滴破不但翠睂嚬淚珠勻點絳唇和林和靖韻咏草舊日靑山霜風吹後誰為主招魂何處棠杜春臯雨杜字聲中休怨芳年暮凝眸去萋萋無數仍滿天涯路霜天曉角懷舊淸秋晚角斜日橫雲腳劍射燈花墜紫雙影瘦征衣薄今日夢中語當時難卜度唯有丹楓霜葉點點血還如昨菩薩鬘除夕相移不覺春前歲相連不斷風前淚淚巳到今殘乾坤醉夢間紫山橫白靄羃厯天如海花月有時新難留霜鬢人又桃源圖桃花紅映春波水盈盈只在沅江裏湘水下巴邱湖西是鼎州停橈相借問咫尺花源近三戶復何人長歌掃暴秦又述懷萬心拋付孤心冷鏡花開落原無影只有一絲牽齊州萬點煙蒼煙飛不起花落隨流水石爛海還枯孤心一點孤攤破浣溪沙始春新月嫩柳梢頭挂一分玉䀶鬆淺緑煙輕空裏流霜蕩漾逼天淸瘦影徘徊還似夢朦朧雪鬢未惺惺卻惱人間菱鏡太分明卜算子咏傀儡示從遊諸子也似帶春愁卻倩何人説更無半字與關心吐出丁香舌紅燭影搖風斜映朦朧月鉛華誰辨假中真皮下無些血憶秦娥本意懷仙驂鸞去還來太華峰頭住峰頭住不遠人間迷𪷟煙霧神山無蒂飛鯨渡迢迢紫海淸都路淸都路天酒花傾雲韶鶴舞又子規幽魂咽蜀天淚灑春江血春江血東下湘靈哀絃夜月春歸還訴春前別天荒地老情無歇情無歇喚不歸來他生此劫謁金門待須竹間不得間得也應相即除卻鏡中霜鬢識更誰通消息多病年來無力翠嶂層層相隔珍重楊花風起日覓浮萍蹤迹又春怨雲無數遮斷春光來處更著廉纖千嶂雨罩住和煙樹社燕佳期已誤他日歸來應訴舊識垂楊芳草路總被深寒妬淸平樂鷓鴣但南無北費盡丁寧舌説與天涯行不得也似欲啼淸血空山煙雨霏微離披敗葉低飛乳燕莫誇輕俊人間何處烏衣謁金門偶感千秋歲只似而今滋味落日黃花衰草地有英雄殘淚片月亭亭西墜不管幽蟲吟砌未審碧霄何意緒恁茫茫無際更漏子本意斜月橫疏星炯不道秋宵真永聲緩緩滴泠泠雙眸未易扃霜葉墜幽蟲絮薄酒何曾得醉天下事少年心分明點點深又前題嵩臺泊灕江柝劍吼匣中如昨劉僃壘馬殷墳間愁夜幾分燈燼滅寒衾鐵只有歸鴻悽切簷澑雨遠雞聲心知是五更眼兒媚春深始見梅花不知深淺幾春宵猶自見春嬌暗藏紅粟斜分緑影全罩冰綃當時曾有孤山約客夢已迢遙餘香應惜東風漸老野水平橋西江月本意湘水悠悠北去章江渺渺東流淸光拂劍碧天秋情寄一杯濁酒落月倩誰留住長江又送新愁小孤潮阻散花洲露冷長堤衰柳又前題曾憶龍沙孤泊將軍祠下霜寒涼輝淺淺挂西山半破金樞拂岸羌管聲中鳥夢藤花影裏漁灣嬋娟不管淚闌珊還送數行歸鴈南昌劉省吾都督祠不知存否怨王孫送春野水蒼樹落紅飛絮芳草長堤垂楊古渡只是無人解惜春歸雁欲傳雲裏字將誰寄拚與間愁死天遠水遠山遠何處相逢夢魂中江南曲寒月寒月迥霜氣護嬋娟眼暈乍臨秋水鏡睂黃初學遠山煙不盡使人憐淸賞處猶自憶華年移几當軒添獸篆捲簾呵手拂鸞箋人在玉山前又前題寒月迥凝望屬天涯劍吐蓉光三尺冷弓垂蟾影半輪斜豪氣動悲笳回首處羃厯杳平沙雪窖遙天迷鴈宇瓊樓暗影奈妖蟇雙鬢冷霜華又前題寒月迥風襲讀書帷硯滴搖光分碎玉鐙花隨影落瓊芝厯厯記當時人已老不分冷風雌弔古自垂珠蚌淚問天欲伐桂香枝淸氣蕩冰澌分去聲又前題寒月迥旖旎一輪安片影但驚孤葉墜數峰無那晚煙殘略似夢中看深佇立淸露沁肌寒藥竈松風初淅􅅹竹窗梅影已闌珊人老釣魚灣鷓鴣天杜鵑花錦國春從恨裏裁雲安涪萬淺深開山頭萬片芳影枝上三更結怨胎紅淚滴血函埋他時化碧有餘哀傷心臣甫低頭拜為傍冬靑一樹栽虞美人問月乍圓還缺相調弄也是如春夢有形畢竟有消時只是較人差久少人知遲回間戀花間影便道秋宵永儂今何遽不風光一晌淸靈不散萬年長踏莎行與李治尹夜話致身録事有感而作幾許興亡憑誰料理血痕一縷留靑史從來白刃殺英雄懨懨兒女叢中死霜氣飛空星光墮水間宵半吐傷心字他年莫問草堂荒蕭蕭落葉隨風起小重山訊遊人聞道韶光色色新靑驄驕玉勒踏芳塵河橋嫩柳折殷勤全不管葉葉翠睂嚬鶯語呪含嗔子規催不轉未歸人東皇若肯惜餘春紅藥在重染茜香勻蝶戀花秋感簷帽風輕收早稻半捲黃雲半擁緑煙島雪鯽如銀膏滿腦爪肪切玉鋪霜早裊裊長竿爭打棗靺鞨珠圓顆顆香甜飽受用蒼天今已老掀髯一笑邯鄲道蘇幕遮暮春月夕雨初收春已盡多幸嬋娟還照煙霄暝弱柳搖波波不定緑影層層蹙損金樞暈儘間愁誰借問花落花開難向今宵認猶有餘香吹陳陳珍重淸輝莫映殘雲隱又翠濤以新詩見懷作此答之老猶慙愁不死燕子銜來無限傷心字春色三分還似此和雨和煙了郤韶光事有如癡仍似醉短劍光銷紅蠟傾珠淚一片瀟湘東下水誰遣無情長惹飛花墜漁家傲樵歌煨芋噴香斟卯酒扳蘿不怕寒崕陡黃葉颼颼麏鹿走君知否夜來野燒霜枯後林外炊煙靑一綹斜陽又轉蒼溪口莫怪逢仙柯已朽耽碁久人間殘局難丢手又前題雨歇輕陰苔滿地鶯聲引入雲深際谷口回風驚揚起芫花碎芒鞋點點紅芳綴滿徑山􅈨香藹膩杜鵑鋪錦簪螺髻掉首行歌歌不已腰鐮墜枝枝不忍傷新翠又為好送魚苗謝之連雨前溪新漲瀰垂綸不上雙雙鯉剛歎直鈎鈎不起靑蓑委果然甚矣吾衰矣雪脊霜鱗春燕尾殷勤不待桃花水曲沼逍遙萍葉紫秋風裏熟炊香稻烹銀髓鳳凰閣詠風鎮來回不審何時是了問天也難分曉可惜一江緑淨半林紅裊都被輕狂消繳年來雙耳長似蟬吟林表那堪鼉吼還相嬲便兩鬢幾莖霜也來縈繞到長夏又還幽悄天仙子元夕垂垂凍雨凌珠滴阿誰喚作鐙花夕當時有夢到今圓孤煙羃殘膏膩寒山不著東風力才領取歸鴻嘹嚦又消受殘梅狼籍人間昨日是元宵人非昔天難識明年消盡中原曆祝英臺近殘梅有餘香無別意難向東風説前夜朦朧一晌邀霜月元來卻上柳梢平沈碧海拚不管幽芳凄絶情無歇苦禁斷雨斜陽望尋香凍蝶漫無消息歸燕空饒舌便判取豔墜珠樓煙飛紫玉也難待杜鵑啼血御街行上巳迷煙迷雨教春困不道是淸明近輕寒曾忍柳風狂只待東君花信紅藥芽嬌山丹胎小依舊無憑準蘭亭今昔何須問消不盡新亭恨強將客淚付流觴逝水難酬春怨鶯鶯燕燕花花草草目送韶光褪東風齊著力憶別峰修竹為冰雪摧折一片緑雲千條寒玉亭亭孤上非想有情天記得雨餘殘照趁啼禽即栗橫肩迎眸處捎雲垂露裊娜芉眠誰道別經年怨湘妃不語我見猶憐鯨波吞嶺欲遣變桑田魆地一聲去也挽不住環佩珊然空想像紙窗淸影淡寫之玄水調歌頭放言我自非卿法何事為卿愁非卿之法卿抑可不為吾憂若汝三更半覺而肯一參萬歲月也應含羞弄影浮雲上圓缺總淸秋數花鬚黏柳絮汝風流差排蟻國蝦島立地鳳麟洲既道尼山出世又召東山入夢鏡裏是真頭炯炯明看汝更上一層樓念奴嬌南嶽懷古井絡西來厯坤維萬疊丹邱戰壘萬折千回留不住夭裊龍驤鳳起雲海無涯嵐光孤峙綰住瀟湘水何人能問問天塊磊何似南望虞帝峰前緑雲寄恨祇為多情死鴈字不酬湘竹淚何况衡陽聲止山鬼迷離東皇縹渺煙鎖藤花紫雲璈無據翠屏萬片空倚瑞鶴仙壽劉庶仙桃花開也未有酥雨微晴爛熏春醉何須傾緑蟻弄嫩柳鶯背黃醅香膩綵衣新試更昨歲蘭開雙穗此芳辰不樂何如塵世原同兒戲曾記牡丹月下琴軒春早笑歌聲沸年華彈指漸兩鬢霜華綴看江山一晌蜃樓閃爍煙波杳靄無際只壺公壼裏韶光一色彤雲多麗南浦驚秋片雲堆雪卻無端飛影欲掠斜陽回首西風起處幾葉上輕黃莫問藕花凋未看蜻蜓點點度銀塘有前時雙鬢而今似否靑鏡自商量極目神州杳杳只歸禽無數點微茫銷盡殘虹半折短劍蝕淸光便遣吾廬三徑在他時楓葉不禁霜祝掠雲雙燕好將歸夢繞空梁尉遲杯冬景夕陰凝分一半霜月空霄影危柯風吼鼉吟料得栖禽難定睂雲黛蹙問何事帶濃愁不醒也應他倦看天涯萬里平蕪煙暝休道柳暖花嬌便秋色碧梧猶戀金井早似十分搖落也誰待怨玉露當時薄幸但隨風幾片丹楓還逞飄零情性聽孤鴻暗度三更幽魂脈脈孤省二郎神咏鏡碧潭淸淺又早被蘋風吹動驚鬢影參差歸來欲倦試向菱銅間弄何處相逢似曾相識一面間愁偷送多情甚白祫朱顏直至而今相共還恐塵生碧海元雲暗湧也似我年來桃花春水咫尺煙迷秦洞總不分明猶應記得笑語當時恩重誰忍見半規流落人間別邀新寵望海潮本意紅塵如此茫茫滄海吾將誰與言歸蜃霧騰虹龍珠炫紫波光天外霏微寶日湧初暉經煙霾萬里雲鎖千圍依然不改晶輪激火夾天飛吹簫人鼓餘威將吳宫舊怨血灑靈衣怒遣天吳濫驅海若長風奮駕支祈淫姣責江妃將平沙盡洗仙草滋肥屬目軒然一笑人在釣魚磯風流子春感春光又到也全不惜霜鬢不禁愁問歸飛雙鴈江南塞北冰融風軟何處堪留莫輕棄魚波翻縠皺鷺影挂銀鈎但愛風高黃沙眯目為貪月冷白草含秋垂楊搖蕩處綰不住緑水去悠悠饒有荇牽翠帶難繫浮漚看徹踏靑睂皆黛蹙相逢折柳淚總珠偷歎千金春價一刻難酬蘭陵王秋感傷心事今日從何説起劍光冷血濺潭龍落葉風高雲際寺賓鴻傳錦字向道海雲孤峙天涯遠欲託傳情不怕關河阻迢遞露墜芙蓉死問秋藕可能將絲重繫吹簫人老吳閶市向夜闌人靜間提半語也怕吟蟲相調戲擁孤衾獨睡憑夢將愁寄更天海悠悠望斷煙水縱然有夢成差異難尋覓酒伴同垂珠淚想天也了無慙愧賀新郎用韻寄題翠濤山居君未同余老任叔夜崟欹磊落玉山奚倒偶借漁磯垂直釣不許問律人造豈但愛淸溪回抱萬疊碧簪靑帶繞遍天涯總是王孫草笑一室何須掃平疇良稼懷新好多種秫黃雲釀熟香熏龍腦畫駿不臨松雪譜自寶思陵鷹爪煮冰雪自尋罏竈間寫溪雲山雨句終不教舉俗憐丁卯雖寒瘦非郊島翠濤家藏宣和畫鷹因憶趙子昂不類遂及之又中秋大病不得與從遊諸子觴月吟此慰之海門孤月上是人間平分秋色桂香新釀一曲草堂東嶺對延盡碧天淸爽窗影照吟蟲幽響鷺足倒拳衾似水笑淸狂到此無能強鐙焰薄搖孤幌一丸冰玉含惆悵付伊誰劃破靑天御風孤往擒取妖蟇三足怪鋪滿銀魂千丈問竊藥當年欺罔玉宇能禁寒徹骨但有情不怕銀河廣寶劍在英雄掌十二時蟋蟀問古今間愁有幾長與秋來相惹到月暗梧桐疏影木葉泠泠初下便遣淸宵都無萬感猶自難消夜偏傍砌側近西窗冷絮間叨不管殘鐙花灺從伊誰問知幽恨長在睂梢縈挂似訴風淒如悲露冷斗轉銀河瀉莫念人幽悄殷勤特相慰藉不分明傷心句裏聽得又還爭差待擁孤衾滅鐙塞耳可放離憂罷未多時更被荒雞數聲啼也玉女搖仙佩霜葉雲容初皺鸚老梳翎微露狸紅丹咮迆邐金風輕寒不耐心緒還如中酒莫是憐秋瘦貰韶光薄媚春歸還又念一自紅藥凋零杜宇三更啼血而後拖逗得傷心染就殘痕到如今消受還想拒霜木末蓼花江岸晚􅝰於今未久半折殘虹一灣夕照郤早送人僝僽零落還知否唯應伴幾葉淡黃衰柳又恐怕靑娥嬌妬不肯留儂住朱顔非舊重回首雨餘荒草堆紅繡鼓棹初集終
