front:
  text: 薑齋文集卷九船山遺書四十六
  hash: sha256:d5642d4f02c51451465ca9295cea1472f6df7e59abdf6ea235f8dc10309eab32
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4f0009_SBCK_009-1a}
body:
  text: 衡陽王夫之撰贊陶孺人像贊孝而殉國人所聞奚俟余云慈以鞠不究其粥奚以相暴靜好爾音函之豫心有言孰諶偕隱之思已而已而焉用文之天或假爾以後昆者髣佛不迷唯斯焉之為儀題熊畏齋先生小像贊爐煙篆輕茗碗香淸天歸綺閣人在瑤京談霏玉屑度挹芝英養丹山之彩鳳族麗景而飛鳴雜物贊雨坐無緒念平生風物或時已滅裂或人間尚有而荒山不得邂逅各為敘其原委而贊之諸有當於大制作者不與感其一葉則搖落可知已髮積糊紙作鍾馗狀髯而執簡空其後挂壁間以納櫛餘之髮神力憤盈食妖充餒謂髮離巔其類維顧巔已繁有徒元冠赭袍云胡其徂氣通鐫方玉管作綺疏方暑簪之以泄蒸溽亦有冶銀及刻鳥羽本為之者百陽趨首鬱則或膱􅌑瓏旁引紓此亢息陰升陽脫不霜而凛熱中汗背非爾所審天蠶絲出廣西府江山中猺獞炙食其肉有絲如金縷以綴巾圈弗飽女桑弗眠葦筁柔堅赩耀綴彼金玉乾綱既裂孰與維之千金一􅗀不及貆貍香筒出納袖中香霧凝綺疏則不爇而熏沈水木紫檀象齒棕竹乃至磨竹皆任為之鏤人物花卉峰巒精者細入毫忽香魂化虛留之以凝褒衣間間偕爾寢興之夫蕕葎是逐無所置爾袪如鬼見愁亦草木之實生武當山谷或採令童子佩之云辟鬼魅狀類粵西所産豬腰子而圓小精潤茶褐色有深黑文緣其間鬼愁不愁人亦不知如彼明王守在四夷爾不我佩鬼愁何有使爾今存人胥疾首料絲鐙燒藥石為之六方合成外如絲內如屏花卉蟲鳥五采斯僃然鐙其中尤為綺麗元夕張鐙漢明創始窮工取麗既光且綺爭月搖星石繭火機以陰以雨奪我容輝太平鼓以鐵為棬鞔羊革作一面鼓棬下施十餘小鐵環揭長柄擊鼓搖環琅琅􅣨􅣨鐙夕之巷樂也三百韶年河淸海謐歡情踔厲播于始吉天山笳哀漁陽撾斷凡今之人孰肯念亂活的兒以烏金紙剪為蛺蝶朱粉點染以小銅絲纏綴針上旁施柏葉迎春元曰冶遊者插之巾帽宋柳永詞所謂閙蛾兒也或亦謂之閙嚷嚷暄風未動春物已翩人載春心爭物之先蘧蘧殘夢生意不蘇梟巢人頂仍啄其膚果罩漆竹絲或燒假珠子為之中固無果名而已矣顧非是則不足為筵非以給欲如彼繡衣目愈心愜何必不飢胡孫充嗉偃鼠滿腹安用初筵貪叨已足高柄碗茗碗下有足可拱可把以架承之古者尊有禁籩豆有房應如此爾謂爾贅疣何者非贅苟便飯啜放流奚害擎拳致肅無患捧盈措地不可而後亡傾盒袋用亂髮結繩作大目網納盒其中荷之以行匪絲匪枲取彼亂髮如山既童柯將焉伐饋食往來露其乾餱苞苴不諱亦孔之羞高閣小紫竹為架下斂上張以庋字畫及藳紙挂壁間截彼湘筠庋我丹策伸臂以探攜無曰益今作字者匪訟則貨藏恐不密畏爾賈禍茶托緝小草結之如蒲團狀大才如碗藉茶具不令蒸歊損案漆使僧如槌爾可安禪不壞色相淨理乃全今者羣大如修羅炙手可熱爾其奈何罏几大理石為中烏木為邊似案而小以承罏香匙瓶明窗棐几香縷縈空終遠腥熏願承下風太元為守介石為心君子去我夜氣惟金看相冶銀作針管粉合鑰槖線囊蓋內則女子所佩實去而形存者也紛帨象揥女職所勤用絀形傳聊樂我員怒馬衒妖裹袖為姿珊珊冉冉奚有來遲袖籠射者衣大褶則以幅錦裹袖詩之所謂拾也射維觀德容乃德隅雖云絭袖不礙卷舒削幅見肘恆有殺容如鷹常攫雀鷇其空銘筆銘為星為磷於爾分畛為梟為麟於爾傳真吁嗟乎吾懼鬼神硯銘余兩赴端州未能得一佳石故水師將軍南陵管燦舊為制使丁魁楚開靈羊峽坑家有數石其子貽余一硯知石理者謂承之以日則晶熒反射如浮金乳為獨絶不在蟲蛀火鬛蕉葉也庚寅冬桂林覆敗為叛吏挾家人奪去既返山中無以和墨劉平思卑一石子外璞中膩參差類小龜即非至者亦頗受墨相隨二十年矣平思下世來倏已五載欽佩故心聊為銘之平思曰咨天憖爾以死不替爾思爾有知錫爾元龜蠲爾心奠爾辭以斯人逖于迷疑維亂夏聃曇為之尸砥礪爾鋒無滋遺種于茲土爾尚不余遺龜拜稽首曷敢不式承子之光施墨銘莠讕浮嚚惜爾如珍微言苟伸爾不吝滅爾身祕閣銘柴桑無絃得琴理何用揮毫而藉此硯蓋銘黃塵元埃切近其災苟藏身之已密彼於我何有哉杖銘莫如信拂子銘所往為之如彼為也語助或窮斯焉取舍圍碁銘子入奩局摺紙將欲何為勿寧事此梳銘新安黃將軍金臺披緇稱廣明大師請余為小傳見贈玳瑁梳一合云藏之無用久矣非先生無可贈者感其意而銘之我瞻斯人皆可贈者達多迷頭非無頭也豈其遠而神農虞夏南窗銘北窗涼風南窗夕曛五柳高卧之心夢依京雒悲哉乎夕堂拂蟻之志邱首滇雲觀生居銘重陰蓊浡浮陽客遷孰忍越視終詘手援物不自我我誰薑齋文集卷九終
