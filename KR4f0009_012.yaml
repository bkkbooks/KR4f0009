seq: 12
body:
  text: 自敘境識生則患不得熟則患失之與其失之也寧不得此豫所知而自懼者也五十以前不得者多矣五十以後未敢謂得一往每幾於失中間不無力為檠括而檠括之難豫自知之抑自提之詩言志又曰詩以道性情賦亦詩之一也人苟有志死生以之性亦自定情不能不因時爾楚人之謂葉公子高一曰君胡胄一曰君胡不胄云胄云不胄皆情之至者也葉公子高處此殆有難言者甲寅以還不期身遇之或謂豫胡胄或謂豫胡不胄皆愛我者誰知豫情豫且不能自言況望知者哉此十年中別有柳岸吟欲遇一峯白沙定山於流連駘宕中學詩幾四十年自應舍旃以求適於柳風桐月則與馬班顏謝了不相應固其所巳彼體自張子壽感遇開之先朱文公遂大振金玉竊謂使彭澤能早知此當不僅為彭澤矣阮步兵髣佛此意而自然別為酒人故和阮和陶各如其量止於阮陶之邊際不能欺也庚申上已湘西草堂記六十自定稿船山遺書五十衡陽王夫之撰五言古詩擬古詩十九首庚戌臨歧送遠道春草生道傍春草生有時遠行去無方逝水無西歸遊子怨流光高臺多夕風平原足晨霜去者日益永留者情益警元雲迷四郊方望不得逞思君褰羅幃滅燭無餘影棄置良獨難沒生誓幽秉東園桃李花南國蛾睂女灼灼相矜悅遙遙動心語淸歌不再發舞袖無雙舉昔為弦上思今為夢中聚芳菲非我春為歡復何許灼灼三春風縈縈楊柳色年少去我徂芳菲不再得遲我心所欽良書寄懷憶迢遞千里間神皋有仙宅朱鳳遺淸音靑天回羽翼玉軫動鳴琴素月輝相即髣佛垂丹梯雲籖降消息願言欣相從含情無終極殷勤重殷勤置酒遙相期華燭搖虛慵流光動哀絲中觴促密坐欲言還自疑懷情不忍戢勸勉當及茲為歡託榮觀結愛在新知飛蓬非久要胡為守枯枝詞終起相謝微生命有涯客從淇水來導我遊朝歌廣陌聚高居冠蓋彯綺羅良夕奏哀絃繁聲驚素波師延亡千載遺怨何其多黃鵠感其音羣飛以阿儺高樓離思女長夜顰靑蛾聞者無厭情歌者益以和淸琴有希音吾心將如何日南有歸客問訊珊瑚枝海水深不測飄零無反時相見既無端相憶無與知唯持憔悴心畢命以為期太陽斂西暉纖月出雲際夕風改晨色羣星相連綴征鳥懷故棲遙天方遠逝巢燕依梁宇流螢漾池砌念我結髮遊納交相砥礪去者日以疏遺我成孤贅宵露不及晨餘霜無久麗自非金石心誰能永匏繫梧桐生井幹桐葉落井中結褵事君子飛蓬附秋風秋風有息時飛蓬委荒阡間關逐君行中道悲棄捐依君日苦短別君日苦延傷哉驚飆集吹此雨絶天日沒羣星出長夜未有端桂樹縈晨霜芳滋久不渝采之無所贈不忍置路隅懷袖經歲年中心良自殊殷勤自疇昔誰為愛斯須滌滌秋宇淸泫泫華露滋冉冉弦月微杳杳雙星期良辰既不屢終夕亦有涯脈脈相視間為歡還自疑未必經年中綢繆無轉移日落登崇岡顧望靑天高四維何茫茫浮雲但蕭騷羣動既非一吾身若秋毫自非精誠徹蠕動徒巳勞精魄無固存奄忽成焄蒿及今百年內何者終吾操所思不可見所怨不可移忽如飄風集貿貿何所之平生交與好長逝相追隨中野飛磷光白日為之迷函意以永世千載將誰知南山崔以嵬上與浮雲連俯視何浩浩飛鳥翔其間延眺須臾中心目淒以間置身如流波旦夕空百端焉能役心志隨物增憂煩疇昔遨大梁結交多英賢千里不相棄良書託歸翰寶玦白玉光繫以雙金環佩之四座驚傍徨發長歎所歎非偶爾白璧當自完陽春二三月緣草被修路靑林無鮮華啼鴂亙晨暮淒彼泉下人不知春風度驅驅無返轍誰者為新故往古既復然非我獨憂懼天物各推遷胡為滋驚怖慮苦不得甘蚤計良巳誤滅性以求真浮光棲月露鼎鼎百年中含情抱貞素古人不可期今人當奈何對酒乍相忘援琴發淸歌適意方􅏅兹憂患徒相如憤世而忘己吾生亦有涯商山采芝人迹邇心自遐和月春巳徂林鳥有餘聲落英無返顧流覽怛中情寶刀垂鞶帶昔我何所營中宵不自戢髣佛感精靈邂逅良人姿執手相徂征心好自旖旎隨風飄長纓雖非思所臻乍覯亦不驚願言託白首疇云中路傾綢繆不相釋屢顧念平生懷抱申此夕感之雙涕零白月流素天微霜滿空際開軒極遠目淸霄何迢遞仲秋元鳥歸季秋陽鴈至染絲弄機杼縱橫成錦字上有永別離下有金石誓不知將寄誰綢繆結封識經年藏寶篋置之不忍視昔我遊日南中道至合浦池水碧以寒靉靆莫能睹得此徑寸珠云自鮫人所緘以金泥封藉之龍文組中夜投君懷當知寸心苦淸風吹華鐙明星啓東方起步中庭間形影相傍徨夙昔志遠遊遲暮迷津梁滅燭從假寐欲罷固難忘浩歎以徹旦不知淚霑裳擬阮步兵詠懷出門何所適極目延雲容白月照廣川緑甽生淸風飛鳥去天末蕭條無餘蹤置意良獨難歸來扣哀桐阿環握靈符翩然降桂宮執戟侍淸宴佩玉相從容嘉會雖迢遞畜意無終窮二八妙娥嬴箏璈蕩虛空穆耳注心感歘焉返閬風懷情不再覿徒乃見狡童萬年獨離傷精爽誰為通涼風西南來吹此浮雲興連蜷相異態奄忽如有憑日暮靈雨飛消釋如春冰步上商南山揮手謝太淸肝膽一胡越百年非我生明滅隨須臾吾心固不能石隕睢陽都夙昔為明星頃刻不自信哀樂異其情韶風榮腐草春霰摧初英去日亦已往來日自多驚唯有王子喬淩空吹玉笙結士苦不早黃金何足言遠聞悲歌士屠狗近居燕攬衣欲就之時命忽我遷蟠泥中道困蛟龍無羽翰歸休南山下日月如流丸棄置平生心荒忽如秋煙鸞鳥棲開明玕琪映毛羽西日不匿暉永夕炫金縷深心非世知有時戴戈舞覽德無良期裴回生憤怒慈儉以全身高深定何補芳春去我遠九夏行將遷靡草閲炎日鮮蔓無久延歸禽避飄風深林相哀喧披衣視河漢惻愴悲高天當時非所謀及今良固然白日閟寒雲辰夜復陰雨夕螢流溼光因風歘相聚奔獸不違林驚禽亦懷侣下士情不深目迎心己許悲歌難自固上蔡餘酸楚失弓原郢客逐日非夸父要領誠不惜孰為同草腐泛舟浮湄水逶迤靑楓林湄水去不息言下湘江潯停楫長太息明月照我襟天宇羃廣野平原氣蕭森夕鳥瞑不飛遊魚喧籟陰寸心不自得何况飛與沈鄴臺閟新宮高陽矜廣宅遊冶相紛奔追歡倒屐舄黃雀在枌榆取之若芥珀華山有高士燒金方結客舒卷無淺心靈蛻託仙迹燕臺多高風易水揚洪波白日照綺疏冠蓋相經過踔厲古今間感慨何其多望諸無返駕洹上計復訛黃金臺己蕪北望空山阿宋子迹云遠誰為紹悲歌蔓草縈咸陽云是阿房宮雛鳳復雙飛莫辨雌與雄山河既綢繆宴處時從容挾彈鳴金錽垂楊驕靑驄意氣生豪族芳塵散春風努力拾新翹無言恤飛蓬秉燭繼白日為歡無終窮長夏生景風飄然過我墟蓬居困杲日赬影過桑榆延睇望廣天胡為自攣拘西臺有餘哀聊城無報書生我自有天憔悴與之俱白日回南轅草木藝以黃時改心易驚哀情隨大荒遠視無所懷但念有悲涼西暉徐以下微風過墟岡庭宇曠蕭森披帷延星光早歲好詞賦文酒相追隨引譽動當時將為名在兹撫劔遊廣都悲歌歸山涯元冥共白日何者不吾欺驅馬上高岡咫尺生崟欹乃知楊公歎非緣道多歧湘水千里來東下巴邱湖迢遞連廣野青山閟幽墟雲氣浮遠白西南接蒼梧落日登迥岡飛鳥去巳孤暝色沒高樹墟煙下平蕪俯仰求寸心不知意所俱姣女多情向烈士無旁趨皎日照此懷行歌一欷歔悠悠青天高不知生所終巫咸巳上天欲訴將奚從但見大壑間大壑沅湘耆舊集作邱壑日暮生淸風驚魚跳淥水秋蛩吟蘭叢懷我心所欽邂逅相迎逢浮雲起東南悠然騖西北駛影無淹留凝望滋迷惑前者既蕭散後來空閔默豈為仰觀者佇迹從察識稚鳥空翔飛馮風鼓羽翼達人知其微馳驅無軌則蘋末生輕風孤心自相得念我心所歡遠在玉山岑戴勝冠崔嵬文鸞奏知音妙藥靑麟脂薰風生瑤琴日夕延佇之綿邈心淫淫三五明月滿光暉發雲林神爽一相接擕手連謳吟企望亦不遐悲哉年歲侵楚人得亡弓塞叟有歸駒乍爾亦為歡達人哂其愚明月照形影惻惻夫何如回風揚秋毫寧轉造化樞冏彼柔曼子猶知泣前魚元珠握重淵金石終不渝心顔誠自我雲容悲素蒼耿耿霜月霽長嘯驚八荒靑天有鳴鴻孤飛不成行聞其哀噭音疑爾悲稻梁所志在鷽鳩枋榆亦可翔支祁降橫流十日恣炎焚英靈相委順千載無秋春刀圭詎偶爾靈液起沈倫鳳笙非世響十載將上賓自信匪無功勤立丹臺勳方壺與圓嶠相去無黍米星河流其間日月蕩其裏孤遊忘歲月奇璨爭紛詭調良駕河車六龍就方軌補天西北傾奠地東南委淸虛非久居沈淪安足紀夙昔驚我懷離合遂無端結好在中塗綢繆苦不安飆風吹落葉夕陰淒以寒握手未及終裴回歧路間駭獸啼我前離怨無與殫焉得三靑鳥從之生羽翰舊夢巳不續無如新夢驚溪雲霑竹尾滴􅅹過三更雙髻峯西峯亙銅梁北嶺矗荆紫百里見陰鐙遙知光發此黃沙潭落葉絶行蹤隨意披疏篠龍氣動喬木空潭無猿鳥溪波巖棕笠濺飛珠回頭不知處徙倚望前山斜陽轉高樹妙高峯陰光浮石壁長如春水生僧歸夕磬後回首見西淸車轍亭偶然成轍迹古人意何取佇立無與言前峯正疏雨方廣路未從方廣遊知為方廣路定有夕煙霏天光露晴樹嘯臺午日尚曈曨紫光襯元葉暄氣上臺陰香風吹凍蝶補衲臺聞有補衲名學之跏趺坐蒻葉搖森森竹鼠穿裙過洗衲池瀑布良可觀臨之喧不淸水簾垂一尺微送佩環聲右嶽後靑溪石門欲作飛猱度不畏蒼苔深森森開一面斜日照前林西石門循壁渡泉橋知有幽人宅山氣動馝馡香麞夜來迹松紋石亭僧歸繞曲澗回首望林端遙知愛啼鳥也向樹梢看塢雲菴曲逐峽田上遙期松徑終涼風中嶺合西日一尖紅右祁邵之間釣竹源杉竹迷千嶂豆苗縈一灣麏麚不相避肥草隱潺湲雲臺山佛宇不可知雲留高樹裏日落鐘磬聲隨雲度溪水右零陵北洞西莊源古樹何年種歸禽來一雙茅齋讀易罷搖影入間窗小祗園宛轉破千嶂平疇起緑煙自然知蘭若不過鳥飛邊右宜江小雲山夕氣澄若濃星光斂淸炯林外露懸燈未知何峯頂昭陽庵歸鴉度何所夕照移西岑蔭入蔚藍色蕭蕭松檜陰馺閣巖欲以貽來者錫之馺閣名終古知不知今兹自含情桃塢曳杖行何適桃花一塢紅回塘積落英從君識東風雪竹山楊墳一竿竹空外影千尋六月飛氷雪埋心直到今茱萸塘緑苞綻紺珠紅泉醖香屑采采及淸秋汝南有真訣敗葉廬敗葉留不掃鏦錚扣哀絃蟲吟凄切外秋色倍淸喧觀生居寒月出東嶺流光入淺廊萬心函片晌一縷未消香右湘西昭山乙卯曲曲見昭山孤靑不相舍湘水送千帆凝眸幾人也終古石自碧深春花欲紅澄潭凝一碧雲末出雙虹避亂石雞村同載謀小憩己未蒼壁不受春轉入溪流曲桃花影外天微波動新緑飛鳥隨風葉梨花漾碧晶溪山得圓淨雞犬亦蕭淸不知身忽輕巳度靑茸表疏雨何妨飛林端露淸曉仇池九十泉桃源千萬樹古人喪亂中自選林泉住五言近體過芋巖不值巳酉隱几非疇昔天遊各徜徉古槐珠蕊熟曲岸蓼紅香晴稻收雲白秋瓜切粉黃呼炊忘主客撰屨巳斜陽深秋望歐子直蕭蕭夕吹外雲斂一痕靑杖履隨天地山川見典型借碁遲畫紙釀酒巳登瓶但覺間情損歸舟憶洞庭因林塘小曲築草菴開南窗不知復幾年晏坐漫成六首呈桃塢老人暨家兄石崖先生同作營築非吾道林塘適物淸吹瓢疑稍釋逃影妄初成無悶炊煙損多徼曙月晴暄風淩小雪當砌炫冬榮七尺一絲存餘生半席溫浮漚仍往迹凷土認誰恩飛鳥消雲際幽蟲蟄草根小東皋畔客今日暫招魂小東臯瞿虞山先生讀書處一日一生留無緣謝白頭天情垂粥飯家學志春秋月影虛窗滿雲滋砌草柔濓溪香菡萏孤棹試中流耕釣傳先志人知德不堪釧聲原宿業崖蜜自先甘寓目團欒淺初心冷暖諳鴻蹤沙外雪聊謝蓋棺慙病畏朔風寒南窗背嶺安林風遲九夏日影夢三竿乞種誰家樹旋成幾尺闌死生還似此倍覺有心難隱几願經年垂楊左肘穿虛空戰雷雨血骨裊霜煙縈蚓通幽迹驚魚遣熟眠天情隨近遠何有息雙肩家兄觀夫之抄稿云墨迹似先徵君垂示以詩哀定後敬和四韻鼎鼎孤生在迢迢百行非皋魚身世恨鴻鴈一雙違斗氣埋長劔霜風綻葛衣驚聞墨影似還欲惜殘暉二中園紀事為懿菴作壬子入閣幾重重雙開曲徑通穿風分柳徑隨蘇度蘭風魚服雙緋盛花階九錫崇居然成緑野何必蔡州功萬折􅍓嵯峩天輸小邵窩書聲花影月曲尾柳鶯歌看奕人無倦臨觴政不苛淸泉四十八何處著風波即事癸丑暄氣熏寒月微霜不改晴光衝西極影月轉北街明川澤淸難巳龍蛇蟄不爭乾坤餘一淚長對暮煙橫仲冬微雨息霜吹捲空晶深紫餘楓在疏黃片柳輕餘年消永夜寒月約孤淸自問滄江侶誰為共濯纓晴步淸韶陶始曙涼潤即新林風定葉當影雲開岫出陰遙禽如往日近蝶有營心四顧誰天損行歌復自今上湘旅興甲寅寒山猶半緑淺日動浮光習習江南暖淫淫小雪長杖藜隨鳥度涉澗有花香不信間愁在千峯一徜徉墟煙何處起渡口己樵歌空外篙音發睛灘柏葉過生平還草屨世事儘藤蓑慙愧元真子淸時畏緑波一巘復千峯參差萬壑松夕煙飛不定落葉轉相逢古寨傳銀穴仙壇記石封金丹及鐵馬吾意定奚從柳陰誰竹外幾葉帶踈黃浴鶩動金綺夕陽生暗塘歸人歡婦子明發有風霜居者忘情甚蕭條客感長山城猶百里戰伐不相知禾黍經時畢冠裳入望疑微霜開驛路落日返樵吹回念巴邱北銀濤捲繡旗舟中上己同須竹客思蕩如何心知令序過韶吹先閏花信緒風和瑤草從誰拾落英念已多盈盈雙白鳥著意浴淸波伊山心識回巒外沿溪曲徑深雲煙開緑畝金碧動靑林香篆迎風入鐘聲過鳥尋蕭淸初覺好風雨更幽岑讀書雲外迹梵剎劫前宮藴藉淸歌日蕭條夕磬中古今藏客淚勳業寄真空牛首虛天闕何因臥懶融衡山曉發擊汰遲楓浦歸心就翠微江空雙古岸天小一雙圍嶽氣雲侵縣墟煙月掩扉松杉回望裡一谷曙光飛緑潤不知冬嶽雲第幾峯身輕隨白鳥裾冷夾靑松江近前時棹碑留故國封漁樵知近遠目賞己從容陳耳臣老矣新詩猶麗遠寄題雪諸咏隨意和之得四首居然穿雨際的的炫輕盈高閣今相望遙心一倍生元雲光漸曙淺水影微縈經歲含情待天涯已贈瓊初雪息心寒夜永無奈小窗何惻惻情還定朧朧影未訛空涵西照合月轉北林多墜玉驚幽響知誰度薜蘿映雪稍稍墟煙度歸禽尚一雙喧風柔落木珠雨緩流淙夕氣先孤幌雲陰上半窗縣心淸賞極酒力未須降欲雪彌望盈淸回還疑溪外蹤鴻飛昨日影龍蟄幾株松曲曲忘前徑山山遂一容扶笻誰早過麏迹恰迎逢訪雪東臺山乙卯百里初見山西暉客望間半峯明紫樹羣岫倒蒼灣仙館簫聲歇漁舟隔浦還祝融知近遠淸夢騖雲間草堂成歸舟湘水北伐木逮秋淸鶴館松雲剪萍蹤雪徑成南窗仍夕暖東嶺迓春晴蕭瑟乾坤裏蓬茅亦太榮早起草堂寓目籬間牽牛花追憶懿菴丙辰秋色生空外微晴始素暉籬花深碧紫風蔓小霏微酒坐懷迎目林軒悵啓扉故心猶宛爾何事歲華違新秋望章載謀丁巳湘山猶曲曲疇昔故天涯偶合添離恨輕分有後期鐙殘知奕誤月上儘詩遲芳草王孫在間愁付杖藜時載謀授館于翠濤干戈方萬里搖落又三秋霜鬢久無據雲蹤幸緩愁周秦焚後字時禮注方竟荆楚賦中樓鄭重淸波意君無忘野謀寄徐蔚子戊午黃鵠一癯仙重逢腹巳便檄從邛部草詩授鄭公箋柯雨先徵夢樵風恰滿船褚公池上月珍重到秋圓送載謀歸吳淞二首己未相逢及送別都在落花時霜雪添雙鬢兵戈共一枝江湖空在望天地儘堪疑顧陸煩憑弔吾生未有期馬當湖水北南望杳瀟湘陸海英雄躓船山煙草荒客臺留蠹簡謁者戀幽芳片石延陵字他年待報章聞聖功訃遽賦間愁生死外回首故人無南望墟煙迥西飛片鳥孤藤花開獨坐蘿月照霜鬚泉下淚艱難付釣徒排律詠菊答須竹癸丑選芳宜隱秀經歲得秋情苗淺春滋弱心微露貯輕啼鶯無醒夢飛絮謝思縈雨浹浮光上吹暄逸態呈螙憎痕屢剔絲繫玉防傾愛惜消長日從容養靜萌荷風熏晚緑蕉霧灑孤榮葉葉容遲上亭亭有獨擎艱難出畏景珍重享西淸紫葆光初透珠胎潤巳瑩竹枝留上番梅影剪疏橫專氣邀金液豐仁長玉嬰星榆方􅍓􅍓雲朵遂盈盈土德先推王冰心亦保貞有時浴紫水終不炫丹猩香外幽難似薰餘靜不攖肅然登鼻觀嗒爾偃心旌龍臘癡誰妒薝葡逸未平霄空霜一色天迥月三更倦賞愁寒夕邀歡暫晚晴袂辭𡵨路把目厭滿堂成桂釀聊孤酌蓴絲小佐羮催開辭羯鼓過訪待緱笙巳事開三徑端居愛九名同牀猶各夢顧影易魂驚身後從冰雪魂歸返日精摧芳寧問落滌月不辭烹君意如相念殷勤訪夕英靑草湖風泊同須竹與黃生看遠汀落鴈甲寅荻芽沉緑影汀際合晶光搖識歸鴻集從知夢澤長雲移千點曙風轉一行將凝立迷煙樹輕遷動夕陽參差香尾亂珍重羽衣涼陳列龍沙白書成太古蒼修眉涵鏡曲仙桂綴蟾光沙起簾鈎蕩洲平瑟柱張濤驚聊靜婉野曠恣疏狂酣寢雲田膩棲心蕙圃香氣矜三楚國神帶九秋霜整翮聊煙水回翔豈稻粱浣紗人佇久垂釣客情忘悽怨依筠淚間愁託杜芳經寒知柳色訪舊憶蓮房北望關雲紫西淸落照黃息機非倦止淸警正遙望平展紋波縠輕浮玉照肪遙天開畫苑活譜寫瀟湘七言近體同唐須竹遊馺閣巖己酉昨日初收梅雨天靑空四幕碧光圓微風引袂分溪草斷嶂當眉露嶽蓮片石偶然留太古同心無待問他年斜暉已長靑松影尚惜苔茸映緑煙昭陽菴同須竹夜話云乘木葉秋波探五老之勝因便送之儘覺當年不易談披雲躡石意猶貪袖圖有迹傳河畫血字無心錮井函白日只今原不損靑山向後定誰堪知君欲訪匡廬瀑摘去蓮花池上參不揆五十齒滿懿菴見過留同芋巖小酌楓陰荻岸晚煙開鶴膝逡巡踐碧苔隔歲相看顏似舊衰年無據漏仍催淸宵疏雨喧梧葉草閣歸雲膩竹胎薄遣新歡消夙昔臨觴聊罷築聲哀偶望辛亥平田無那素光何稻葉娟娟浸碧波白鳥試飛疑遠浦元雲微斷影高柯墟煙小困雙灣樹砌葉全低一徑莎不礙小窗消午睡爐煙孤裊緒風和極丸老人書所示劉安禮詩垂寄情見乎詞愚一往呐吃無以奉答聊次其韻述懷洪爐滴水試烹煎窮措生涯有火傳哀鴈頻分弦上怨凍蜂長惜紙中天知恩不淺難忘此別調相看更囅然舊識五湖霜月好寒梅春在野塘邊宿雪竹山同茹蘖大師夜話不知情在與無情丈室挑燈魄自驚海濺雲飛千嶂斷煙籠雪壓一枝輕破船載月浮寒水别路尋芳駐晚晴自護楊墳莖草緑春歸間唱踏莎行師嗣法嘉興楊墳山劉庶仙五十初度即席同唐須竹壬子未解平生因底事華筵詩思不相通逢君縣弧聊莞笑垂老臨觴偶自容竹孰午窗雙總丱梅花小閣一春風童心幾皺恆河水何必襄城問小童半語逢人吞不得於君燒燭耐春寒年華轂運有如此譜樣翻新孰與看但祝羲和留萬轉長披黃襖到三竿華山呼取墜驢客共説當年行路難聞極丸翁凶問不禁狂哭痛定輒吟二章傳聞薨于泰和蕭氏春浮園長夜悠悠二十年流螢死焰燭高天春浮夢裏迷歸鶴敗葉雲中哭杜鵑一線不留夕照影孤虹應繞點蒼煙何人抱器歸張楚餘有南華內七篇三年懷袖尺書深文水東流隔楚潯半嶺斜陽雙雪鬢五湖煙水一霜林遠遊留作他生賦土室聊安後死心恰恐相逢難下口靈旗不杳寄空音冬夕夕風楮葉有淸喧片紫西收碧未圓河漢依微傾北戶流霜容與潤高天寥寥空界魂孤往鼎鼎長宵夢小年欲與禁寒邀白鶴齊州不耐暝橫煙天物何歸剩碧虛霜飊難挽日南車哀絃短劔留魂夢雪鬢霧花空贅餘蠶妾報收雙甕酒故人諾借滿牀書不知哀樂將誰得惻惻寒心逼歲除詠雪癸丑素綃羃岫淺黃通倒影靑冥一片濃鴈背皴含天闕景魚鱗雲烈晚簷風乾坤回合搖山澤形魄孤淸接混𪷟回首少年心緒回衝寒狂折野梅紅霰外間飛幾片輕回瞻平甸巳盈盈梅趺出色翻紅栗草甲棲心映緑晶雲幕空輪千影轉風回池縠萬雙迎南塘曲岸誰相待不惜明珠百斛傾皚光晨射凝脂肥海日輪孤膩不飛紅藥隱尖疑月冷梨花搖夢想春暉池雲壓頂團魚陳松粉鋪翎散鶴衣遙想玉峰辰似此淸寒應悔學仙飛淸空無際奈寒何萬岫參差捲白波人在氷輪迷海岸天回平野倒雲􅌪松風吹咽笙三疊櫧葉微留碧半柯不信人間有春日桃花紅雨點靑莎送蒙聖功暫還故山甲寅秋風淫淫吹我衣送君言歸君欲歸不知天地消逼側已覺江山忘是非疏星照水方昨夜涼日當襟返翠微靑山料理勿取次留之待我慰調飢殘雪乙卯寒心肅肅擁孤淸斷岸無心弄晚晴舊恨半消隨去鴈新歡難待到流鶯莎叢緑淺愁輕護蘚砌痕欹感易傾夙昔南枝曾有約不貪春早逐初英珍重凋零劫後身人間還遇可憐春和霜和月猶前日爭柳爭花非此辰睥睨靑天悲寂􅍓淹留丹巘賞嶙峋雙飛燕子來何暮不見瓊田萬頃新蒼煙黃日久迷離猶有牆東片月窺身外江山還似舊夢中蜂蝶儘相疑東流徹夜銀濤急平甸矜春碧草欺不識瑞香花落後幾人還賦玉樓詩回塘曲徑偶相依不擬春歸尚未歸向後生緣隨旦暮當時心緒在霏微珠胎含淚禁疏雨玉骨凝寒傲夕暉子夜輕冰聊邂逅素心元不藉霜肥長沙旅興江上紅芽始試春乳鶯調語正迎人人間韶日還相識花下喧風已試新鶴杖恰逢苔徑軟漁舟初繞碧波勻乘乘生事餘年在隨處桃花可問津郡歸書懷寄懿菴雨滯花殘不解飛此身無主更無依乾坤何夢到淸晝生死難忘只翠微捲幕碁終歸燕緩敲尊歌闋薦魚肥如君貧病真天上莫惜淸秋共釣磯出郭赴李緩山之約桓伊山下遇雨葛衣疏透雨珠間習習輕風宿暑闌白練半飛分木末丹虹雙綰護雲關笛聲恰在桓伊步飯顆初逢杜甫山珍重碧煙開玉鏡明宵何夕照雙顏萍鄉中秋同聖功對月白頭還作他鄉客不負靑天只月明自笑漁樵非泛宅聊聽鴻鴈有新聲晶瓶浸魄一雙影玉鏡當心無限情莫為銀蟾增悵恨孤淸直上即瑤京春夕同章載謀看月丙辰草堂新築延新月夕望春煙散夕淸天地空輪原自昔鶯花流目不須驚東風搖柳拖柔影緑暈莎肥炫露明莫擬華亭歸鶴怨湘山布穀未催耕先秋一日作西峯半影逼天靑閃閃斜陽紫焰明木末一絲雲影渡稻畦千緑水痕平麟洲夢覺餘香雪鶴髮身輕憶鳳笙菡萏梧桐雙在眼他時搖落不須驚重登回鴈峯丁巳碧樹江煙小散愁靑鞋雪鬢又重遊朱甍如夢迷雙岸緑草當春覆一邱縱酒華年凌石級題詩夕雨認高樓漁舟戰鼓皆今日慙愧乾坤一影浮遣懷求仙無訣問蓬壼縹渺神山一片孤溪水冰融隨岸闊天風霜起任桑枯霜起沅湘耆舊集作聲緊田疇死記廬龍塞司馬生慙瑞獸符為問今宵寒夜月照來還似舊時無乾坤極目不消愁生事崢嶸祗敝裘漁艇可容人釣雪故鄉還似客登樓探梅的皪丹砂蒂問月殷勤白玉鈎儘有風光相假借無妨孤棹試中流靑箬笠還在短牆漁汀樵徑儘披霜明年春在柳仍絮前夜雪深梅自香天地龍蛇消一淚河山烏鵲且孤翔情知華頂酣眠客蛻骨難留笑汴梁人間口耳總無權對影忘言且問天劉宋科名原荏苒蘇張車馬自喧闐水沈香篆靑煙細海霧空輪赤日懸匣有寶刀隨老病無勞堇土淬龍淵桐城余兼尊昔為靑原侍者歸素以來崎嶇嶺外相值見訪為録前寄極丸老人詩仍次原韻贈之沙上鴻蹤昔歲心堞樓鶴語舊時林巳知罷釣能忘餌何必登牀更碎琴月影偶留傳鴈字秋聲不斷有蟬吟間愁杜口從君語為受靑原記莂深小樓雨枕戊午江城二月催寒雨山客三更蘿嶺雲靑鏡分明知鶴髮寶刀疇昔掩龍文援毫猶記趨南史誓墓還誰起右軍飛鳥雲邊隨去住淸猿無事憶離羣長鑱斸术自生涯短棹衡萍有獨知偶測天心容杖屨不從人事整鬚眉孤情琴外傳昭氏病眼花前待子規間坐小樓淸徹極垣衣緑潤帶煙垂小圃桃花發幾株暫時瀟灑且江湖柳風乍得吹烏帽燕壘莫驚長緑蕪符璽可容徐廣淚山河難授馬融圖千秋􅍓􅍓憑靑史不信兵戈有腐儒客窗倦雨曉朦朧乍有晨光半紙紅江岸夜喧春水長沙汀波漾燕泥融乾坤即事容心廣老病隨緣自德充莫問漁津知處否緑楊繞屋已陰濃春山漫興靑山一曲古今誰曾向藤蘿挂接㒿古樹幾逢新蘚長落花聊遣曉鶯知乾坤舊日容雙鬢戰伐隨時老一枝擬上懸崖尋片石苔函無字禹功碑碧磴朱櫻始試花定知紅藥孕丹芽晶含斜日搖餘雪縠長輕風皺淺沙遊屐未拋資藥力漁簑欲捲過霜華堂堂永晝相容得卧看窗西映綺霞雨斂平田一鷺輕西峯新展半圍晴葉光浮上通雲緑天影低沈透水淸柔草待收園客繭泠風欲和子喬笙百年俄頃春情極未羡商山摘紫英東海無能釣玉璜嶽陰從昔咀金薑刀圭鼎鼎千春臼簑笠悠悠一雨航碁劫屢翻憐日永琴心自寡到春忘東方笑爾詼諧甚濫借金門作隱鄉丹霞白雨夾分霄浴鷺棲鴉各自饒夕爽淸吹生水影晴光片碧動山椒靑鞋躡迹違珠露紫笋依痕剝玉苗依痕沅湘耆舊集作分明假借春光安病客天年恰恰在今朝天年句沅湘耆舊集作不妨詩思滿唐瓢南國春從積雨過西淸雲奈夕先何褰帷陰壁生靑蘇倚杖空階土緑莎肺病久拚臨下溼心期不但畏風波晴絲曙月容他日幾厭落英覆碧􅌪餘春春閏太從容即次鶯花老漸慵送夕柳邊斜照淺留寒雨外溼雲重烹龜自惜千年表放鶴先栽九里松人事天情宜痼疾草堂曲曲暮煙封同須竹送芋巖歸窆竟心艇泝湘轉郡城有作誰將今古作浮煙人各為心亦自憐飮泣當年聞國變埋心遙夜但天全靑編無字酬雙淚赤縣何時慰九泉千計不如歸尺土飄零人在釣魚船斷雲影裏泝湘隈回首荒阡半畝才縱使君還生幾歲可容春去有重來寒灰墮地皆千載老病逢人但一哀不是躬園相識久孤山錯擬萬株梅詠木魚引己未觀生居壁粘比歲人土酬贈韻語時復迎目如相揚榷僕與當世偶一往還觴咏耳亦可不容志之兵警後為俗惡寓人盡擲棄之非有長吉睚眥之怨浪施和仲箋云之懼能使人不氣盡耶唯攸縣陳耳臣二箋僅存裴回不忍捨目用覺其咏木魚詩未當作者輒和二章不能寄耳臣差賢於存沒諸公之逢蠹蠈無從靜對己爾紺宇虛堂敞肅陰蓮趺直下啓孤音霏微樂句香煙合蕭颯淸喧墜葉侵夢覺乍如星漏永簾垂間遣梵筵深初機塗毒難酬得定借驚魚警夙心崔嵬忘情受衆吹息機何用作鱗而敲空別證生公義彈指還拈寶月詩馴鴿依簷春雨靜蒲牢息杵曉空知新翻罷釣離鈎句從遣楗槌客儘疑七言絶蚤春壬子側砌新苔透暖融回波搖影碧痕通東風向晚吹疏雨却送歸雲上淺紅小窗春淺不中春徑次啼鶯煞惱人忘盡故心消不得夕煙約莫柳條新得須竹鄂渚信知李雨蒼長逝遙望魚山哭之孤鴈哀吟帶淚飛南詢鴈岫釣魚磯尋常鴈塔稱兄弟魚稻汀洲各捒肥一期生死有千秋欲語逢人翦舌休剛遣西風吹片葉黑雲棲斷洞庭舟靑原罷棹石門寒柳岸霜風月巳殘欲轉金輪須換面紅罏別鑄紫金丹密之閣老天門司馬俱以是年棄世赤壁雄風百戰酣新安碧血灑江南大觀綽板先君歇淒絶吳江老蘖菴雨蒼蚤與金正希尹洞庭熊魚山齊名時金已殉難尹亦先逝熊公僧隱吳江存亡未審白楊衰草楚雲天孺子生芻奠暝煙忍淚欲彈須剪燭霜風偏緩上灘船須竹赴哭未歸新秋同唐古遺須竹遊鐘武故城歸坐小軒夜語癸丑嶽陰萬片惹雲肥暑氣猶留凝不飛野徑偶然成遠望江湖何地卜漁磯荆榛蒼淺古城秋脈脈蒸江碧玉鉤野曠天低飛鳥度不知何處弔孫劉野人愛菊亦偶爾種菊滿闌秋已淸但為愛君兄弟好欹眠間看緑光晴間堂剪燭夜如何銀漢疏風古樹多便把一竿隨爾住江門原有舊藤蓑水口道中乙卯叢竹低垂過雪斜森寒緑氣透靑霞乳鶯啼處春無幾才見櫻桃一樹花走筆贈劉生思肯故園枝葉記君家兄弟風流競筆花泛宅五湖君自遠相逢猶幸在長沙水緑洲前魚艇多也來相伴曬漁蓑逢君翦燭當深夜奈此干戈滿地何老覺形容漸不真鏡中身似夢中身憑君寫取千莖雪猶是先朝未死人題林良枯木寒鴉圖圖有李賓之題句未辨斜陽與暮煙枝枝不墮早春前此中無放鶯啼處留待桃花二月天便得春風也是枯藤蘿不挂儘蕭疏遙知練鵲過新緑只似河陽擲果圖內苑春風萬樹皆文鵷掠彩艷心諧寒山古木啼淸怨只有梅齋與木齋三十年來認得真吉凶無據自無情鵲聲縱好非歸計塞耳春風第一聲戲作七夕詞三首戊午甲子須臾一局棊人間荏苒歲華遲經年莫為添惆悵離別曾無片晌時晶輪不惹少商風銀漢無波一派通博望仙槎容易度何須烏鵲掠淸空織錦無成上帝嗔憨慵長夜望河津何從更得蛛絲裏賸巧年年乞與人梅花墟里寒煙罩斷橋年來春色最蕭條船山半曲淸溪裏霜日黃曛一樹遙不知淺素更輕紅遙望長疑煙靄中除取梅花心自省看花人隔小橋東老眼看花似隔紗臨風偶愛一枝斜香生微暈初輪月紫透輕魂破體砂開從小雪入新年雪妒霜侵不損妍珍重深寒禁凍蝶低飛不過淺闌邊樂府石流篇乙卯石上流水漸彼蒲英滌根孤弱植芳不傾撫我平昔居然既往攬景無及何用追賞水無旋流卉木有方冬春屢易天故不常一善可師萬端方迷授我坎坷天故不齊浩浩方隅茫茫圓軌有命艱貞繄惟今始愠不可長逸不可終含默難言孤置我躬烏元鶴白其辨易知分芒析微何者忌疑雉子遊原澤篇雉子遊原澤芒芒非故林寒秋草葉短離離露華襟念昔志節士抱道閲飛沈龍爭而蠖屈華屋若邱岑輾轉萬變內崎嶇北與南若辱全大白蛟日破重陰寤寐豈不思力弱無能任申旦勞太息悠悠但長吟門有車馬客林徑晴風生鳥雀喧夕樹策馬何方來遙遙駐光度依依相慰深轉轉將情愫繇言既不輕珍重託微諭仰睇靑雲飛光采殊新故各有懷心端孰為目擊遇耿耿非自韜殷勤愼維護夜坐吟長莫長冬夜寒眀霜流空天宇寬朱鐙明思未闌昔日之日未足歎今日之日百憂攢古人不可問流俗空漫漫吾何歸歸何歎眀星爛晨雞喧抱孤心臨萬端豫章行遵塗出郭門待遠有來期新歡寡所諧舊好良多違分手亦己薄彈冠安足希洪流從問津危岑將共之商山非孤雲海濱有雙儀夔曠誠不作吾生將見欺順東西門行良夜徂皚光盈東方厯厯白日生酌醇酒吹華笙閲世迢迢心不驚發淸謳蕩間情九州萬年誰相攖乘逍遙歸太寧馳騁無羈驅空猛虎行塗長不息空舍亭道迷不隨飛蓬征飛蓬無去心空亭多夕驚寸心有端緒歧路勞屏營銜憂非死亡膺福非華榮危塗厲修篩遊衍悲俜零短歌行臨觴不辭當歌不悲明月遲空天漢離離南有玉衡北有營室眀明兩間達者自逸鴻鴈驚霜飛必有鄉鷃雀棲遲東西回翔登山善疑臨水善憶古人有心千秋不測東望碣石大海環之橫波施楫誰能代持陳餘絶交馮衍悲老佩玦千金輕喪其寶剖臆出心與天而遊回風在御何用繁憂箜􅔃引丁巳河水流蛟龍遊我聞昔夾神禹舟斥以蝘蜓爪角弭后啓云維神禹子駕之驂驔渡河水非不欲公效其美公非夏后與子孫胡為與之爭吸吞天風有靜波有馴公雖欲渡姑逡巡歌行寄和些翁補山堂詩己就聞翁返石門復次元韻寄意己酉無字之碑誰帝虎無絃之琴誰宫羽角尖不挂羚羊痕隨意天花散春雨我公昔浮玉沙湖湖上突出孤山孤補山未了公南返螺髻修眉半有無下士之見不越咫謂公勤勤補山耳支祈平吞江南之雲江北夢息壤欲堙何處起公笑捲山山為藏沅湘耆舊集捲作掩靑蒼縮入柳杯裏折腳鐺中氷不腐煮爛須彌將芥補湖南空有靑蓮七十二萬莖總不入公補處數無土不現補山堂崢嶸日月開幽荒飛來之峯彈指已過洞庭水北山愚公嗟倣徨粵奴初識雪歌翦髮粵雛年十四聞人説有霜雪字正月梅殘度嶺來桃花郴水春流膩經年絶望望南天落葉黃雲棲瞑煙飄空冉冉光搖目疑絮疑花兩不然心知是雪情難決借問方知寒雨結此生今日乍相逢掬玉尋香向誰説可憐覿面未相親故是陽臺夢裏雲垂楊風細梧桐月總道龜毛重九斤孤鴈行和李雨蒼當年回鴈峯頭住鴈影雲開天際路夫君縹渺鴈峯心遙寄湖南煙雨渡誰知白鴈杳寒沙斷使靑峯遮日暮日暮雲迷鴈陳哀逢君千里鴈書來欲分寶瑟銀箏怨似向沙明水碧回一水盈盈烏石戍千秋渺渺楚雲臺楚雲臺乃白沙留雨蒼五世祖大崖先生讀書而築楚雲臺高芳草齊湘干北望鷓鴣啼虞卿著書亦何有建陽賣卜還自迷瘦影難雙矰繳滿寒更欲警露霜淒淸霜白露飛不前亭亭片月當高天前身憶住靑龍寺血迹還埋古井邊遙飛尺帛君邊去沙上鴻蹤隔暝煙讀涇陽先生虞山書院語録示唐須竹涇陽先生不復作涇陽遺編縣高閣彩虹垂天漫璀璨大造徒爾鼓空橐永陵之季狂瀾驚倒吹枯瓠為玉笙平地躍起攫光影失足猶漫誇輕淸先生兩足不妄插矗立欲撑銀漢傾鳥舌無從説鳥夢人頭定可作人鳴毫髮析作千萬片一絲獨飛挂匹練亭亭萬歲終不欹世人皆見莫能見嗚呼乎吾不知麟衰鳯去將誰傳區區下界縈寒煙秉燭對讀過深夜詰旦赤日生高天聽月樓倦客歸山留別翠濤王孫我夢聽月樓巳久不意今生登此樓樓前湘水膩碧玉細細紋波送遠秋我有狂歌知者誰古人不作今人疑夜闌酒熟相對笑男兒不受雙眸欺我今歸臥蒸南谷黃菊將開酒將熟爛醉三萬六千年柳生左肘石穿肩君勿疑我不相就聽月無聲月自圓效柏梁體壽王愷六鐵牆拗頭緑鳳棲就君踏花蹂香泥君今僦宇當湘西陽禽回翼空悽迷人生即久如躡梯駸駸不舍相攀攜我旬過五君始躋欲呼蒼天問端倪誰為龍翁配虎妻活汞煎之如嬰啼東兔藏金西木雞戰酣四壁休鼓鼙得之圜中一刀圭與君分吞如糖䬾倒騎白衛馳丹霓俯聽蟪蛄聲益低長笑爾曹延蝤蠐睨高欲就終無稽我摘月華沁心臍君胸洞開消日鐫斫麟為脯堯非臡團星作餅甘露醯命鸞歌囀如黃鸝羿妻婉孌出金閨疑貞疑謔相嘲詆然後與君歸湘溪嶽為部婁湘成蹊三皇五帝重攝提如此與君終不睽乃稱丈夫心交締非炎索箑寒就烓短歌隆隆蒼虬嘶千春萬朔留品題風泊中湘訪張永明老將弔孫呂二姬烈死讀辛卯以來諸公奬貞之篇放歌以言情孫呂事詳故中舍管公記乙卯昭潭萬波疊霜縠南望灕江暮雲緑驚鴻呌雲天不開秋夕孤飛遙痛哭二十六年春蔓長我與張君四鬢霜衰顏不死猶前日湘女空靈鬱杳茫茫茫洞雲結煙草貞魂不舍蒼梧道哀歌血淚灑靑天管子嗣裘金郎堡而我悲吟獨待今二十六年愁埋心左掖蒙生俱未死軍中彈淚秋陰深嗚呼乎往恨迷離無再説一死人間萬事決君不見張君二婦灕江濱俄頃千秋如截鐵梅陰冢戊午船山老人幼女七歲許字友人唐君之子者以戊午八月天敗葉廬左有梅一株老人夙所玩息廬圮梅存因瘞其側老人女蚤曉字動有間則嘗自言使我且死必不亂垂亡果然老人哀之甚且恐此土為樵犁所侵詩以志之秋露漙梅葉丹莎根草蟲吟初寒梅根千年蔭野土鶴髮衰翁淚如雨梅葉落梅花開棠杜無人斸徑苔寸腸矗立望思臺六十自定稿終
